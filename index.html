// ── API ──────────────────────────────────────────────────────────
async function api(action,body={}) {
  const res=await fetch(GAS_URL,{method:"POST",body:JSON.stringify({action,...body})});
  const json=await res.json();
  if(!json.ok) throw new Error(json.error||"エラー");
  return json;
}
function readFileAsDataUrl(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(String(reader.result||""));
    reader.onerror=()=>reject(new Error("ファイルの読み込みに失敗しました"));
    reader.readAsDataURL(file);
  });
}
function parseFamilyMembers(value){
  if (Array.isArray(value)) {
    return [...new Set(value.map(v=>String(v||"").trim()).filter(Boolean))];
  }
  const s = String(value || "").trim();
  if (!s) return [];
  try {
    const parsed = JSON.parse(s);
    if (Array.isArray(parsed)) {
      return [...new Set(parsed.map(v=>String(v||"").trim()).filter(Boolean))];
    }
  } catch(e) {}
  return [...new Set(s.split(/\r?\n|,|、/).map(v=>String(v||"").trim()).filter(Boolean))];
}

function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map(ch => ch.charCodeAt(0)));
}

async function subscribeWebPush(user) {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
    throw new Error("この端末ではWeb Pushに対応していません");
  }
  const swUrl = "/sw.js?v=9";
  const reg =
    (await navigator.serviceWorker.getRegistration()) ||
    (await navigator.serviceWorker.register(swUrl));
  await Promise.race([
    navigator.serviceWorker.ready,
    new Promise((_, reject) =>
      setTimeout(() => reject(new Error("通知の初期化がタイムアウトしました")), 8000)
    ),
  ]);
  const keyRes = await fetch("/api/push-public-key");
  if (!keyRes.ok) throw new Error("公開鍵の取得に失敗しました");
  const { publicKey } = await keyRes.json();
  if (!publicKey) throw new Error("通知公開鍵が設定されていません");
  let sub = await reg.pushManager.getSubscription();
  if (!sub) {
    sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(publicKey),
    });
  }
  await api("savePushSubscription", {
    userId: user.id,
    userName: user.name,
    subscription: sub.toJSON(),
  });
  return sub;
}

async function getCurrentPushSubscription() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) return null;
  const reg = await navigator.serviceWorker.getRegistration();
  if (!reg || !reg.pushManager) return null;
  return await reg.pushManager.getSubscription();
}

async function unsubscribeWebPush() {
  const sub = await getCurrentPushSubscription();
  if (!sub) return false;
  const endpoint = sub.endpoint;
  await sub.unsubscribe().catch(() => false);
  if (endpoint) {
    await api("deletePushSubscription", { endpoint }).catch(() => {});
  }
  return true;
}

// ── ユーティリティ ────────────────────────────────────────────
function nd(v) {
  if(!v) return "";
  const s=String(v);
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const d=new Date(s);
  if(!isNaN(d.getTime())) return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  return s;
}
function todayLocal() {
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function fmt(v) {
  const s=nd(v);
  if(!s||s.length<10) return {y:"",m:"",d:"",dw:"",short:"",full:""};
  const dt=new Date(s+"T00:00:00");
  const dw=["日","月","火","水","木","金","土"][dt.getDay()];
  return {y:s.slice(0,4),m:s.slice(5,7),d:s.slice(8,10),dw,short:s.slice(5,7)+"/"+s.slice(8,10),full:s.slice(0,4)+"年"+s.slice(5,7)+"月"+s.slice(8,10)+"日("+dw+")"};
}
function getCurrentThirdGeneration() {
  const now = new Date();
  const fiscalYear = now.getMonth() + 1 >= 4 ? now.getFullYear() : now.getFullYear() - 1;
  return fiscalYear - 1965;
}
function resolveGrade(member) {
  const gen = Number(String(member?.generation || "").replace(/[^\d]/g,""));
  if (!gen) return member?.grade || "";
  const gradeNum = getCurrentThirdGeneration() - gen + 3;
  if (gradeNum >= 1 && gradeNum <= 6) return gradeNum + "年";
  if (gradeNum === 0) return "年長";
  if (gradeNum === -1) return "年中";
  if (gradeNum > 6) return "卒業";
  return member?.grade || "";
}
function normalizeMember(member) {
  return {...member, grade: resolveGrade(member)};
}
function calcStats(rs) {
  if(!rs.length) return {games:0,wins:0,draws:0,losses:0,gf:0,ga:0,pct:"-"};
  // PK戦がある試合のみPKスコアで勝敗判定、それ以外は通常スコア
  const hasPkData = r => {
    // pkKickers配列があれば確実にPK戦あり
    try { const k=JSON.parse(r.pkKickers); if(Array.isArray(k)&&k.length>0) return true; } catch(e){}
    // 旧データ: pkOur/pkTheirが両方数値かつ合計1以上
    const o=Number(r.pkOur), t=Number(r.pkTheir);
    return !isNaN(o) && !isNaN(t) && r.pkOur!=="" && r.pkTheir!=="" && (o+t)>0;
  };
  const isWin = r => {
    const our=Number(r.ourScore), their=Number(r.theirScore);
    if(our>their) return true;
    if(our<their) return false;
    // 引き分けでPKあり
    if(hasPkData(r)) return Number(r.pkOur)>Number(r.pkTheir);
    return false;
  };
  const isDraw = r => {
    const our=Number(r.ourScore), their=Number(r.theirScore);
    if(our!==their) return false;
    if(hasPkData(r)) return false; // PKあれば引き分けなし
    return true;
  };
  const w=rs.filter(isWin).length;
  const dr=rs.filter(isDraw).length;
  const gf=rs.reduce((a,r)=>a+Number(r.ourScore||0),0);
  const ga=rs.reduce((a,r)=>a+Number(r.theirScore||0),0);
  return {games:rs.length,wins:w,draws:dr,losses:rs.length-w-dr,gf,ga,pct:Math.round(w/rs.length*100)+"%"};
}

async function showLocalNotification(title, options={}) {
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  if ("serviceWorker" in navigator) {
    const reg = await navigator.serviceWorker.getRegistration();
    if (reg && reg.showNotification) {
      await reg.showNotification(title, options);
      return;
    }
  }
  new Notification(title, options);
}

async function maybeNotifyDeadlines(schedules) {
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  const today = todayLocal();
  for (const s of schedules) {
    if (!s.deadline) continue;
    const d = nd(s.deadline);
    if (!d) continue;
    const days = Math.round((new Date(d + "T00:00:00") - new Date(today + "T00:00:00")) / (1000 * 60 * 60 * 24));
    if (days !== 1) continue;
    const key = `afc_deadline_notice_${s.id}_${s.deadline}`;
    if (localStorage.getItem(key)) continue;
    await showLocalNotification("出欠締切が近づいています", {
      body: `${s.title || "予定"} の締切は明日です（${d}）`,
      icon: "/icon-512.png",
      badge: "/icon-512.png",
    });
    localStorage.setItem(key, "1");
  }
}

async function maybeNotifyUpcomingEvents(schedules) {
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  const today = new Date();
  const base = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  for (const s of schedules) {
    if (!s.date) continue;
    const eventDate = new Date(s.date + "T00:00:00");
    const days = Math.round((eventDate.getTime() - base.getTime()) / (1000 * 60 * 60 * 24));
    if (days !== 1) continue;
    const key = `afc_event_notice_${s.id}_${s.date}`;
    if (localStorage.getItem(key)) continue;
    await showLocalNotification("明日の予定があります", {
      body: `${s.date} ${s.title || "予定"}${s.location ? " / " + s.location : ""}`,
      icon: "/icon-512.png",
      badge: "/icon-512.png",
    });
    localStorage.setItem(key, "1");
  }
}

function Login({onLogin}) {
  const initParams=new URLSearchParams(location.search);
  const presetSignupEmail=(initParams.get("email")||"").trim();
  const approvedFromLink=initParams.get("approved")==="1";
  const [mode,setMode]=useState(initParams.get("mode")==="signup"?"signup":"login");
  const [email,setEmail]=useState("");
  const [pass,setPass]=useState("");
  const [showPass,setShowPass]=useState(false);
  const [err,setErr]=useState("");
  const [loading,setLoading]=useState(false);
  const [signupMembers,setSignupMembers]=useState([]);
  const [signup,setSignup]=useState({name:"",email:presetSignupEmail,password:"",generation:"",memberId:""});
  const [approvalStatus,setApprovalStatus]=useState(approvedFromLink?"approved":(presetSignupEmail?"checking":"none"));
  const [approvalUntil,setApprovalUntil]=useState("");
  useEffect(()=>{
    if(mode!=="signup"||approvalStatus!=="approved") return;
    api("getSignupMembers").then(r=>{
      setSignupMembers((r.members||[]).map(normalizeMember));
    }).catch(()=>{});
  },[mode,approvalStatus]);
  useEffect(()=>{
    if(mode!=="signup"||!signup.email) return;
    checkApprovalStatus(signup.email);
  },[]);
  useEffect(()=>{
    if(mode!=="signup"||approvalStatus!=="pending"||!signup.email) return;
    const timer=setInterval(()=>checkApprovalStatus(signup.email),5000);
    return ()=>clearInterval(timer);
  },[mode,approvalStatus,signup.email]);
  const generations=[...new Set(signupMembers.map(m=>String(m.generation||"").trim()).filter(Boolean))].sort((a,b)=>Number(b)-Number(a));
  const filteredChildren=signup.generation?signupMembers.filter(m=>String(m.generation||"")===String(signup.generation)):[];
  const login=async()=>{
    if(!email||!pass){setErr("メールとパスワードを入力してください");return;}
    setLoading(true);setErr("");
    try{const r=await api("login",{email,password:pass});onLogin(r.user);}
    catch(e){setErr(e.message);}
    setLoading(false);
  };
  const checkApprovalStatus=async(targetEmail=signup.email)=>{
    if(!targetEmail) return;
    try{
      const r=await api("getSignupApprovalStatus",{email:targetEmail});
      setApprovalStatus(r.status||"none");
      setApprovalUntil(r.approvedUntil||"");
    }catch(e){}
  };
  const requestApproval=async()=>{
    if(!signup.email){setErr("メールアドレスを入力してください");return;}
    setLoading(true);setErr("");
    try{
      const appUrl=location.origin+location.pathname+"?mode=signup&email="+encodeURIComponent(signup.email);
      await api("requestSignupApproval",{email:signup.email,appUrl});
      setApprovalStatus("pending");
    }catch(e){setErr(e.message);}
    setLoading(false);
  };
  const register=async()=>{
    if(!signup.name||!signup.email||!signup.password||!signup.generation||!signup.memberId){

// ── YouTube テンプレ生成 ─────────────────────────────────────
function makeYtTitle(match, schedule, half) {
  const dt = fmt(match.date || schedule?.date);
  const dateStr = dt.y + "/" + Number(dt.m) + "/" + Number(dt.d);
  const opponent = match.opponent || "";
  const tc = getTC(match.type);
  const gameNo = match.gameNumber ? "第" + match.gameNumber + "試合" : "";
  const loc = schedule?.location ? "@" + schedule.location : "";
  return [dateStr, "VS", opponent, tc.lb, gameNo, half, loc].filter(Boolean).join(" ");
}

// 秒→ m:ss 形式
function secToTime(min, sec) {
  const m = Number(min)||0;
  const s = Number(sec)||0;
  return m + ":" + String(s).padStart(2,"0");
}

// チャプター形式の説明欄生成（前半 or 後半）
function makeYtDesc(match, members, half) {
  const isH1 = half === "1st";
  const halfKey = isH1 ? "1st" : "2nd";

  // 全体スコア（前半+後半合計）
  const allOur   = (match.goals||[]).filter(g=>g.team!=="them").length;
  const allTheir = (match.theirGoals||[]).length + (match.goals||[]).filter(g=>g.team==="them").length;

  // 前半・後半別スコア
  const h1Our   = (match.goals||[]).filter(g=>g.team!=="them" && String(g.half).toLowerCase()==="1st").length;
  const h1Their = (match.theirGoals||[]).filter(g=>String(g.half).toLowerCase()==="1st").length
                + (match.goals||[]).filter(g=>g.team==="them" && String(g.half).toLowerCase()==="1st").length;
  const h2Our   = (match.goals||[]).filter(g=>g.team!=="them" && String(g.half).toLowerCase()==="2nd").length;
  const h2Their = (match.theirGoals||[]).filter(g=>String(g.half).toLowerCase()==="2nd").length
                + (match.goals||[]).filter(g=>g.team==="them" && String(g.half).toLowerCase()==="2nd").length;

  const scoreLine = "塚口AFC " + allOur + " - " + allTheir + " " + match.opponent
    + "\n前半 " + h1Our + "-" + h1Their + "  後半 " + h2Our + "-" + h2Their;

  // チャプター: 指定ハーフのゴールのみ
  const myG = (match.goals||[])
    .filter(g => String(g.half).toLowerCase()===halfKey.toLowerCase() && g.team!=="them")
    .sort((a,b)=>Number(a.minute)-Number(b.minute)||Number(a.second)-Number(b.second));
  const thG = [
    ...(match.theirGoals||[]).filter(g => String(g.half).toLowerCase()===halfKey.toLowerCase()),
    ...(match.goals||[]).filter(g => String(g.half).toLowerCase()===halfKey.toLowerCase() && g.team==="them"),
  ].sort((a,b)=>Number(a.minute)-Number(b.minute)||Number(a.second)-Number(b.second));

  const lines = ["0:00 スタート"];
  const events = [
    ...myG.map(g => {
      const sc = members.find(m=>m.id===g.scorerId);
      const scorerName = sc?.name || g.scorerName || "不明";
      const as = members.find(m=>m.id===g.assistId);
      const assistName = as?.name || g.assistName || "";
      const type = g.goalType && g.goalType!=="通常" ? "("+g.goalType+")" : "";
      const assistStr = assistName ? " アシスト "+assistName : "";
      return { min:Number(g.minute)||0, sec:Number(g.second)||0,
               text: secToTime(g.minute,g.second)+" [得点]"+scorerName+type+assistStr };
    }),
    ...thG.map(g => {
      const type = g.goalType && g.goalType!=="通常" ? "("+g.goalType+")" : "";
      return { min:Number(g.minute)||0, sec:Number(g.second)||0,
               text: secToTime(g.minute,g.second)+" 失点"+type };
    }),
  ].sort((a,b)=>a.min-b.min||a.sec-b.sec);
  events.forEach(e => lines.push(e.text));

  return scoreLine + "\n\n" + lines.join("\n");
}


// ── HP用テンプレ生成 ─────────────────────────────────────────
function makeHpTemplate(schedule, results) {
  const dt = fmt(schedule.date);
  const dateStr = dt.m+"月"+Number(dt.d)+"日";
  const title = schedule.title || "";
  const loc = schedule.location || "";
  const nums = ["①","②","③","④","⑤","⑥","⑦","⑧","⑨","⑩"];

  const sorted = [...results].sort((a,b)=>Number(a.gameNumber||1)-Number(b.gameNumber||1));

  // ヘッダー: 日付 タイトル / 場所
  let text = dateStr+(title?"「"+title+"」":"");
  text += "\n"+loc;
  text += "\n";

  sorted.forEach((r,i)=>{
    const num = nums[i]||"・";
    const our = r.ourScore||0;
    const their = r.theirScore||0;
    // 試合ごとの得点者
    const scorers = (r.goals||[])
      .filter(g=>g.team!=="them"&&g.goalType!=="オウンゴール"&&g.scorerName&&g.scorerName!=="失点")
      .map(g=>g.scorerName);
    const scorerStr = scorers.length>0 ? "\n　得点："+scorers.join("、") : "";
    text += num+"塚口AFCjr "+our+"—"+their+" "+r.opponent+"さん"+scorerStr+"\n";
  });

  return text.trimEnd();
}

function copyToClipboard(text) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).catch(()=>{});
  } else {
    const el = document.createElement("textarea");
    el.value = text; document.body.appendChild(el);
    el.select(); document.execCommand("copy");
    document.body.removeChild(el);
  }
}

// ── ホームタブ ─────────────────────────────────────────────────
function HomeTab({results,schedules,news,members,isAdmin,onGoToMatch,onGoToDay,onOpenDashTab,onOpenTab}) {
  const [todayKey,setTodayKey]=useState(()=>todayLocal());
  const parseNewsTs = v => {
    const d = new Date(String(v || ""));
    return isNaN(d.getTime()) ? 0 : d.getTime();
  };
  const fmtNewsDateTime = v => {
    const d = new Date(String(v || ""));
    if (isNaN(d.getTime())) return fmt(v).short || "";
    return `${String(d.getMonth() + 1).padStart(2, "0")}/${String(d.getDate()).padStart(2, "0")} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  };
  const isFreshNews = v => {
    const d = new Date(String(v || ""));
    if (isNaN(d.getTime())) return false;
    const postedDate = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    const todayDate = new Date(todayKey + "T00:00:00").getTime();
    const diffDays = Math.floor((todayDate - postedDate) / (1000 * 60 * 60 * 24));
    return diffDays >= 0 && diffDays < 2; // 更新後2日だけ NEW
  };
  const extractDateFromText = text => {
    const m = String(text || "").match(/(20\d{2})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})/);
    if (!m) return "";
    return `${m[1]}-${String(m[2]).padStart(2, "0")}-${String(m[3]).padStart(2, "0")}`;
  };
  const findScheduleFromNotice = n => {
    const targetId = String(n.targetId || "").trim();
    if (targetId) {
      const byId = schedules.find(s => String(s.id || "").trim() === targetId);
      if (byId) return byId;
    }
    const src = `${String(n.title || "")} ${String(n.content || "")}`.trim();
    const dateKey = extractDateFromText(src);
    const byDate = dateKey ? schedules.filter(s => nd(s.date) === dateKey) : [];
    if (byDate.length === 1) return byDate[0];
    if (byDate.length > 1) {
      const hint = String(n.content || n.title || "").replace("新しい予定が追加されました", "").trim();
      const hit = byDate.find(s => {
        const t = String(s.title || "").trim();
        return hint && (hint.includes(t) || t.includes(hint));
      });
      return hit || byDate[0];
    }
    return null;
  };
  const openNotice = n => {
    const tt = String(n.targetType || "").toLowerCase();
    const title = String(n.title || "");
    const content = String(n.content || "");
    const targetUrl = String(n.targetUrl || "").trim();
    const isScheduleNotice =
      tt === "schedule" || tt === "deadline" ||
      title.includes("予定") || title.includes("締切") || content.includes("締切");
    if (isScheduleNotice) {
      const s = findScheduleFromNotice(n);
      if (s && onGoToDay) {
        onGoToDay(s);
        return;
      }
      if (onOpenTab) {
        onOpenTab("cal");
        return;
      }
    }
    const isYoutubeNotice = tt === "youtube" || /youtube/i.test(title) || /youtube/i.test(content);
    if (isYoutubeNotice) {
      const extractedUrl = (content.match(/https?:\/\/[^\s]+/i) || [])[0] || "";
      const youtubeUrl = targetUrl || extractedUrl || (HOME_LINKS.find(l => /youtube/i.test(String(l.label || ""))) || {}).url;
      if (youtubeUrl) {
        window.open(youtubeUrl, "_blank", "noopener,noreferrer");
        return;
      }
    }
    if (targetUrl) {
      if (/^https?:\/\//i.test(targetUrl)) {
        window.open(targetUrl, "_blank", "noopener,noreferrer");
        return;
      }
      if (targetUrl.includes("tab=cal") && onOpenTab) { onOpenTab("cal"); return; }
      if (targetUrl.includes("tab=match") && onOpenTab) { onOpenTab("match"); return; }
      if (targetUrl.includes("tab=dash") && onOpenTab) { onOpenTab("dash"); return; }
      if (targetUrl.includes("tab=member") && onOpenTab) { onOpenTab("member"); return; }
      if (targetUrl.includes("tab=memo") && onOpenTab) { onOpenTab("memo"); return; }
    }
  };
  const getResultType = r => {
    const linked = schedules.find(s => s.id === r.scheduleId) || schedules.find(s => nd(s.date) === nd(r.date));
    return linked?.type || r.type || "";
  };
  useEffect(()=>{
    const updateToday=()=>setTodayKey(todayLocal());
    const timer=setInterval(updateToday,60*1000);
    return ()=>clearInterval(timer);
  },[]);
  const recent=results.slice(0,5);
  const recentNews=news
    .filter(n=>n.category!=="コーチメモ")
    .sort((a,b)=>parseNewsTs(b.date)-parseNewsTs(a.date))
    .slice(0,3);
  // 次の試合を探す
  const today=todayKey;
  const nextSch=schedules.filter(s=>nd(s.date)>=today).sort((a,b)=>nd(a.date).localeCompare(nd(b.date)))[0];
  const daysUntil=nextSch?Math.ceil((new Date(nd(nextSch.date)+"T00:00:00")-new Date(today+"T00:00:00"))/(1000*60*60*24)):null;
  return h(Fragment,{},
    // ① 次の試合カード
    nextSch&&h("div",{onClick:()=>onGoToDay&&onGoToDay(nextSch),style:{background:"linear-gradient(135deg,#1D4ED8,#0F172A)",borderRadius:18,padding:18,marginTop:8,marginBottom:16,boxShadow:"0 4px 16px rgba(15,23,42,0.28)",cursor:"pointer"}},
      h("div",{style:{fontSize:10,fontWeight:700,color:"rgba(255,255,255,0.7)",letterSpacing:2,marginBottom:8}},"NEXT EVENT"),
      h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between"}},
        h("div",{},
          h("div",{style:{fontSize:18,fontWeight:900,color:"#fff",marginBottom:4}},nextSch.title||"（タイトルなし）"),
          h("div",{style:{fontSize:12,color:"rgba(255,255,255,0.8)"}},fmt(nextSch.date).full+(nextSch.location?" ／ 📍"+nextSch.location:""))),
        h("div",{style:{textAlign:"center",background:"rgba(255,255,255,0.2)",borderRadius:14,padding:"10px 16px",flexShrink:0,marginLeft:12}},
          h("div",{style:{fontSize:28,fontWeight:900,color:"#fff"}},daysUntil===0?"今日":daysUntil),
          h("div",{style:{fontSize:10,color:"rgba(255,255,255,0.8)",fontWeight:700}},daysUntil===0?"":"日後")))),
    // ② お知らせ
    h("div",{style:{marginBottom:20}},
      h("div",{style:{fontSize:11,fontWeight:700,color:"#bbb",letterSpacing:2,marginBottom:10}},"お知らせ"),
      recentNews.length===0&&h("div",{style:{background:"#fff",borderRadius:14,padding:20,textAlign:"center",color:"#ccc",fontSize:13}},"お知らせはありません"),
      recentNews.map(n=>{
        const titleText = String(n.title||"");
        const contentText = String(n.content||"");
        const isScheduleAddedNotice = titleText.includes("新しい予定が追加されました") || contentText.includes("新しい予定が追加されました") || titleText.includes("予定が追加されました") || contentText.includes("予定が追加されました");
        const summaryRaw = isScheduleAddedNotice
          ? contentText.replace("新しい予定が追加されました","").replace("予定が追加されました","").replace(/^[:：\s-]+/,"").trim()
          : contentText.trim();
        const summary = summaryRaw || (isScheduleAddedNotice ? "予定が追加されました" : "");
        const displayTitle = isScheduleAddedNotice ? "予定追加" : (titleText || "お知らせ");
        const canClick = isScheduleAddedNotice || /youtube/i.test(titleText+" "+contentText) || String(n.targetType||"").trim() || String(n.targetUrl||"").trim();
        const showNew = isFreshNews(n.date);
        return h("div",{key:n.id,onClick:canClick?()=>openNotice(n):undefined,style:{background:"#fff",borderRadius:14,padding:"11px 12px",marginBottom:8,boxShadow:"0 2px 8px rgba(0,0,0,0.05)",borderLeft:isScheduleAddedNotice?"3px solid #1D4ED8":"3px solid #E2E8F0",cursor:canClick?"pointer":"default"}},
          h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:5,gap:8}},
            h("div",{style:{display:"flex",alignItems:"center",gap:6,flex:1,minWidth:0,flexWrap:"wrap"}},
              showNew && h("span",{style:{display:"inline-block",fontSize:9,fontWeight:800,color:"#fff",background:"#1D4ED8",borderRadius:999,padding:"2px 6px",lineHeight:1}},"NEW"),
              h("div",{style:{fontSize:12,fontWeight:700,color:"#1a1a2e",paddingRight:8,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",maxWidth:"100%"}},displayTitle)),
            h("div",{style:{display:"flex",alignItems:"center",gap:6,flexShrink:0}},
              h("div",{style:{fontSize:10,color:"#94A3B8"}},fmtNewsDateTime(n.date)),
              canClick && h("div",{style:{fontSize:12,color:"#94A3B8",fontWeight:700}},"›"))),
          summary && h("div",{style:{fontSize:12,color:"#1E293B",lineHeight:1.6,whiteSpace:"pre-wrap",fontWeight:isScheduleAddedNotice?800:700}},summary));
      })),
    // ③ 最近の試合結果
    h("div",{style:{marginBottom:20}},
      h("div",{style:{fontSize:11,fontWeight:700,color:"#bbb",letterSpacing:2,marginBottom:10}},"最近の試合結果"),
      recent.length===0&&h("div",{style:{background:"#fff",borderRadius:14,padding:20,textAlign:"center",color:"#ccc",fontSize:13}},"試合記録がありません"),
      recent.map(r=>{
        const tc=getTC(getResultType(r));
        const s=schedules.find(s=>s.id===r.scheduleId||nd(s.date)===nd(r.date));
        const dt=fmt(r.date);
        return h("div",{key:r.id,onClick:()=>onGoToMatch(r,s),style:{background:"#fff",borderRadius:14,padding:"13px 16px",marginBottom:8,display:"flex",alignItems:"center",gap:12,boxShadow:"0 2px 8px rgba(0,0,0,0.05)",cursor:"pointer"}},
          h("div",{style:{textAlign:"center",flexShrink:0,width:36}},h("div",{style:{fontSize:11,color:"#aaa"}},dt.short),h("div",{style:{fontSize:10,color:"#ccc"}},dt.dw)),
          h("div",{style:{width:3,height:40,background:tc.bg,borderRadius:2,flexShrink:0}}),
          h("div",{style:{flex:1,minWidth:0}},
            h("div",{style:{marginBottom:2}},h(Bdg,{label:tc.lb,color:tc.bg,small:true})),
            h("div",{style:{fontSize:14,fontWeight:700,color:"#1a1a2e"}},"vs "+r.opponent)),
          h("div",{style:{textAlign:"right",flexShrink:0}},
            h(ScoreLine,{our:r.ourScore,their:r.theirScore,size:16}),
            h("div",{style:{marginTop:3}},h(RWdg,{our:r.ourScore,their:r.theirScore}))));
      })));
}

function DetailSection({schedule, members, users=[], schedules=[], isAdmin, onSave}) {
  const DEFAULT_CLOTHES = "練習シャツ、白パン、青ソックス、トレシュー、長袖インナー\n・防寒具\n・ジャージなどの上着";
  const DEFAULT_BELONGINGS = "ユニフォーム（白・青）、レガース、キャップ、タオル、スパイク\n・氷柱1本（ペットボトル、ジップロックなど）\n・コロコロ氷（水筒orジップロック）\n・水筒\n・着替え\n・軽食（ゼリー系）\n・昼食\n・お湯（当番・荷物担当）\n・着替え（必須）";
  const COACH_OPTIONS = ["丸尾コーチ", "健太郎コーチ"];
  const isEventSchedule = normalizeType(schedule.type) === "event";
  const isPracticeSchedule = normalizeType(schedule.type) === "practice";
  const [editing, setEditing] = useState(false);
  const [form, setForm] = useState({
    gatherTime: schedule.gatherTime || "",
    upTime: schedule.upTime || "",
    matchTime: schedule.matchTime || "",
    clothes: schedule.clothes || DEFAULT_CLOTHES,
    belongings: schedule.belongings || DEFAULT_BELONGINGS,
    duty: schedule.duty || "",
    dutyNote: schedule.dutyNote || "",
    luggagePerson: schedule.luggagePerson || "",
    firstAidPerson: schedule.firstAidPerson || schedule.luggagePerson || "",
    coach: schedule.coach || "丸尾コーチ",
    note: schedule.note || "",
    pdfUrl: schedule.pdfUrl || "",
    pdfName: schedule.pdfName || "",
  });
  const [saving, setSaving] = useState(false);
  const [pdfUploading, setPdfUploading] = useState(false);
  const [attend, setAttend] = useState({});
  const [eventAttend, setEventAttend] = useState([]);
  const [attendLoading, setAttendLoading] = useState(true);
  const [showClothes, setShowClothes] = useState(false);
  const [showBelongings, setShowBelongings] = useState(false);

  useEffect(() => {
    let cancelled = false;
    api(isEventSchedule ? "getEventAttend" : "getAttend", { scheduleId: schedule.id })
      .then(r => {
        if (cancelled) return;
        if (isEventSchedule) {
          setEventAttend(r.attend || []);
        } else {
          const map = {};
          (r.attend || []).forEach(a => {
            map[a.memberId] = a.status;
          });
          setAttend(map);
        }
        setAttendLoading(false);
      })
      .catch(() => setAttendLoading(false));
    return () => {
      cancelled = true;
    };
  }, [schedule.id, isEventSchedule]);

  const participants = members
    .filter(m => attend[m.id] === "○")
    .sort((a, b) => Number(a.number) - Number(b.number));

  const gradeGroups = {};
  participants.forEach(m => {
    const g = m.grade || "その他";
    if (!gradeGroups[g]) gradeGroups[g] = [];
    gradeGroups[g].push(m);
  });
  const eventTotals = eventAttend.reduce((acc, row) => ({
    adult: acc.adult + Number(row.adultCount || 0),
    child: acc.child + Number(row.childCount || 0),
    preschool: acc.preschool + Number(row.preschoolCount || 0),
  }), {adult:0, child:0, preschool:0});

  const toSurname = name => {
    if (!name) return name;
    if (String(name).endsWith("さん")) return name;
    const parts = String(name).split(/[ 　]/).filter(Boolean);
    return (parts[0] || String(name)) + "さん";
  };
  const cleanTime = v => {
    const s = String(v || "").trim();
    if (!s) return "";
    if (s.includes("1899-12-30")) return "";
    if (/^00:00(:00)?$/.test(s)) return "";
    const m = s.match(/(\d{2}:\d{2})/);
    return m ? m[1] : s;
  };
  const normalizePerson = name => String(toSurname(name || "")).replace(/\s+/g, "").trim();
  const dutyCountMap = {};
  const luggageCountMap = {};
  (schedules || []).forEach(s => {
    if (String(s.id || "") === String(schedule.id || "")) return;
    const dutyName = normalizePerson(s.duty || "");
    if (dutyName) dutyCountMap[dutyName] = (dutyCountMap[dutyName] || 0) + 1;
    const luggageName = normalizePerson(s.luggagePerson || "");
    if (luggageName) luggageCountMap[luggageName] = (luggageCountMap[luggageName] || 0) + 1;
  });
  const userNameOptions = [...new Set(
    (users || [])
      .map(u => toSurname(u.name || ""))
      .filter(Boolean)
  )].sort((a, b) => String(a).localeCompare(String(b), "ja"));
  const mapUrl = schedule.location
    ? "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(schedule.location)
    : "";
  const parsePdfItems = (urlRaw, nameRaw) => {
    const normalize = value => String(value || "").trim();
    const urlsText = normalize(urlRaw);
    const namesText = normalize(nameRaw);
    if (!urlsText) return [];
    try {
      const parsedUrls = JSON.parse(urlsText);
      if (Array.isArray(parsedUrls)) {
        if (parsedUrls.length && typeof parsedUrls[0] === "object") {
          return parsedUrls
            .map(item => ({ url: normalize(item.url), name: normalize(item.name) }))
            .filter(item => item.url);
        }
        let parsedNames = [];
        try { parsedNames = JSON.parse(namesText || "[]"); } catch (e) {}
        return parsedUrls
          .map((url, idx) => ({ url: normalize(url), name: normalize(parsedNames[idx]) }))
          .filter(item => item.url);
      }
    } catch (e) {}
    return [{ url: urlsText, name: namesText }];
  };
  const pdfItems = parsePdfItems(form.pdfUrl, form.pdfName);
  const pdfPreviewUrl = url => String(url || "").replace("/view?usp=sharing", "/preview").replace("/view", "/preview");
  const uploadPdf = async(file) => {

      alert("PDFファイルを選んでください");
      return;
    }

    try{
      const dataUrl = await readFileAsDataUrl(file);
      const base64 = dataUrl.split(",")[1] || "";

        scheduleId: schedule.id,
        fileName: file.name,
        mimeType: file.type || "application/pdf",
        base64,
      });
      setForm(p => ({ ...p, pdfUrl: r.pdfUrl || "", pdfName: r.pdfName || "" }));
      schedule.pdfUrl = r.pdfUrl || "";
      schedule.pdfName = r.pdfName || "";
      alert("PDFを添付しました");
    }catch(e){
      alert("PDFアップロードエラー: " + (e.message || e));
    }finally{
      setPdfUploading(false);
    }
  };
  const save = async () => {
    setSaving(true);
    await onSave({
      ...form,
      firstAidPerson: form.luggagePerson || "",
      date: schedule.date,
      title: schedule.title,
      location: schedule.location,
      type: schedule.type,

      onChange: e => setForm(p => syncLuggageToFirstAid
        ? { ...p, [k]: e.target.value, firstAidPerson: e.target.value }

      style: { ...css.inp, width: "100%" }
    },
      h("option", { value: "" }, "-- 未設定 --"),
      userNameOptions.map(name => {
        const cnt = countMap[normalizePerson(name)] || 0;
        return h("option", { key: k + "-" + name, value: name }, `${name}（${cnt}回）`);
      })
    ),
    form[k] && h("div", { style: { marginTop: 4, fontSize: 11, color: "#64748B" } },
      `これまで ${countMap[normalizePerson(form[k])] || 0}回`
    ),
    userNameOptions.length === 0 && h("div", { style: { marginTop: 4, fontSize: 11, color: "#F59E0B" } }, "ユーザー登録がありません")
  );

  const editContent = h(Fragment, {},
    !isEventSchedule && h("div", { style: { background: "#F8F9FA", borderRadius: 12, padding: 12, marginBottom: 14 } },
      h("div", { style: { fontSize: 11, fontWeight: 700, color: "#bbb", marginBottom: 10 } }, "時間"),

      h("div", { style: { fontSize: 11, fontWeight: 600, color: "#666", marginBottom: 4 } }, "服装・持ち物"),

        rows: 3,

      ),

// ── 配車セクション ────────────────────────────────────────────
function CarpoolSection({schedule, user, isAdmin, members, users=[]}) {
  const COACH_CANDIDATES = ["丸尾コーチ", "健太郎コーチ", "その他"];
  const ROLE_COLORS = { child:"#1D4ED8", adult:"#16A34A", coach:"#7C3AED" };
  const normalizeName = v => String(v||"").replace(/\s+/g," ").replace(/さん$/,"").trim();
  const currentUserProfile = (users || []).find(u => String(u.id || "") === String(user.id || "")) || user || {};
  const familyChoices = parseFamilyMembers(currentUserProfile.familyMembers || []);
  const luggageLabel = String(schedule.luggagePerson || "").trim();
  const luggageKey = normalizeName(luggageLabel);
  const [carpools, setCarpools] = useState([]);
  const [loading, setLoading] = useState(true);
  const [my, setMy] = useState({available:"", capacity:"", note:"", familyPlan:"", familyMembers:[]});
  const [saving, setSaving] = useState(false);
  const [saved,  setSaved]  = useState(false);
  const [attend, setAttend] = useState({});
  // 配車割り当て state: {memberId: carIndex} carIndex=0〜(cars.length-1)
  const [assignment, setAssignment] = useState({});
  const [assignMode, setAssignMode] = useState(false);
  // 各車のピックアップ情報 {userId: {place:"", time:""}}
  const [pickupInfo, setPickupInfo] = useState({});
  // 車ごとの追加情報 {userId: {highway:boolean, adultUser1:"", adultUser2:"", coach:"", coachOther:""}}
  const [carMeta, setCarMeta] = useState({});
  const adultUserOptions = [...new Set(
    (users || [])
      .map(u => String(u.name || "").trim())
      .filter(Boolean)
  )].sort((a,b)=>a.localeCompare(b,"ja"));
  const [planLoaded, setPlanLoaded] = useState(false);
  const pickupRows = userId => {
    const raw = pickupInfo[userId];
    if (Array.isArray(raw)) return raw;
    if (raw && typeof raw === "object") return [raw];
    return [{place:"",time:""}];
  };
  const setPickupRows = (userId, rows) => {
    setPickupInfo(p => ({...p, [userId]: rows}));
  };
  const getMeta = userId => ({
    highway: false,
    adultUser1: "",
    adultUser2: "",
    coach: "",
    coachOther: "",
    ...(carMeta[userId] || {})
  });
  const setMeta = (userId, patch) => {
    setCarMeta(prev => ({
      ...prev,
      [userId]: {
        highway: false,
        adultUser1: "",
        adultUser2: "",
        coach: "",
        coachOther: "",
        ...(prev[userId] || {}),
        ...patch
      }
    }));
  };
  const getAdultNames = userId => {
    const m = getMeta(userId);
    return [String(m.adultUser1 || "").trim(), String(m.adultUser2 || "").trim()].filter(Boolean);
  };
  const getCoachName = userId => {
    const m = getMeta(userId);
    if (m.coach === "その他") return String(m.coachOther || "").trim();
    return String(m.coach || "").trim();
  };
  const isLuggageCar = carUserName => {
    if (!luggageKey) return false;
    return normalizeName(carUserName) === luggageKey;
  };
  // 高速利用時は「運転手 + 同乗大人1名以上（合計大人2名）」を必須にする
  const hasEnoughAdultsForHighway = userId => {
    const m = getMeta(userId);
    const adults = getAdultNames(userId);
    return !m.highway || adults.length >= 1;
  };
  const toggleAssignMode = () => {
    if (assignMode) {
      const invalidCars = cars.filter(car => !hasEnoughAdultsForHighway(car.userId));
      if (invalidCars.length > 0) {
        alert("高速利用の車は「運転手 + 同乗大人1名以上（合計2名）」を設定してください。");
        return;
      }
    }
    setAssignMode(p => !p);
  };
  const showCarpoolRule = () => {
    alert([
      "【配車ルール】",
      "・配車できる場合は、必ず乗車人数を入力してください。",
      "・高速利用の車は、運転手 + 同乗大人1名以上（合計大人2名）が必要です。",
      "・同乗大人はユーザー一覧から選択してください（コーチ欄は別）。",
      "・集合場所と出発時間を入力してください。",
      "・変更が出たら、できるだけ早く更新してください。",
      "・安全第一（シートベルト着用・定員超過なし）でお願いします。"
    ].join("\n"));
  };
  useEffect(() => {
    setPlanLoaded(false);
    try {
      const raw = localStorage.getItem("afc_carpool_plan_" + schedule.id);
      if (raw) {
        const savedPlan = JSON.parse(raw);
        if (savedPlan && typeof savedPlan === "object") {
          if (savedPlan.assignment && typeof savedPlan.assignment === "object") setAssignment(savedPlan.assignment);
          if (savedPlan.pickupInfo && typeof savedPlan.pickupInfo === "object") setPickupInfo(savedPlan.pickupInfo);
          if (savedPlan.carMeta && typeof savedPlan.carMeta === "object") setCarMeta(savedPlan.carMeta);
        }
      }
    } catch (e) {}
    setPlanLoaded(true);
  }, [schedule.id]);
  useEffect(() => {
    if (!planLoaded) return;
    try {
      localStorage.setItem("afc_carpool_plan_" + schedule.id, JSON.stringify({
        assignment,
        pickupInfo,
        carMeta
      }));
    } catch (e) {}
  }, [schedule.id, assignment, pickupInfo, carMeta, planLoaded]);

  useEffect(()=>{
    let cancelled=false;
    Promise.all([
      api("getCarpool",{scheduleId:schedule.id}),
      api("getAttend",{scheduleId:schedule.id})
    ]).then(([cr,ar])=>{
      if(cancelled)return;
      setCarpools(cr.carpools||[]);
      const mine=(cr.carpools||[]).find(c=>c.userId===user.id);
      if(mine) setMy({
        available:mine.available||"",
        capacity:mine.capacity||"",
        note:mine.note||"",
        familyPlan:mine.familyPlan||"",
        familyMembers:parseFamilyMembers(mine.familyMembers||[])
      });
      const map={};
      (ar.attend||[]).forEach(a=>{map[a.memberId]=a.status;});
      setAttend(map);
      setLoading(false);
    }).catch(()=>setLoading(false));
    return ()=>{cancelled=true;};
  },[schedule.id]);

  const save=async()=>{
    if(!my.available) return alert("可否を選択してください");
    if(my.familyPlan==="行く" && parseFamilyMembers(my.familyMembers||[]).length===0){
      return alert("参加する家族を選択してください");
    }
    setSaving(true);
    const payload = {
      ...my,
      familyMembers: parseFamilyMembers(my.familyMembers || [])
    };
    await api("saveCarpool",{scheduleId:schedule.id,userId:user.id,userName:user.name,...payload});
    const next=[...carpools.filter(c=>c.userId!==user.id),{scheduleId:schedule.id,userId:user.id,userName:user.name,...payload}];
    setCarpools(next);
    setSaving(false);setSaved(true);setTimeout(()=>setSaved(false),2000);
  };

  const total=carpools.filter(c=>c.available==="可").reduce((a,c)=>a+Number(c.capacity||0),0);
  // 配車可の車リスト
  const cars=carpools.filter(c=>c.available==="可"&&Number(c.capacity||0)>0);
  // 参加者リスト（出欠○）
  const participants=members.filter(m=>attend[m.id]==="○").sort((a,b)=>Number(a.number)-Number(b.number));
  const seatSummary = ci => {
    const car = cars[ci];
    if (!car) return {cap:0, adults:0, coach:0, children:0, used:0, free:0, rawFree:0};
    const cap = Math.max(0, Number(car.capacity || 0));
    const adults = getAdultNames(car.userId).length;
    const coach = getCoachName(car.userId) ? 1 : 0;
    const children = participants.filter(m => assignment[m.id] === ci).length;
    const used = adults + coach + children;
    const rawFree = cap - used;
    return { cap, adults, coach, children, used, rawFree, free: Math.max(0, rawFree) };
  };
  const autoAssign = () => {
    if (participants.length === 0) {
      alert("参加者がいません。");
      return;
    }
    const enabledCars = cars
      .map((car, ci) => ({ car, ci }))
      .filter(({ car }) => hasEnoughAdultsForHighway(car.userId))
      .map(({ car, ci }) => {
        const reserved = getAdultNames(car.userId).length + (getCoachName(car.userId) ? 1 : 0);
        return { ci, remain: Number(car.capacity || 0) - reserved };
      })
      .filter(c => c.remain > 0);
    if (enabledCars.length === 0) {
      alert("割り当て可能な空席がありません（高速条件・同乗大人・定員を確認してください）。");
      return;
    }
    const next = {};
    const list = [...participants].sort((a,b)=>Number(a.number||99)-Number(b.number||99));
    list.forEach(m => {
      enabledCars.sort((a,b)=>b.remain-a.remain || a.ci-b.ci);
      const target = enabledCars.find(c => c.remain > 0);
      if (!target) return;
      next[m.id] = target.ci;
      target.remain -= 1;
    });
    setAssignment(next);
    const assignedCount = Object.keys(next).length;

function AttendSection({schedule, members, user, isAdmin}) {
  const isEventSchedule = normalizeType(schedule.type) === "event";
  const isGrade2OrBelow = (grade) => {
    const g = String(grade || "").trim();
    return ["2年","２年","1年","１年","年長","年中","年少"].includes(g);
  };
  const [attend, setAttend] = useState({});   // {memberId: status}
  const [eventAttend, setEventAttend] = useState([]);
  const [eventForm, setEventForm] = useState({adultCount:"0", childCount:"0", preschoolCount:"0"});
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState("");
  const [accompanying, setAccompanying] = useState([]); // 帯同メンバーIDリスト
  // 3年生メンバー
  const grade3 = members.filter(m=>m.grade==="3年"||m.grade==="３年");
  // 2年以下メンバー
  const under2 = members.filter(m=>isGrade2OrBelow(m.grade));

  // スケジュールの出欠を読み込み
  useEffect(() => {
    let cancelled = false;
    api(isEventSchedule ? "getEventAttend" : "getAttend", {scheduleId: schedule.id}).then(r => {
      if (cancelled) return;
      if (isEventSchedule) {
        const rows = r.attend || [];
        setEventAttend(rows);
        const mine = rows.find(a => String(a.userId) === String(user.id));
        if (mine) {
          setEventForm({
            adultCount: String(mine.adultCount || 0),
            childCount: String(mine.childCount || 0),
            preschoolCount: String(mine.preschoolCount || 0),
          });
        }
      } else {

// ── 試合一覧：月別タブコンポーネント ─────────────────────────
function MatchListByMonth({results,schedules,onGoToMatch}) {
  const getResultType = r => {
    const linked = schedules.find(s => s.id === r.scheduleId) || schedules.find(s => nd(s.date) === nd(r.date));
    return linked?.type || r.type || "";
  };
  // 月別グループ作成（降順）
  const groups = useMemo(() => {
    const map = {};
    results.forEach(r => {
      const d = nd(r.date);
      if (!d) return;
      const ym = d.slice(0,7); // "2026-03"
      if (!map[ym]) map[ym] = [];
      map[ym].push(r);
    });
    // 降順ソート
    return Object.entries(map)
      .sort((a,b) => b[0].localeCompare(a[0]))
      .map(([ym, rs]) => ({
        ym,
        label: Number(ym.slice(0,4)) + "年" + Number(ym.slice(5,7)) + "月",
        rs: rs.sort((a,b) => nd(b.date).localeCompare(nd(a.date))),
      }));
  }, [results]);

  const [selYm, setSelYm] = useState(() => groups[0]?.ym || "");

  // groupsが変わったとき（初回ロード）に選択月を最新にリセット
  useEffect(() => {
    if (groups.length && !groups.find(g=>g.ym===selYm)) {
      setSelYm(groups[0].ym);
    }
  }, [groups]);

  if (results.length === 0) {
    return h("div",{style:{textAlign:"center",padding:"40px",color:"#aaa",background:"#fff",borderRadius:16}},
      h("div",{style:{fontSize:40,marginBottom:10}},"🏆"),"試合記録がありません");
  }

  const cur = groups.find(g=>g.ym===selYm);
  const st = cur ? calcStats(cur.rs) : null;

  return h(Fragment,{},
    // 月タブ（横スクロール）
    h("div",{style:{overflowX:"auto",marginBottom:12,paddingBottom:4}},
      h("div",{style:{display:"flex",gap:6,width:"max-content"}},
        groups.map(g => {
          const active = g.ym === selYm;
          const mst = calcStats(g.rs);
          return h("div",{key:g.ym,onClick:()=>setSelYm(g.ym),
            style:{padding:"8px 14px",borderRadius:20,cursor:"pointer",flexShrink:0,textAlign:"center",
              background:active?"#1D4ED8":"#fff",
              color:active?"#fff":"#666",
              boxShadow:"0 2px 6px rgba(0,0,0,0.07)",
              border:active?"none":"1px solid #eee",
              fontWeight:active?700:400}},
            h("div",{style:{fontSize:12,whiteSpace:"nowrap"}},g.label),
            h("div",{style:{fontSize:10,opacity:0.8,marginTop:2}},g.rs.length+"試合 "+mst.wins+"勝"+mst.draws+"分"+mst.losses+"敗"))
        }))),

    // 月サマリー
    cur&&st&&h("div",{style:{background:"#fff",borderRadius:14,padding:"12px 16px",marginBottom:12,display:"flex",gap:16,alignItems:"center",boxShadow:"0 2px 6px rgba(0,0,0,0.05)"}},
      h("div",{style:{fontSize:13,fontWeight:800,color:"#1a1a2e",flex:1}},cur.label),
      h("div",{style:{display:"flex",gap:12,fontSize:13}},
        h("span",{style:{color:"#4CAF50",fontWeight:700}},st.wins+"勝"),
        h("span",{style:{color:"#FFC107",fontWeight:700}},st.draws+"分"),
        h("span",{style:{color:"#F44336",fontWeight:700}},st.losses+"敗"),
        h("span",{style:{color:"#666"}},st.gf+"得点 "+st.ga+"失点"))),

    // 試合リスト
    cur&&cur.rs.map(r=>{
      const tc=getTC(getResultType(r));
      const s=schedules.find(s=>s.id===r.scheduleId||nd(s.date)===nd(r.date));
      const dt=fmt(r.date);
      return h("div",{key:r.id,onClick:()=>onGoToMatch(r,s),
        style:{background:"#fff",borderRadius:14,padding:"13px 16px",marginBottom:8,
               boxShadow:"0 2px 8px rgba(0,0,0,0.06)",display:"flex",alignItems:"center",gap:12,cursor:"pointer"}},
        h("div",{style:{textAlign:"center",flexShrink:0,width:40}},
          h("div",{style:{fontSize:11,color:"#aaa"}},dt.short),
          h("div",{style:{fontSize:10,color:"#ccc"}},dt.dw)),
        h("div",{style:{width:3,height:44,background:tc.bg,borderRadius:2,flexShrink:0}}),
        h("div",{style:{flex:1,minWidth:0}},
          h("div",{style:{marginBottom:3}},
            h(Bdg,{label:tc.lb,color:tc.bg,small:true}),
            r.gameNumber?h("span",{style:{fontSize:10,color:"#bbb",marginLeft:5}},"第"+r.gameNumber+"試合"):"",
            r.formatLabel?h("span",{style:{fontSize:10,color:"#ccc",marginLeft:5}},r.formatLabel):""),
          h("div",{style:{fontSize:14,fontWeight:700,color:"#1a1a2e"}},"vs "+r.opponent),
          s?.location&&h("div",{style:{fontSize:11,color:"#aaa"}},"📍 "+s.location)),
        h("div",{style:{textAlign:"right",flexShrink:0}},
          h(ScoreLine,{our:r.ourScore,their:r.theirScore,size:18}),
          h("div",{style:{marginTop:3}},h(RWdg,{our:r.ourScore,their:r.theirScore}))));
    }));
}

    return normalizeType(row.type || linked?.type || "");

    if(typeF==="all") return true;

    return baseType===normalizeType(typeF);

// リフティング記録入力コンポーネント
function LiftingInput({members,liftings}) {
  const [selId,setSelId]=useState("");
  const [cnt,setCnt]=useState("");
  const [saving,setSaving]=useState(false);
  const [saved,setSaved]=useState(false);
  const sel=members.find(m=>m.id===selId);
  const existing=liftings.find(x=>x.memberId===selId);
  const save=async()=>{
    if(!selId||!cnt) return;
    setSaving(true);
    await api("saveLifting",{memberId:selId,memberName:sel?.name||"",count:Number(cnt),date:new Date().toISOString().slice(0,10)});
    // ローカル反映
    const lf=liftings.find(x=>x.memberId===selId);
    if(lf){lf.count=Number(cnt);}else{liftings.push({memberId:selId,memberName:sel?.name||"",count:Number(cnt)});}
    setSaving(false);setSaved(true);setTimeout(()=>setSaved(false),2000);
  };
  return h("div",{style:{background:"#fff",borderRadius:16,padding:18,marginBottom:12,boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}},
    h("div",{style:{fontSize:13,fontWeight:800,color:"#1a1a2e",marginBottom:14}},"📝 記録を入力・更新"),
    h("select",{value:selId,onChange:e=>setSelId(e.target.value),style:{...css.inp,width:"100%",marginBottom:10}},
      h("option",{value:""},"選手を選択..."),
      ["FW","MF","DF","GK"].map(pos=>{
        const ms=members.filter(m=>m.position===pos).sort((a,b)=>Number(a.number)-Number(b.number));
        return ms.length?h("optgroup",{key:pos,label:pos},ms.map(m=>h("option",{key:m.id,value:m.id},"#"+m.number+" "+m.name))):null;
      }),
      members.filter(m=>!["FW","MF","DF","GK"].includes(m.position)).length>0&&h("optgroup",{label:"その他"},
        members.filter(m=>!["FW","MF","DF","GK"].includes(m.position)).sort((a,b)=>Number(a.number)-Number(b.number)).map(m=>h("option",{key:m.id,value:m.id},"#"+m.number+" "+m.name)))),
    existing&&h("div",{style:{fontSize:12,color:"#aaa",marginBottom:8}},"現在の記録: "+existing.count+"回"),
    h("div",{style:{display:"flex",gap:10,alignItems:"center"}},
      h("input",{type:"number",value:cnt,onChange:e=>setCnt(e.target.value),placeholder:"記録（回）",min:"0",style:{...css.inp,flex:1,fontSize:18,fontWeight:900,textAlign:"center"}}),
      h("button",{onClick:save,disabled:saving||!selId||!cnt,style:{...css.bS,flexShrink:0,padding:"10px 18px",opacity:(!selId||!cnt)?0.4:1}},
        saved?"✓ 保存済":saving?"保存中...":"保存")));
}

// ── 日程タブ：カレンダー＋今月の予定＋日程追加 ─────────────────
function CalTab({schedules,results,isAdmin,onGoToDay,onAddSchedule}) {
  const today=new Date();
  const [year,setYear]=useState(today.getFullYear());
  const [month,setMonth]=useState(today.getMonth());
  const [modal,setModal]=useState(false);
  const [fs,setFs]=useState({date:"",allDay:true,timeFrom:"",timeTo:"",title:"",location:"",type:"official"});
  const todayStr=today.toISOString().slice(0,10);

  // 過去の場所一覧（重複除去）
  const pastLocations=[...new Set(schedules.map(s=>s.location).filter(Boolean))];

  // 公式戦・カップ戦のタイトル選択肢
  const TITLE_OPTS={
    official:["春季大会","夏季大会","秋季大会","冬季大会","リーグ戦","選手権","県大会","市大会","その他"],
    cup:["カップ戦","招待大会","フレンドリーマッチ","その他"],
    training:["練習試合","トレーニングマッチ","その他"],
    practice:[],
    event:["スポーツ交流","親子イベント","その他"],

  const saveSchedule=async()=>{
    const isPractice=fs.type==="practice";
    const isEvent=fs.type==="event";
    const titleVal=isPractice?"練習":fs.title;
    if(!fs.date) return alert("日付を入力してください");
    if(!titleVal) return alert("タイトルを入力してください");
    const dateVal=(!fs.allDay&&fs.timeFrom)?fs.date+"T"+fs.timeFrom:fs.date;
    const timeLabel=(!fs.allDay&&fs.timeFrom)?(fs.timeFrom+(fs.timeTo?" - "+fs.timeTo:"")):"";
    await onAddSchedule({...fs,title:titleVal,date:dateVal,timeLabel});
    setFs({date:"",allDay:true,timeFrom:"",timeTo:"",title:"",location:"",type:"official"});
    setModal(false);
  };

  // カレンダー計算
  const daysInMonth=new Date(year,month+1,0).getDate();
  const firstDay=new Date(year,month,1).getDay();
  const dayData={};
  schedules.forEach(s=>{
    const dd=nd(s.date); if(!dd) return;
    const [y,m,d]=dd.split("-").map(Number);
    if(y===year&&m===month+1){if(!dayData[d])dayData[d]=[];dayData[d].push(s);}
  });
  const cells=[]; for(let i=0;i<firstDay;i++)cells.push(null); for(let d=1;d<=daysInMonth;d++)cells.push(d);
  const weeks=[]; let row=[];
  cells.forEach(d=>{row.push(d);if(row.length===7){weeks.push(row);row=[];}});
  if(row.length>0){while(row.length<7)row.push(null);weeks.push(row);}
  const prev=()=>{if(month===0){setYear(y=>y-1);setMonth(11);}else setMonth(m=>m-1);};
  const next=()=>{if(month===11){setYear(y=>y+1);setMonth(0);}else setMonth(m=>m+1);};

  return h(Fragment,{},
// ── カレンダー本体
h("div",{style:{background:"#fff",borderRadius:16,padding:16,marginBottom:12,boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}},

  h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}},
    h("button",{onClick:prev,style:{background:"#F0F4F8",border:"none",borderRadius:8,width:36,height:36,fontSize:20,cursor:"pointer"}},"‹"),
    h("div",{style:{fontSize:17,fontWeight:800,color:"#1a1a2e"}},year+"年 "+(month+1)+"月"),
    h("button",{onClick:next,style:{background:"#F0F4F8",border:"none",borderRadius:8,width:36,height:36,fontSize:20,cursor:"pointer"}},"›")
  ),

  h("div",{style:{display:"grid",gridTemplateColumns:"repeat(7,minmax(0,1fr))",marginBottom:6}},
    ["日","月","火","水","木","金","土"].map((d,i)=>h("div",{key:d,style:{textAlign:"center",fontSize:11,fontWeight:700,color:i===0?"#F44336":i===6?"#2196F3":"#aaa",padding:"4px 0"}},d))
  ),

  weeks.map((wk,wi)=>h("div",{key:wi,style:{display:"grid",gridTemplateColumns:"repeat(7,minmax(0,1fr))",gap:2}},
    wk.map((d,di)=>{
      if(!d) return h("div",{key:di});
      const dStr=`${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      const evs=dayData[d]||[];

      const primaryEvent = evs[0] || null;

        h("div",{style:{fontSize:13,fontWeight:isToday?900:400,color:isToday?"#fff":di===0?"#F44336":di===6?"#2196F3":"#1a1a2e"}},d),

          h("div",{style:{fontSize:8,fontWeight:800,color:isToday?"#fff":typeColor,lineHeight:1.2,whiteSpace:"nowrap",overflow:"hidden"}},
            typeLabel+(moreCount>0?` +${moreCount}`:"")),

            primaryEvent?.title||"予定")
        )
      );
    })
  )),

  // 凡例＋追加ボタン
  h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}},
    h("div",{style:{display:"flex",gap:10,flexWrap:"wrap"}},
      [{c:"#4CAF50",l:"練習"},{c:"#1D4ED8",l:"公式戦"},{c:"#2563EB",l:"トレマ"},{c:"#0F172A",l:"カップ戦"},{c:"#009688",l:"イベント"}].map(x=>

      h("button",{onClick:()=>setModal(true),style:{...css.bO,padding:"7px 14px",fontSize:12,whiteSpace:"nowrap"}},"+ 日程追加"))

),
    // ── 今月の予定リスト
    h("div",{style:{fontSize:11,fontWeight:700,color:"#bbb",letterSpacing:2,marginBottom:10}},"今月の予定"),

            evs.map(e=>{
              const tc=getTC(e.type);
              const dayR=results.filter(r=>r.scheduleId===e.id||nd(r.date)===nd(e.date));
              // クリックでその日のまとめページへ
              const clickEv=()=>onGoToDay(e);
              return h("div",{key:e.id,onClick:clickEv,
                style:{display:"flex",gap:10,alignItems:"center",marginBottom:6,

                  padding:"8px 10px",borderRadius:10,

                h("div",{style:{width:4,height:42,background:tc.bg,borderRadius:2,flexShrink:0}}),

function InfoTab({news,isAdmin,user,onAdd,onDelete,onUpdate}) {
  const [openId,setOpenId]=useState("");
  const [createModal,setCreateModal]=useState(false);
  const [editModal,setEditModal]=useState(false);
  const [saving,setSaving]=useState(false);
  const [fd,setFd]=useState({title:"",content:"",file:null});
  const [ed,setEd]=useState({id:"",title:"",content:"",attachmentUrl:"",attachmentName:"",file:null,removeAttachment:false});

  const items=(news||[])
    .filter(n=>(n.category||"")==="資料")
    .sort((a,b)=>new Date(String(b.date||0)).getTime()-new Date(String(a.date||0)).getTime())
    .map(n=>({
      id:String(n.id||""),
      title:n.title||"資料",
      content:n.content||"",
      date:n.date||"",
      author:n.author||"",
      attachmentUrl:n.attachmentUrl||"",
      attachmentName:n.attachmentName||"",
    }));

  const uploadAttachment = async (file) => {
    if(!file) return {attachmentUrl:"",attachmentName:""};
    if(Number(file.size||0) > 20*1024*1024) throw new Error("添付ファイルは20MB以下にしてください");
    const dataUrl = await readFileAsDataUrl(file);
    const base64 = String(dataUrl||"").split(",")[1] || "";
    if(!base64) throw new Error("添付ファイルの読み込みに失敗しました");
    const uploaded = await api("uploadNewsAttachment",{
      fileName: file.name || "document",
      mimeType: file.type || "application/octet-stream",
      base64
    });
    return {
      attachmentUrl: uploaded.url || "",
      attachmentName: uploaded.name || file.name || ""
    };
  };

  const saveDoc=async()=>{
    if(saving) return;
    if(!fd.title||!fd.content) return alert("タイトルと内容を入力してください");
    setSaving(true);
    try{
      const uploaded = fd.file ? await uploadAttachment(fd.file) : {attachmentUrl:"",attachmentName:""};
      await onAdd({
        title:fd.title,
        content:fd.content,
        category:"資料",
        author:user.name,
        attachmentUrl:uploaded.attachmentUrl,
        attachmentName:uploaded.attachmentName
      });
      setFd({title:"",content:"",file:null});
      setCreateModal(false);
    }catch(e){
      alert("資料保存エラー: " + (e && e.message ? e.message : e));
    }
    setSaving(false);
  };

  const startEdit = item => {
    setEd({
      id:item.id,
      title:item.title||"",
      content:item.content||"",
      attachmentUrl:item.attachmentUrl||"",
      attachmentName:item.attachmentName||"",
      file:null,
      removeAttachment:false
    });
    setEditModal(true);
  };

  const saveEdit = async () => {
    if(saving) return;
    if(!ed.id) return alert("更新対象が見つかりません");
    if(!ed.title||!ed.content) return alert("タイトルと内容を入力してください");
    setSaving(true);
    try{
      let attachmentUrl = ed.removeAttachment ? "" : (ed.attachmentUrl||"");
      let attachmentName = ed.removeAttachment ? "" : (ed.attachmentName||"");
      if(ed.file){
        const uploaded = await uploadAttachment(ed.file);
        attachmentUrl = uploaded.attachmentUrl;
        attachmentName = uploaded.attachmentName;
      }
      await onUpdate({
        id:ed.id,
        title:ed.title,
        content:ed.content,
        category:"資料",
        author:user.name,
        attachmentUrl,
        attachmentName
      });
      setEditModal(false);
    }catch(e){
      alert("資料更新エラー: " + (e && e.message ? e.message : e));
    }
    setSaving(false);
  };

  const renderItem=(item)=>{
    const opened=openId===item.id;
    return h("div",{key:item.id,style:{background:"#fff",borderRadius:14,marginBottom:10,boxShadow:"0 2px 8px rgba(0,0,0,0.05)",overflow:"hidden"}},
      h("button",{onClick:()=>setOpenId(opened?"":item.id),style:{width:"100%",display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,padding:"14px 14px",border:"none",background:"#fff",cursor:"pointer"}},
        h("div",{style:{fontSize:14,fontWeight:800,color:"#1E293B",textAlign:"left",flex:1,minWidth:0,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},item.title),
        h("div",{style:{fontSize:16,color:"#94A3B8",fontWeight:800,flexShrink:0}},opened?"−":"+")
      ),
      opened ? h("div",{style:{padding:"0 14px 14px",borderTop:"1px solid #F1F5F9"}},
        h("div",{style:{fontSize:13,color:"#334155",lineHeight:1.8,whiteSpace:"pre-wrap",marginTop:10}},item.content||"（内容なし）"),
        item.attachmentUrl ? h("a",{href:item.attachmentUrl,target:"_blank",rel:"noopener noreferrer",
          style:{display:"inline-flex",alignItems:"center",marginTop:10,padding:"6px 10px",borderRadius:8,background:"#DBEAFE",color:"#1D4ED8",fontSize:12,fontWeight:700,textDecoration:"none"}},
          "📎 " + (item.attachmentName || "添付資料を開く")
        ) : null,
        (item.date||item.author) ? h("div",{style:{fontSize:11,color:"#94A3B8",marginTop:10}},
          (item.date?fmt(item.date).short:"") + (item.author?` / ${item.author}`:"")
        ) : null,
        isAdmin ? h("div",{style:{marginTop:10,display:"flex",gap:8,justifyContent:"flex-end"}},
          h("button",{onClick:()=>startEdit(item),style:{border:"none",background:"#DBEAFE",color:"#1D4ED8",fontSize:12,fontWeight:700,padding:"6px 10px",borderRadius:8,cursor:"pointer"}},"編集"),
          h("button",{onClick:()=>onDelete(item.id),style:{border:"none",background:"#FEE2E2",color:"#B91C1C",fontSize:12,fontWeight:700,padding:"6px 10px",borderRadius:8,cursor:"pointer"}},"削除")
        ) : null
      ) : null
    );
  };

  return h(Fragment,{},
    h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}},
      h("div",{style:{fontSize:11,fontWeight:700,color:"#94A3B8",letterSpacing:1.2}},"資料・FAQ"),
      isAdmin ? h("button",{onClick:()=>setCreateModal(true),style:{...css.bO,padding:"8px 12px",fontSize:12,borderRadius:12}},"+ 追加") : null
    ),
    h("div",{style:{fontSize:12,color:"#64748B",marginBottom:12,lineHeight:1.6}},"チーム運営に必要な情報をためていく"),
    items.length===0 ? h("div",{style:{background:"#fff",borderRadius:14,padding:20,textAlign:"center",color:"#94A3B8",fontSize:13}},"資料はまだありません") : null,
    items.map(renderItem),

    createModal ? h(Modal,{title:"資料を追加",onClose:()=>setCreateModal(false)},
      h("div",{style:{marginBottom:14}},
        h("div",{style:{fontSize:12,fontWeight:600,color:"#666",marginBottom:6}},"タイトル"),
        h("input",{value:fd.title,onChange:e=>setFd(p=>({...p,title:e.target.value})),placeholder:"例：会計ルール（2026年度）",style:css.inp})
      ),
      h("div",{style:{marginBottom:20}},
        h("div",{style:{fontSize:12,fontWeight:600,color:"#666",marginBottom:6}},"内容"),
        h("textarea",{value:fd.content,onChange:e=>setFd(p=>({...p,content:e.target.value})),rows:8,placeholder:"手順・注意事項・リンクなど",style:{...css.inp,resize:"none"}})
      ),
      h("div",{style:{marginBottom:20}},
        h("div",{style:{fontSize:12,fontWeight:600,color:"#666",marginBottom:6}},"資料添付"),
        h("input",{type:"file",onChange:e=>setFd(p=>({...p,file:(e.target.files&&e.target.files[0])?e.target.files[0]:null})),style:{...css.inp,padding:"8px 10px"}}),
        fd.file ? h("div",{style:{fontSize:11,color:"#64748B",marginTop:6,wordBreak:"break-all"}},"選択中: " + fd.file.name + " (" + Math.ceil((Number(fd.file.size||0)/1024)) + "KB)") : null
      ),
      h("div",{style:{display:"flex",gap:10}},
        h("button",{onClick:()=>{ if(saving) return; setCreateModal(false); },style:css.bG},saving?"処理中...":"キャンセル"),
        h("button",{onClick:saveDoc,disabled:saving,style:{...css.bS,opacity:saving?0.7:1,cursor:saving?"wait":"pointer"}},saving?"保存中...":"保存する")
      )
    ) : null,

    editModal ? h(Modal,{title:"資料を編集",onClose:()=>setEditModal(false)},
      h("div",{style:{marginBottom:14}},
        h("div",{style:{fontSize:12,fontWeight:600,color:"#666",marginBottom:6}},"タイトル"),
        h("input",{value:ed.title,onChange:e=>setEd(p=>({...p,title:e.target.value})),style:css.inp})
      ),
      h("div",{style:{marginBottom:14}},
        h("div",{style:{fontSize:12,fontWeight:600,color:"#666",marginBottom:6}},"内容"),
        h("textarea",{value:ed.content,onChange:e=>setEd(p=>({...p,content:e.target.value})),rows:8,style:{...css.inp,resize:"none"}})
      ),
      h("div",{style:{marginBottom:14}},
        h("div",{style:{fontSize:12,fontWeight:600,color:"#666",marginBottom:6}},"添付資料"),
        ed.attachmentUrl ? h("a",{href:ed.attachmentUrl,target:"_blank",rel:"noopener noreferrer",style:{display:"inline-block",fontSize:12,color:"#1D4ED8",fontWeight:700,textDecoration:"none",marginBottom:8}},
          "現在の添付: " + (ed.attachmentName || "添付資料を開く")
        ) : h("div",{style:{fontSize:12,color:"#94A3B8",marginBottom:8}},"現在の添付はありません"),
        h("input",{type:"file",onChange:e=>setEd(p=>({...p,file:(e.target.files&&e.target.files[0])?e.target.files[0]:null,removeAttachment:false})),style:{...css.inp,padding:"8px 10px"}}),
        h("button",{onClick:()=>setEd(p=>({...p,removeAttachment:!p.removeAttachment,file:null})),
          style:{marginTop:8,border:"1px solid #CBD5E1",background:ed.removeAttachment?"#FEE2E2":"#fff",color:ed.removeAttachment?"#B91C1C":"#475569",borderRadius:8,padding:"6px 10px",fontSize:12,fontWeight:700,cursor:"pointer"}},
          ed.removeAttachment?"添付を削除して保存する":"添付を削除する")
      ),
      h("div",{style:{display:"flex",gap:10}},
        h("button",{onClick:()=>{ if(saving) return; setEditModal(false); },style:css.bG},saving?"処理中...":"キャンセル"),
        h("button",{onClick:saveEdit,disabled:saving,style:{...css.bS,opacity:saving?0.7:1,cursor:saving?"wait":"pointer"}},saving?"保存中...":"更新する")
      )
    ) : null
  );
}

function MemberTab({members,liftings=[]}) {
  const [pos,setPos]=useState("all");
  const [gradeF,setGradeF]=useState("3年");
  const allowedGrades = ["3年","３年","2年","２年","1年","１年"];
  const gradeOrder = {"3年":0,"３年":0,"2年":1,"２年":1,"1年":2,"１年":2};
  const grades=["3年",...[...new Set(members.map(m=>m.grade||"").filter(g=>g&&g!=="3年"&&g!=="３年"&&allowedGrades.includes(g)))].sort((a,b)=>(gradeOrder[a]??99)-(gradeOrder[b]??99)),"全員"];
  const baseMembers = members.filter(m=>allowedGrades.includes(m.grade||""));
  const gradeFiltered=gradeF==="全員"
    ? baseMembers
    : baseMembers.filter(m=>(m.grade||"")===(gradeF==="3年"?"3年":gradeF)||(m.grade||"")===(gradeF==="3年"?"３年":gradeF));
  const filtered=pos==="all"?gradeFiltered:gradeFiltered.filter(m=>m.position===pos);
  const sorted=[...filtered].sort((a,b)=>Number(a.number||99)-Number(b.number||99));
  return h(Fragment,{},
    // 学年フィルター
    h("div",{style:{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}},
      grades.map(g=>h("button",{key:g,onClick:()=>setGradeF(g),
        style:{padding:"5px 12px",border:"2px solid "+(gradeF===g?"#1D4ED8":"#eee"),borderRadius:20,
          background:gradeF===g?"#1D4ED8":"#fff",color:gradeF===g?"#fff":"#666",
          fontSize:12,fontWeight:gradeF===g?700:400,cursor:"pointer"}},g))),
    // ポジションフィルター
    h("div",{style:{display:"flex",gap:6,marginBottom:14,flexWrap:"wrap"}},
      [{k:"all",l:"全員"},{k:"FW",l:"FW"},{k:"MF",l:"MF"},{k:"DF",l:"DF"},{k:"GK",l:"GK"}].map(t=>
        h("button",{key:t.k,onClick:()=>setPos(t.k),
          style:{padding:"6px 14px",border:`2px solid ${pos===t.k?"#1D4ED8":"#eee"}`,
            borderRadius:20,background:pos===t.k?"#1D4ED8":"#fff",
            color:pos===t.k?"#fff":"#666",fontSize:12,fontWeight:pos===t.k?700:400,cursor:"pointer"}},t.l))),
    // 選手カード一覧
    sorted.map(m=>{
      const pc=PC[m.position]||{bg:"#999"};
      const lf=liftings.find(x=>x.memberId===m.id);
      return h("div",{key:m.id,style:{background:"#fff",borderRadius:16,padding:16,marginBottom:10,
        boxShadow:"0 2px 8px rgba(0,0,0,0.06)",display:"flex",alignItems:"center",gap:14}},
        h("div",{style:{width:48,height:48,borderRadius:12,background:pc.bg,
          display:"flex",alignItems:"center",justifyContent:"center",
          color:"#fff",fontSize:20,fontWeight:900,flexShrink:0}},m.number||"?"),
        h("div",{style:{flex:1}},
          h("div",{style:{fontSize:16,fontWeight:800,color:"#1a1a2e",marginBottom:3}},m.name),
          h("div",{style:{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}},
            h("span",{style:{fontSize:11,fontWeight:700,color:pc.bg,background:pc.bg+"22",borderRadius:6,padding:"2px 8px"}},m.position||"?"),
            h("span",{style:{fontSize:11,color:"#aaa"}},m.grade||""),
            lf&&h("span",{style:{fontSize:11,color:"#4CAF50",background:"#E8F5E9",borderRadius:6,padding:"2px 8px"}},"🏃 "+lf.count+"回"))));
    }));

function SettingsTab({user,users=[],members,notificationEnabled,notificationBusy,onToggleNotifications,onUpdateProfile}) {
  const currentUserProfile = (users || []).find(u => String(u.id || "") === String(user.id || "")) || user;
  const child = members.find(m => String(m.id || "") === String(currentUserProfile.memberId || ""));
  const familyListView = parseFamilyMembers(currentUserProfile.familyMembers || []);
  const [editing,setEditing] = useState(false);
  const [name,setName] = useState(currentUserProfile.name || "");
  const [memberId,setMemberId] = useState(currentUserProfile.memberId || "");
  const [familyText,setFamilyText] = useState(familyListView.join("\n"));
  const [saving,setSaving] = useState(false);

  useEffect(()=>{
    const latest = (users || []).find(u => String(u.id || "") === String(user.id || "")) || user;
    setName(latest.name || "");
    setMemberId(latest.memberId || "");
    setFamilyText(parseFamilyMembers(latest.familyMembers || []).join("\n"));
  },[user.id,user.name,user.memberId,JSON.stringify((users||[]).map(u=>[u.id,u.familyMembers]))]);

  const generations = [...new Set(members.map(m=>String(m.generation||"").trim()).filter(Boolean))].sort((a,b)=>Number(b)-Number(a));
  const memberOptions = generations.flatMap(gen => {
    const grouped = members
      .filter(m => String(m.generation || "").trim() === gen)
      .sort((a,b)=>Number(a.number||999)-Number(b.number||999));
    if (!grouped.length) return [];
    return [h("optgroup",{key:gen,label:`${gen}期生`},
      grouped.map(m=>h("option",{key:m.id,value:m.id},`${m.name} #${m.number||"-"} (${m.grade||""})`))
    )];
  });

  const save = async() => {
    setSaving(true);
    try{
      await onUpdateProfile({name, memberId, familyMembers: parseFamilyMembers(familyText)});
      setEditing(false);
      alert("設定を保存しました");
    }catch(e){
      alert("設定保存エラー: " + e.message);
    }
    setSaving(false);
  };

  return h(Fragment,{},
    h("div",{style:{background:"#fff",borderRadius:16,padding:18,marginBottom:12,boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}} ,

          h("textarea",{value:familyText,onChange:e=>setFamilyText(e.target.value),rows:4,placeholder:"例:\n父\n母\n妹",style:{...css.inp,resize:"none"}})),
        h("div",{style:{display:"flex",gap:10}},
          h("button",{onClick:()=>{setEditing(false);setName(currentUserProfile.name||"");setMemberId(currentUserProfile.memberId||"");setFamilyText(parseFamilyMembers(currentUserProfile.familyMembers||[]).join("\n"));},style:css.bG},"キャンセル"),
          h("button",{onClick:save,disabled:saving||!name||!memberId,style:{...css.bS,opacity:(!name||!memberId)?0.5:1}},saving?"保存中...":"保存する")))
      : h(Fragment,{},
        h("div",{style:{fontSize:12,color:"#888",marginBottom:8}},"メールアドレス"),

  const [liftings,setLiftings]=useState([]);
  const [users,setUsers]=useState([]);
  const [notificationPermission,setNotificationPermission]=useState(()=>("Notification" in window ? Notification.permission : "unsupported"));
  const [notificationEnabled,setNotificationEnabled]=useState(false);
  const [notificationBusy,setNotificationBusy]=useState(false);
  const isAdmin=user?.role==="admin";

  const load=useCallback(async(msg="読み込み中...")=>{
    setLoadMsg(msg);setLoading(true);
    try{
      const d=await api("getAll");
      setMembers((d.members||[]).map(normalizeMember));
      setSchedules(d.schedules||[]);
      setResults(d.results||[]);
      setNews(d.news||[]); setLiftings(d.liftings||[]);
      setUsers(d.users||[]);
    }catch(e){alert("読み込みエラー: "+e.message);}
    setLoading(false);
  },[]);
  useEffect(()=>{if(user)load();},[user]);
  useEffect(()=>{
    if(!user || !("serviceWorker" in navigator) || !("PushManager" in window)) {
      setNotificationEnabled(false);
      return;
    }
    getCurrentPushSubscription()
      .then(sub=>setNotificationEnabled(!!sub && Notification.permission==="granted"))
      .catch(()=>setNotificationEnabled(false));
  },[user,notificationPermission]);
  useEffect(()=>{
    if(!user || schedules.length===0 || !("Notification" in window)) return;
    setNotificationPermission(Notification.permission);
    if(Notification.permission!=="granted") return;
    maybeNotifyDeadlines(schedules).catch(()=>{});
    maybeNotifyUpcomingEvents(schedules).catch(()=>{});
  },[user,schedules]);
  const handleEnableNotifications=async()=>{
    if(notificationBusy) return;
    setNotificationBusy(true);
    try{
      if(notificationEnabled){
        await unsubscribeWebPush();
        setNotificationEnabled(false);
        alert("通知をOFFにしました");
        return;
      }
      const p=await enableNotifications();
      setNotificationPermission(p);
      if(p==="granted"){
        try{
          await subscribeWebPush(user);
        }catch(e){
          alert("通知購読エラー: "+(e&&e.message?e.message:"不明なエラー"));
          return;
        }
        setNotificationEnabled(true);
        setTimeout(()=>{ maybeNotifyDeadlines(schedules).catch(()=>{}); },0);
        setTimeout(()=>{ maybeNotifyUpcomingEvents(schedules).catch(()=>{}); },0);
        alert("通知をONにしました");
      }else if(p==="denied"){
        alert("ブラウザで通知がブロックされています");
      }else if(p==="default"){
        alert("通知の許可が完了しませんでした");
      }else{
        alert("この端末では通知に対応していません");
      }
    }catch(e){
      alert("通知ボタン処理エラー: "+(e&&e.message?e.message:"不明なエラー"));
    }finally{
      setNotificationBusy(false);
    }
  };

  // ── ハンドラ（全てここで定義）─────────────────────────────────
  const goToMatch=(r,s)=>setPage({type:"matchDetail",match:r,schedule:s});
  const goToDay  =(s)  =>setPage({type:"dayDetail",schedule:s});
  const openDashTab = (nextTab) => {
    setDashInitialTab(nextTab || "result");
    setTab("dash");
  };
  const goBack   =()   =>setPage(null);

  const handleAddResult=async fr=>{
    setLoading(true);setLoadMsg("追加中...");
    try{
      await api("addResult",{result:{
        scheduleId:fr.scheduleId,date:fr.date,opponent:fr.opponent,
        formatLabel:fr.formatLabel||"",gameNumber:fr.gameNumber||1,
        type:fr.type,memo:""
      }});
      await load("更新中...");
    }catch(e){alert("エラー: "+e.message);}
    setLoading(false);
    setPage({type:"dayDetail",schedule:page?.schedule||fr});
  };
  const handleAddSchedule=async fs=>{
    setLoading(true);setLoadMsg("追加中...");
    try{await api("addSchedule",{schedule:fs});await load("更新中...");}
    catch(e){alert("エラー: "+e.message);}
    setLoading(false);
  };
  const handleSaveMvp=async(scheduleId,mvpName)=>{
    try{await api("updateMvp",{scheduleId,mvp:mvpName});await load("更新中...");}
    catch(e){alert("MVP保存エラー: "+e.message);}
  };
  const handleDeleteResult=async(r)=>{
    if(!confirm("「vs "+r.opponent+"」を削除しますか？"))return;
    setLoading(true);setLoadMsg("削除中...");
    try{await api("deleteResult",{id:r.id});await load("更新中...");}
    catch(e){alert("削除エラー: "+e.message);}
    setLoading(false);
  };
  const handleDeleteSchedule=async(s)=>{
    if(!confirm("「"+(s.title||"この日程")+"」を削除しますか？"))return;
    setLoading(true);setLoadMsg("削除中...");
    try{
      await api("deleteSchedule",{id:s.id});
      await load("更新中...");
      setPage(null);
    }catch(e){alert("削除エラー: "+e.message);}
    setLoading(false);
  };
  const [editResult,setEditResult]=useState(null);
  const handleAddNews=async n=>{
    setLoading(true);setLoadMsg("投稿中...");
    try{await api("addNews",{news:n});await load("更新中...");}
    catch(e){alert("エラー: "+e.message);}
    setLoading(false);
  };
  const handleDeleteNews=async id=>{
    if(!confirm("削除しますか？"))return;
    setLoading(true);
    try{await api("deleteNews",{id});await load("更新中...");}
    catch(e){alert("エラー: "+e.message);}
    setLoading(false);
  };
  const handleUpdateNews=async n=>{
    setLoading(true);setLoadMsg("更新中...");
    try{await api("updateNews",{news:n});await load("更新中...");}
    catch(e){alert("エラー: "+e.message);}
    setLoading(false);
  };
  const handleUpdateProfile=async({name,memberId,familyMembers=[]})=>{
    const r=await api("updateUserProfile",{userId:user.id,name,memberId,familyMembers});
    saveUser({...user,...r.user});
    await load("更新中...");
  };

  // ── ページルーティング ────────────────────────────────────────
  if(!user) return h(Login,{onLogin:saveUser});

  if(page?.type==="matchDetail") return h(Fragment,{},
    loading&&h(Loader,{msg:loadMsg}),
    h(GoalPage,{
      match:page.match,schedule:page.schedule,members,isAdmin,
      onHome:goBack,
      onBack:()=>setPage({type:"dayDetail",schedule:page.schedule}),
      onSaved:async()=>{
        await load("更新中...");
        setPage({type:"dayDetail",schedule:page.schedule});
      }
    }));

  if(page?.type==="addMatch") return h(Fragment,{},
    loading&&h(Loader,{msg:loadMsg}),
    h(AddMatchModal,{
      schedule:page.schedule,results,
      onSave:handleAddResult,
      onClose:()=>setPage({type:"dayDetail",schedule:page.schedule})
    }));

  if(page?.type==="dayDetail") return h(Fragment,{},
    loading&&h(Loader,{msg:loadMsg}),
    editResult&&h(EditResultModal,{result:editResult,members,onSave:async fr=>{
      setLoading(true);setLoadMsg("更新中...");
      try{await api("updateResult",{result:fr});await load("更新中...");}
      catch(e){alert("更新エラー: "+e.message);}
      setLoading(false);setEditResult(null);
    },onClose:()=>setEditResult(null)}),
    h(DayPage,{
      schedule:page.schedule,results,schedules,members,isAdmin,user,users,
      onGoToMatch:(r,s)=>setPage({type:"matchDetail",match:r,schedule:s}),
      onAdd:s=>setPage({type:"addMatch",schedule:s}),
      onEdit:r=>setEditResult(r),
      onDelete:handleDeleteResult,
      onDeleteSchedule:handleDeleteSchedule,
      onBack:goBack,
      onHome:goBack,
      onSaveMvp:handleSaveMvp,
    }));

  // ── 通常タブ画面 ──────────────────────────────────────────────
  const TABS=[
    {k:"home",   i:"🏠",l:"ホーム"},
    {k:"cal",    i:"📅",l:"日程"},
    {k:"match",  i:"⚽",l:"試合"},
    {k:"dash",   i:"📊",l:"成績"},
    {k:"member", i:"👥",l:"選手"},
    {k:"memo",   i:"📝",l:"メモ"},
    {k:"docs",   i:"📚",l:"資料"},
    ...(isAdmin?[{k:"settings",i:"⚙️",l:"設定"}]:[]),
  ];
  const currentTabContent =
    tab==="home" ? h(HomeTab,{results,schedules,news,members,isAdmin,onGoToMatch:goToMatch,onGoToDay:goToDay,onOpenDashTab:openDashTab,onOpenTab:setTab})
    : tab==="cal" ? h(CalTab,{schedules,results,isAdmin,onGoToDay:goToDay,onAddSchedule:handleAddSchedule})
    : tab==="match" ? h(MatchTab,{results,schedules,members,isAdmin,onGoToMatch:goToMatch})
    : tab==="dash" ? h(DashTab,{results,members,schedules,liftings,isAdmin,initialDashTab:dashInitialTab,onGoToMatch:goToMatch})
    : tab==="member" ? h(MemberTab,{members,liftings})
    : tab==="memo" ? h(MemoTab,{news,isAdmin,user,onAdd:handleAddNews,onDelete:handleDeleteNews})
    : tab==="docs" ? h(InfoTab,{news,isAdmin,user,onAdd:handleAddNews,onDelete:handleDeleteNews,onUpdate:handleUpdateNews})
    : tab==="settings" ? h(SettingsTab,{user,users,members,notificationEnabled,notificationBusy,onToggleNotifications:handleEnableNotifications,onUpdateProfile:handleUpdateProfile})
    : null;

  return h(Fragment,{},
    loading && h(Loader,{msg:loadMsg}),
    h("div",{className:"page"},
      h(AppHeader,{user,onLogout:()=>saveUser(null),onRefresh:()=>load("更新中..."),notificationEnabled,notificationBusy,onEnableNotifications:handleEnableNotifications}),
      h("div",{style:{background:"#fff",margin:"0 16px",borderRadius:16,marginTop:-24,boxShadow:"0 4px 20px rgba(0,0,0,0.12)",overflow:"hidden",position:"relative",zIndex:10,marginBottom:16}},
        h("div",{style:{display:"flex"}},
          TABS.map(t=>h("button",{key:t.k,onClick:()=>setTab(t.k),style:{flex:1,padding:"11px 2px 9px",border:"none",background:tab===t.k?"#1D4ED8":"transparent",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:2}},
            h("span",{style:{fontSize:17}},t.i),
            h("span",{style:{fontSize:9,fontWeight:tab===t.k?700:400,color:tab===t.k?"#fff":"#aaa"}},t.l)
          ))
        )
      ),
      h("div",{style:{padding:"12px 16px 0"}}, currentTabContent)
    )
  );
}
render(h(App,{}), document.getElementById("app"));

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js?v=9").catch(() => {});
  });
}
</script>
</body>
</html>
