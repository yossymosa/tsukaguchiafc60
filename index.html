// ── チャットタブ ─────────────────────────────────────────────────
function ChatTab({user,canWrite}) {
  const [messages,setMessages] = useState([]);
  const [text,setText] = useState("");
  const [loading,setLoading] = useState(true);
  const [sending,setSending] = useState(false);
  const [error,setError] = useState("");

  const fmtChatTime = (v) => {
    const d = new Date(String(v || ""));
    if (isNaN(d.getTime())) return "";
    return `${String(d.getMonth() + 1).padStart(2, "0")}/${String(d.getDate()).padStart(2, "0")} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  };

  const loadMessages = useCallback(async (silent = false) => {
    if (!silent) setLoading(true);
    try {
      const res = await api("getChatMessages", { userId: user.id, limit: 200 });
      setMessages(Array.isArray(res.messages) ? res.messages : []);
      setError("");
    } catch (e) {
      setError(e && e.message ? e.message : "取得エラー");
    }
    if (!silent) setLoading(false);
  }, [user.id]);

  useEffect(() => {
    let active = true;
    const run = async (silent = false) => {
      if (!active) return;
      await loadMessages(silent);
    };
    run(false);
    const timer = setInterval(() => { run(true); }, 2000);
    return () => {
      active = false;
      clearInterval(timer);
    };
  }, [loadMessages]);

  const sendMessage = async () => {
    const content = String(text || "").trim();
    if (!content) return;
    if (!canWrite) return alert("閲覧専用アカウントでは投稿できません");
    if (sending) return;
    setSending(true);
    try {
      const optimistic = {
        id: "tmp_" + Date.now(),
        date: new Date().toISOString(),
        userId: user.id,
        userName: user.name,
        content,
      };
      setMessages(prev => [...prev, optimistic]);
      setText("");
      await api("sendChatMessage", {
        userId: user.id,
        userName: user.name,
        content,
      });
      await loadMessages(true);
    } catch (e) {
      alert("送信エラー: " + (e && e.message ? e.message : e));
      await loadMessages(true);
    }
    setSending(false);
  };

  const renderMessage = (m) => {
    const mine = String(m.userId || "") === String(user.id || "");
    return h("div", { key: m.id, style: { display: "flex", justifyContent: mine ? "flex-end" : "flex-start", marginBottom: 8 } },
      h("div", { style: { maxWidth: "82%", background: mine ? "#1D4ED8" : "#F8FAFC", color: mine ? "#fff" : "#1E293B", border: mine ? "none" : "1px solid #E2E8F0", borderRadius: 12, padding: "8px 10px" } },
        !mine && h("div", { style: { fontSize: 10, fontWeight: 700, color: "#64748B", marginBottom: 3 } }, m.userName || ""),
        h("div", { style: { fontSize: 13, lineHeight: 1.5, whiteSpace: "pre-wrap", wordBreak: "break-word" } }, m.content || ""),
        h("div", { style: { fontSize: 10, marginTop: 4, color: mine ? "rgba(255,255,255,0.78)" : "#94A3B8", textAlign: "right" } }, fmtChatTime(m.date))
      )
    );
  };

  return h(Fragment, {},
    h("div", { style: { background: "#fff", borderRadius: 16, padding: 14, marginBottom: 12, boxShadow: "0 2px 8px rgba(0,0,0,0.06)" } },
      h("div", { style: { fontSize: 13, fontWeight: 800, color: "#1a1a2e", marginBottom: 4 } }, "💬 チームチャット"),
      h("div", { style: { fontSize: 11, color: "#94A3B8" } }, "2秒ごと自動更新（無料版）"),
      error && h("div", { style: { fontSize: 11, color: "#DC2626", marginTop: 8 } }, error)
    ),
    h("div", { style: { background: "#fff", borderRadius: 16, padding: 12, boxShadow: "0 2px 8px rgba(0,0,0,0.06)", minHeight: 360, maxHeight: 480, overflowY: "auto", marginBottom: 12 } },
      loading
        ? h("div", { style: { textAlign: "center", color: "#94A3B8", fontSize: 13, padding: "40px 0" } }, "読み込み中...")
        : (messages.length === 0
            ? h("div", { style: { textAlign: "center", color: "#94A3B8", fontSize: 13, padding: "40px 0" } }, "まだメッセージはありません")
            : messages.map(renderMessage))
    ),
    canWrite
      ? h("div", { style: { background: "#fff", borderRadius: 16, padding: 12, boxShadow: "0 2px 8px rgba(0,0,0,0.06)" } },
          h("textarea", {
            value: text,
            onInput: e => setText(e.target.value),
            onChange: e => setText(e.target.value),
            placeholder: "メッセージを入力",
            rows: 2,
            onKeyDown: e => {
              if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
              }
            },
            style: { ...css.inp, resize: "none", marginBottom: 8 }
          }),
          h("div", { style: { fontSize: 11, color: "#94A3B8", marginBottom: 8 } }, "Enterで送信 / Shift+Enterで改行"),
          h("div", { style: { display: "flex", justifyContent: "flex-end" } },
            h("button", {
              onClick: sendMessage,
              disabled: sending || !String(text || "").trim(),
              style: {
                border: "none",
                borderRadius: 10,
                minWidth: 92,
                padding: "10px 16px",
                fontSize: 13,
                fontWeight: 800,
                cursor: (sending || !String(text || "").trim()) ? "not-allowed" : "pointer",
                background: (sending || !String(text || "").trim()) ? "#93C5FD" : "#1D4ED8",
                color: "#fff",
                boxShadow: "0 2px 8px rgba(29,78,216,0.25)"
              }
            }, sending ? "送信中..." : "送信")
          )
        )
      : h("div", { style: { background: "#fff", borderRadius: 16, padding: 14, boxShadow: "0 2px 8px rgba(0,0,0,0.06)", fontSize: 12, color: "#94A3B8" } }, "閲覧専用アカウントです")
  );
}

// ── 資料/FAQタブ ────────────────────────────────────────────────
function InfoTab({news,isAdmin,user,onAdd,onDelete,onUpdate}) {
  const [openId,setOpenId]=useState("");
  const [createModal,setCreateModal]=useState(false);
  const [editModal,setEditModal]=useState(false);
  const [saving,setSaving]=useState(false);
  const [fd,setFd]=useState({title:"",content:"",file:null});
  const [ed,setEd]=useState({id:"",title:"",content:"",attachmentUrl:"",attachmentName:"",file:null,removeAttachment:false});

  const items=(news||[])
    .filter(n=>(n.category||"")==="資料")
    .sort((a,b)=>new Date(String(b.date||0)).getTime()-new Date(String(a.date||0)).getTime())
    .map(n=>({
      id:String(n.id||""),
      title:n.title||"資料",
      content:n.content||"",
      date:n.date||"",
      author:n.author||"",
      attachmentUrl:n.attachmentUrl||"",
      attachmentName:n.attachmentName||"",
    }));
  const attachmentPreviewUrl = url => String(url || "").replace("/view?usp=sharing", "/preview").replace("/view", "/preview");
  const isPdfAttachment = item => {
    const url = String(item?.attachmentUrl || "");
    const name = String(item?.attachmentName || "");
    return /\.pdf($|[?#])/i.test(url) || /\.pdf($|[?#])/i.test(name);
  };

  const uploadAttachment = async (file) => {
    if(!file) return {attachmentUrl:"",attachmentName:""};
    if(Number(file.size||0) > 20*1024*1024) throw new Error("添付ファイルは20MB以下にしてください");
    const dataUrl = await readFileAsDataUrl(file);
    const base64 = String(dataUrl||"").split(",")[1] || "";
    if(!base64) throw new Error("添付ファイルの読み込みに失敗しました");
    const uploaded = await api("uploadNewsAttachment",{
      fileName: file.name || "document",
      mimeType: file.type || "application/octet-stream",
      base64
    });
    return {
      attachmentUrl: uploaded.url || "",
      attachmentName: uploaded.name || file.name || ""
    };
  };

  const saveDoc=async()=>{
    if(saving) return;
    if(!fd.title||!fd.content) return alert("タイトルと内容を入力してください");
    setSaving(true);
    try{
      const uploaded = fd.file ? await uploadAttachment(fd.file) : {attachmentUrl:"",attachmentName:""};
      await onAdd({
        title:fd.title,
        content:fd.content,
        category:"資料",
        author:user.name,
        attachmentUrl:uploaded.attachmentUrl,
        attachmentName:uploaded.attachmentName
      });
      setFd({title:"",content:"",file:null});
      setCreateModal(false);
    }catch(e){
      alert("資料保存エラー: " + (e && e.message ? e.message : e));
    }
    setSaving(false);
  };

  const startEdit = item => {
    setEd({
      id:item.id,
      title:item.title||"",
      content:item.content||"",
      attachmentUrl:item.attachmentUrl||"",
      attachmentName:item.attachmentName||"",
      file:null,
      removeAttachment:false
    });
    setEditModal(true);
  };

  const saveEdit = async () => {
    if(saving) return;
    if(!ed.id) return alert("更新対象が見つかりません");
    if(!ed.title||!ed.content) return alert("タイトルと内容を入力してください");
    setSaving(true);
    try{
      let attachmentUrl = ed.removeAttachment ? "" : (ed.attachmentUrl||"");
      let attachmentName = ed.removeAttachment ? "" : (ed.attachmentName||"");
      if(ed.file){
        const uploaded = await uploadAttachment(ed.file);
        attachmentUrl = uploaded.attachmentUrl;
        attachmentName = uploaded.attachmentName;
      }
      await onUpdate({
        id:ed.id,
        title:ed.title,
        content:ed.content,
        category:"資料",
        author:user.name,
        attachmentUrl,
        attachmentName
      });
      setEditModal(false);
    }catch(e){
      alert("資料更新エラー: " + (e && e.message ? e.message : e));
    }
    setSaving(false);
  };

  const renderItem=(item)=>{
    const opened=openId===item.id;
    return h("div",{key:item.id,style:{background:"#fff",borderRadius:14,marginBottom:10,boxShadow:"0 2px 8px rgba(0,0,0,0.05)",overflow:"hidden"}},
      h("button",{onClick:()=>setOpenId(opened?"":item.id),style:{width:"100%",display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,padding:"14px 14px",border:"none",background:"#fff",cursor:"pointer"}},
        h("div",{style:{fontSize:14,fontWeight:800,color:"#1E293B",textAlign:"left",flex:1,minWidth:0,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},item.title),
        h("div",{style:{fontSize:16,color:"#94A3B8",fontWeight:800,flexShrink:0}},opened?"−":"+")

          h("button",{onClick:()=>startEdit(item),style:{border:"none",background:"#DBEAFE",color:"#1D4ED8",fontSize:12,fontWeight:700,padding:"6px 10px",borderRadius:8,cursor:"pointer"}},"編集"),
          h("button",{onClick:()=>onDelete(item.id),style:{border:"none",background:"#FEE2E2",color:"#B91C1C",fontSize:12,fontWeight:700,padding:"6px 10px",borderRadius:8,cursor:"pointer"}},"削除")

    items.map(renderItem),

    createModal ? h(Modal,{title:"資料を追加",onClose:()=>setCreateModal(false)},
      h("div",{style:{marginBottom:14}},

        fd.file ? h("div",{style:{fontSize:11,color:"#64748B",marginTop:6,wordBreak:"break-all"}},"選択中: " + fd.file.name + " (" + Math.ceil((Number(fd.file.size||0)/1024)) + "KB)") : null
      ),
      h("div",{style:{display:"flex",gap:10}},
        h("button",{onClick:()=>{ if(saving) return; setCreateModal(false); },style:css.bG},saving?"処理中...":"キャンセル"),
        h("button",{onClick:saveDoc,disabled:saving,style:{...css.bS,opacity:saving?0.7:1,cursor:saving?"wait":"pointer"}},saving?"保存中...":"保存する")
      )
    ) : null,

    editModal ? h(Modal,{title:"資料を編集",onClose:()=>setEditModal(false)},
      h("div",{style:{marginBottom:14}},
        h("div",{style:{fontSize:12,fontWeight:600,color:"#666",marginBottom:6}},"タイトル"),
        h("input",{value:ed.title,onChange:e=>setEd(p=>({...p,title:e.target.value})),style:css.inp})
      ),
      h("div",{style:{marginBottom:14}},
        h("div",{style:{fontSize:12,fontWeight:600,color:"#666",marginBottom:6}},"内容"),
        h("textarea",{value:ed.content,onChange:e=>setEd(p=>({...p,content:e.target.value})),rows:8,style:{...css.inp,resize:"none"}})
      ),
      h("div",{style:{marginBottom:14}},
        h("div",{style:{fontSize:12,fontWeight:600,color:"#666",marginBottom:6}},"添付資料"),
        ed.attachmentUrl ? h("a",{href:ed.attachmentUrl,target:"_blank",rel:"noopener noreferrer",style:{display:"inline-block",fontSize:12,color:"#1D4ED8",fontWeight:700,textDecoration:"none",marginBottom:8}},
          "現在の添付: " + (ed.attachmentName || "添付資料を開く")
        ) : h("div",{style:{fontSize:12,color:"#94A3B8",marginBottom:8}},"現在の添付はありません"),
        h("input",{type:"file",onChange:e=>setEd(p=>({...p,file:(e.target.files&&e.target.files[0])?e.target.files[0]:null,removeAttachment:false})),style:{...css.inp,padding:"8px 10px"}}),
        h("button",{onClick:()=>setEd(p=>({...p,removeAttachment:!p.removeAttachment,file:null})),
          style:{marginTop:8,border:"1px solid #CBD5E1",background:ed.removeAttachment?"#FEE2E2":"#fff",color:ed.removeAttachment?"#B91C1C":"#475569",borderRadius:8,padding:"6px 10px",fontSize:12,fontWeight:700,cursor:"pointer"}},
          ed.removeAttachment?"添付を削除して保存する":"添付を削除する")
      ),
      h("div",{style:{display:"flex",gap:10}},
        h("button",{onClick:()=>{ if(saving) return; setEditModal(false); },style:css.bG},saving?"処理中...":"キャンセル"),
        h("button",{onClick:saveEdit,disabled:saving,style:{...css.bS,opacity:saving?0.7:1,cursor:saving?"wait":"pointer"}},saving?"保存中...":"更新する")
      )
    ) : null
  );
}

// ── その日の試合まとめページ ─────────────────────────────────────
function DayPage({schedule,results,schedules,members,isAdmin,canWrite,user,users=[],initialTab="",onGoToMatch,onAdd,onEdit,onDelete,onDeleteSchedule,onBack,onHome,onSaveMvp}) {
  const isEventDay = normalizeType(schedule.type) === "event";
  const isPracticeDay = normalizeType(schedule.type) === "practice";
  const isSimpleDay = isEventDay || isPracticeDay;
  const canUseReviewTab = !isSimpleDay && !!isAdmin;
  const resolveDayTab = raw => {
    const fallback = isSimpleDay ? "detail" : "matches";
    const v = String(raw || "").trim();
    if (isSimpleDay) return (v === "detail" || v === "attend") ? v : fallback;
    const allowed = canUseReviewTab
      ? ["matches","detail","attend","carpool","settlement","album","review"]
      : ["matches","detail","attend","carpool","settlement","album"];
    return allowed.includes(v) ? v : fallback;
  };
  const [dayTab,setDayTab]=useState(()=>resolveDayTab(initialTab)); // "matches"|"detail"|"attend"|"carpool"|"settlement"|"album"
  const tc=getTC(schedule.type);
  const dt=fmt(schedule.date);
  const dayR=results
    .filter(r=>r.scheduleId===schedule.id||nd(r.date)===nd(schedule.date))
    .sort((a,b)=>Number(a.gameNumber||1)-Number(b.gameNumber||1));

  // 合計スコア集計
  const totalOur=dayR.reduce((a,r)=>a+Number(r.ourScore||0),0);
  const totalTheir=dayR.reduce((a,r)=>a+Number(r.theirScore||0),0);
  const st=calcStats(dayR);

  // 公式戦・カップ戦のみ
  const isTournamentTarget=["official","cup","公式戦","カップ戦"].includes(schedule.type);
  const [mvp,setMvp]=useState(schedule.mvp||"");
  const [mvpSaving,setMvpSaving]=useState(false);
  const [rank,setRank]=useState(schedule.rank||"");
  const [rankSaving,setRankSaving]=useState(false);
  const extractTimeFromDate = value => {
    const s = String(value || "");
    const m = s.match(/T(\d{1,2}:\d{2})/);
    return m ? `${String(Number(m[1].split(":")[0])).padStart(2, "0")}:${m[1].split(":")[1]}` : "";
  };
  const parseTimeLabelRange = value => {
    const s = String(value || "");
    const m = s.match(/(\d{1,2}:\d{2})\s*-\s*(\d{1,2}:\d{2})/);
    if (!m) return { from: "", to: "" };
    return {
      from: `${String(Number(m[1].split(":")[0])).padStart(2, "0")}:${m[1].split(":")[1]}`,
      to: `${String(Number(m[2].split(":")[0])).padStart(2, "0")}:${m[2].split(":")[1]}`
    };
  };
  const buildEditScheduleForm = sch => {
    const dateOnly = nd(sch?.date || "") || "";
    const range = parseTimeLabelRange(sch?.timeLabel || "");
    const from = String(sch?.timeFrom || "").trim() || extractTimeFromDate(sch?.date || "") || range.from;
    const to = String(sch?.timeTo || "").trim() || range.to;
    const hasTime = !!from;
    const allDayRaw = sch?.allDay;
    const allDay = (allDayRaw === true || String(allDayRaw).toLowerCase() === "true")
      ? true
      : (allDayRaw === false || String(allDayRaw).toLowerCase() === "false")
        ? false
        : !hasTime;
    return {
      date: dateOnly,
      allDay,
      timeFrom: from,
      timeTo: to,
      title: sch?.title || "",
      location: sch?.location || "",
      type: sch?.type || "practice",
      deadline: sch?.deadline || "",
      carpoolDeadline: sch?.carpoolDeadline || "",
      memo: sch?.memo || ""
    };
  };
  const [editSch,setEditSch]=useState(false);
  const [editSchSaving,setEditSchSaving]=useState(false);
  const [schForm,setSchForm]=useState(()=>buildEditScheduleForm(schedule));
  const [hpModal,setHpModal]=useState(false);
  const [hpText,setHpText]=useState("");
  const [ytModal,setYtModal]=useState(false);
  const [ytCopied,setYtCopied]=useState("");
  const [aiDraft,setAiDraft]=useState("");
  const [aiResult,setAiResult]=useState("");
  const [aiLoading,setAiLoading]=useState(false);
  const [aiDraftSaved,setAiDraftSaved]=useState(false);
  const [memoToAiState,setMemoToAiState]=useState(""); // "" | "loading" | "done"
  const [hpCopied,setHpCopied]=useState(false);
  const hpDraftOwner = encodeURIComponent(String(user?.email || user?.id || user?.name || "anon").trim().toLowerCase());
  const hpDraftKey = "afc_hp_ai_draft_" + (schedule?.id || "") + "_" + hpDraftOwner;
  const loadAiDraft = ()=>{
    try{
      return localStorage.getItem(hpDraftKey) || "";
    }catch(e){
      return "";
    }
  };
  const saveAiDraft = ()=>{
    try{
      localStorage.setItem(hpDraftKey, aiDraft || "");
      setAiDraftSaved(true);
      setTimeout(()=>setAiDraftSaved(false),1800);
    }catch(e){
      alert("下書き保存エラー: " + e.message);
    }
  };
  const getMergedHpText = ()=>{
    const base = String(hpText || "").trim();
    const generated = String(aiResult || "").trim();
    return [base, generated].filter(Boolean).join("\n\n");
  };
  const scheduleMemoText = String(schedule.memo || "").trim();
  const matchMemoRows = dayR
    .filter(r => String(r?.memo || "").trim())
    .map((r, idx) => {
      const gameNo = String(r?.gameNumber || (idx + 1)).trim();
      const opp = String(r?.opponent || "相手未設定").trim();
      const head = `第${gameNo}試合 vs ${opp}`;
      return { head, memo: String(r.memo || "").trim() };
    });
  const matchMemoSourceText = matchMemoRows
    .map(row => `${row.head}\n${row.memo}`)
    .join("\n\n");
  useEffect(()=>{
    setDayTab(resolveDayTab(initialTab));
  },[schedule.id,isSimpleDay,canUseReviewTab,initialTab]);
  useEffect(()=>{
    setSchForm(buildEditScheduleForm(schedule));
  },[schedule.id]);
  const saveEditSch=async()=>{
    setEditSchSaving(true);
    try{
      const nextType = normalizeType(schForm.type) || schForm.type;
      const dateOnly = nd(schForm.date) || schForm.date;
      const timeFrom = String(schForm.timeFrom || "").trim();
      const timeTo = String(schForm.timeTo || "").trim();
      const allDay = !!schForm.allDay;
      const nextDate = (!allDay && timeFrom) ? (dateOnly + "T" + timeFrom) : dateOnly;
      const nextTimeLabel = (!allDay && timeFrom) ? (timeFrom + (timeTo ? " - " + timeTo : "")) : "";
      await api("updateSchedule",{schedule:{
        ...schForm,
        id:schedule.id,
        type:nextType,
        date:nextDate,
        allDay,
        timeFrom: allDay ? "" : timeFrom,
        timeTo: allDay ? "" : timeTo,
        timeLabel: nextTimeLabel,
        mvp:schedule.mvp||"",
        deadline:schForm.deadline||"",
        carpoolDeadline:schForm.carpoolDeadline||""
      }});
      schedule.date = nextDate;
      schedule.allDay = allDay;
      schedule.timeFrom = allDay ? "" : timeFrom;
      schedule.timeTo = allDay ? "" : timeTo;
      schedule.timeLabel = nextTimeLabel;
      schedule.title = schForm.title;
      schedule.location = schForm.location;
      schedule.type = nextType;
      schedule.deadline = schForm.deadline || "";
      schedule.carpoolDeadline = schForm.carpoolDeadline || "";
      schedule.memo = schForm.memo || "";
      setEditSch(false);
    }catch(e){
      alert("日程更新エラー: " + e.message);
    }
    setEditSchSaving(false);
  };
  const saveMvp=async()=>{
    setMvpSaving(true);
    await onSaveMvp(schedule.id,mvp);
    setMvpSaving(false);
  };
  const saveRank=async()=>{
    setRankSaving(true);
    await api("updateSchedule",{schedule:{id:schedule.id,rank}});
    schedule.rank=rank;
    setRankSaving(false);
  };
  const openHpModal=()=>{
    const text=makeHpTemplate(schedule,dayR);
    setHpText(text);
    setAiDraft(loadAiDraft());
    setAiResult("");
    setMemoToAiState("");
    setHpModal(true);
  };
  const runAi=async()=>{
    if(!aiDraft.trim())return;
    setAiLoading(true);
    try{
      const prompt="あなたは少年サッカーチーム「塚口AFCjr」の広報担当です。\n"+
        "以下の入力内容だけをもとに、HPに載せる自然な文章を作成してください。\n\n"+
        "【当日の試合内容・AIへの指示】\n"+aiDraft.trim()+
        "\n\n出力は本文テキストのみ。前置きや説明は不要です。";
      const d=await api("aiGenerate",{prompt});
      if(d.text) setAiResult(String(d.text).trim());
    }catch(e){alert("AI生成エラー: "+e.message);}
    setAiLoading(false);
  };
  const copyHp=()=>{
    copyToClipboard(getMergedHpText());
    setHpCopied(true);setTimeout(()=>setHpCopied(false),2000);
  };
  const copyYtTemplateText=(text,key)=>{
    copyToClipboard(text);
    setYtCopied(key);
    setTimeout(()=>setYtCopied(""),1800);
  };
  const summarizeMatchMemoToAi=async()=>{
    if(!matchMemoSourceText || memoToAiState==="loading") return;
    setMemoToAiState("loading");
    try{
      const prompt =
        "あなたは少年サッカーチームの広報補助です。\n" +
        "以下は同じ日程内の複数試合メモです。\n" +
        "内容を重複なく整理し、HP記事の下書きに使いやすいように日本語でやさしく要約してください。\n" +
        "出力形式は必ず次の条件に従ってください。\n" +
        "1. 箇条書き（各行の先頭は「・」）\n" +
        "2. 4〜8行\n" +
        "3. 各行は体言止め（名詞句で終了）\n" +
        "4. 「しました」「されました」「です」「ます」などの文末は禁止\n" +
        "5. 句点「。」は使わない\n\n" +
        "【試合メモ】\n" + matchMemoSourceText;
      const d = await api("aiGenerate",{prompt});
      const summarized = String(d?.text || "").trim() || matchMemoSourceText;
      setAiDraft(prev=>{
        const cur = String(prev || "").trim();
        return cur ? (cur + "\n\n" + summarized) : summarized;
      });
      setMemoToAiState("done");
      setTimeout(()=>setMemoToAiState(""),2000);
    }catch(e){
      alert("試合メモ要約エラー: " + e.message);
      setMemoToAiState("");
    }
  };

  return h("div",{className:"page"},
    editSchSaving&&h(Loader,{msg:"更新中..."}),
    // HP用テンプレモーダル
    hpModal&&h(Modal,{title:"📋 HP用テンプレ",onClose:()=>setHpModal(false)},
      h("div",{style:{marginBottom:12}},
        h("div",{style:{fontSize:12,fontWeight:700,color:"#334155",marginBottom:6}},"テキスト（手編集）"),
        h("textarea",{value:hpText,onChange:e=>setHpText(e.target.value),rows:14,
          style:{...css.inp,resize:"vertical",minHeight:220,fontSize:13,lineHeight:1.85,fontFamily:"monospace"}})),
      h("div",{style:{marginBottom:10}},
        h("div",{style:{fontSize:12,fontWeight:700,color:"#0F172A",marginBottom:6}},"✨ AI入力（当日の試合内容・指示）"),
        h("textarea",{value:aiDraft,onChange:e=>setAiDraft(e.target.value),
          placeholder:"例：前半は守備が安定、後半は右サイドから崩して得点\n例：保護者への感謝コメントを2文追加",
          rows:7,style:{...css.inp,resize:"vertical",minHeight:130,fontSize:13,lineHeight:1.75}})),
      h("div",{style:{display:"flex",gap:8,marginBottom:10}},
        h("button",{onClick:summarizeMatchMemoToAi,disabled:!matchMemoSourceText || memoToAiState==="loading",
          style:{flex:1,padding:"10px 12px",border:"1px solid #BFDBFE",borderRadius:10,
            background:(!matchMemoSourceText || memoToAiState==="loading")?"#E2E8F0":"#EFF6FF",
            color:(!matchMemoSourceText || memoToAiState==="loading")?"#94A3B8":"#1D4ED8",
            fontSize:12,fontWeight:700,cursor:(!matchMemoSourceText || memoToAiState==="loading")?"not-allowed":"pointer"}},
          memoToAiState==="loading" ? "✨ 要約中..." :
          memoToAiState==="done" ? "✓ AI入力へ反映済み" :
          "📝 試合メモをAIで要約"),
        matchMemoSourceText && h("div",{style:{flex:1,fontSize:11,color:"#64748B",lineHeight:1.55,background:"#F8FAFC",border:"1px solid #E2E8F0",borderRadius:10,padding:"8px 10px",whiteSpace:"pre-wrap",maxHeight:92,overflow:"auto"}},
          matchMemoSourceText),
        !matchMemoSourceText && scheduleMemoText && h("div",{style:{flex:1,fontSize:11,color:"#64748B",lineHeight:1.55,background:"#F8FAFC",border:"1px solid #E2E8F0",borderRadius:10,padding:"8px 10px",whiteSpace:"pre-wrap",maxHeight:92,overflow:"auto"}},
          scheduleMemoText)),
      h("div",{style:{display:"flex",gap:8,marginBottom:10}},
        h("button",{onClick:saveAiDraft,
          style:{flex:1,padding:"10px 12px",border:"1px solid #CBD5E1",borderRadius:10,background:"#fff",
            color:"#334155",fontSize:12,fontWeight:700,cursor:"pointer"}},
          aiDraftSaved?"✓ 下書き保存済み":"💾 下書き保存"),
        h("button",{onClick:runAi,disabled:aiLoading||!aiDraft.trim(),
          style:{flex:2,padding:"10px 12px",border:"none",borderRadius:10,
            background:aiLoading||!aiDraft.trim()?"#CBD5E1":"linear-gradient(135deg,#1D4ED8,#2563EB)",
            color:"#fff",fontSize:13,fontWeight:700,cursor:aiLoading||!aiDraft.trim()?"not-allowed":"pointer"}},
          aiLoading?"✨ 生成中...":"✨ AIで文章作成")),
      h("div",{style:{marginBottom:12}},
        h("div",{style:{fontSize:12,fontWeight:700,color:"#334155",marginBottom:6}},"AIで作成した文章（編集可）"),
        h("textarea",{value:aiResult,onChange:e=>setAiResult(e.target.value),rows:10,
          placeholder:"AI生成後にここへ表示されます",
          style:{...css.inp,resize:"vertical",minHeight:170,fontSize:13,lineHeight:1.8}})),
      h("div",{style:{fontSize:11,color:"#64748B",marginBottom:8}},"コピー時は「テキスト」→「AI作成文」の順で結合されます。"),
      h("div",{style:{display:"flex",gap:8}},
        h("button",{onClick:copyHp,
          style:{flex:1,padding:14,border:"none",borderRadius:12,
            background:hpCopied?"#16A34A":"#1D4ED8",color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer"}},
          hpCopied?"✓ コピー済":"📋 結合してコピー"),
        h("button",{onClick:()=>{
          const subject=encodeURIComponent((schedule.title||"試合結果")+" "+fmt(schedule.date).full);
          const body=encodeURIComponent(getMergedHpText());
          window.location.href="mailto:t.afcjr@gmail.com?subject="+subject+"&body="+body;
        },style:{flex:1,padding:14,border:"none",borderRadius:12,
          background:"#F59E0B",color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer"}},
        "📧 メールで送る"))),
    // YouTubeテンプレモーダル
    ytModal&&h(Modal,{title:"🎬 YouTubeテンプレ",onClose:()=>setYtModal(false)},
      dayR.length===0
        ? h("div",{style:{fontSize:13,color:"#64748B",lineHeight:1.8}},"この日程に試合がないため、YouTubeテンプレを作成できません。")
        : h("div",{style:{display:"flex",flexDirection:"column",gap:12}},
            dayR.map((r,idx)=>{
              const halfs = getHalfOptionsByFormatLabel(r.formatLabel || "", r.goals || [], r.theirGoals || []);
              const keys = ["full", ...halfs];
              return h("div",{key:r.id||(`${schedule.id}-${idx}`),style:{border:"1px solid #E2E8F0",borderRadius:12,padding:10,background:"#F8FAFC"}},
                h("div",{style:{fontSize:12,fontWeight:800,color:"#0F172A",marginBottom:8}},
                  `第${r.gameNumber || (idx+1)}試合 vs ${r.opponent || "相手"}`),
                h("div",{style:{display:"flex",flexDirection:"column",gap:8}},
                  keys.map(k=>{
                    const halfKey = k==="full" ? "" : k;
                    const halfLabel = k==="full" ? "FULL" : k;
                    const title = makeYtTitle(r, schedule, halfKey);
                    const desc = makeYtDesc(r, members, halfKey);
                    return h("div",{key:`${r.id||idx}-${k}`,style:{background:"#fff",border:"1px solid #E2E8F0",borderRadius:10,padding:"8px 10px"}},
                      h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,marginBottom:6}},
                        h("div",{style:{fontSize:11,fontWeight:900,color:"#334155"}},halfLabel),
                        h("div",{style:{display:"flex",gap:6}},
                          h("button",{onClick:()=>copyYtTemplateText(title,`t-${r.id||idx}-${k}`),
                            style:{border:"1px solid #BFDBFE",background:"#EFF6FF",color:"#1D4ED8",borderRadius:8,padding:"5px 8px",fontSize:11,fontWeight:700,cursor:"pointer"}},
                            ytCopied===`t-${r.id||idx}-${k}`?"✓ タイトル":"タイトル"),
                          h("button",{onClick:()=>copyYtTemplateText(desc,`d-${r.id||idx}-${k}`),
                            style:{border:"1px solid #FECACA",background:"#FFF1F2",color:"#DC2626",borderRadius:8,padding:"5px 8px",fontSize:11,fontWeight:700,cursor:"pointer"}},
                            ytCopied===`d-${r.id||idx}-${k}`?"✓ 概要":"概要")
                        )
                      ),
                      h("div",{style:{fontSize:11,color:"#64748B",lineHeight:1.5,wordBreak:"break-all"}},title)
                    );
                  })
                )
              );
            })
          )
    ),
    // 日程編集モーダル
    editSch&&h(Modal,{title:"📅 日程を編集",onClose:()=>!editSchSaving&&setEditSch(false)},
      h("div",{style:{marginBottom:12}},
        h("div",{style:{fontSize:12,fontWeight:600,color:"#666",marginBottom:6}},"種類"),
        h("div",{style:{display:"flex",gap:6,flexWrap:"wrap"}},
          [{k:"practice",l:"練習"},{k:"official",l:"公式戦"},{k:"training",l:"トレマ"},{k:"cup",l:"カップ戦"},{k:"event",l:"イベント"}].map(t=>
            h("button",{key:t.k,onClick:()=>setSchForm(p=>({...p,type:t.k,carpoolDeadline:(t.k==="practice"||t.k==="event")?"":p.carpoolDeadline})),style:{padding:"7px 14px",border:`2px solid ${schForm.type===t.k?"#1D4ED8":"#eee"}`,borderRadius:20,background:schForm.type===t.k?"#1D4ED8":"#fff",color:schForm.type===t.k?"#fff":"#666",fontSize:12,fontWeight:700,cursor:"pointer"}},t.l)))),
      h("div",{style:{marginBottom:12}},
        h("div",{style:{fontSize:12,fontWeight:600,color:"#666",marginBottom:6}},"日付"),
        h("input",{type:"date",value:schForm.date,onChange:e=>setSchForm(p=>({...p,date:e.target.value})),style:{...css.inp,width:"100%"}})),
      h("div",{style:{marginBottom:12}},
        h("div",{style:{fontSize:12,fontWeight:600,color:"#666",marginBottom:8}},"時間"),
        h("div",{style:{display:"flex",gap:8,marginBottom:8}},
          [{k:true,l:"終日"},{k:false,l:"時間指定"}].map(opt=>
            h("button",{key:"edit-sch-all-day-"+String(opt.k),onClick:()=>setSchForm(p=>({...p,allDay:opt.k})),
              style:{flex:1,padding:"9px",border:"2px solid "+(schForm.allDay===opt.k?"#1D4ED8":"#eee"),
                borderRadius:10,background:schForm.allDay===opt.k?"#1D4ED8":"#fff",
                color:schForm.allDay===opt.k?"#fff":"#666",fontSize:13,fontWeight:700,cursor:"pointer"}},opt.l))
        ),
        !schForm.allDay&&h("div",{style:{display:"flex",alignItems:"center",gap:8}},

function MemberTab({members,liftings=[]}) {
  const [pos,setPos]=useState("all");
  const [gradeF,setGradeF]=useState("4年");
  const baseMembers = useMemo(() =>
    members
      .filter(m => [1,2,3,4].includes(getGradeNumber(m.grade)))
      .map(m => {
        const n = getGradeNumber(m.grade);
        return {...m, _gradeNum:n, _gradeKey:`${n}年`};
      }),
  [members]);
  const gradeOptions = useMemo(() => {
    const grouped = {};
    baseMembers.forEach(m => {
      if (!grouped[m._gradeKey]) grouped[m._gradeKey] = [];
      grouped[m._gradeKey].push(m);
    });
    return Object.keys(grouped)
      .sort((a,b)=>(getGradeNumber(b)??0)-(getGradeNumber(a)??0))
      .map(key => {
        const gens = [...new Set(
          grouped[key]
            .map(m=>String(m.generation||"").replace(/[^\d]/g,""))
            .filter(Boolean)
        )].sort((a,b)=>Number(b)-Number(a));
        const primaryGen = gens[0] || getGenerationByGrade(key);
        return {key, label:formatGenerationGrade(key, primaryGen)};
      });
  }, [baseMembers]);
  useEffect(() => {
    if (gradeF === "全員") return;
    if (!gradeOptions.some(g => g.key === gradeF)) {
      setGradeF(gradeOptions[0]?.key || "全員");
    }
  }, [gradeF, gradeOptions]);
  const gradeFiltered=gradeF==="全員"
    ? baseMembers
    : baseMembers.filter(m=>m._gradeKey===gradeF);
  const filtered=pos==="all"?gradeFiltered:gradeFiltered.filter(m=>m.position===pos);
  const sorted=[...filtered].sort((a,b)=>Number(a.number||99)-Number(b.number||99));
  return h(Fragment,{},
    // 学年フィルター
    h("div",{style:{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}},
      [...gradeOptions, {key:"全員", label:"全員"}].map(g=>h("button",{key:g.key,onClick:()=>setGradeF(g.key),
        style:{padding:"5px 12px",border:"2px solid "+(gradeF===g.key?"#1D4ED8":"#eee"),borderRadius:20,
          background:gradeF===g.key?"#1D4ED8":"#fff",color:gradeF===g.key?"#fff":"#666",
          fontSize:12,fontWeight:gradeF===g.key?700:400,cursor:"pointer"}},g.label))),
    // ポジションフィルター
    h("div",{style:{display:"flex",gap:6,marginBottom:14,flexWrap:"wrap"}},
      [{k:"all",l:"全員"},{k:"FW",l:"FW"},{k:"MF",l:"MF"},{k:"DF",l:"DF"},{k:"GK",l:"GK"}].map(t=>
        h("button",{key:t.k,onClick:()=>setPos(t.k),
          style:{padding:"6px 14px",border:`2px solid ${pos===t.k?"#1D4ED8":"#eee"}`,
            borderRadius:20,background:pos===t.k?"#1D4ED8":"#fff",
            color:pos===t.k?"#fff":"#666",fontSize:12,fontWeight:pos===t.k?700:400,cursor:"pointer"}},t.l))),
    // 選手カード一覧（3列）
    h("div",{style:{display:"grid",gridTemplateColumns:"repeat(3,minmax(0,1fr))",gap:8}},
      sorted.map(m=>{
        const pc=PC[m.position]||{bg:"#999"};
        const lf=liftings.find(x=>x.memberId===m.id);
        return h("div",{key:m.id,style:{background:"#fff",borderRadius:12,padding:"10px 8px",
          boxShadow:"0 2px 8px rgba(0,0,0,0.06)",textAlign:"center",minWidth:0}},
          h("div",{style:{width:40,height:40,borderRadius:10,background:pc.bg,margin:"0 auto 8px",
            display:"flex",alignItems:"center",justifyContent:"center",
            color:"#fff",fontSize:17,fontWeight:900}},m.number||"?"),
          h("div",{style:{fontSize:13,fontWeight:800,color:"#1a1a2e",marginBottom:4,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},m.name),
          h("div",{style:{display:"flex",justifyContent:"center",marginBottom:4}},
            h("span",{style:{fontSize:10,fontWeight:700,color:pc.bg,background:pc.bg+"22",borderRadius:999,padding:"2px 8px"}},m.position||"?")),
          h("div",{style:{fontSize:10,color:"#94A3B8",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},formatMemberGenerationGrade(m)||m.grade||""),
          lf&&h("div",{style:{fontSize:10,color:"#4CAF50",fontWeight:700,marginTop:4}},"🏃"+lf.count));
      })
    ));
}

function SettingsTab({user,users=[],members,notificationEnabled,notificationBusy,onToggleNotifications,onUpdateProfile,uiTabVisibility,onSaveUiTabVisibility}) {
  const currentUserProfile = (users || []).find(u => String(u.id || "") === String(user.id || "")) || user;
  const child = members.find(m => String(m.id || "") === String(currentUserProfile.memberId || ""));
  const familyListView = parseFamilyMembers(currentUserProfile.familyMembers || []);
  const accessCount = Number(currentUserProfile.accessCount || 0);
  const lastAccessLabel = currentUserProfile.lastAccessAt
    ? String(currentUserProfile.lastAccessAt).replace("T"," ").slice(0,16)
    : "-";
  const [editing,setEditing] = useState(false);
  const [name,setName] = useState(currentUserProfile.name || "");
  const [memberId,setMemberId] = useState(currentUserProfile.memberId || "");
  const [familyText,setFamilyText] = useState(familyListView.join("\n"));
  const [saving,setSaving] = useState(false);
  const [tabVisibility,setTabVisibility] = useState(()=>normalizeUiTabVisibility(uiTabVisibility));
  const [tabVisibilitySaving,setTabVisibilitySaving] = useState(false);

  useEffect(()=>{
    const latest = (users || []).find(u => String(u.id || "") === String(user.id || "")) || user;
    setName(latest.name || "");
    setMemberId(latest.memberId || "");
    setFamilyText(parseFamilyMembers(latest.familyMembers || []).join("\n"));
  },[user.id,user.name,user.memberId,JSON.stringify((users||[]).map(u=>[u.id,u.familyMembers]))]);
  useEffect(()=>{
    setTabVisibility(normalizeUiTabVisibility(uiTabVisibility));
  },[uiTabVisibility?.member, uiTabVisibility?.memo]);

  const generations = [...new Set(members.map(m=>String(m.generation||"").trim()).filter(Boolean))].sort((a,b)=>Number(b)-Number(a));
  const memberOptions = generations.flatMap(gen => {
    const grouped = members
      .filter(m => String(m.generation || "").trim() === gen)
      .sort((a,b)=>Number(a.number||999)-Number(b.number||999));
    if (!grouped.length) return [];
    return [h("optgroup",{key:gen,label:`${gen}期生`},
      grouped.map(m=>h("option",{key:m.id,value:m.id},`${m.name} #${m.number||"-"} (${formatMemberGenerationGrade(m)||m.grade||""})`))
    )];
  });

  const save = async() => {
    setSaving(true);
    try{
      await onUpdateProfile({name, memberId, familyMembers: parseFamilyMembers(familyText)});
      setEditing(false);
      alert("設定を保存しました");
    }catch(e){
      alert("設定保存エラー: " + e.message);
    }
    setSaving(false);
  };
  const saveTabVisibility = async() => {
    if (String(user?.role || "") !== "admin") return;
    if (typeof onSaveUiTabVisibility !== "function") return;
    setTabVisibilitySaving(true);
    try{
      const next = await onSaveUiTabVisibility(tabVisibility);
      setTabVisibility(normalizeUiTabVisibility(next || tabVisibility));
      alert("タブ表示設定を保存しました");
    }catch(e){
      alert("タブ表示設定エラー: " + e.message);
    }
    setTabVisibilitySaving(false);
  };

  return h(Fragment,{},
    h("div",{style:{background:"#fff",borderRadius:16,padding:18,marginBottom:12,boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}} ,
      h("div",{style:{fontSize:13,fontWeight:800,color:"#1a1a2e",marginBottom:14}},"👤 アカウント"),
      editing ? h(Fragment,{},
        h("div",{style:{marginBottom:12}},
          h("div",{style:{fontSize:12,fontWeight:600,color:"#666",marginBottom:6}},"表示名"),

        h("button",{onClick:()=>setEditing(true),style:{...css.bS,width:"100%",marginTop:16}},"プロフィールを編集"))),
    h("div",{style:{background:"#fff",borderRadius:16,padding:18,marginBottom:12,boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}} ,
      h("div",{style:{fontSize:13,fontWeight:800,color:"#1a1a2e",marginBottom:14}},"🧒 子ども情報"),
      h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}},
        h("div",{style:{background:"#F8FAFC",borderRadius:12,padding:"12px 14px"}},

          h("div",{style:{fontSize:14,fontWeight:700,color:"#1a1a2e"}},child?.name||"-")),
        h("div",{style:{background:"#F8FAFC",borderRadius:12,padding:"12px 14px"}},
          h("div",{style:{fontSize:11,color:"#94A3B8",marginBottom:4}},"期生"),

        h("div",{style:{background:"#F8FAFC",borderRadius:12,padding:"12px 14px"}},

        h("div",{style:{background:"#F8FAFC",borderRadius:12,padding:"12px 14px"}},

          h("div",{style:{fontSize:14,fontWeight:700,color:"#1a1a2e"}},child?.number||"-")))),
    String(user?.role||"")==="admin" && h("div",{style:{background:"#fff",borderRadius:16,padding:18,marginBottom:12,boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}} ,
      h("div",{style:{fontSize:13,fontWeight:800,color:"#1a1a2e",marginBottom:10}},"🧩 タブ表示設定"),
      h("div",{style:{fontSize:12,color:"#64748B",marginBottom:12}},"管理者で「選手」「メモ」タブの表示を切り替えできます（全員共通）"),
      h("div",{style:{display:"grid",gap:10,marginBottom:12}},
        h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 12px",background:"#F8FAFC",border:"1px solid #E2E8F0",borderRadius:10}},
          h("div",{style:{fontSize:13,fontWeight:700,color:"#1E293B"}},"選手タブ"),
          h("button",{onClick:()=>setTabVisibility(p=>({...p,member:!p.member})),disabled:tabVisibilitySaving,style:{
            width:58,height:32,flexShrink:0,border:"none",borderRadius:999,

          h("button",{onClick:()=>setTabVisibility(p=>({...p,memo:!p.memo})),disabled:tabVisibilitySaving,style:{
            width:58,height:32,flexShrink:0,border:"none",borderRadius:999,
            background:tabVisibility.memo?"#1D4ED8":"#CBD5E1",padding:3,cursor:tabVisibilitySaving?"wait":"pointer",

    ),

          h("div",{style:{fontSize:12,color:"#888",marginTop:4}},notificationBusy?"通知設定を更新しています":"締切通知・新規予定・YouTube更新で使います")),
        h("button",{onClick:onToggleNotifications,ariaLabel:"通知切り替え",disabled:notificationBusy,
          style:{width:58,height:32,flexShrink:0,border:"none",borderRadius:999,
            background:notificationEnabled?"#1D4ED8":"#CBD5E1",padding:3,cursor:notificationBusy?"wait":"pointer",
            display:"flex",alignItems:"center",justifyContent:notificationEnabled?"flex-end":"flex-start",
            transition:"all .2s ease",opacity:notificationBusy?0.7:1}},

            boxShadow:"0 2px 6px rgba(0,0,0,0.18)",display:"block"}})))));
}

// ── メインアプリ ───────────────────────────────────────────────
function App() {
  const [user,setUser]=useState(()=>{
    try{ const u=localStorage.getItem("afc_user"); return u?JSON.parse(u):null; }catch(e){ return null; }
  });
  const saveUser=(u)=>{
    setUser(u);
    try{
      if(u){
        localStorage.setItem("afc_user",JSON.stringify(u));
      }else{
        localStorage.removeItem("afc_user");
        Object.keys(sessionStorage)
          .filter(k=>k.indexOf("afc_access_logged_")===0)
          .forEach(k=>sessionStorage.removeItem(k));
      }
    }catch(e){}
  };
  const [loading,setLoading]=useState(false);
  const [loadMsg,setLoadMsg]=useState("読み込み中...");
  const [tab,setTab]=useState("home");
  const [showTactics,setShowTactics]=useState(false);
  const [dashInitialTab,setDashInitialTab]=useState("result");
  const [page,setPage]=useState(null); // null | {type,schedule?,match?}
  const [members,setMembers]=useState([]);
  const [schedules,setSchedules]=useState([]);
  const [results,setResults]=useState([]);
  const [news,setNews]=useState([]);
  const [pendingNotices,setPendingNotices]=useState([]);
  const [liftings,setLiftings]=useState([]);
  const [users,setUsers]=useState([]);
  const [myFavorites,setMyFavorites]=useState({});
  const [uiTabVisibility,setUiTabVisibility]=useState({member:true,memo:true});
  const [deepLink,setDeepLink]=useState(()=>{
    const params = new URLSearchParams(location.search);
    return {
      scheduleId: String(params.get("scheduleId") || "").trim(),
      dayTab: String(params.get("dayTab") || "").trim(),
      tab: String(params.get("tab") || "").trim(),
    };
  });
  const [notificationPermission,setNotificationPermission]=useState(()=>("Notification" in window ? Notification.permission : "unsupported"));
  const [notificationEnabled,setNotificationEnabled]=useState(false);
  const [notificationBusy,setNotificationBusy]=useState(false);
  const isAdmin=user?.role==="admin";
  const canWrite=user?.role!=="viewer";

  const load=useCallback(async(msg="読み込み中...")=>{
    setLoadMsg(msg);setLoading(true);
    try{
      const uid = String(user?.id || "").trim();
      const accessKey = uid ? "afc_access_logged_" + uid : "";
      const shouldCountAccess = !!uid && !sessionStorage.getItem(accessKey);
      const d=await api("getAll",{userId:uid,countAccess:shouldCountAccess?1:0});
      if(shouldCountAccess) sessionStorage.setItem(accessKey,"1");
      setMembers((d.members||[]).map(normalizeMember));
      setSchedules(d.schedules||[]);
      setResults(
        (d.results||[])
          .filter(r => String((r && r.id) || "").trim())
          .map(r => ({...r, formation: normalizeFormationLabel(r.formation || "")}))
      );
      setNews(d.news||[]); setLiftings(d.liftings||[]);
      setPendingNotices(d.myPendingNotices||[]);
      setUsers(d.users||[]);
      setMyFavorites(normalizeFavoriteMap(d.myFavorites || {}));
      setUiTabVisibility(normalizeUiTabVisibility(d.uiTabVisibility || {}));
    }catch(e){alert("読み込みエラー: "+e.message);}
    setLoading(false);
  },[user?.id]);
  useEffect(()=>{if(user)load();},[user,load]);
  useEffect(()=>{
    if(!user || !("serviceWorker" in navigator) || !("PushManager" in window)) {
      setNotificationEnabled(false);
      return;
    }
    getCurrentPushSubscription()
      .then(sub=>setNotificationEnabled(!!sub && Notification.permission==="granted"))
      .catch(()=>setNotificationEnabled(false));
  },[user,notificationPermission]);
  useEffect(()=>{
    if(!user || !("Notification" in window)) return;
    setNotificationPermission(Notification.permission);
    if(Notification.permission!=="granted") return;
    maybeNotifyDeadlines(pendingNotices).catch(()=>{});
    maybeNotifyUpcomingEvents(schedules).catch(()=>{});
  },[user,schedules,pendingNotices]);
  const handleEnableNotifications=async()=>{
    if(notificationBusy) return;
    setNotificationBusy(true);
    try{
      if(notificationEnabled){
        await unsubscribeWebPush();
        setNotificationEnabled(false);
        alert("通知をOFFにしました");
        return;
      }
      const p=await enableNotifications();
      setNotificationPermission(p);
      if(p==="granted"){
        try{
          await subscribeWebPush(user);
        }catch(e){
          alert("通知購読エラー: "+(e&&e.message?e.message:"不明なエラー"));
          return;
        }
        setNotificationEnabled(true);
        setTimeout(()=>{ maybeNotifyDeadlines(pendingNotices).catch(()=>{}); },0);
        setTimeout(()=>{ maybeNotifyUpcomingEvents(schedules).catch(()=>{}); },0);
        alert("通知をONにしました");
      }else if(p==="denied"){
        alert("ブラウザで通知がブロックされています");
      }else if(p==="default"){
        alert("通知の許可が完了しませんでした");
      }else{
        alert("この端末では通知に対応していません");
      }
    }catch(e){
      alert("通知ボタン処理エラー: "+(e&&e.message?e.message:"不明なエラー"));
    }finally{
      setNotificationBusy(false);
    }
  };

  // ── ハンドラ（全てここで定義）─────────────────────────────────
  const goToMatch=(r,s)=>{
    const linked = s || findLinkedScheduleForResult(r, schedules) || {
      id: r?.scheduleId || "",
      date: r?.date || "",
      title: r?.opponent ? ("vs " + r.opponent) : "試合",
      type: r?.type || ""
    };
    scrollAppTop();
    setPage({type:"matchDetail",match:r,schedule:linked});
    setTimeout(scrollAppTop,0);
  };
  const goToDay  =(s,dayTab="")  =>{
    scrollAppTop();
    setPage({type:"dayDetail",schedule:s,dayTab:dayTab||""});
    setTimeout(scrollAppTop,0);
  };
  const openDashTab = (nextTab) => {
    setDashInitialTab(nextTab || "result");
    setTab("dash");
  };
  const goBack   =()   =>{
    scrollAppTop();
    setPage(null);
    setTimeout(scrollAppTop,0);
  };

  const handleAddResult=async fr=>{
    setLoading(true);setLoadMsg("追加中...");
    let ok=false;
    try{
      await api("addResult",{result:{
        scheduleId:fr.scheduleId,date:fr.date,opponent:fr.opponent,
        formatLabel:fr.formatLabel||"",gameNumber:fr.gameNumber||1,
        type:fr.type,memo:fr.memo||"",
        matchStatus:fr.matchStatus||"pre",
        formation:fr.formation||"",
        formationSlots:fr.formationSlots||"",
        ourShots:fr.ourShots,
        theirShots:fr.theirShots,
        ourCorners:fr.ourCorners,
        theirCorners:fr.theirCorners,
        ourFreeKicks:fr.ourFreeKicks,
        theirFreeKicks:fr.theirFreeKicks,
        ourPkCount:fr.ourPkCount,
        theirPkCount:fr.theirPkCount,
        ourOffsides:fr.ourOffsides,
        theirOffsides:fr.theirOffsides
      }});
      await load("更新中...");
      ok=true;
    }catch(e){alert("エラー: "+e.message);}
    setLoading(false);
    if(ok){
      setPage({type:"dayDetail",schedule:page?.schedule||fr});
    }
    return ok;
  };
  const handleAddSchedule=async fs=>{
    setLoading(true);setLoadMsg("追加中...");
    try{await api("addSchedule",{schedule:fs});await load("更新中...");}
    catch(e){alert("エラー: "+e.message);}
    setLoading(false);
  };
  const handleImportFc2Practice=async({url,year,month,previewOnly,selectedKeys,mode})=>{
    const importMode = mode==="match" ? "match" : "practice";
    const payload={
      url:String(url||"").trim(),
      year:Number(year),
      month:Number(month),
      selectedKeys:Array.isArray(selectedKeys)?selectedKeys:[]
    };
    const previewAction = importMode==="match" ? "previewOfficialHpMatchImport" : "previewFc2Schedule";
    const syncAction = importMode==="match" ? "syncOfficialHpMatchImport" : "syncFc2PracticeSchedules";
    if(previewOnly){
      return await api(previewAction,payload);
    }
    setLoading(true);setLoadMsg(importMode==="match"?"公式HP試合情報取込中...":"公式HP練習取込中...");
    try{
      const res=await api(syncAction,payload);
      await load("更新中...");
      return res;
    }catch(e){
      throw e;
    }finally{
      setLoading(false);
    }
  };
  const handleSaveMvp=async(scheduleId,mvpName)=>{
    try{await api("updateMvp",{scheduleId,mvp:mvpName});await load("更新中...");}
    catch(e){alert("MVP保存エラー: "+e.message);}
  };
  const handleDeleteResult=async(r)=>{
    if(!confirm("「vs "+r.opponent+"」を削除しますか？"))return;
    setLoading(true);setLoadMsg("削除中...");
    try{await api("deleteResult",{id:r.id});await load("更新中...");}
    catch(e){alert("削除エラー: "+e.message);}
    setLoading(false);
  };
  const handleDeleteSchedule=async(s)=>{
    if(!confirm("「"+(s.title||"この日程")+"」を削除しますか？"))return;
    setLoading(true);setLoadMsg("削除中...");
    try{
      await api("deleteSchedule",{id:s.id});
      await load("更新中...");
      setPage(null);
    }catch(e){alert("削除エラー: "+e.message);}
    setLoading(false);
  };
  const [editResult,setEditResult]=useState(null);
  const handleAddNews=async n=>{
    setLoading(true);setLoadMsg("投稿中...");
    try{await api("addNews",{news:n});await load("更新中...");}
    catch(e){alert("エラー: "+e.message);}
    setLoading(false);
  };
  const handleDeleteNews=async id=>{
    if(!confirm("削除しますか？"))return;
    setLoading(true);
    try{await api("deleteNews",{id});await load("更新中...");}
    catch(e){alert("エラー: "+e.message);}
    setLoading(false);
  };
  const handleUpdateNews=async n=>{
    setLoading(true);setLoadMsg("更新中...");
    try{await api("updateNews",{news:n});await load("更新中...");}
    catch(e){alert("エラー: "+e.message);}
    setLoading(false);
  };
  const handleUpdateProfile=async({name,memberId,familyMembers=[]})=>{
    const r=await api("updateUserProfile",{userId:user.id,name,memberId,familyMembers});
    saveUser({...user,...r.user});
    await load("更新中...");
  };
  const handleToggleFavorite=async(resultId,nextOn)=>{
    const r = await api("saveMyFavorite",{
      userId:String(user?.id||"").trim(),
      resultId:String(resultId||"").trim(),
      favorite:nextOn?"1":""
    });
    const map = normalizeFavoriteMap(r.favoriteMap || {});
    setMyFavorites(map);
    return { favoriteMap: map };
  };
  const handleSaveUiTabVisibility=async(nextVisibility={})=>{
    const payload = normalizeUiTabVisibility(nextVisibility || {});
    const res = await api("saveUiTabVisibility",{
      userId:String(user?.id||"").trim(),
      uiTabVisibility: payload
    });
    const saved = normalizeUiTabVisibility((res && res.uiTabVisibility) || payload);
    setUiTabVisibility(saved);
    return saved;
  };
  const safeSetTab=useCallback((nextTab)=>{
    const t=String(nextTab||"").trim();
    if(!t) return setTab("home");
    if(t==="settings" && !isAdmin) return setTab("home");
    if(t==="member" && !uiTabVisibility.member) return setTab("home");
    if(t==="memo" && !uiTabVisibility.memo) return setTab("home");
    setTab(t);
  },[isAdmin,uiTabVisibility?.member,uiTabVisibility?.memo]);
  useEffect(()=>{
    if(!user || !deepLink.scheduleId || schedules.length===0) return;
    const target = schedules.find(s => String(s.id || "").trim() === String(deepLink.scheduleId).trim());
    if (!target) return;
    if (deepLink.tab) safeSetTab(deepLink.tab);
    setPage({type:"dayDetail",schedule:target,dayTab:deepLink.dayTab||""});
    setDeepLink({scheduleId:"",dayTab:"",tab:""});
    try {
      window.history.replaceState(null, "", location.pathname);
    } catch (e) {}
  },[user,deepLink,schedules,safeSetTab]);
  useEffect(()=>{
    if(!isAdmin && tab==="settings") setTab("home");
  },[isAdmin,tab]);
  useEffect(()=>{
    if(tab==="member" && !uiTabVisibility.member) setTab("home");
    if(tab==="memo" && !uiTabVisibility.memo) setTab("home");
  },[tab,uiTabVisibility?.member,uiTabVisibility?.memo]);

  // ── ページルーティング ────────────────────────────────────────
  if(!user) return h(Login,{onLogin:saveUser});

  if(page?.type==="matchDetail") return h(Fragment,{},
    loading&&h(Loader,{msg:loadMsg}),
    h(GoalPage,{
      key:String(page?.match?.id||"")+"|"+String(page?.schedule?.id||""),
      match:page.match,schedule:page.schedule,members,isAdmin,canWrite,
      user,favoriteMap:myFavorites,onToggleFavorite:handleToggleFavorite,
      onHome:goBack,
      onBack:()=>{
        const backSchedule = findLinkedScheduleForResult(page.match, schedules) || page.schedule;
        goToDay(backSchedule);
      },
      onSaved:async()=>{
        await load("更新中...");
        const backSchedule = findLinkedScheduleForResult(page.match, schedules) || page.schedule;
        goToDay(backSchedule);
      },
      onShotSaved:async(savedPatch)=>{
        const patch = savedPatch && typeof savedPatch === "object" ? savedPatch : null;
        const patchId = String((patch && patch.id) || "").trim();
        if (patch && patchId) {
          setResults(prev => (prev || []).map(r =>
            String(r.id || "").trim() === patchId ? ({...r, ...patch}) : r
          ));
          setPage(prev => {
            if (!prev || prev.type !== "matchDetail" || String(prev?.match?.id || "").trim() !== patchId) return prev;
            return {...prev, match:{...prev.match, ...patch}};
          });
        }
        await load("更新中...");
      },
    }));

  if(page?.type==="addMatch") return h(Fragment,{},
    loading&&h(Loader,{msg:loadMsg}),
    h(AddMatchModal,{
      schedule:page.schedule,results,
      onSave:handleAddResult,
      onClose:()=>setPage({type:"dayDetail",schedule:page.schedule})
    }));

  if(page?.type==="dayDetail") return h(Fragment,{},
    loading&&h(Loader,{msg:loadMsg}),
    editResult&&h(EditResultModal,{result:editResult,members,onSave:async fr=>{
      setLoading(true);setLoadMsg("更新中...");
      try{await api("updateResult",{result:fr});await load("更新中...");}
      catch(e){alert("更新エラー: "+e.message);}
      setLoading(false);setEditResult(null);
    },onClose:()=>setEditResult(null)}),
    h(DayPage,{
      schedule:page.schedule,results,schedules,members,isAdmin,canWrite,user,users,initialTab:page.dayTab||"",
      onGoToMatch:goToMatch,
      onAdd:s=>setPage({type:"addMatch",schedule:s}),
      onEdit:r=>setEditResult(r),
      onDelete:handleDeleteResult,
      onDeleteSchedule:handleDeleteSchedule,
      onBack:goBack,
      onHome:goBack,
      onSaveMvp:handleSaveMvp,
    }));

  // ── 通常タブ画面 ──────────────────────────────────────────────
  const TABS=[
    {k:"home",   i:"🏠",l:"ホーム"},
    {k:"cal",    i:"📅",l:"日程"},
    {k:"match",  i:"⚽",l:"試合"},
    {k:"dash",   i:"📊",l:"成績"},
    ...(uiTabVisibility.member ? [{k:"member", i:"👥",l:"選手"}] : []),
    ...(uiTabVisibility.memo ? [{k:"memo",   i:"📝",l:"メモ"}] : []),
    {k:"docs",   i:"📚",l:"資料"},
    ...(isAdmin?[{k:"settings",i:"⚙️",l:"設定"}]:[]),
  ];
  const currentTabContent =
    tab==="home" ? h(HomeTab,{results,schedules,news,pendingNotices,members,isAdmin,onGoToMatch:goToMatch,onGoToDay:goToDay,onOpenDashTab:openDashTab,onOpenTab:safeSetTab})
    : tab==="cal" ? h(CalTab,{schedules,results,isAdmin,onGoToDay:goToDay,onAddSchedule:handleAddSchedule,onImportFc2Practice:handleImportFc2Practice})
    : tab==="match" ? h(MatchTab,{results,schedules,members,isAdmin,onGoToMatch:goToMatch,onGoToDay:goToDay})
    : tab==="dash" ? h(DashTab,{results,members,schedules,liftings,isAdmin,favoriteMap:myFavorites,initialDashTab:dashInitialTab,onGoToMatch:goToMatch,onGoToDay:goToDay})
    : tab==="member" ? h(MemberTab,{members,liftings})
    : tab==="memo" ? h(MemoTab,{news,isAdmin,user,onAdd:handleAddNews,onDelete:handleDeleteNews})
    : tab==="docs" ? h(InfoTab,{news,isAdmin,user,onAdd:handleAddNews,onDelete:handleDeleteNews,onUpdate:handleUpdateNews})
    : tab==="settings" ? (isAdmin
        ? h(SettingsTab,{user,users,members,notificationEnabled,notificationBusy,onToggleNotifications:handleEnableNotifications,onUpdateProfile:handleUpdateProfile,uiTabVisibility,onSaveUiTabVisibility:handleSaveUiTabVisibility})
        : null)
    : h(HomeTab,{results,schedules,news,pendingNotices,members,isAdmin,onGoToMatch:goToMatch,onGoToDay:goToDay,onOpenDashTab:openDashTab,onOpenTab:safeSetTab});

  return h(Fragment,{},
    loading && h(Loader,{msg:loadMsg}),
    showTactics && h(TacticalBoardModal,{members,onClose:()=>setShowTactics(false)}),
    h("div",{className:"page"},
      h("div",{style:{position:"sticky",top:0,zIndex:1500,background:"#F0F4F8"}},
        h(AppHeader,{user,onLogout:()=>saveUser(null),onRefresh:()=>load("更新中..."),notificationEnabled,notificationBusy,onEnableNotifications:handleEnableNotifications,onOpenTactics:()=>setShowTactics(true)}),
        h("div",{style:{background:"#fff",margin:"0 0 10px",borderRadius:0,boxShadow:"0 2px 10px rgba(0,0,0,0.08)",overflow:"hidden"}},
          h("div",{style:{display:"flex"}},
            TABS.map(t=>h("button",{key:t.k,onClick:()=>safeSetTab(t.k),style:{flex:1,padding:"10px 2px 8px",border:"none",background:tab===t.k?"#1D4ED8":"transparent",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:2}},
              h("span",{style:{fontSize:17}},t.i),
              h("span",{style:{fontSize:9,fontWeight:tab===t.k?700:400,color:tab===t.k?"#fff":"#aaa"}},t.l)
            ))
          )
        )
      ),
      h("div",{style:{padding:"12px 16px 0"}}, currentTabContent)
    )
  );
}
render(h(App,{}), document.getElementById("app"));

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js?v=15")
      .then(reg => { try { reg.update(); } catch (e) {} })
      .catch(() => {});
  });
}
</script>
</body>
</html>
