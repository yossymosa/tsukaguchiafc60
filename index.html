}

// ── 精算セクション（adminのみ） ────────────────────────────────
function SettlementSection({schedule}) {
  const DEFAULT_ORIGIN = "塚口小学校";
  const storageKey = "afc_settlement_" + String(schedule?.id || "");
  const defaultDestination = String(schedule?.location || "").trim();
  const defaultForm = {
    mode: "dispatch", // dispatch | luggage
    origin: DEFAULT_ORIGIN,
    destination: defaultDestination,
    oneWayKm: "",
    returnKm: "",
    withinAmagasaki: false,
    parkingYen: "0",
    highwayOutYen: "0",
    highwayReturnYen: "0",
    outFromIcWord: "",
    outToIcWord: "",
    returnFromIcWord: "",
    returnToIcWord: "",
    useEtc: true,
    holidayMode: true,
    luggageCarriesPeople: false,
    luggageBikeArea: true,
    fuelYenPerLiter: "175",
  };
  const [form, setForm] = useState(defaultForm);
  const [icFetchBusy, setIcFetchBusy] = useState("");
  const [icFetchMsg, setIcFetchMsg] = useState("");
  const [distanceFetchBusy, setDistanceFetchBusy] = useState(false);
  const [distanceFetchMsg, setDistanceFetchMsg] = useState("");
  const toNum = (v, fallback = 0) => {
    const n = Number(v);
    return Number.isFinite(n) ? n : fallback;
  };
  const oneWayKm = toNum(form.oneWayKm, 0);
  const returnKm = toNum(form.returnKm, 0);
  const totalKm = Math.max(0, oneWayKm) + Math.max(0, returnKm);
  const parkingYen = Math.max(0, toNum(form.parkingYen, 0));
  const highwayOutYen = Math.max(0, toNum(form.highwayOutYen, 0));
  const highwayReturnYen = Math.max(0, toNum(form.highwayReturnYen, 0));
  const highwayYen = highwayOutYen + highwayReturnYen;
  const fuelYenPerLiter = Math.max(0, toNum(form.fuelYenPerLiter, 175));
  const dispatchRule = form.mode === "dispatch" || (form.mode === "luggage" && (form.luggageCarriesPeople || !form.luggageBikeArea));
  const nearRule = dispatchRule && !!form.withinAmagasaki && oneWayKm > 0 && oneWayKm < 11;
  const isFarRule = dispatchRule && !nearRule;
  const gasOutYen = isFarRule ? Math.round((Math.max(0, oneWayKm) / 8) * fuelYenPerLiter) : 0;
  const gasReturnYen = isFarRule ? Math.round((Math.max(0, returnKm) / 8) * fuelYenPerLiter) : 0;
  const gasYen = gasOutYen + gasReturnYen;
  const thanksYen = isFarRule ? (oneWayKm < 15 ? 500 : 1000) : 0;
  const luggageBaseYen = (!dispatchRule) ? 200 : 0;
  const totalYen = dispatchRule
    ? Math.round((nearRule ? 500 : gasYen + thanksYen + highwayYen) + parkingYen)
    : Math.round(luggageBaseYen + parkingYen);
  const calcReady = dispatchRule ? oneWayKm > 0 : true;

  useEffect(() => {
    try {
      const raw = localStorage.getItem(storageKey);
      if (!raw) {
        setForm(defaultForm);
        return;
      }
      const parsed = JSON.parse(raw);
      const nextForm = {
        ...defaultForm,
        ...(parsed.form && typeof parsed.form === "object" ? parsed.form : {}),
      };
      if (!String(nextForm.destination || "").trim() && defaultDestination) {
        nextForm.destination = defaultDestination;
      }
      if (!String(nextForm.origin || "").trim()) {
        nextForm.origin = DEFAULT_ORIGIN;
      }
      setForm(nextForm);
    } catch (_e) {
      setForm(defaultForm);
    }
  }, [storageKey, defaultDestination]);

  const persist = (nextForm) => {
    try {
      localStorage.setItem(storageKey, JSON.stringify({
        form: nextForm,
        updatedAt: new Date().toISOString(),
      }));
    } catch (_e) {}
  };
  const patchForm = patch => {
    setForm(prev => {
      const next = { ...prev, ...patch };
      persist(next);
      return next;
    });
  };

  const openGoogleMapsRoute = () => {
    const from = String(form.origin || "").trim() || DEFAULT_ORIGIN;
    const dest = String(form.destination || "").trim();
    if (!dest) return alert("目的地を入力してください");
    const url =
      "https://www.google.com/maps/dir/?api=1"
      + "&origin=" + encodeURIComponent(from)
      + "&destination=" + encodeURIComponent(dest)
      + "&travelmode=driving";
    window.open(url, "_blank", "noopener,noreferrer");
  };

  const fetchDistanceOnly = async () => {
    const from = String(form.origin || "").trim() || DEFAULT_ORIGIN;
    const dest = String(form.destination || "").trim();
    if (!dest) return alert("目的地を入力してください");
    setDistanceFetchBusy(true);
    setDistanceFetchMsg("");
    try {
      const res = await fetch("/api/maps-route-estimate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ origin: from, destination: dest }),
      });
      const json = await res.json();
      if (!res.ok || !json.ok) throw new Error(json.error || "距離取得に失敗しました");
      const distanceKm = Number(json.distanceKm || 0);
      if (!(distanceKm > 0)) throw new Error("距離が取得できませんでした");
      patchForm({ oneWayKm: String(distanceKm) });
      setDistanceFetchMsg(`距離取得: ${from} → ${dest} / ${distanceKm}km（往路kmに反映）`);
    } catch (e) {
      setDistanceFetchMsg(`距離取得エラー: ${String((e && e.message) || e || "")}`);
    }
    setDistanceFetchBusy(false);
  };

  const fetchIcToll = async direction => {
    const isOut = direction === "out";
    const fromWord = String(isOut ? form.outFromIcWord : form.returnFromIcWord).trim();
    const toWord = String(isOut ? form.outToIcWord : form.returnToIcWord).trim();
    if (!fromWord || !toWord) return alert("入口名と出口名を入力してください");
    setIcFetchBusy(direction);
    setIcFetchMsg("");
    try {
      const res = await fetch("/api/navitime-ic-toll", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          fromWord,
          toWord,
          condition: "toll_time",
          useEtc: !!form.useEtc,
          holidayMode: !!form.holidayMode,
        }),
      });
      const json = await res.json();
      if (!res.ok || !json.ok) throw new Error(json.error || "NAVITIME取得に失敗しました");
      const tollYen = Number(json.tollYen || 0);
      const distanceKm = Number(json.distanceKm || 0);
      if (isOut) {
        patchForm({
          highwayOutYen: String(Math.max(0, Math.round(tollYen))),
          oneWayKm: form.oneWayKm || (distanceKm > 0 ? String(distanceKm) : form.oneWayKm),
          outFromIcWord: String((json.fromIc && json.fromIc.name) || fromWord),
          outToIcWord: String((json.toIc && json.toIc.name) || toWord),
        });
      } else {
        patchForm({
          highwayReturnYen: String(Math.max(0, Math.round(tollYen))),
          returnKm: form.returnKm || (distanceKm > 0 ? String(distanceKm) : form.returnKm),
          returnFromIcWord: String((json.fromIc && json.fromIc.name) || fromWord),
          returnToIcWord: String((json.toIc && json.toIc.name) || toWord),
        });
      }
      const modeText = `普通車 / ${form.useEtc ? "ETC" : "一般"}${form.holidayMode ? " / 休日条件ON" : ""}`;
      setIcFetchMsg(
        `${isOut ? "往路" : "復路"}: ${(json.fromIc && json.fromIc.name) || fromWord} → ${(json.toIc && json.toIc.name) || toWord} / ${modeText} / 高速代 ${Math.max(0, Math.round(tollYen)).toLocaleString()}円`
      );
    } catch (e) {
      setIcFetchMsg(`取得エラー: ${String((e && e.message) || e || "")}`);
    }
    setIcFetchBusy("");
  };
  const settlementSummaryText = (() => {
    const lines = [];
    lines.push(`精算区分: ${dispatchRule ? "配車" : "荷物車"}`);
    if (dispatchRule) {
      lines.push(`ルール: ${nearRule ? "近郊（尼崎市内・往路11km未満）" : "遠方（往路11km以上 or 近郊条件外）"}`);
      if (nearRule) {
        lines.push("謝礼+ガソリン代(定額): 500円");
        lines.push(`駐車場代: ${parkingYen.toLocaleString()}円`);
      } else {
        lines.push(`ガソリン代: ${gasYen.toLocaleString()}円（${fuelYenPerLiter.toLocaleString()}円/L）`);
        lines.push(`駐車場代: ${parkingYen.toLocaleString()}円`);
        lines.push(`高速代: ${highwayYen.toLocaleString()}円`);
        lines.push(`謝礼: ${thanksYen.toLocaleString()}円`);
      }
    } else {
      lines.push("荷物車代: 200円");
      lines.push(`駐車場代: ${parkingYen.toLocaleString()}円`);
    }
    lines.push(`合計: ${totalYen.toLocaleString()}円`);
    return lines.join("\n");
  })();
  const copySettlementSummary = () => {
    copyToClipboard(settlementSummaryText);
    alert("計算結果と合計をコピーしました");
  };

  return h("div",{style:{background:"#fff",borderRadius:16,padding:16,boxShadow:"0 2px 10px rgba(0,0,0,0.07)"}},
    h("div",{style:{fontSize:11,fontWeight:700,color:"#bbb",letterSpacing:2,marginBottom:10}},"💴 精算（仮）"),
    h("div",{style:{marginBottom:10,padding:"10px 12px",border:"1px solid #E2E8F0",borderRadius:10,background:"#F8FAFC"}},
      h("div",{style:{fontSize:11,fontWeight:700,color:"#64748B",marginBottom:4}},"出発地"),
      h("input",{
        value:form.origin,
        onChange:e=>patchForm({origin:e.target.value}),
        placeholder:DEFAULT_ORIGIN,
        style:{...css.inp,width:"100%"}
      })
    ),
    h("div",{style:{marginBottom:10}},
      h("div",{style:{fontSize:12,fontWeight:600,color:"#666",marginBottom:6}},"精算区分"),
      h("div",{style:{display:"flex",gap:8}},
        [["dispatch","配車"],["luggage","荷物車"]].map(([v,label])=>
          h("button",{key:v,onClick:()=>patchForm({mode:v}),
            style:{flex:1,padding:"9px 0",border:`2px solid ${form.mode===v?"#1D4ED8":"#E2E8F0"}`,borderRadius:10,background:form.mode===v?"#DBEAFE":"#fff",color:form.mode===v?"#1D4ED8":"#475569",fontSize:12,fontWeight:700,cursor:"pointer"}},label))
      )
    ),
    form.mode==="luggage"&&h("div",{style:{marginBottom:10,padding:"10px 12px",border:"1px solid #E2E8F0",borderRadius:10,background:"#F8FAFC"}},
      h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}},
        h("div",{style:{fontSize:12,fontWeight:700,color:"#334155"}},"荷物車条件"),
        h("label",{style:{display:"inline-flex",alignItems:"center",gap:6,fontSize:12,color:"#334155",fontWeight:700,cursor:"pointer"}},
          h("input",{type:"checkbox",checked:!!form.luggageBikeArea,onChange:e=>patchForm({luggageBikeArea:!!e.target.checked})}),
          "自転車移動地域内"
        )
      ),
      h("label",{style:{display:"inline-flex",alignItems:"center",gap:6,fontSize:12,color:"#334155",fontWeight:700,cursor:"pointer"}},
        h("input",{type:"checkbox",checked:!!form.luggageCarriesPeople,onChange:e=>patchForm({luggageCarriesPeople:!!e.target.checked})}),
        "荷物も人も乗る（配車扱い）"
      )
    ),
    h("div",{style:{marginBottom:10}},
      h("div",{style:{fontSize:12,fontWeight:600,color:"#666",marginBottom:6}},"目的地"),
      h("input",{value:form.destination,onChange:e=>patchForm({destination:e.target.value}),placeholder:"例：三木防災公園",style:{...css.inp,width:"100%"}})
    ),
    h("div",{style:{display:"flex",gap:8,marginBottom:10}},
      h("button",{onClick:openGoogleMapsRoute,style:{...css.bG,flex:1,padding:"10px 12px",fontSize:12,borderRadius:10}},"🗺 グーグルマップで距離を確認")
    ),
    distanceFetchMsg&&h("div",{style:{marginBottom:10,fontSize:11,fontWeight:700,color:distanceFetchMsg.startsWith("距離取得エラー")?"#DC2626":"#1D4ED8",whiteSpace:"pre-wrap"}},distanceFetchMsg),
    dispatchRule&&h(Fragment,{},
      h("div",{style:{marginBottom:10,padding:"10px 12px",border:"1px solid #E2E8F0",borderRadius:10,background:"#F8FAFC"}},
        h("div",{style:{fontSize:12,fontWeight:700,color:"#334155",marginBottom:8}},"ICから高速代取得（任意 / NAVITIME）"),
        h("div",{style:{display:"flex",gap:10,flexWrap:"wrap",marginBottom:8}},
          h("label",{style:{display:"inline-flex",alignItems:"center",gap:6,fontSize:12,color:"#334155",fontWeight:700,cursor:"pointer"}},
            h("input",{type:"checkbox",checked:!!form.useEtc,onChange:e=>patchForm({useEtc:!!e.target.checked})}),
            "ETC料金"
          ),
          h("label",{style:{display:"inline-flex",alignItems:"center",gap:6,fontSize:12,color:"#334155",fontWeight:700,cursor:"pointer"}},
            h("input",{type:"checkbox",checked:!!form.holidayMode,onChange:e=>patchForm({holidayMode:!!e.target.checked})}),
            "休日条件"
          ),
          h("a",{
            href:"https://www.navitime.co.jp/drive/",
            target:"_blank",
            rel:"noopener noreferrer",
            style:{...css.bG,padding:"6px 10px",fontSize:11,borderRadius:10,flex:"0 0 auto",textDecoration:"none",display:"inline-flex",alignItems:"center",justifyContent:"center",color:"#1D4ED8",fontWeight:700}
          },"条件該当しない場合は各自調べてください（NAVITIME）")
        ),
        h("div",{style:{marginTop:-2,marginBottom:8,fontSize:11,fontWeight:700,color:"#64748B",background:"#EEF2FF",border:"1px solid #DBEAFE",borderRadius:8,padding:"6px 8px",lineHeight:1.4}},
          "※ 普通車料金 / 例: 宝塚・龍野 / ICなしで入力"),
        h("div",{style:{fontSize:11,fontWeight:700,color:"#64748B",marginBottom:6}},"往路（入口 → 出口）"),
        h("div",{style:{display:"flex",gap:6,marginBottom:6}},
          h("input",{value:form.outFromIcWord,onChange:e=>patchForm({outFromIcWord:e.target.value}),placeholder:"入口 例: 宝塚",style:{...css.inp,flex:1,padding:"8px 10px",fontSize:12}}),
          h("input",{value:form.outToIcWord,onChange:e=>patchForm({outToIcWord:e.target.value}),placeholder:"出口 例: 龍野",style:{...css.inp,flex:1,padding:"8px 10px",fontSize:12}}),
          h("button",{onClick:()=>fetchIcToll("out"),disabled:icFetchBusy==="out",style:{...css.bS,padding:"8px 10px",fontSize:12,borderRadius:10,flex:"0 0 auto",opacity:icFetchBusy==="out"?0.7:1,cursor:icFetchBusy==="out"?"wait":"pointer"}},icFetchBusy==="out"?"取得中":"往路取得")
        ),
        h("div",{style:{fontSize:11,fontWeight:700,color:"#64748B",marginBottom:6}},"復路（入口 → 出口）"),

      h("div",{style:{display:"flex",gap:8,marginBottom:10}},
        h("div",{style:{flex:1}},
          h("div",{style:{fontSize:12,fontWeight:600,color:"#666",marginBottom:6}},"駐車場代（円）"),
          h("input",{type:"number",min:"0",step:"1",value:form.parkingYen,onChange:e=>patchForm({parkingYen:e.target.value}),style:{...css.inp,width:"100%"}})
        ),
        h("div",{style:{flex:1}},
          h("div",{style:{fontSize:12,fontWeight:600,color:"#666",marginBottom:6}},"ガソリン単価（円/L）"),
          h("input",{type:"number",min:"0",step:"1",value:form.fuelYenPerLiter,onChange:e=>patchForm({fuelYenPerLiter:e.target.value}),placeholder:"175",style:{...css.inp,width:"100%"}})
        )
      ),
      h("div",{style:{display:"flex",gap:8,marginBottom:10}},
        h("div",{style:{flex:1}},
          h("div",{style:{fontSize:12,fontWeight:600,color:"#666",marginBottom:6}},"高速代（往路円）"),
          h("input",{type:"number",min:"0",step:"1",value:form.highwayOutYen,onChange:e=>patchForm({highwayOutYen:e.target.value}),style:{...css.inp,width:"100%"}})
        ),
        h("div",{style:{flex:1}},
          h("div",{style:{fontSize:12,fontWeight:600,color:"#666",marginBottom:6}},"高速代（復路円）"),
          h("input",{type:"number",min:"0",step:"1",value:form.highwayReturnYen,onChange:e=>patchForm({highwayReturnYen:e.target.value}),style:{...css.inp,width:"100%"}})
        )
      ),
      h("div",{style:{display:"flex",justifyContent:"flex-end",marginTop:-4,marginBottom:10}},
        h("button",{
          onClick:()=>patchForm({highwayReturnYen:String(form.highwayOutYen||"0")}),
          style:{...css.bG,padding:"6px 10px",fontSize:11,borderRadius:8}
        },"復路高速代を往路と同じ")
      ),
      h("label",{style:{display:"inline-flex",alignItems:"center",gap:6,fontSize:12,color:"#334155",fontWeight:700,cursor:"pointer",marginBottom:10}},
        h("input",{type:"checkbox",checked:!!form.withinAmagasaki,onChange:e=>patchForm({withinAmagasaki:!!e.target.checked})}),
        "尼崎市内（近郊ルール判定に使用）"
      )
    ),
    !dispatchRule&&h("div",{style:{display:"flex",gap:8,marginBottom:10}},
      h("div",{style:{flex:1}},
        h("div",{style:{fontSize:12,fontWeight:600,color:"#666",marginBottom:6}},"駐車場代（円）"),
        h("input",{type:"number",min:"0",step:"1",value:form.parkingYen,onChange:e=>patchForm({parkingYen:e.target.value}),style:{...css.inp,width:"100%"}})
      )
    ),
    (!calcReady)&&h("div",{style:{fontSize:12,color:"#B45309",marginBottom:8,whiteSpace:"pre-wrap"}},"⚠ 距離（往路/復路）を入力すると計算できます"),
    h("div",{style:{marginTop:10,background:"#FFFFFF",border:"1px solid #E2E8F0",borderRadius:12,padding:"10px 12px"}},
      h("div",{style:{fontSize:12,fontWeight:800,color:"#0F172A",marginBottom:8}},"計算結果"),
      dispatchRule
        ? h(Fragment,{},
            h("div",{style:{fontSize:12,color:"#334155",marginBottom:6,fontWeight:700}},
              nearRule ? "近郊ルール（尼崎市内・往路11km未満）" : "遠方ルール（往路11km以上 or 近郊条件外）"),
            nearRule
              ? h("div",{style:{fontSize:12,color:"#475569",lineHeight:1.7}},
                  `謝礼+ガソリン代(定額): 500円`,
                  h("br",{}),
                  `駐車場代: ${parkingYen.toLocaleString()}円`)
              : h("div",{style:{fontSize:12,color:"#475569",lineHeight:1.7}},
                  `ガソリン代: 往路${oneWayKm.toFixed(1)}km→${gasOutYen.toLocaleString()}円 + 復路${returnKm.toFixed(1)}km→${gasReturnYen.toLocaleString()}円 = ${gasYen.toLocaleString()}円（${fuelYenPerLiter.toLocaleString()}円/L）`,
                  h("br",{}),
                  `駐車場代: ${parkingYen.toLocaleString()}円`,
                  h("br",{}),
                  `高速代: 往路${highwayOutYen.toLocaleString()}円 + 復路${highwayReturnYen.toLocaleString()}円 = ${highwayYen.toLocaleString()}円`,
                  h("br",{}),
                  `謝礼: ${thanksYen.toLocaleString()}円（往路${oneWayKm.toFixed(1)}km）`)
          )
        : h("div",{style:{fontSize:12,color:"#475569",lineHeight:1.7}},
            `荷物車代: 200円`,
            h("br",{}),
            `駐車場代: ${parkingYen.toLocaleString()}円`),
      h("div",{style:{marginTop:8,paddingTop:8,borderTop:"1px dashed #CBD5E1",display:"flex",justifyContent:"space-between",alignItems:"center"}},
        h("span",{style:{fontSize:12,fontWeight:800,color:"#0F172A"}},"合計"),
        h("span",{style:{fontSize:18,fontWeight:900,color:"#1D4ED8"}},`${totalYen.toLocaleString()} 円`)
      ),
      h("div",{style:{display:"flex",justifyContent:"flex-end",marginTop:8}},
        h("button",{onClick:copySettlementSummary,style:{...css.bG,padding:"6px 10px",fontSize:11,borderRadius:8}},
          "📋 計算結果と合計をコピー"))
    ),
    h("div",{style:{fontSize:11,color:"#94A3B8",marginTop:10,lineHeight:1.5}},
      "※ ルール準拠の仮計算です。最終精算は駐車場レシート・高速実費・会計判断に従ってください。")
  );
}

// ── 出欠セクション（DayPage内で使用） ────────────────────────
function AttendSection({schedule, members, user, isAdmin, canWrite=true, users=[]}) {
  const isEventSchedule = normalizeType(schedule.type) === "event";
  const [attend, setAttend] = useState({});   // {memberId: status}
  const [eventAttend, setEventAttend] = useState([]);
  const [eventForm, setEventForm] = useState({adultMembers:[], childMembers:[], preschoolMembers:[]});
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState("");
  const [deadlineDraft, setDeadlineDraft] = useState(String(schedule.deadline || "").trim());
  const [deadlineSaving, setDeadlineSaving] = useState(false);
  const parseMemberList = value => parseFamilyMembers(value || []);
  const currentUserProfile = (users || []).find(u => String(u.id || "") === String(user.id || "")) || user || {};
  const linkedMember = (members || []).find(m => String(m.id || "").trim() === String(user.memberId || "").trim());
  const linkedPlayerName = String(linkedMember?.name || "").trim();
  const registeredFamilyMembers = parseFamilyMembers(currentUserProfile.familyMembers || currentUserProfile.familyComposition || []);
  const eventFamilyCandidates = [...new Set(
    [
      linkedPlayerName,
      ...registeredFamilyMembers,
    ]
      .map(v => String(v || "").trim())
      .filter(Boolean)
  )];
  const sanitizeEventForm = formValue => {
    const allowedSet = new Set(eventFamilyCandidates.map(n => String(n || "").trim()).filter(Boolean));
    const next = {
      adultMembers: parseMemberList(formValue?.adultMembers || []).filter(n => allowedSet.has(String(n || "").trim())),
      childMembers: parseMemberList(formValue?.childMembers || []).filter(n => allowedSet.has(String(n || "").trim())),
      preschoolMembers: parseMemberList(formValue?.preschoolMembers || []).filter(n => allowedSet.has(String(n || "").trim())),
    };
    const seen = new Set();
    ["adultMembers","childMembers","preschoolMembers"].forEach(k => {
      next[k] = next[k].filter(name => {
        const key = String(name || "").trim();
        if (!key || seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    });
    return next;
  };
  const toggleEventMember = (categoryKey, name) => {
    const targetName = String(name || "").trim();
    if (!targetName) return;
    setEventForm(prev => {
      const keys = ["adultMembers", "childMembers", "preschoolMembers"];
      const base = {
        adultMembers: parseMemberList(prev.adultMembers),
        childMembers: parseMemberList(prev.childMembers),
        preschoolMembers: parseMemberList(prev.preschoolMembers),
      };
      keys.forEach(k => {
        if (k !== categoryKey) base[k] = base[k].filter(n => n !== targetName);
      });
      const cur = base[categoryKey];
      base[categoryKey] = cur.includes(targetName)
        ? cur.filter(n => n !== targetName)
        : [...cur, targetName];
      return base;
    });
  };
  useEffect(() => {
    setDeadlineDraft(String(schedule.deadline || "").trim());
  }, [schedule?.id, schedule?.deadline]);
  useEffect(() => {
    if (!isEventSchedule) return;
    setEventForm(prev => sanitizeEventForm(prev));
  }, [isEventSchedule, eventFamilyCandidates.join("|")]);

  // スケジュールの出欠を読み込み
  useEffect(() => {
    let cancelled = false;
    api(isEventSchedule ? "getEventAttend" : "getAttend", {scheduleId: schedule.id}).then(r => {
      if (cancelled) return;
      if (isEventSchedule) {
        const rows = r.attend || [];
        setEventAttend(rows);
        const mine = rows.find(a => String(a.userId) === String(user.id));
        if (mine) {
          setEventForm(sanitizeEventForm({
            adultMembers: parseMemberList(mine.adultMembers || []),
            childMembers: parseMemberList(mine.childMembers || []),
            preschoolMembers: parseMemberList(mine.preschoolMembers || []),
          }));
        } else {
          setEventForm(sanitizeEventForm({ adultMembers: [], childMembers: [], preschoolMembers: [] }));
        }
      } else {
        const map = {};
        (r.attend||[]).forEach(a => { map[a.memberId] = a.status; });
        setAttend(map);
      }
      setLoading(false);
    }).catch(() => setLoading(false));
    return () => { cancelled = true; };
  }, [schedule.id, isEventSchedule, user.id]);

  const save = async (memberId, status) => {
    if (!canWrite) return;
    setSaving(memberId);
    const next = {...attend, [memberId]: status};
    setAttend(next);
    try { await api("saveAttend", {scheduleId: schedule.id, memberId, status}); }
    catch(e) { alert("保存エラー: " + e.message); }
    setSaving("");
  };
  const saveEventAttend = async () => {
    if (!canWrite) return;
    setSaving("event");
    const sanitized = sanitizeEventForm(eventForm);
    const adultMembers = parseMemberList(sanitized.adultMembers || []);
    const childMembers = parseMemberList(sanitized.childMembers || []);
    const preschoolMembers = parseMemberList(sanitized.preschoolMembers || []);
    const payload = {
      scheduleId: schedule.id,
      userId: user.id,
      userName: user.name,
      adultMembers,
      childMembers,
      preschoolMembers,
      adultCount: adultMembers.length,
      childCount: childMembers.length,
      preschoolCount: preschoolMembers.length,
    };
    try {
      await api("saveEventAttend", payload);
      setEventForm(sanitized);
      setEventAttend(prev => [...prev.filter(a => String(a.userId) !== String(user.id)), payload]);
    } catch(e) { alert("保存エラー: " + e.message); }
    setSaving("");
  };
  const saveAttendDeadline = async () => {
    if (!isAdmin) return;
    setDeadlineSaving(true);
    try {
      await api("updateSchedule", { schedule: { ...schedule, deadline: deadlineDraft || "" } });
      schedule.deadline = deadlineDraft || "";
      alert("出欠締切を更新しました");
    } catch (e) {
      alert("出欠締切の更新エラー: " + (e.message || e));
    }
    setDeadlineSaving(false);
  };

  // 自分のmemberIdが紐づいているか
  const myMemberId = user.memberId || "";
  const myMember = myMemberId ? members.find(m => m.id === myMemberId) : null;

  const TEAM_GENERATION = 60;
  const targetGradeNum = getCurrentThirdGeneration() - TEAM_GENERATION + 3;
  const parseGeneration = m => {
    const n = Number(String(m?.generation || "").replace(/[^\d]/g, ""));
    return Number.isFinite(n) ? n : 0;
  };
  const getResolvedGradeNum = m => {
    const n = getGradeNumber(resolveGrade(m) || m.grade || "");
    return Number.isFinite(n) ? n : null;
  };
  const classifyAttendMember = m => {
    const gen = parseGeneration(m);
    if (gen) {
      if (gen === TEAM_GENERATION) return "core";
      if (gen > TEAM_GENERATION) return "accompany";
      return "exclude"; // 上級生は除外
    }
    const gradeNum = getResolvedGradeNum(m);
    if (gradeNum == null) return "accompany";
    if (gradeNum > targetGradeNum) return "exclude";
    if (gradeNum === targetGradeNum) return "core";
    return "accompany";
  };
  const sortMembers = arr => arr.slice().sort((a,b)=>{
    const na = Number(a.number || 999);
    const nb = Number(b.number || 999);
    if (na !== nb) return na - nb;
    return String(a.name || "").localeCompare(String(b.name || ""), "ja");
  });
  const coreMembers = sortMembers(members.filter(m => classifyAttendMember(m) === "core"));
  const accompanyMembers = sortMembers(members.filter(m => classifyAttendMember(m) === "accompany"));
  const visibleAdminMembers = [...coreMembers, ...accompanyMembers];
  const membersForSummary = isAdmin ? visibleAdminMembers : members;

  // 集計
  const counts = ["○","×","△"].map(s => membersForSummary.filter(m => attend[m.id]===s).length);
  // 名前リスト
  const nameList = (status) => sortMembers(membersForSummary.filter(m => attend[m.id]===status));
  const unresolved = sortMembers(membersForSummary.filter(m => !attend[m.id] || attend[m.id]==="未"));

  if (loading) return h("div",{style:{textAlign:"center",padding:16,color:"#aaa",fontSize:13}},"読み込み中...");

  // 締め切りチェック
  const deadline = String(deadlineDraft || "").trim();
  const today = todayLocal();
  const isPast = deadline && deadline < today;
  const deadlineEditor = isAdmin && h("div",{style:{display:"flex",gap:8,alignItems:"flex-end",marginBottom:12,padding:"10px 12px",background:"#F8FAFC",border:"1px solid #E2E8F0",borderRadius:10}},
    h("div",{style:{flex:1}},
      h("div",{style:{fontSize:11,fontWeight:700,color:"#64748B",marginBottom:6}},"出欠締切（管理者）"),
      h("input",{type:"date",value:deadlineDraft,onChange:e=>setDeadlineDraft(e.target.value),style:{...css.inp,width:"100%",marginBottom:0}})
    ),
    h("button",{onClick:saveAttendDeadline,disabled:deadlineSaving,style:{...css.bS,padding:"9px 12px",fontSize:12,borderRadius:10,opacity:deadlineSaving?0.7:1,cursor:deadlineSaving?"wait":"pointer"}},
      deadlineSaving?"保存中...":"保存")
  );
  if (isEventSchedule) {
    const totals = eventAttend.reduce((acc, row) => ({
      adult: acc.adult + Number(row.adultCount || 0),
      child: acc.child + Number(row.childCount || 0),
      preschool: acc.preschool + Number(row.preschoolCount || 0),
    }), {adult:0, child:0, preschool:0});

    return h("div",{style:{background:"#fff",borderRadius:16,padding:18,marginTop:14,boxShadow:"0 2px 10px rgba(0,0,0,0.07)"}} ,
      h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}},
        h("div",{style:{fontSize:11,fontWeight:700,color:"#bbb",letterSpacing:2}},"📋 出欠"),
        deadline&&h("div",{style:{fontSize:11,fontWeight:700,color:isPast?"#F44336":"#FF9800",background:isPast?"#FFEBEE":"#DBEAFE",borderRadius:8,padding:"3px 8px"}},
          isPast?"⚠ 締め切り済":"⏰ 締切 "+fmt(deadline).short)),
      deadlineEditor,
      h("div",{style:{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:14}},
        [
          {label:"大人", value:totals.adult, color:"#1D4ED8", bg:"#DBEAFE"},
          {label:"小学生", value:totals.child, color:"#4CAF50", bg:"#E8F5E9"},
          {label:"幼児", value:totals.preschool, color:"#2196F3", bg:"#E3F2FD"},
        ].map(item=>
          h("div",{key:item.label,style:{textAlign:"center",padding:"12px 8px",borderRadius:12,background:item.bg}},
            h("div",{style:{fontSize:22,fontWeight:900,color:item.color}},item.value),
            h("div",{style:{fontSize:11,color:item.color,fontWeight:700,marginTop:4}},item.label)))),
      h("div",{style:{padding:"12px 14px",background:"#F8F9FA",borderRadius:12,marginBottom:12}},
        h("div",{style:{fontSize:12,fontWeight:700,color:"#666",marginBottom:10}},"登録している家族から選択"),
        eventFamilyCandidates.length===0
          ? h("div",{style:{fontSize:12,color:"#64748B",marginBottom:10,lineHeight:1.6}},"設定タブで家族構成を登録し、子どもを紐づけるとここで選択できます")
          : [
              {key:"adultMembers",label:"大人",color:"#1D4ED8",bg:"#DBEAFE"},
              {key:"childMembers",label:"小学生",color:"#4CAF50",bg:"#E8F5E9"},
              {key:"preschoolMembers",label:"幼児",color:"#2563EB",bg:"#EFF6FF"},
            ].map(cat => {
              const selected = parseMemberList(eventForm[cat.key]);
              return h("div",{key:cat.key,style:{marginBottom:10,padding:"10px",borderRadius:10,background:"#fff",border:`1px solid ${cat.bg}`}},
                h("div",{style:{fontSize:11,fontWeight:700,color:cat.color,marginBottom:8}},`${cat.label} (${selected.length}人)`),
                h("div",{style:{display:"grid",gridTemplateColumns:"repeat(3,minmax(0,1fr))",gap:6}},
                  eventFamilyCandidates.map(name => {
                    const active = selected.includes(name);
                    return h("button",{
                      key:cat.key+"-"+name,
                      type:"button",
                      onClick:()=>toggleEventMember(cat.key, name),
                      disabled:isPast||!canWrite,
                      style:{
                        border:`1px solid ${active ? cat.color : "#E2E8F0"}`,
                        background:active ? cat.bg : "#fff",
                        color:active ? cat.color : "#334155",
                        borderRadius:999,
                        padding:"4px 10px",
                        fontSize:12,
                        fontWeight:700,
                        width:"100%",
                        whiteSpace:"nowrap",
                        overflow:"hidden",
                        textOverflow:"ellipsis",
                        cursor:(isPast||!canWrite)?"not-allowed":"pointer",
                        opacity:(isPast||!canWrite)?0.6:1
                      }
                    },name);
                  })
                )
              );
            }),
        h("button",{onClick:saveEventAttend,disabled:saving==="event"||isPast||!canWrite,style:{...css.bS,width:"100%",marginTop:12,opacity:(saving==="event"||isPast||!canWrite)?0.6:1,cursor:(isPast||!canWrite)?"not-allowed":"pointer"}},!canWrite?"閲覧専用":(saving==="event"?"保存中...":"💾 イベント出欠を保存"))),
      isAdmin&&h("div",{style:{padding:"12px 14px",background:"#F8F9FA",borderRadius:12}},
        h("div",{style:{fontSize:11,fontWeight:700,color:"#bbb",letterSpacing:2,marginBottom:10}},"回答一覧"),
        eventAttend.length===0
          ? h("div",{style:{fontSize:12,color:"#aaa"}},"まだ回答がありません")
          : eventAttend.slice().sort((a,b)=>String(a.userName||"").localeCompare(String(b.userName||""),"ja")).map(row=>
              h("div",{key:row.userId,style:{padding:"10px 0",borderTop:"1px solid #eee"}},
                h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,marginBottom:4}},
                  h("div",{style:{fontSize:13,fontWeight:700,color:"#333"}},row.userName||"名前未設定"),
                  h("div",{style:{fontSize:12,color:"#666",textAlign:"right"}},`大人 ${Number(row.adultCount||0)} / 小学生 ${Number(row.childCount||0)} / 幼児 ${Number(row.preschoolCount||0)}`)),
                h("div",{style:{fontSize:11,color:"#64748B",lineHeight:1.6}},
                  (() => {
                    const adults = parseMemberList(row.adultMembers || []);
                    const childs = parseMemberList(row.childMembers || []);
                    const pres = parseMemberList(row.preschoolMembers || []);
                    const parts = [];
                    if (adults.length) parts.push(`大人: ${adults.join("、")}`);
                    if (childs.length) parts.push(`小学生: ${childs.join("、")}`);
                    if (pres.length) parts.push(`幼児: ${pres.join("、")}`);
                    return parts.length ? parts.join(" / ") : "カテゴリ別の名前未設定";
                  })()
                ))))
    );
  }

  return h("div",{style:{background:"#fff",borderRadius:16,padding:18,marginTop:14,boxShadow:"0 2px 10px rgba(0,0,0,0.07)"}},
    h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}},
      h("div",{style:{fontSize:11,fontWeight:700,color:"#bbb",letterSpacing:2}},"📋 出欠"),
      deadline&&h("div",{style:{fontSize:11,fontWeight:700,color:isPast?"#F44336":"#FF9800",background:isPast?"#FFEBEE":"#DBEAFE",borderRadius:8,padding:"3px 8px"}},
        isPast?"⚠ 締め切り済":"⏰ 締切 "+fmt(deadline).short)),
    deadlineEditor,

    // 集計バー
    h("div",{style:{display:"flex",gap:8,marginBottom:12,padding:"10px 14px",background:"#F8F9FA",borderRadius:12}},

// ── 試合一覧：月別タブコンポーネント ─────────────────────────
function MatchListByMonth({results,schedules,onGoToMatch}) {
  const getResultType = r => {
    const linked = findLinkedScheduleForResult(r, schedules);
    return linked?.type || r.type || "";
  };
  // 月別グループ作成（降順：新しい月を左）
  const groups = useMemo(() => {
    const map = {};
    results.forEach(r => {
      const d = nd(r.date);
      if (!d) return;
      const ym = d.slice(0,7); // "2026-03"
      if (!map[ym]) map[ym] = [];
      map[ym].push(r);
    });
    // 降順ソート（新しい月を左側へ）
    return Object.entries(map)
      .sort((a,b) => b[0].localeCompare(a[0]))
      .map(([ym, rs]) => ({
        ym,
        label: Number(ym.slice(0,4)) + "年" + Number(ym.slice(5,7)) + "月",
        rs: rs.sort((a,b) => nd(a.date).localeCompare(nd(b.date))),
      }));
  }, [results]);

  const currentYm = useMemo(() => {
    const now = new Date();
    return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
  }, []);
  const [selYm, setSelYm] = useState("");

  // 初期は「今月」を優先。今月が無ければ最新月（先頭）を選択
  useEffect(() => {
    if (!groups.length) {
      if (selYm) setSelYm("");
      return;
    }
    if (selYm && groups.some(g => g.ym === selYm)) return;
    const nowGroup = groups.find(g => g.ym === currentYm);
    setSelYm((nowGroup || groups[0]).ym);
  }, [groups, selYm, currentYm]);

  if (results.length === 0) {
    return h("div",{style:{textAlign:"center",padding:"40px",color:"#aaa",background:"#fff",borderRadius:16}},
      h("div",{style:{fontSize:40,marginBottom:10}},"🏆"),"試合記録がありません");
  }

  const cur = groups.find(g=>g.ym===selYm);
  const st = cur ? calcStats(cur.rs) : null;

  return h(Fragment,{},
    // 月タブ（横スクロール）
    h("div",{style:{overflowX:"auto",marginBottom:12,paddingBottom:4}},
      h("div",{style:{display:"flex",gap:6,width:"max-content"}},
        groups.map(g => {
          const active = g.ym === selYm;
          const mst = calcStats(g.rs);
          return h("div",{key:g.ym,onClick:()=>setSelYm(g.ym),
            style:{padding:"8px 14px",borderRadius:20,cursor:"pointer",flexShrink:0,textAlign:"center",
              background:active?"#1D4ED8":"#fff",
              color:active?"#fff":"#666",
              boxShadow:"0 2px 6px rgba(0,0,0,0.07)",
              border:active?"none":"1px solid #eee",
              fontWeight:active?700:400}},
            h("div",{style:{fontSize:12,whiteSpace:"nowrap"}},g.label),
            h("div",{style:{fontSize:10,opacity:0.8,marginTop:2}},mst.games+"試合 "+mst.wins+"勝"+mst.draws+"分"+mst.losses+"敗"))
        }))),

    // 月サマリー
    cur&&st&&h("div",{style:{background:"#fff",borderRadius:14,padding:"12px 16px",marginBottom:12,display:"flex",gap:16,alignItems:"center",boxShadow:"0 2px 6px rgba(0,0,0,0.05)"}},
      h("div",{style:{fontSize:13,fontWeight:800,color:"#1a1a2e",flex:1}},cur.label),
      h("div",{style:{display:"flex",gap:12,fontSize:13}},
        h("span",{style:{color:"#4CAF50",fontWeight:700}},st.wins+"勝"),
        h("span",{style:{color:"#FFC107",fontWeight:700}},st.draws+"分"),
        h("span",{style:{color:"#F44336",fontWeight:700}},st.losses+"敗"),
        h("span",{style:{color:"#666"}},st.gf+"得点 "+st.ga+"失点"))),

    // 試合リスト
    cur&&cur.rs.map(r=>{
      const tc=getTC(getResultType(r));
      const s=findLinkedScheduleForResult(r, schedules);
      const dt=fmt(r.date);
      return h("div",{key:r.id,onClick:()=>onGoToMatch(r,s),
        style:{background:"#fff",borderRadius:14,padding:"13px 16px",marginBottom:8,
               boxShadow:"0 2px 8px rgba(0,0,0,0.06)",display:"flex",alignItems:"center",gap:12,cursor:"pointer"}},
        h("div",{style:{textAlign:"center",flexShrink:0,width:40}},
          h("div",{style:{fontSize:11,color:"#aaa"}},dt.short),
          h("div",{style:{fontSize:10,color:"#ccc"}},dt.dw)),
        h("div",{style:{width:3,height:44,background:tc.bg,borderRadius:2,flexShrink:0}}),
        h("div",{style:{flex:1,minWidth:0}},
          h("div",{style:{marginBottom:3}},
            h(Bdg,{label:tc.lb,color:tc.bg,small:true}),
            r.gameNumber?h("span",{style:{fontSize:10,color:"#bbb",marginLeft:5}},"第"+r.gameNumber+"試合"):"",
            r.formatLabel?h("span",{style:{fontSize:10,color:"#ccc",marginLeft:5}},r.formatLabel):""),
          h("div",{style:{fontSize:14,fontWeight:700,color:"#1a1a2e"}},"vs "+r.opponent),
          s?.location&&h("div",{style:{fontSize:11,color:"#aaa"}},"📍 "+s.location)),
        h("div",{style:{textAlign:"right",flexShrink:0}},
          h(ScoreLine,{our:r.ourScore,their:r.theirScore,size:18}),
          h("div",{style:{marginTop:3}},h(RWdg,{our:r.ourScore,their:r.theirScore,status:r.matchStatus,date:r.date}))));
    }));
}

// ── 試合タブ：月タブ + 日程カード一覧 ───────────────────────────
function MatchTab({results,schedules,members,isAdmin,onGoToMatch,onGoToDay,onAdd}) {
  const matchSchedules = useMemo(() =>
    (schedules || [])
      .filter(s => {
        const t = normalizeType(s.type);
        return t !== "practice" && t !== "event";
      })
      .sort((a,b) => nd(a.date).localeCompare(nd(b.date)))
  , [schedules]);

  const getResultsForSchedule = (schedule) => {
    const sid = String(schedule?.id || "").trim();
    const byId = (results || []).filter(r => String(r.scheduleId || "").trim() === sid);
    if (byId.length > 0) return byId;
    const d = nd(schedule?.date);
    if (!d) return [];
    return (results || []).filter(r => !String(r.scheduleId || "").trim() && nd(r.date) === d);
  };

  const monthGroups = useMemo(() => {
    const map = {};
    matchSchedules.forEach(s => {
      const d = nd(s.date);
      if (!d) return;
      const ym = d.slice(0, 7);
      if (!map[ym]) map[ym] = [];
      map[ym].push(s);
    });
    return Object.entries(map)
      .sort((a,b) => b[0].localeCompare(a[0]))
      .map(([ym, scheds]) => ({
        ym,
        label: Number(ym.slice(0,4)) + "年" + Number(ym.slice(5,7)) + "月",
        scheds: scheds.sort((a,b) => nd(a.date).localeCompare(nd(b.date))),
      }));
  }, [matchSchedules]);

  const currentYm = useMemo(() => {
    const now = new Date();
    return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
  }, []);
  const [selYm, setSelYm] = useState("");
  useEffect(() => {
    if (!monthGroups.length) {
      if (selYm) setSelYm("");
      return;
    }
    if (selYm && monthGroups.some(g => g.ym === selYm)) return;
    const nowGroup = monthGroups.find(g => g.ym === currentYm);
    setSelYm((nowGroup || monthGroups[0]).ym);
  }, [monthGroups, selYm, currentYm]);

  if (matchSchedules.length === 0) {
    return h("div",{style:{background:"#fff",borderRadius:14,padding:20,textAlign:"center",color:"#94A3B8",fontSize:13}},"試合日程がありません");
  }

  const cur = monthGroups.find(g => g.ym === selYm) || monthGroups[0];
  const monthResults = (() => {
    const seen = new Set();
    const rows = [];
    (cur?.scheds || []).forEach(s => {
      getResultsForSchedule(s).forEach(r => {
        const key = String(r.id || `${nd(r.date)}|${r.opponent || ""}|${r.gameNumber || ""}|${r.ourScore || ""}|${r.theirScore || ""}`);
        if (seen.has(key)) return;
        seen.add(key);
        rows.push(r);
      });
    });
    return rows;
  })();
  const monthStat = calcStats(monthResults);

  return h(Fragment,{},
    h("div",{style:{overflowX:"auto",marginBottom:12,paddingBottom:4}},
      h("div",{style:{display:"flex",gap:6,width:"max-content"}},
        monthGroups.map(g => {
          const active = g.ym === (cur?.ym || "");
          const monthRows = (() => {
            const seen = new Set();
            const rows = [];
            g.scheds.forEach(s => {
              getResultsForSchedule(s).forEach(r => {
                const key = String(r.id || `${nd(r.date)}|${r.opponent || ""}|${r.gameNumber || ""}|${r.ourScore || ""}|${r.theirScore || ""}`);
                if (seen.has(key)) return;
                seen.add(key);
                rows.push(r);
              });
            });
            return rows;
          })();
          const mst = calcStats(monthRows);
          return h("div",{key:g.ym,onClick:()=>setSelYm(g.ym),
            style:{padding:"8px 14px",borderRadius:20,cursor:"pointer",flexShrink:0,textAlign:"center",
              background:active?"#1D4ED8":"#fff",
              color:active?"#fff":"#666",
              boxShadow:"0 2px 6px rgba(0,0,0,0.07)",
              border:active?"none":"1px solid #eee",
              fontWeight:active?700:400}},
            h("div",{style:{fontSize:12,whiteSpace:"nowrap"}},g.label),
            h("div",{style:{fontSize:10,opacity:0.85,marginTop:2}},mst.wins+"勝"+mst.draws+"分"+mst.losses+"敗"));
        }))),

    cur && h("div",{style:{background:"#fff",borderRadius:14,padding:"12px 16px",marginBottom:12,display:"flex",gap:16,alignItems:"center",boxShadow:"0 2px 6px rgba(0,0,0,0.05)"}},
      h("div",{style:{fontSize:13,fontWeight:800,color:"#1a1a2e",flex:1}},cur.label),
      h("div",{style:{display:"flex",gap:10,fontSize:12,flexWrap:"wrap",justifyContent:"flex-end"}},
        h("span",{style:{color:"#4CAF50",fontWeight:700}},monthStat.wins+"勝"),
        h("span",{style:{color:"#FFC107",fontWeight:700}},monthStat.draws+"分"),
        h("span",{style:{color:"#F44336",fontWeight:700}},monthStat.losses+"敗"),
        h("span",{style:{color:"#64748B"}},(cur.scheds.length || 0)+"日程 / "+monthStat.games+"試合"))),

    (cur?.scheds || []).map((s,i) => {
      const tc = getTC(s.type);
      const dt = fmt(s.date);
      const dayRows = getResultsForSchedule(s);
      const st = calcStats(dayRows);
      return h("div",{key:s.id || `${s.date}-${i}`,onClick:()=>onGoToDay&&onGoToDay(s,"match"),
        style:{background:"#fff",borderRadius:14,padding:"12px 14px",marginBottom:8,display:"flex",alignItems:"center",gap:10,boxShadow:"0 2px 8px rgba(0,0,0,0.05)",cursor:"pointer"}},
        h("div",{style:{textAlign:"center",flexShrink:0,width:40}},
          h("div",{style:{fontSize:11,color:"#64748B",fontWeight:700}},dt.short),
          h("div",{style:{fontSize:10,color:"#94A3B8"}},dt.dw)),
        h("div",{style:{width:3,height:42,background:tc.bg,borderRadius:2,flexShrink:0}}),
        h("div",{style:{flex:1,minWidth:0}},
          h("div",{style:{marginBottom:3}},h(Bdg,{label:tc.lb,color:tc.bg,small:true})),

function DashTab({results,members,schedules,liftings=[],isAdmin=false,favoriteMap={},initialDashTab="result",onGoToMatch,onGoToDay}) {
  const SHOT_RATE_START_DATE = "2026-04-12";
  const [dashTab,setDashTab]=useState(initialDashTab); // "result" | "tournament" | "rank" | "personal"
  const [typeF,setTypeF]=useState("all");
  const [periodF,setPeriodF]=useState("grade4"); // "alltime"|"grade4"|"grade3"|"month"|"lastmonth"|"custom"
  const [from,setFrom]=useState("");
  const [to,setTo]=useState("");
  const [oppFilter,setOppFilter]=useState("all"); // "all" or opponent name
  const [oppSearch,setOppSearch]=useState("");
  useEffect(()=>{ if(initialDashTab) setDashTab(initialDashTab); },[initialDashTab]);
  const currentFiscalStart = useMemo(() => {
    const now = new Date();
    return now.getMonth() + 1 >= 4 ? now.getFullYear() : now.getFullYear() - 1;
  }, []);
  const grade3FiscalStart = currentFiscalStart - 1;
  const grade4FiscalStart = currentFiscalStart;
  const getResultType=row=>{
    const linked=findLinkedScheduleForResult(row, schedules);
    return normalizeType(row.type || linked?.type || "");
  };
  function typeMatch(r,typeF){
    if(typeF==="all") return true;
    const baseType = r && Object.prototype.hasOwnProperty.call(r,"opponent") ? getResultType(r) : normalizeType(r.type);
    return baseType===normalizeType(typeF);
  }
  const parseResultShotStats = r => parseShotStatsMap((r && r.shotStats) || {});
  const periodRange=useMemo(()=>{
    const now=new Date();
    const y=now.getFullYear(), m=now.getMonth()+1;
    if(periodF==="alltime") return {f:"", t:""};
    if(periodF==="grade3")  return {f:`${grade3FiscalStart}-04-01`, t:`${grade3FiscalStart+1}-03-31`};
    if(periodF==="grade4")  return {f:`${grade4FiscalStart}-04-01`, t:`${grade4FiscalStart+1}-03-31`};
    if(periodF==="month")   return {f:`${y}-${String(m).padStart(2,"0")}-01`, t:`${y}-${String(m).padStart(2,"0")}-31`};
    if(periodF==="lastmonth"){
      const lm = m===1 ? 12 : m-1;
      const ly = m===1 ? y-1 : y;
      return {f:`${ly}-${String(lm).padStart(2,"0")}-01`, t:`${ly}-${String(lm).padStart(2,"0")}-31`};
    }
    if(periodF==="custom") return {f:from, t:to};
    return {f:"", t:""};
  },[periodF,from,to,grade3FiscalStart,grade4FiscalStart]);
  const toFiscalLabel = (year, gradeText) => `${String(year).slice(-2)}年度（${gradeText}）`;
  const periodGrade3Label = toFiscalLabel(grade3FiscalStart, "3年生");
  const periodGrade4Label = toFiscalLabel(grade4FiscalStart, "4年生");
  const periodGrade3ShortLabel = `${String(grade3FiscalStart).slice(-2)}年度`;
  const periodGrade4ShortLabel = `${String(grade4FiscalStart).slice(-2)}年度`;
  const filtered=useMemo(()=>results.filter(r=>{
    if(typeF!=="all"&&!typeMatch(r,typeF)) return false;
    const d=nd(r.date);
    if(!isValidDateKey(d)) return false;
    if(periodRange.f&&d<periodRange.f) return false;
    if(periodRange.t&&d>periodRange.t) return false;
    return true;
  }),[results,typeF,periodRange]);
  const normalizeOppSearch = s => String(s||"").toLowerCase().replace(/\s+/g,"");
  const opponentOptions=useMemo(()=>
    [...new Set(filtered.map(r=>String(r?.opponent||"").trim()).filter(Boolean))].sort()
  ,[filtered]);
  const searchedResults=useMemo(()=>{
    const key=normalizeOppSearch(oppSearch);
    if(!key) return filtered;
    return filtered.filter(r=>normalizeOppSearch(r?.opponent).includes(key));
  },[filtered,oppSearch]);
  const visibleOpponentOptions=useMemo(()=>{
    const key=normalizeOppSearch(oppSearch);
    if(!key) return opponentOptions;
    return opponentOptions.filter(opp=>normalizeOppSearch(opp).includes(key));
  },[opponentOptions,oppSearch]);
  const selectOpponentOptions=useMemo(()=>{
    if(oppFilter==="all") return visibleOpponentOptions;
    return visibleOpponentOptions.includes(oppFilter)
      ? visibleOpponentOptions
      : [oppFilter, ...visibleOpponentOptions];
  },[visibleOpponentOptions,oppFilter]);
  const oppFiltered=useMemo(()=>
    oppFilter==="all"?searchedResults:searchedResults.filter(r=>r.opponent===oppFilter)
  ,[searchedResults,oppFilter]);
  const privateFavoriteMap = useMemo(() => normalizeFavoriteMap(favoriteMap), [favoriteMap]);
  const favoriteRows = useMemo(() => {
    const rows = (results || [])
      .map(r => {
        const id = String(r?.id || "").trim();
        const row = id ? privateFavoriteMap[id] : null;
        if (!row) return null;
        return {...r, _privateFavoriteAt: String(row.updatedAt || "")};
      })
      .filter(Boolean);
    return [...rows].sort((a,b) => {
      const ta = new Date(String(a._privateFavoriteAt || a.date || "")).getTime();
      const tb = new Date(String(b._privateFavoriteAt || b.date || "")).getTime();
      if (isNaN(ta) && isNaN(tb)) return nd(b.date).localeCompare(nd(a.date));
      if (isNaN(ta)) return 1;
      if (isNaN(tb)) return -1;
      return tb - ta;
    });
  }, [results, privateFavoriteMap]);
  const st=calcStats(filtered);
  const tournamentFiltered=useMemo(()=>schedules.filter(s=>{
    if(!["official","cup","公式戦","カップ戦"].includes(s.type)) return false;
    if(typeF!=="all"&&!typeMatch(s,typeF)) return false;
    const d=nd(s.date);
    if(!isValidDateKey(d)) return false;
    if(periodRange.f&&d<periodRange.f) return false;
    if(periodRange.t&&d>periodRange.t) return false;
    return true;
  }),[schedules,typeF,periodRange]);
  const championCount = tournamentFiltered.filter(s => {
    const rank = String(s.rank || "").trim();
    return ["優勝","1位","第1位","1"].includes(rank);
  }).length;
  const tournamentRows=tournamentFiltered
    .filter(s=>String(s.rank||"").trim())
    .sort((a,b)=>nd(b.date).localeCompare(nd(a.date)));

  // ランキング集計
  const scorerMap={},assistMap={},mvpMap={};
  // PK成功率: 各選手のPK得点(goalType==="PK")を集計
  const pkScoreMap={},pkTotalMap={};
  filtered.forEach(r=>{
    (r.goals||[]).forEach(g=>{
      const scId = g.scorerId || (g.scorerName && members.find(m=>m.name===g.scorerName)?.id) || "";
      const isOwnGoal = g.goalType==="オウンゴール";
      if(scId && !isOwnGoal) scorerMap[scId]=(scorerMap[scId]||0)+1;
      const asId = g.assistId || (g.assistName && members.find(m=>m.name===g.assistName)?.id) || "";
      if(asId && !isOwnGoal) assistMap[asId]=(assistMap[asId]||0)+1;
      // PK: goalType==="PK" かつ自チームの得点
      if(g.goalType==="PK" && scId) {
        pkScoreMap[scId]=(pkScoreMap[scId]||0)+1;
      }
    });
    // 相手ゴールにPKがあれば（失点PK）→ 選手別PK試行数に加算はしない（被PK）
  });
  // MVPはスケジュール（公式戦・カップ戦）から（期間フィルタ適用）
  schedules.forEach(s=>{
    if(!s.mvp) return;
    const t=s.type;
    if(!["official","cup","公式戦","カップ戦"].includes(t)) return;
    const d=nd(s.date); if(periodRange.f&&d<periodRange.f) return; if(periodRange.t&&d>periodRange.t) return;
    // MVP値はメンバー名で保存→IDに逆引き
    const m=members.find(x=>x.name===s.mvp||x.id===s.mvp);
    const key=m?m.id:s.mvp;
    mvpMap[key]=(mvpMap[key]||0)+1;
  });
  // toRank: IDで引けなければ名前で表示
  const toRank=(map,mbrs)=>Object.entries(map).map(([id,cnt])=>{
    const m=mbrs.find(x=>x.id===id)||mbrs.find(x=>x.name===id);
    return {m,cnt:Number(cnt||0),label:id};
  }).filter(x=>x.m).sort((a,b)=>Number(b.cnt||0)-Number(a.cnt||0)||Number(a.m.number||999)-Number(b.m.number||999)||String(a.m.name||"").localeCompare(String(b.m.name||""))).slice(0,10);

  // 個人成績: メンバー別集計
  const personalStats = useMemo(()=>members.map(m=>{
    let goals=0,assists=0,shots=0,pkMade=0,pkTotal=0,mvpCount=0;
    let shotRateGoals=0, shotRateShots=0;
    filtered.forEach(r=>{
      const resultDate = nd(r.date);
      const isShotRateTarget = !!resultDate && resultDate >= SHOT_RATE_START_DATE && !isTrueFlag(r.shotCountMissing);
      const shotMap = parseResultShotStats(r);
      const myShotsInResult = Math.max(0, Number(shotMap[m.id] || 0) || 0);
      shots += myShotsInResult;
      if (isShotRateTarget) shotRateShots += myShotsInResult;
      (r.goals||[]).forEach(g=>{
        const scId=g.scorerId||(g.scorerName&&members.find(x=>x.name===g.scorerName)?.id)||"";
        const asId=g.assistId||(g.assistName&&members.find(x=>x.name===g.assistName)?.id)||"";
        const isOwnGoal = g.goalType==="オウンゴール";
        if(scId===m.id && !isOwnGoal) {
          goals++;
          if (isShotRateTarget) shotRateGoals++;
        }
        if(asId===m.id && !isOwnGoal) assists++;
      });
      // pkKickers（キッカー方式）からPK成功率を集計
      try{
        const kickers=JSON.parse(r.pkKickers);
        if(Array.isArray(kickers)){
          kickers.forEach(k=>{
            if(k.memberId===m.id){ pkTotal++; if(k.success) pkMade++; }
          });
        }
      }catch(e){}
    });
    schedules.forEach(s=>{
      if(!s.mvp) return;
      if(!["official","cup","公式戦","カップ戦"].includes(s.type)) return;
      const sd=nd(s.date); if(periodRange.f&&sd<periodRange.f) return; if(periodRange.t&&sd>periodRange.t) return;
      const mv=members.find(x=>x.name===s.mvp||x.id===s.mvp);
      if(mv&&mv.id===m.id) mvpCount++;
    });
    return {...m,goals,assists,shots,pkMade,pkTotal,mvpCount,shotRateGoals,shotRateShots};
  }).filter(m=>m.goals>0||m.assists>0||m.shots>0||m.mvpCount>0).sort((a,b)=>b.goals-a.goals||b.shots-a.shots||b.assists-a.assists)
  ,[filtered,members,schedules,periodRange,SHOT_RATE_START_DATE]);

  return h(Fragment,{},
    // サブタブ
    h("div",{style:{display:"flex",background:"#fff",borderRadius:16,padding:4,marginBottom:14,boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}},
      [{k:"result",l:"🆚 対戦成績"},{k:"tournament",l:"🏆 大会結果"},{k:"rank",l:"📊 ランキング"},{k:"personal",l:"👤 個人成績"}].map(t=>
        h("button",{key:t.k,onClick:()=>setDashTab(t.k),
          style:{flex:1,padding:"10px 4px",border:"none",borderRadius:12,
            background:dashTab===t.k?"#1D4ED8":"transparent",
            color:dashTab===t.k?"#fff":"#aaa",fontSize:11,fontWeight:700,cursor:"pointer"}},t.l))),
    // フィルター（インライン）
    h("div",{style:{background:"#fff",borderRadius:16,padding:16,marginBottom:14,boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}},
      h("div",{style:{fontSize:11,fontWeight:700,color:"#bbb",letterSpacing:2,marginBottom:8}},"試合分類"),
      h("div",{style:{display:"grid",gridTemplateColumns:"repeat(4,minmax(0,1fr))",gap:4,marginBottom:10}},
        [{k:"all",l:"すべて"},{k:"official",l:"公式戦"},{k:"cup",l:"カップ戦"},{k:"training",l:"トレマ"}].map(t=>h("button",{key:t.k,onClick:()=>setTypeF(t.k),style:{padding:"6px 4px",border:`1.5px solid ${typeF===t.k?"#1D4ED8":"#E5E7EB"}`,borderRadius:16,background:typeF===t.k?"#1D4ED8":"#fff",color:typeF===t.k?"#fff":"#64748B",fontSize:11,fontWeight:typeF===t.k?700:500,cursor:"pointer",whiteSpace:"nowrap"}},t.l))),
      h("div",{style:{fontSize:11,fontWeight:700,color:"#bbb",letterSpacing:2,marginBottom:8,marginTop:4}},"期間"),
      h("div",{style:{display:"grid",gridTemplateColumns:"repeat(6,minmax(0,1fr))",gap:4,marginBottom:8}},

// リフティング記録入力コンポーネント
function LiftingInput({members,liftings}) {
  const [selId,setSelId]=useState("");
  const [cnt,setCnt]=useState("");
  const [saving,setSaving]=useState(false);
  const [saved,setSaved]=useState(false);
  const sel=members.find(m=>m.id===selId);
  const existing=liftings.find(x=>x.memberId===selId);
  const save=async()=>{
    if(!selId||!cnt) return;
    setSaving(true);
    await api("saveLifting",{memberId:selId,memberName:sel?.name||"",count:Number(cnt),date:todayLocal()});
    // ローカル反映
    const lf=liftings.find(x=>x.memberId===selId);
    if(lf){lf.count=Number(cnt);}else{liftings.push({memberId:selId,memberName:sel?.name||"",count:Number(cnt)});}
    setSaving(false);setSaved(true);setTimeout(()=>setSaved(false),2000);
  };
  return h("div",{style:{background:"#fff",borderRadius:16,padding:18,marginBottom:12,boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}},
    h("div",{style:{fontSize:13,fontWeight:800,color:"#1a1a2e",marginBottom:14}},"📝 記録を入力・更新"),
    h("select",{value:selId,onChange:e=>setSelId(e.target.value),style:{...css.inp,width:"100%",marginBottom:10}},
      h("option",{value:""},"選手を選択..."),
      ["FW","MF","DF","GK"].map(pos=>{
        const ms=members.filter(m=>m.position===pos).sort((a,b)=>Number(a.number)-Number(b.number));
        return ms.length?h("optgroup",{key:pos,label:pos},ms.map(m=>h("option",{key:m.id,value:m.id},"#"+m.number+" "+m.name))):null;
      }),
      members.filter(m=>!["FW","MF","DF","GK"].includes(m.position)).length>0&&h("optgroup",{label:"その他"},
        members.filter(m=>!["FW","MF","DF","GK"].includes(m.position)).sort((a,b)=>Number(a.number)-Number(b.number)).map(m=>h("option",{key:m.id,value:m.id},"#"+m.number+" "+m.name)))),
    existing&&h("div",{style:{fontSize:12,color:"#aaa",marginBottom:8}},"現在の記録: "+existing.count+"回"),
    h("div",{style:{display:"flex",gap:10,alignItems:"center"}},
      h("input",{type:"number",value:cnt,onChange:e=>setCnt(e.target.value),placeholder:"記録（回）",min:"0",style:{...css.inp,flex:1,fontSize:18,fontWeight:900,textAlign:"center"}}),
      h("button",{onClick:save,disabled:saving||!selId||!cnt,style:{...css.bS,flexShrink:0,padding:"10px 18px",opacity:(!selId||!cnt)?0.4:1}},
        saved?"✓ 保存済":saving?"保存中...":"保存")));
}

// ── 日程タブ：カレンダー＋今月の予定＋日程追加 ─────────────────
function CalTab({schedules,results,isAdmin,onGoToDay,onAddSchedule,onImportFc2Practice}) {
  const today=new Date();
  const [year,setYear]=useState(today.getFullYear());
  const [month,setMonth]=useState(today.getMonth());
  const [modal,setModal]=useState(false);
  const [dayModal,setDayModal]=useState(null);
  const [importModal,setImportModal]=useState(false);
  const [importMode,setImportMode]=useState("practice"); // practice | match
  const [importBusy,setImportBusy]=useState(false);
  const [importRows,setImportRows]=useState([]);
  const [importChecks,setImportChecks]=useState({});
  const [importResult,setImportResult]=useState(null);
  const [importForm,setImportForm]=useState({
    url:"http://afcjr.web.fc2.com/",
    year:today.getFullYear(),
    month:today.getMonth()+1
  });
  const [holidayMap,setHolidayMap]=useState(()=>{
    try{
      const cached = sessionStorage.getItem("afc_holiday_map_jp");
      return cached ? JSON.parse(cached) : {};
    }catch(e){ return {}; }
  });
  const defaultFs=(dateVal="",typeVal="official")=>({
    date:dateVal,allDay:true,timeFrom:"",timeTo:"",title:"",location:"",
    type:typeVal,deadline:"",carpoolDeadline:"",memo:""
  });
  const [fs,setFs]=useState(defaultFs());
  const todayStr=todayLocal();
  useEffect(()=>{
    if(holidayMap && Object.keys(holidayMap).length>0) return;
    let active=true;
    fetch("https://holidays-jp.github.io/api/v1/date.json")
      .then(r=>r.ok?r.json():{})
      .then(data=>{
        if(!active || !data || typeof data!=="object") return;
        setHolidayMap(data);
        try{ sessionStorage.setItem("afc_holiday_map_jp", JSON.stringify(data)); }catch(e){}
      })
      .catch(()=>{});
    return ()=>{ active=false; };
  },[]);

  // 過去の場所一覧（重複除去）
  const pastLocations=[...new Set(schedules.map(s=>s.location).filter(Boolean))];

  // 公式戦・カップ戦のタイトル選択肢
  const TITLE_OPTS={
    official:["春季大会","夏季大会","秋季大会","冬季大会","リーグ戦","選手権","県大会","市大会","その他"],
    cup:["カップ戦","招待大会","フレンドリーマッチ","その他"],
    training:["練習試合","トレーニングマッチ","その他"],
    practice:[],
    event:["スポーツ交流","親子イベント","その他"],
  };

  const isFridayDate=(dateStr)=>{
    const s=String(dateStr||"").trim();
    if(!/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
    const [y,m,d]=s.split("-").map(Number);
    return new Date(y,m-1,d).getDay()===5;
  };
  const applyFridayPracticeDefaults=(draft)=>{
    const p={...draft};
    if(p.type!=="practice" || !isFridayDate(p.date)) return p;
    p.allDay=false;
    if(!p.timeFrom) p.timeFrom="18:30";
    if(!p.timeTo) p.timeTo="20:30";
    if(!String(p.title||"").trim()) p.title="ナイター練習";
    return p;
  };
  const openAddScheduleModal=(dateVal="")=>{
    let next = defaultFs(dateVal,dateVal&&isFridayDate(dateVal)?"practice":"official");
    next = applyFridayPracticeDefaults(next);
    setFs(next);
    setModal(true);
  };
  const openImportModal=(mode="practice")=>{
    const nextMode = mode==="match" ? "match" : "practice";
    setImportMode(nextMode);
    setImportForm({
      url:"http://afcjr.web.fc2.com/",
      year:year,
      month:month+1
    });
    setImportRows([]);
    setImportChecks({});
    setImportResult(null);
    setImportModal(true);
  };
  const getImportRowUiKey=(row,i)=>String((row&&row.importKey)||"")+"#"+String(i);
  const buildImportCheckMap=(rows,checked)=>{
    const out={};
    (Array.isArray(rows)?rows:[]).forEach((r,i)=>{ out[getImportRowUiKey(r,i)] = !!checked; });
    return out;
  };
  const fetchImportPreview=async()=>{
    if(!onImportFc2Practice) return;
    setImportBusy(true);
    try{
      const y=Number(importForm.year||0);
      const m=Number(importForm.month||0);
      if(!y||!m||m<1||m>12) throw new Error("年・月を正しく入力してください");
      const r=await onImportFc2Practice({url:importForm.url,year:y,month:m,previewOnly:true,mode:importMode});
      const rows = Array.isArray(r.items)?r.items:[];
      setImportRows(rows);
      setImportChecks(buildImportCheckMap(rows,true)); // デフォルト全チェック
      setImportResult(null);
    }catch(e){
      alert("取り込み候補の取得エラー: "+(e&&e.message?e.message:"不明なエラー"));
    }finally{
      setImportBusy(false);
    }
  };
  const runImportFromPreview=async()=>{
    if(!onImportFc2Practice) return;
    if(!importRows.length){
      alert("先に取り込み候補を取得してください");
      return;
    }
    const selectedRows = importRows.filter((r,i)=>importChecks[getImportRowUiKey(r,i)]);
    const selectedKeys = selectedRows.map(r=>String(r?.importKey||"").trim()).filter(Boolean);
    if(!selectedRows.length){
      alert("取り込む予定にチェックを入れてください");
      return;
    }
    if(!selectedKeys.length){
      alert("候補キーが取得できませんでした。候補を再取得してください。");
      return;
    }
    if(!confirm(importMode==="match" ? "この内容で試合情報を取り込みますか？" : "この内容で練習予定を取り込みますか？")) return;
    setImportBusy(true);
    try{
      const y=Number(importForm.year||0);
      const m=Number(importForm.month||0);
      const r=await onImportFc2Practice({url:importForm.url,year:y,month:m,previewOnly:false,selectedKeys,mode:importMode});
      setImportResult(r||null);
      if(Array.isArray(r?.items)){
        setImportRows(r.items);
        setImportChecks(buildImportCheckMap(r.items,true));
      }
    }catch(e){
      alert("取り込みエラー: "+(e&&e.message?e.message:"不明なエラー"));
    }finally{
      setImportBusy(false);
    }
  };

  const saveSchedule=async()=>{
    const normalizedFs=applyFridayPracticeDefaults(fs);
    const isPractice=normalizedFs.type==="practice";
    const titleVal=String(normalizedFs.title||"").trim() || (isPractice?"練習":"");
    if(!normalizedFs.date) return alert("日付を入力してください");
    if(!titleVal) return alert("タイトルを入力してください");
    const dateVal=(!normalizedFs.allDay&&normalizedFs.timeFrom)?normalizedFs.date+"T"+normalizedFs.timeFrom:normalizedFs.date;
    const timeLabel=(!normalizedFs.allDay&&normalizedFs.timeFrom)?(normalizedFs.timeFrom+(normalizedFs.timeTo?" - "+normalizedFs.timeTo:"")):"";
    await onAddSchedule({...normalizedFs,title:titleVal,date:dateVal,timeLabel});
    setFs(defaultFs());
    setModal(false);
  };

  // カレンダー計算
  const daysInMonth=new Date(year,month+1,0).getDate();
  const firstDay=new Date(year,month,1).getDay();
  const dayData={};
  schedules.forEach(s=>{
    const dd=nd(s.date); if(!dd) return;
    const [y,m,d]=dd.split("-").map(Number);
    if(y===year&&m===month+1){if(!dayData[d])dayData[d]=[];dayData[d].push(s);}
  });
  const cells=[]; for(let i=0;i<firstDay;i++)cells.push(null); for(let d=1;d<=daysInMonth;d++)cells.push(d);
  const weeks=[]; let row=[];
  cells.forEach(d=>{row.push(d);if(row.length===7){weeks.push(row);row=[];}});
  if(row.length>0){while(row.length<7)row.push(null);weeks.push(row);}
  const prev=()=>{if(month===0){setYear(y=>y-1);setMonth(11);}else setMonth(m=>m-1);};
  const next=()=>{if(month===11){setYear(y=>y+1);setMonth(0);}else setMonth(m=>m+1);};

  return h(Fragment,{},
// ── カレンダー本体
h("div",{style:{background:"#fff",borderRadius:16,padding:14,marginBottom:12,boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}},

  h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}},
    h("button",{onClick:prev,style:{background:"#F0F4F8",border:"none",borderRadius:8,width:36,height:36,fontSize:20,cursor:"pointer"}},"‹"),
    h("div",{style:{fontSize:17,fontWeight:800,color:"#1a1a2e"}},year+"年 "+(month+1)+"月"),
    h("button",{onClick:next,style:{background:"#F0F4F8",border:"none",borderRadius:8,width:36,height:36,fontSize:20,cursor:"pointer"}},"›")
  ),

  h("div",{style:{display:"grid",gridTemplateColumns:"repeat(7,minmax(0,1fr))",marginBottom:4}},
    ["日","月","火","水","木","金","土"].map((d,i)=>h("div",{key:d,style:{textAlign:"center",fontSize:11,fontWeight:700,color:i===0?"#F44336":i===6?"#2196F3":"#aaa",padding:"4px 0"}},d))
  ),

  weeks.map((wk,wi)=>h("div",{key:wi,style:{display:"grid",gridTemplateColumns:"repeat(7,minmax(0,1fr))",gap:1}},
    wk.map((d,di)=>{
      if(!d) return h("div",{key:di});
      const dStr=`${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      const evs=dayData[d]||[];
      const holidayName = String(holidayMap[dStr] || "");
      const isHoliday = !!holidayName;
      const isToday=dStr===todayStr;
      const primaryEvent = evs[0] || null;
      const primaryType = primaryEvent ? getTC(primaryEvent.type) : null;
      const typeLabel = primaryType ? primaryType.lb : "予定";
      const typeColor = primaryType ? primaryType.bg : "#1D4ED8";
      const softBgMap = {"練習":"#E8F5E9","公式戦":"#DBEAFE","トレマ":"#E8F1FF","カップ戦":"#F3E8FF","イベント":"#E0F2F1"};
      const typeSoftBg = softBgMap[typeLabel] || "#EFF6FF";
      const moreCount = evs.length > 1 ? evs.length - 1 : 0;
      const clickDay=()=>{
        setDayModal({date:dStr,events:evs});
      };
      return h("div",{key:di,onClick:clickDay,style:{textAlign:"center",padding:"4px 2px",borderRadius:8,background:isToday?"#1D4ED8":evs.length>0?typeSoftBg:"transparent",minHeight:60,minWidth:0,width:"100%",overflow:"hidden",cursor:"pointer"}},
        h("div",{style:{fontSize:13,fontWeight:isToday?900:400,color:isToday?"#fff":isHoliday?"#F44336":di===0?"#F44336":di===6?"#2196F3":"#1a1a2e"}},d),
        isHoliday&&h("div",{style:{fontSize:8,fontWeight:700,lineHeight:1.2,color:isToday?"rgba(255,255,255,0.95)":"#EF4444",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",marginTop:2}},holidayName),
        evs.length>0&&h("div",{style:{marginTop:3,padding:"3px 4px",borderRadius:7,background:isToday?"rgba(255,255,255,0.22)":"#fff",border:isToday?"1px solid rgba(255,255,255,0.35)":`1px solid ${typeColor}44`,textAlign:"left",width:"100%",boxSizing:"border-box",overflow:"hidden"}},
          h("div",{style:{fontSize:8,fontWeight:800,color:isToday?"#fff":typeColor,lineHeight:1.2,whiteSpace:"nowrap",overflow:"hidden"}},
            typeLabel+(moreCount>0?` +${moreCount}`:"")),
          h("div",{style:{fontSize:9,fontWeight:700,color:isToday?"#fff":"#1E293B",lineHeight:1.25,marginTop:2,whiteSpace:"nowrap",overflow:"hidden",maxWidth:"100%"}},
            primaryEvent?.title||"予定")
        )
      );
    })
  )),

  // 凡例＋追加ボタン
    h("div",{style:{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:10,marginBottom:10,flexWrap:"wrap"}},
      h("div",{style:{display:"flex",gap:8,flexWrap:"wrap",flex:1,minWidth:220}},
        [{c:"#4CAF50",l:"練習"},{c:"#1D4ED8",l:"公式戦"},{c:"#2563EB",l:"トレマ"},{c:"#0F172A",l:"カップ戦"},{c:"#009688",l:"イベント"}].map(x=>
          h("div",{key:x.l,style:{display:"flex",alignItems:"center",gap:6,padding:"5px 9px",borderRadius:999,border:"1px solid #E2E8F0",background:"#F8FAFC"}},
            h("div",{style:{width:9,height:9,borderRadius:"50%",background:x.c,flexShrink:0}}),
            h("span",{style:{fontSize:11,fontWeight:700,color:"#475569",lineHeight:1}},x.l)
          )
        )
      ),
      isAdmin&&h("div",{style:{display:"grid",gap:8,minWidth:180}},
        h("button",{onClick:()=>openImportModal("practice"),style:{...css.bG,padding:"8px 12px",fontSize:12,whiteSpace:"nowrap",width:"100%"}},"練習日程インポート"),
        h("button",{onClick:()=>openImportModal("match"),style:{...css.bG,padding:"8px 12px",fontSize:12,whiteSpace:"nowrap",width:"100%"}},"試合インポート"),
        h("button",{onClick:()=>openAddScheduleModal(),style:{...css.bO,padding:"8px 12px",fontSize:12,whiteSpace:"nowrap",width:"100%"}},"+ 日程追加")
      )
    )
),
    // ── 今月の予定リスト
    (()=>{const upcomingDayKeys=Object.keys(dayData).filter(d=>`${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`>=todayStr).sort((a,b)=>Number(a)-Number(b));
      return h(Fragment,{},
    h("div",{style:{fontSize:11,fontWeight:700,color:"#bbb",letterSpacing:2,marginBottom:10}},"今月の予定"),
    upcomingDayKeys.length===0
      ?h("div",{style:{background:"#fff",borderRadius:14,padding:20,textAlign:"center",color:"#ccc",fontSize:13}},"本日以降の日程はありません")
      :upcomingDayKeys.map(d=>{
          const evs=dayData[d];
          const dStr=`${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
          const dt=fmt(dStr);
          return h("div",{key:d,id:"cal-day-"+dStr,style:{background:"#fff",borderRadius:14,padding:"12px 16px",marginBottom:8,boxShadow:"0 1px 6px rgba(0,0,0,0.05)"}},
            h("div",{style:{fontSize:13,fontWeight:700,color:"#1a1a2e",marginBottom:8}},dt.m+"/"+dt.d+"("+dt.dw+")"),
            evs.map(e=>{
              const tc=getTC(e.type);
              const dayR=results.filter(r=>r.scheduleId===e.id||nd(r.date)===nd(e.date));
              // クリックでその日のまとめページへ
              const clickEv=()=>onGoToDay(e);
              return h("div",{key:e.id,onClick:clickEv,
                style:{display:"flex",gap:10,alignItems:"center",marginBottom:6,
                  cursor:"pointer",
                  padding:"8px 10px",borderRadius:10,
                  background:"#F8F9FA",
                  transition:"background 0.15s"}},
                h("div",{style:{width:4,height:42,background:tc.bg,borderRadius:2,flexShrink:0}}),
                h("div",{style:{flex:1}},
                  h(Bdg,{label:tc.lb,color:tc.bg,small:true}),
                  h("div",{style:{fontSize:13,fontWeight:600,color:"#333",marginTop:2}},e.title),
                  e.timeLabel&&h("div",{style:{fontSize:11,color:"#FF9800",fontWeight:600}},"🕐 "+e.timeLabel),
                  e.location&&h("div",{style:{fontSize:11,color:"#aaa"}},"📍 "+e.location)),
                h("div",{style:{textAlign:"right",flexShrink:0}},
                  dayR.length>0&&h("div",{style:{fontSize:11,color:"#4CAF50",fontWeight:700}},"⚽ "+dayR.length+"試合"),
                  h("div",{style:{fontSize:14,color:"#ccc",marginTop:2}},"›")));
            }));
        })
      );
    })(),

    dayModal&&h(Modal,{title:fmt(dayModal.date).full,onClose:()=>setDayModal(null),position:"center"},
      dayModal.events.length===0
        ? h("div",{style:{fontSize:13,color:"#94A3B8",marginBottom:16}},"この日の予定はまだありません")
        : h("div",{style:{display:"grid",gap:8,marginBottom:16}},
            dayModal.events.map(e=>{
              const tc=getTC(e.type);
              return h("div",{key:e.id,onClick:()=>{setDayModal(null);onGoToDay(e);},
                style:{display:"flex",gap:10,alignItems:"center",padding:"10px 12px",borderRadius:10,background:"#F8FAFC",cursor:"pointer"}},
                h("div",{style:{width:4,height:40,borderRadius:3,background:tc.bg,flexShrink:0}}),
                h("div",{style:{flex:1,minWidth:0}},
                  h(Bdg,{label:tc.lb,color:tc.bg,small:true}),
                  h("div",{style:{fontSize:13,fontWeight:700,color:"#1E293B",marginTop:4,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},e.title||"予定"),
                  e.timeLabel&&h("div",{style:{fontSize:11,color:"#64748B",marginTop:2}},"🕐 "+e.timeLabel),
                  e.location&&h("div",{style:{fontSize:11,color:"#94A3B8",marginTop:2,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},"📍 "+e.location)),
                h("div",{style:{fontSize:14,color:"#CBD5E1"}},"›"));
            })),
      isAdmin&&h("button",{onClick:()=>{
          const targetDate = dayModal.date;
          setDayModal(null);
          openAddScheduleModal(targetDate);
        },style:{...css.bS,width:"100%"}},
        dayModal.events.length>0 ? "予定を追加" : "予定を作成")
    ),

    // ── 日程追加モーダル
    modal&&h(Modal,{title:"日程を追加",onClose:()=>setModal(false)},
      // 1. 種類（最初に選ぶ）
      h("div",{style:{marginBottom:16}},
        h("div",{style:{fontSize:12,fontWeight:600,color:"#666",marginBottom:8}},"種類"),
        h("div",{style:{display:"flex",gap:6,flexWrap:"wrap"}},
          Object.entries(TC).map(([k,v])=>h("button",{key:k,
            onClick:()=>setFs(p=>{
              let next={...p,type:k,carpoolDeadline:(k==="practice"||k==="event")?"":p.carpoolDeadline};
              if(k!=="practice" && String(next.title||"").trim()==="ナイター練習") next.title="";
              next=applyFridayPracticeDefaults(next);
              return next;
            }),
            style:{flex:1,padding:"9px 4px",border:"2px solid "+(fs.type===k?v.bg:"#eee"),
              borderRadius:10,background:fs.type===k?v.bg:"#fff",
              color:fs.type===k?"#fff":"#666",fontSize:11,fontWeight:600,cursor:"pointer",minWidth:60}},v.lb)))),

      // 2. 日付 + 終日/時間
      h("div",{style:{marginBottom:14}},
        h("div",{style:{fontSize:12,fontWeight:600,color:"#666",marginBottom:6}},"日付"),
        h("input",{type:"date",value:fs.date,onChange:e=>setFs(p=>applyFridayPracticeDefaults({...p,date:e.target.value})),style:css.inp})),
      h("div",{style:{marginBottom:14}},
        h("div",{style:{fontSize:12,fontWeight:600,color:"#666",marginBottom:8}},"時間"),
        h("div",{style:{display:"flex",gap:8}},
          [{k:true,l:"終日"},{k:false,l:"時間指定"}].map(opt=>
            h("button",{key:String(opt.k),onClick:()=>setFs(p=>({...p,allDay:opt.k})),
              style:{flex:1,padding:"9px",border:"2px solid "+(fs.allDay===opt.k?"#1D4ED8":"#eee"),
                borderRadius:10,background:fs.allDay===opt.k?"#1D4ED8":"#fff",
                color:fs.allDay===opt.k?"#fff":"#666",fontSize:13,fontWeight:700,cursor:"pointer"}},opt.l))),
        !fs.allDay&&h("div",{style:{display:"flex",alignItems:"center",gap:8,marginTop:8}},
          h("input",{type:"time",value:fs.timeFrom,onChange:e=>setFs(p=>({...p,timeFrom:e.target.value})),
            style:{...css.inp,flex:1}}),
          h("span",{style:{color:"#aaa",flexShrink:0,fontWeight:700}},"〜"),
          h("input",{type:"time",value:fs.timeTo,onChange:e=>setFs(p=>({...p,timeTo:e.target.value})),
            style:{...css.inp,flex:1}}))),

      // 3. タイトル
      h("div",{style:{marginBottom:14}},
        h("div",{style:{fontSize:12,fontWeight:600,color:"#666",marginBottom:6}},"タイトル"),
        h("div",{style:{display:"flex",gap:6,flexWrap:"wrap",marginBottom:6}},
          (TITLE_OPTS[fs.type]||[]).map(t=>
            h("button",{key:t,onClick:()=>setFs(p=>({...p,title:t})),
              style:{padding:"5px 10px",border:"2px solid "+(fs.title===t?"#1D4ED8":"#eee"),
                borderRadius:8,background:fs.title===t?"#1D4ED8":"#fff",
                color:fs.title===t?"#fff":"#666",fontSize:12,cursor:"pointer"}},t))),
        h("input",{value:fs.title,onChange:e=>setFs(p=>({...p,title:e.target.value})),
          placeholder:"またはここに入力",style:css.inp})),

      // 4. 場所（過去の場所サジェスト）
      h("div",{style:{marginBottom:20}},
        h("div",{style:{fontSize:12,fontWeight:600,color:"#666",marginBottom:6}},"場所"),
        pastLocations.length>0&&h("div",{style:{display:"flex",gap:6,flexWrap:"wrap",marginBottom:6}},
          pastLocations.map(loc=>
            h("button",{key:loc,onClick:()=>setFs(p=>({...p,location:loc})),
              style:{padding:"5px 10px",border:"2px solid "+(fs.location===loc?"#2196F3":"#eee"),
                borderRadius:8,background:fs.location===loc?"#2196F3":"#fff",
                color:fs.location===loc?"#fff":"#666",fontSize:12,cursor:"pointer"}},loc))),
        h("input",{value:fs.location,onChange:e=>setFs(p=>({...p,location:e.target.value})),
          placeholder:"市営グラウンド",style:css.inp})),
      h("div",{style:{marginBottom:12}},
        h("div",{style:{fontSize:12,fontWeight:600,color:"#666",marginBottom:6}},"日程メモ（任意）"),
        h("textarea",{value:fs.memo||"",onChange:e=>setFs(p=>({...p,memo:e.target.value})),
          rows:3,placeholder:"この日の補足メモを入力",style:{...css.inp,width:"100%",resize:"none"}})),
      h("div",{style:{marginBottom:12}},
        h("div",{style:{fontSize:12,fontWeight:600,color:"#666",marginBottom:6}},"出欠締め切り日（任意）"),
        h("input",{type:"date",value:fs.deadline||"",onChange:e=>setFs(p=>({...p,deadline:e.target.value})),style:{...css.inp,width:"100%"}})),
      fs.type!=="practice"&&fs.type!=="event"&&h("div",{style:{marginBottom:20}},
        h("div",{style:{fontSize:12,fontWeight:600,color:"#666",marginBottom:6}},"配車締め切り日（任意）"),
