function DashTab({results,members,schedules,liftings=[],isAdmin=false,initialDashTab="result",onGoToMatch,onGoToDay}) {
  const SHOT_RATE_START_DATE = "2026-04-12";
  const [dashTab,setDashTab]=useState(initialDashTab); // "result" | "tournament" | "rank" | "personal"
  const [typeF,setTypeF]=useState("all");
  const [periodF,setPeriodF]=useState("grade4"); // "alltime"|"grade4"|"grade3"|"month"|"lastmonth"|"custom"
  const [from,setFrom]=useState("");
  const [to,setTo]=useState("");
  const [oppFilter,setOppFilter]=useState("all"); // "all" or opponent name
  const [oppSearch,setOppSearch]=useState("");
  useEffect(()=>{ if(initialDashTab) setDashTab(initialDashTab); },[initialDashTab]);
  const currentFiscalStart = useMemo(() => {
    const now = new Date();
    return now.getMonth() + 1 >= 4 ? now.getFullYear() : now.getFullYear() - 1;
  }, []);
  const grade3FiscalStart = currentFiscalStart - 1;
  const grade4FiscalStart = currentFiscalStart;
  const getResultType=row=>{
    const linked=findLinkedScheduleForResult(row, schedules);
    return normalizeType(row.type || linked?.type || "");
  };
  function typeMatch(r,typeF){
    if(typeF==="all") return true;
    const baseType = r && Object.prototype.hasOwnProperty.call(r,"opponent") ? getResultType(r) : normalizeType(r.type);
    return baseType===normalizeType(typeF);
  }
  const parseResultShotStats = r => parseShotStatsMap((r && r.shotStats) || {});
  const periodRange=useMemo(()=>{
    const now=new Date();
    const y=now.getFullYear(), m=now.getMonth()+1;
    if(periodF==="alltime") return {f:"", t:""};
    if(periodF==="grade3")  return {f:`${grade3FiscalStart}-04-01`, t:`${grade3FiscalStart+1}-03-31`};
    if(periodF==="grade4")  return {f:`${grade4FiscalStart}-04-01`, t:`${grade4FiscalStart+1}-03-31`};
    if(periodF==="month")   return {f:`${y}-${String(m).padStart(2,"0")}-01`, t:`${y}-${String(m).padStart(2,"0")}-31`};
    if(periodF==="lastmonth"){
      const lm = m===1 ? 12 : m-1;
      const ly = m===1 ? y-1 : y;
      return {f:`${ly}-${String(lm).padStart(2,"0")}-01`, t:`${ly}-${String(lm).padStart(2,"0")}-31`};
    }
    if(periodF==="custom") return {f:from, t:to};
    return {f:"", t:""};
  },[periodF,from,to,grade3FiscalStart,grade4FiscalStart]);
  const toFiscalLabel = (year, gradeText) => `${String(year).slice(-2)}年度（${gradeText}）`;
  const periodGrade3Label = toFiscalLabel(grade3FiscalStart, "3年生");
  const periodGrade4Label = toFiscalLabel(grade4FiscalStart, "4年生");
  const periodGrade3ShortLabel = `${String(grade3FiscalStart).slice(-2)}年度`;
  const periodGrade4ShortLabel = `${String(grade4FiscalStart).slice(-2)}年度`;
  const filtered=useMemo(()=>results.filter(r=>{
    if(typeF!=="all"&&!typeMatch(r,typeF)) return false;
    const d=nd(r.date);
    if(periodRange.f&&d<periodRange.f) return false;
    if(periodRange.t&&d>periodRange.t) return false;
    return true;
  }),[results,typeF,periodRange]);
  const normalizeOppSearch = s => String(s||"").toLowerCase().replace(/\s+/g,"");
  const opponentOptions=useMemo(()=>
    [...new Set(filtered.map(r=>String(r?.opponent||"").trim()).filter(Boolean))].sort()
  ,[filtered]);
  const searchedResults=useMemo(()=>{
    const key=normalizeOppSearch(oppSearch);
    if(!key) return filtered;
    return filtered.filter(r=>normalizeOppSearch(r?.opponent).includes(key));
  },[filtered,oppSearch]);
  const visibleOpponentOptions=useMemo(()=>{
    const key=normalizeOppSearch(oppSearch);
    if(!key) return opponentOptions;
    return opponentOptions.filter(opp=>normalizeOppSearch(opp).includes(key));
  },[opponentOptions,oppSearch]);
  const selectOpponentOptions=useMemo(()=>{
    if(oppFilter==="all") return visibleOpponentOptions;
    return visibleOpponentOptions.includes(oppFilter)
      ? visibleOpponentOptions
      : [oppFilter, ...visibleOpponentOptions];
  },[visibleOpponentOptions,oppFilter]);
  const oppFiltered=useMemo(()=>
    oppFilter==="all"?searchedResults:searchedResults.filter(r=>r.opponent===oppFilter)
  ,[searchedResults,oppFilter]);
  const st=calcStats(filtered);
  const tournamentFiltered=useMemo(()=>schedules.filter(s=>{
    if(!["official","cup","公式戦","カップ戦"].includes(s.type)) return false;
    if(typeF!=="all"&&!typeMatch(s,typeF)) return false;
    const d=nd(s.date);
    if(periodRange.f&&d<periodRange.f) return false;
    if(periodRange.t&&d>periodRange.t) return false;
    return true;
  }),[schedules,typeF,periodRange]);
  const championCount = tournamentFiltered.filter(s => {
    const rank = String(s.rank || "").trim();
    return ["優勝","1位","第1位","1"].includes(rank);
  }).length;
  const tournamentRows=tournamentFiltered
    .filter(s=>String(s.rank||"").trim())
    .sort((a,b)=>nd(b.date).localeCompare(nd(a.date)));

  // ランキング集計
  const scorerMap={},assistMap={},mvpMap={};
  // PK成功率: 各選手のPK得点(goalType==="PK")を集計
  const pkScoreMap={},pkTotalMap={};
  filtered.forEach(r=>{
    (r.goals||[]).forEach(g=>{
      const scId = g.scorerId || (g.scorerName && members.find(m=>m.name===g.scorerName)?.id) || "";
      const isOwnGoal = g.goalType==="オウンゴール";
      if(scId && !isOwnGoal) scorerMap[scId]=(scorerMap[scId]||0)+1;
      const asId = g.assistId || (g.assistName && members.find(m=>m.name===g.assistName)?.id) || "";
      if(asId && !isOwnGoal) assistMap[asId]=(assistMap[asId]||0)+1;
      // PK: goalType==="PK" かつ自チームの得点
      if(g.goalType==="PK" && scId) {
        pkScoreMap[scId]=(pkScoreMap[scId]||0)+1;
      }
    });
    // 相手ゴールにPKがあれば（失点PK）→ 選手別PK試行数に加算はしない（被PK）
  });
  // MVPはスケジュール（公式戦・カップ戦）から（期間フィルタ適用）
  schedules.forEach(s=>{
    if(!s.mvp) return;
    const t=s.type;
    if(!["official","cup","公式戦","カップ戦"].includes(t)) return;
    const d=nd(s.date); if(periodRange.f&&d<periodRange.f) return; if(periodRange.t&&d>periodRange.t) return;
    // MVP値はメンバー名で保存→IDに逆引き
    const m=members.find(x=>x.name===s.mvp||x.id===s.mvp);
    const key=m?m.id:s.mvp;
    mvpMap[key]=(mvpMap[key]||0)+1;
  });
  // toRank: IDで引けなければ名前で表示
  const toRank=(map,mbrs)=>Object.entries(map).map(([id,cnt])=>{
    const m=mbrs.find(x=>x.id===id)||mbrs.find(x=>x.name===id);
    return {m,cnt:Number(cnt||0),label:id};
  }).filter(x=>x.m).sort((a,b)=>Number(b.cnt||0)-Number(a.cnt||0)||Number(a.m.number||999)-Number(b.m.number||999)||String(a.m.name||"").localeCompare(String(b.m.name||""))).slice(0,10);

  // 個人成績: メンバー別集計
  const personalStats = useMemo(()=>members.map(m=>{
    let goals=0,assists=0,shots=0,pkMade=0,pkTotal=0,mvpCount=0;
    let shotRateGoals=0, shotRateShots=0;
    filtered.forEach(r=>{
      const resultDate = nd(r.date);
      const isShotRateTarget = !!resultDate && resultDate >= SHOT_RATE_START_DATE && !isTrueFlag(r.shotCountMissing);
      const shotMap = parseResultShotStats(r);
      const myShotsInResult = Math.max(0, Number(shotMap[m.id] || 0) || 0);
      shots += myShotsInResult;
      if (isShotRateTarget) shotRateShots += myShotsInResult;
      (r.goals||[]).forEach(g=>{
        const scId=g.scorerId||(g.scorerName&&members.find(x=>x.name===g.scorerName)?.id)||"";
        const asId=g.assistId||(g.assistName&&members.find(x=>x.name===g.assistName)?.id)||"";
        const isOwnGoal = g.goalType==="オウンゴール";
        if(scId===m.id && !isOwnGoal) {
          goals++;
          if (isShotRateTarget) shotRateGoals++;
        }
        if(asId===m.id && !isOwnGoal) assists++;
      });
      // pkKickers（キッカー方式）からPK成功率を集計
      try{
        const kickers=JSON.parse(r.pkKickers);
        if(Array.isArray(kickers)){
          kickers.forEach(k=>{
            if(k.memberId===m.id){ pkTotal++; if(k.success) pkMade++; }
          });
        }
      }catch(e){}
    });
    schedules.forEach(s=>{
      if(!s.mvp) return;
      if(!["official","cup","公式戦","カップ戦"].includes(s.type)) return;
      const sd=nd(s.date); if(periodRange.f&&sd<periodRange.f) return; if(periodRange.t&&sd>periodRange.t) return;
      const mv=members.find(x=>x.name===s.mvp||x.id===s.mvp);
      if(mv&&mv.id===m.id) mvpCount++;
    });
    return {...m,goals,assists,shots,pkMade,pkTotal,mvpCount,shotRateGoals,shotRateShots};
  }).filter(m=>m.goals>0||m.assists>0||m.shots>0||m.mvpCount>0).sort((a,b)=>b.goals-a.goals||b.shots-a.shots||b.assists-a.assists)
  ,[filtered,members,schedules,periodRange,SHOT_RATE_START_DATE]);

  return h(Fragment,{},
    // サブタブ
    h("div",{style:{display:"flex",background:"#fff",borderRadius:16,padding:4,marginBottom:14,boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}},
      [{k:"result",l:"🆚 対戦成績"},{k:"tournament",l:"🏆 大会結果"},{k:"rank",l:"📊 ランキング"},{k:"personal",l:"👤 個人成績"}].map(t=>
        h("button",{key:t.k,onClick:()=>setDashTab(t.k),
          style:{flex:1,padding:"10px 4px",border:"none",borderRadius:12,
            background:dashTab===t.k?"#1D4ED8":"transparent",
            color:dashTab===t.k?"#fff":"#aaa",fontSize:11,fontWeight:700,cursor:"pointer"}},t.l))),
    // フィルター（インライン）
    h("div",{style:{background:"#fff",borderRadius:16,padding:16,marginBottom:14,boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}},
      h("div",{style:{fontSize:11,fontWeight:700,color:"#bbb",letterSpacing:2,marginBottom:8}},"試合分類"),
      h("div",{style:{display:"grid",gridTemplateColumns:"repeat(4,minmax(0,1fr))",gap:4,marginBottom:10}},
        [{k:"all",l:"すべて"},{k:"official",l:"公式戦"},{k:"cup",l:"カップ戦"},{k:"training",l:"トレマ"}].map(t=>h("button",{key:t.k,onClick:()=>setTypeF(t.k),style:{padding:"6px 4px",border:`1.5px solid ${typeF===t.k?"#1D4ED8":"#E5E7EB"}`,borderRadius:16,background:typeF===t.k?"#1D4ED8":"#fff",color:typeF===t.k?"#fff":"#64748B",fontSize:11,fontWeight:typeF===t.k?700:500,cursor:"pointer",whiteSpace:"nowrap"}},t.l))),
      h("div",{style:{fontSize:11,fontWeight:700,color:"#bbb",letterSpacing:2,marginBottom:8,marginTop:4}},"期間"),
      h("div",{style:{display:"grid",gridTemplateColumns:"repeat(6,minmax(0,1fr))",gap:4,marginBottom:8}},
        [{k:"alltime",l:"全期間"},{k:"grade4",l:periodGrade4ShortLabel},{k:"grade3",l:periodGrade3ShortLabel},{k:"month",l:"今月"},{k:"lastmonth",l:"先月"},{k:"custom",l:"期間指定"}].map(t=>h("button",{key:t.k,onClick:()=>setPeriodF(t.k),title:t.k==="grade4"?periodGrade4Label:(t.k==="grade3"?periodGrade3Label:t.l),style:{padding:"6px 2px",border:`1.5px solid ${periodF===t.k?"#2196F3":"#E5E7EB"}`,borderRadius:16,background:periodF===t.k?"#2196F3":"#fff",color:periodF===t.k?"#fff":"#64748B",fontSize:11,fontWeight:periodF===t.k?700:500,cursor:"pointer",whiteSpace:"nowrap"}},t.l))),
      h("div",{style:{fontSize:11,fontWeight:600,color:"#64748B",marginBottom:8}},
        "※ 試合記録は 2025年10月19日 以降が対象です"),
      periodF==="custom"&&h("div",{style:{display:"flex",gap:8,alignItems:"center",marginTop:4}},
        h("input",{type:"date",value:from,onChange:e=>setFrom(e.target.value),style:{...css.inp,flex:1,fontSize:13,padding:"8px 10px"}}),
        h("span",{style:{color:"#ccc",flexShrink:0}},"〜"),
        h("input",{type:"date",value:to,onChange:e=>setTo(e.target.value),style:{...css.inp,flex:1,fontSize:13,padding:"8px 10px"}})),
      dashTab==="result"&&h("div",{style:{marginTop:10,paddingTop:10,borderTop:"1px solid #f5f5f5"}},
        h("div",{style:{fontSize:11,fontWeight:700,color:"#bbb",marginBottom:6}},"対戦相手"),
        h("div",{style:{display:"flex",gap:8,marginBottom:8}},
          h("input",{value:oppSearch,onChange:e=>setOppSearch(e.target.value),placeholder:"対戦相手を検索（部分一致）",
            style:{...css.inp,flex:1,fontSize:13}}),
          !!oppSearch&&h("button",{onClick:()=>setOppSearch(""),
            style:{padding:"0 12px",border:"1px solid #E2E8F0",borderRadius:10,background:"#fff",fontSize:12,fontWeight:700,color:"#64748B",cursor:"pointer"}},"クリア")),
        h("select",{value:oppFilter,onChange:e=>setOppFilter(e.target.value),
          style:{...css.inp,width:"100%",fontSize:13}},
          h("option",{value:"all"},"全相手"),
          selectOpponentOptions.map(opp=>
            h("option",{key:opp,value:opp},opp))))),

    // ── 対戦成績タブ ──
    dashTab==="result"&&h(Fragment,{},
      (()=>{
        const st2=calcStats(oppFiltered);
        const oppMap={};
        searchedResults.forEach(r=>{
          if(!r.opponent) return;
          if(!oppMap[r.opponent]) oppMap[r.opponent]={w:0,d:0,l:0,gf:0,ga:0};
          const o=oppMap[r.opponent];

// リフティング記録入力コンポーネント
function LiftingInput({members,liftings}) {
  const [selId,setSelId]=useState("");
  const [cnt,setCnt]=useState("");
  const [saving,setSaving]=useState(false);
  const [saved,setSaved]=useState(false);
  const sel=members.find(m=>m.id===selId);
  const existing=liftings.find(x=>x.memberId===selId);
  const save=async()=>{
    if(!selId||!cnt) return;
    setSaving(true);
    await api("saveLifting",{memberId:selId,memberName:sel?.name||"",count:Number(cnt),date:todayLocal()});
    // ローカル反映
    const lf=liftings.find(x=>x.memberId===selId);
    if(lf){lf.count=Number(cnt);}else{liftings.push({memberId:selId,memberName:sel?.name||"",count:Number(cnt)});}
    setSaving(false);setSaved(true);setTimeout(()=>setSaved(false),2000);
  };
  return h("div",{style:{background:"#fff",borderRadius:16,padding:18,marginBottom:12,boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}},
    h("div",{style:{fontSize:13,fontWeight:800,color:"#1a1a2e",marginBottom:14}},"📝 記録を入力・更新"),
    h("select",{value:selId,onChange:e=>setSelId(e.target.value),style:{...css.inp,width:"100%",marginBottom:10}},
      h("option",{value:""},"選手を選択..."),
      ["FW","MF","DF","GK"].map(pos=>{
        const ms=members.filter(m=>m.position===pos).sort((a,b)=>Number(a.number)-Number(b.number));
        return ms.length?h("optgroup",{key:pos,label:pos},ms.map(m=>h("option",{key:m.id,value:m.id},"#"+m.number+" "+m.name))):null;
      }),
      members.filter(m=>!["FW","MF","DF","GK"].includes(m.position)).length>0&&h("optgroup",{label:"その他"},
        members.filter(m=>!["FW","MF","DF","GK"].includes(m.position)).sort((a,b)=>Number(a.number)-Number(b.number)).map(m=>h("option",{key:m.id,value:m.id},"#"+m.number+" "+m.name)))),
    existing&&h("div",{style:{fontSize:12,color:"#aaa",marginBottom:8}},"現在の記録: "+existing.count+"回"),
    h("div",{style:{display:"flex",gap:10,alignItems:"center"}},
      h("input",{type:"number",value:cnt,onChange:e=>setCnt(e.target.value),placeholder:"記録（回）",min:"0",style:{...css.inp,flex:1,fontSize:18,fontWeight:900,textAlign:"center"}}),
      h("button",{onClick:save,disabled:saving||!selId||!cnt,style:{...css.bS,flexShrink:0,padding:"10px 18px",opacity:(!selId||!cnt)?0.4:1}},
        saved?"✓ 保存済":saving?"保存中...":"保存")));
}

// ── 日程タブ：カレンダー＋今月の予定＋日程追加 ─────────────────
function CalTab({schedules,results,isAdmin,onGoToDay,onAddSchedule}) {
  const today=new Date();
  const [year,setYear]=useState(today.getFullYear());
  const [month,setMonth]=useState(today.getMonth());
  const [modal,setModal]=useState(false);
  const [dayModal,setDayModal]=useState(null);
  const [holidayMap,setHolidayMap]=useState(()=>{
    try{
      const cached = sessionStorage.getItem("afc_holiday_map_jp");
      return cached ? JSON.parse(cached) : {};
    }catch(e){ return {}; }
  });
  const defaultFs=(dateVal="",typeVal="official")=>({
    date:dateVal,allDay:true,timeFrom:"",timeTo:"",title:"",location:"",
    type:typeVal,deadline:"",carpoolDeadline:"",memo:""
  });
  const [fs,setFs]=useState(defaultFs());
  const todayStr=todayLocal();
  useEffect(()=>{
    if(holidayMap && Object.keys(holidayMap).length>0) return;
    let active=true;
    fetch("https://holidays-jp.github.io/api/v1/date.json")
      .then(r=>r.ok?r.json():{})
      .then(data=>{
        if(!active || !data || typeof data!=="object") return;
        setHolidayMap(data);
        try{ sessionStorage.setItem("afc_holiday_map_jp", JSON.stringify(data)); }catch(e){}
      })
      .catch(()=>{});
    return ()=>{ active=false; };
  },[]);

  // 過去の場所一覧（重複除去）
  const pastLocations=[...new Set(schedules.map(s=>s.location).filter(Boolean))];

  // 公式戦・カップ戦のタイトル選択肢
  const TITLE_OPTS={
    official:["春季大会","夏季大会","秋季大会","冬季大会","リーグ戦","選手権","県大会","市大会","その他"],
    cup:["カップ戦","招待大会","フレンドリーマッチ","その他"],
    training:["練習試合","トレーニングマッチ","その他"],
    practice:[],
    event:["スポーツ交流","親子イベント","その他"],
  };

  const isFridayDate=(dateStr)=>{
    const s=String(dateStr||"").trim();
    if(!/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
    const [y,m,d]=s.split("-").map(Number);
    return new Date(y,m-1,d).getDay()===5;
  };
  const applyFridayPracticeDefaults=(draft)=>{
    const p={...draft};
    if(p.type!=="practice" || !isFridayDate(p.date)) return p;
    p.allDay=false;
    if(!p.timeFrom) p.timeFrom="18:30";
    if(!p.timeTo) p.timeTo="20:30";
    if(!String(p.title||"").trim()) p.title="ナイター練習";
    return p;
  };
  const openAddScheduleModal=(dateVal="")=>{
    let next = defaultFs(dateVal,dateVal&&isFridayDate(dateVal)?"practice":"official");
    next = applyFridayPracticeDefaults(next);
    setFs(next);
    setModal(true);
  };

  const saveSchedule=async()=>{
    const normalizedFs=applyFridayPracticeDefaults(fs);
    const isPractice=normalizedFs.type==="practice";
    const titleVal=String(normalizedFs.title||"").trim() || (isPractice?"練習":"");
    if(!normalizedFs.date) return alert("日付を入力してください");
    if(!titleVal) return alert("タイトルを入力してください");
    const dateVal=(!normalizedFs.allDay&&normalizedFs.timeFrom)?normalizedFs.date+"T"+normalizedFs.timeFrom:normalizedFs.date;
    const timeLabel=(!normalizedFs.allDay&&normalizedFs.timeFrom)?(normalizedFs.timeFrom+(normalizedFs.timeTo?" - "+normalizedFs.timeTo:"")):"";
    await onAddSchedule({...normalizedFs,title:titleVal,date:dateVal,timeLabel});
    setFs(defaultFs());
    setModal(false);
  };

  // カレンダー計算
  const daysInMonth=new Date(year,month+1,0).getDate();
  const firstDay=new Date(year,month,1).getDay();
  const dayData={};
  schedules.forEach(s=>{
    const dd=nd(s.date); if(!dd) return;
    const [y,m,d]=dd.split("-").map(Number);
    if(y===year&&m===month+1){if(!dayData[d])dayData[d]=[];dayData[d].push(s);}
  });
  const cells=[]; for(let i=0;i<firstDay;i++)cells.push(null); for(let d=1;d<=daysInMonth;d++)cells.push(d);
  const weeks=[]; let row=[];
  cells.forEach(d=>{row.push(d);if(row.length===7){weeks.push(row);row=[];}});
  if(row.length>0){while(row.length<7)row.push(null);weeks.push(row);}
  const prev=()=>{if(month===0){setYear(y=>y-1);setMonth(11);}else setMonth(m=>m-1);};
  const next=()=>{if(month===11){setYear(y=>y+1);setMonth(0);}else setMonth(m=>m+1);};

// ── チャットタブ ─────────────────────────────────────────────────
function ChatTab({user,canWrite}) {
  const [messages,setMessages] = useState([]);
  const [text,setText] = useState("");
  const [loading,setLoading] = useState(true);
  const [sending,setSending] = useState(false);
  const [error,setError] = useState("");

  const fmtChatTime = (v) => {
    const d = new Date(String(v || ""));
    if (isNaN(d.getTime())) return "";
    return `${String(d.getMonth() + 1).padStart(2, "0")}/${String(d.getDate()).padStart(2, "0")} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  };

  const loadMessages = useCallback(async (silent = false) => {
    if (!silent) setLoading(true);
    try {
      const res = await api("getChatMessages", { userId: user.id, limit: 200 });
      setMessages(Array.isArray(res.messages) ? res.messages : []);
      setError("");
    } catch (e) {
      setError(e && e.message ? e.message : "取得エラー");
    }
    if (!silent) setLoading(false);
  }, [user.id]);

  useEffect(() => {
    let active = true;
    const run = async (silent = false) => {
      if (!active) return;
      await loadMessages(silent);
    };
    run(false);
    const timer = setInterval(() => { run(true); }, 2000);
    return () => {
      active = false;
      clearInterval(timer);
    };
  }, [loadMessages]);

  const sendMessage = async () => {
    const content = String(text || "").trim();
    if (!content) return;
    if (!canWrite) return alert("閲覧専用アカウントでは投稿できません");
    if (sending) return;
    setSending(true);
    try {
      const optimistic = {
        id: "tmp_" + Date.now(),
        date: new Date().toISOString(),
        userId: user.id,
        userName: user.name,
        content,
      };
      setMessages(prev => [...prev, optimistic]);
      setText("");
      await api("sendChatMessage", {
        userId: user.id,
        userName: user.name,
        content,
      });
      await loadMessages(true);
    } catch (e) {
      alert("送信エラー: " + (e && e.message ? e.message : e));
      await loadMessages(true);
    }
    setSending(false);
  };

  const renderMessage = (m) => {
    const mine = String(m.userId || "") === String(user.id || "");
    return h("div", { key: m.id, style: { display: "flex", justifyContent: mine ? "flex-end" : "flex-start", marginBottom: 8 } },
      h("div", { style: { maxWidth: "82%", background: mine ? "#1D4ED8" : "#F8FAFC", color: mine ? "#fff" : "#1E293B", border: mine ? "none" : "1px solid #E2E8F0", borderRadius: 12, padding: "8px 10px" } },
        !mine && h("div", { style: { fontSize: 10, fontWeight: 700, color: "#64748B", marginBottom: 3 } }, m.userName || ""),
        h("div", { style: { fontSize: 13, lineHeight: 1.5, whiteSpace: "pre-wrap", wordBreak: "break-word" } }, m.content || ""),
        h("div", { style: { fontSize: 10, marginTop: 4, color: mine ? "rgba(255,255,255,0.78)" : "#94A3B8", textAlign: "right" } }, fmtChatTime(m.date))
      )
    );
  };

  return h(Fragment, {},
    h("div", { style: { background: "#fff", borderRadius: 16, padding: 14, marginBottom: 12, boxShadow: "0 2px 8px rgba(0,0,0,0.06)" } },
      h("div", { style: { fontSize: 13, fontWeight: 800, color: "#1a1a2e", marginBottom: 4 } }, "💬 チームチャット"),
      h("div", { style: { fontSize: 11, color: "#94A3B8" } }, "2秒ごと自動更新（無料版）"),
      error && h("div", { style: { fontSize: 11, color: "#DC2626", marginTop: 8 } }, error)
    ),
    h("div", { style: { background: "#fff", borderRadius: 16, padding: 12, boxShadow: "0 2px 8px rgba(0,0,0,0.06)", minHeight: 360, maxHeight: 480, overflowY: "auto", marginBottom: 12 } },
      loading
        ? h("div", { style: { textAlign: "center", color: "#94A3B8", fontSize: 13, padding: "40px 0" } }, "読み込み中...")
        : (messages.length === 0
            ? h("div", { style: { textAlign: "center", color: "#94A3B8", fontSize: 13, padding: "40px 0" } }, "まだメッセージはありません")
            : messages.map(renderMessage))
    ),
    canWrite
      ? h("div", { style: { background: "#fff", borderRadius: 16, padding: 12, boxShadow: "0 2px 8px rgba(0,0,0,0.06)" } },
          h("textarea", {
            value: text,
            onInput: e => setText(e.target.value),
            onChange: e => setText(e.target.value),
            placeholder: "メッセージを入力",
            rows: 2,
            onKeyDown: e => {
              if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
              }
            },
            style: { ...css.inp, resize: "none", marginBottom: 8 }
          }),
          h("div", { style: { fontSize: 11, color: "#94A3B8", marginBottom: 8 } }, "Enterで送信 / Shift+Enterで改行"),
          h("div", { style: { display: "flex", justifyContent: "flex-end" } },
            h("button", {
              onClick: sendMessage,
              disabled: sending || !String(text || "").trim(),
              style: {
                border: "none",
                borderRadius: 10,
                minWidth: 92,
                padding: "10px 16px",
                fontSize: 13,
                fontWeight: 800,
                cursor: (sending || !String(text || "").trim()) ? "not-allowed" : "pointer",
                background: (sending || !String(text || "").trim()) ? "#93C5FD" : "#1D4ED8",
                color: "#fff",
                boxShadow: "0 2px 8px rgba(29,78,216,0.25)"
              }
            }, sending ? "送信中..." : "送信")
          )
        )
      : h("div", { style: { background: "#fff", borderRadius: 16, padding: 14, boxShadow: "0 2px 8px rgba(0,0,0,0.06)", fontSize: 12, color: "#94A3B8" } }, "閲覧専用アカウントです")
  );
}

// ── 資料/FAQタブ ────────────────────────────────────────────────
function InfoTab({news,isAdmin,user,onAdd,onDelete,onUpdate}) {
  const [openId,setOpenId]=useState("");
  const [createModal,setCreateModal]=useState(false);
  const [editModal,setEditModal]=useState(false);
  const [saving,setSaving]=useState(false);
  const [fd,setFd]=useState({title:"",content:"",file:null});
  const [ed,setEd]=useState({id:"",title:"",content:"",attachmentUrl:"",attachmentName:"",file:null,removeAttachment:false});

  const items=(news||[])
    .filter(n=>(n.category||"")==="資料")
    .sort((a,b)=>new Date(String(b.date||0)).getTime()-new Date(String(a.date||0)).getTime())
    .map(n=>({
      id:String(n.id||""),
      title:n.title||"資料",
      content:n.content||"",
      date:n.date||"",
      author:n.author||"",
      attachmentUrl:n.attachmentUrl||"",
      attachmentName:n.attachmentName||"",
    }));
  const attachmentPreviewUrl = url => String(url || "").replace("/view?usp=sharing", "/preview").replace("/view", "/preview");
  const isPdfAttachment = item => {
    const url = String(item?.attachmentUrl || "");
    const name = String(item?.attachmentName || "");
    return /\.pdf($|[?#])/i.test(url) || /\.pdf($|[?#])/i.test(name);
  };

  const uploadAttachment = async (file) => {
    if(!file) return {attachmentUrl:"",attachmentName:""};
    if(Number(file.size||0) > 20*1024*1024) throw new Error("添付ファイルは20MB以下にしてください");
    const dataUrl = await readFileAsDataUrl(file);
    const base64 = String(dataUrl||"").split(",")[1] || "";
    if(!base64) throw new Error("添付ファイルの読み込みに失敗しました");
    const uploaded = await api("uploadNewsAttachment",{
      fileName: file.name || "document",
      mimeType: file.type || "application/octet-stream",
      base64
    });
    return {
      attachmentUrl: uploaded.url || "",
      attachmentName: uploaded.name || file.name || ""
    };
  };

  const saveDoc=async()=>{
    if(saving) return;
    if(!fd.title||!fd.content) return alert("タイトルと内容を入力してください");
    setSaving(true);
    try{
      const uploaded = fd.file ? await uploadAttachment(fd.file) : {attachmentUrl:"",attachmentName:""};
      await onAdd({
        title:fd.title,
        content:fd.content,
        category:"資料",
        author:user.name,
        attachmentUrl:uploaded.attachmentUrl,
        attachmentName:uploaded.attachmentName
      });
      setFd({title:"",content:"",file:null});
      setCreateModal(false);
    }catch(e){
      alert("資料保存エラー: " + (e && e.message ? e.message : e));
    }
    setSaving(false);
  };

  const startEdit = item => {
    setEd({
      id:item.id,
      title:item.title||"",
      content:item.content||"",
      attachmentUrl:item.attachmentUrl||"",
      attachmentName:item.attachmentName||"",
      file:null,
      removeAttachment:false
    });
    setEditModal(true);
  };

  const saveEdit = async () => {
    if(saving) return;
    if(!ed.id) return alert("更新対象が見つかりません");
    if(!ed.title||!ed.content) return alert("タイトルと内容を入力してください");
    setSaving(true);
    try{
      let attachmentUrl = ed.removeAttachment ? "" : (ed.attachmentUrl||"");
      let attachmentName = ed.removeAttachment ? "" : (ed.attachmentName||"");
      if(ed.file){
        const uploaded = await uploadAttachment(ed.file);
        attachmentUrl = uploaded.attachmentUrl;
        attachmentName = uploaded.attachmentName;
      }
      await onUpdate({
        id:ed.id,
        title:ed.title,
        content:ed.content,
        category:"資料",
        author:user.name,
        attachmentUrl,
        attachmentName
      });
      setEditModal(false);
    }catch(e){
      alert("資料更新エラー: " + (e && e.message ? e.message : e));
    }
    setSaving(false);
  };

  const renderItem=(item)=>{
    const opened=openId===item.id;
    return h("div",{key:item.id,style:{background:"#fff",borderRadius:14,marginBottom:10,boxShadow:"0 2px 8px rgba(0,0,0,0.05)",overflow:"hidden"}},
      h("button",{onClick:()=>setOpenId(opened?"":item.id),style:{width:"100%",display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,padding:"14px 14px",border:"none",background:"#fff",cursor:"pointer"}},
        h("div",{style:{fontSize:14,fontWeight:800,color:"#1E293B",textAlign:"left",flex:1,minWidth:0,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},item.title),
        h("div",{style:{fontSize:16,color:"#94A3B8",fontWeight:800,flexShrink:0}},opened?"−":"+")
      ),
      opened ? h("div",{style:{padding:"0 14px 14px",borderTop:"1px solid #F1F5F9"}},
        h("div",{style:{fontSize:13,color:"#334155",lineHeight:1.8,whiteSpace:"pre-wrap",marginTop:10}},item.content||"（内容なし）"),
        item.attachmentUrl ? h("div",{style:{marginTop:10}},
          h("a",{href:item.attachmentUrl,target:"_blank",rel:"noopener noreferrer",
            style:{display:"inline-flex",alignItems:"center",padding:"6px 10px",borderRadius:8,background:"#DBEAFE",color:"#1D4ED8",fontSize:12,fontWeight:700,textDecoration:"none",wordBreak:"break-all"}},
            "📎 " + (item.attachmentName || "添付資料を開く")
          ),
          isPdfAttachment(item) && attachmentPreviewUrl(item.attachmentUrl) ? h("iframe",{
            src: attachmentPreviewUrl(item.attachmentUrl),
            title: item.attachmentName || item.title || "添付PDF",
            style:{width:"100%",height:360,border:"none",borderRadius:10,background:"#fff",marginTop:8}
          }) : null
        ) : null,
        (item.date||item.author) ? h("div",{style:{fontSize:11,color:"#94A3B8",marginTop:10}},
          (item.date?fmt(item.date).short:"") + (item.author?` / ${item.author}`:"")
        ) : null,
        isAdmin ? h("div",{style:{marginTop:10,display:"flex",gap:8,justifyContent:"flex-end"}},
          h("button",{onClick:()=>startEdit(item),style:{border:"none",background:"#DBEAFE",color:"#1D4ED8",fontSize:12,fontWeight:700,padding:"6px 10px",borderRadius:8,cursor:"pointer"}},"編集"),
          h("button",{onClick:()=>onDelete(item.id),style:{border:"none",background:"#FEE2E2",color:"#B91C1C",fontSize:12,fontWeight:700,padding:"6px 10px",borderRadius:8,cursor:"pointer"}},"削除")
        ) : null
      ) : null
    );
  };

  return h(Fragment,{},
    h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}},
      h("div",{style:{fontSize:11,fontWeight:700,color:"#94A3B8",letterSpacing:1.2}},"資料・FAQ"),
      isAdmin ? h("button",{onClick:()=>setCreateModal(true),style:{...css.bO,padding:"8px 12px",fontSize:12,borderRadius:12}},"+ 追加") : null
    ),
    h("div",{style:{fontSize:12,color:"#64748B",marginBottom:12,lineHeight:1.6}},"チーム運営に必要な情報をためていく"),
    items.length===0 ? h("div",{style:{background:"#fff",borderRadius:14,padding:20,textAlign:"center",color:"#94A3B8",fontSize:13}},"資料はまだありません") : null,
    items.map(renderItem),

    createModal ? h(Modal,{title:"資料を追加",onClose:()=>setCreateModal(false)},
      h("div",{style:{marginBottom:14}},
        h("div",{style:{fontSize:12,fontWeight:600,color:"#666",marginBottom:6}},"タイトル"),
        h("input",{value:fd.title,onChange:e=>setFd(p=>({...p,title:e.target.value})),placeholder:"例：会計ルール（2026年度）",style:css.inp})
      ),
      h("div",{style:{marginBottom:20}},
        h("div",{style:{fontSize:12,fontWeight:600,color:"#666",marginBottom:6}},"内容"),
        h("textarea",{value:fd.content,onChange:e=>setFd(p=>({...p,content:e.target.value})),rows:8,placeholder:"手順・注意事項・リンクなど",style:{...css.inp,resize:"none"}})
      ),
      h("div",{style:{marginBottom:20}},
        h("div",{style:{fontSize:12,fontWeight:600,color:"#666",marginBottom:6}},"資料添付"),
        h("input",{type:"file",onChange:e=>setFd(p=>({...p,file:(e.target.files&&e.target.files[0])?e.target.files[0]:null})),style:{...css.inp,padding:"8px 10px"}}),
        fd.file ? h("div",{style:{fontSize:11,color:"#64748B",marginTop:6,wordBreak:"break-all"}},"選択中: " + fd.file.name + " (" + Math.ceil((Number(fd.file.size||0)/1024)) + "KB)") : null
      ),
      h("div",{style:{display:"flex",gap:10}},
        h("button",{onClick:()=>{ if(saving) return; setCreateModal(false); },style:css.bG},saving?"処理中...":"キャンセル"),
        h("button",{onClick:saveDoc,disabled:saving,style:{...css.bS,opacity:saving?0.7:1,cursor:saving?"wait":"pointer"}},saving?"保存中...":"保存する")
      )
    ) : null,

    editModal ? h(Modal,{title:"資料を編集",onClose:()=>setEditModal(false)},
      h("div",{style:{marginBottom:14}},
        h("div",{style:{fontSize:12,fontWeight:600,color:"#666",marginBottom:6}},"タイトル"),
        h("input",{value:ed.title,onChange:e=>setEd(p=>({...p,title:e.target.value})),style:css.inp})
      ),
      h("div",{style:{marginBottom:14}},
        h("div",{style:{fontSize:12,fontWeight:600,color:"#666",marginBottom:6}},"内容"),
        h("textarea",{value:ed.content,onChange:e=>setEd(p=>({...p,content:e.target.value})),rows:8,style:{...css.inp,resize:"none"}})
      ),
      h("div",{style:{marginBottom:14}},
        h("div",{style:{fontSize:12,fontWeight:600,color:"#666",marginBottom:6}},"添付資料"),
        ed.attachmentUrl ? h("a",{href:ed.attachmentUrl,target:"_blank",rel:"noopener noreferrer",style:{display:"inline-block",fontSize:12,color:"#1D4ED8",fontWeight:700,textDecoration:"none",marginBottom:8}},
          "現在の添付: " + (ed.attachmentName || "添付資料を開く")
        ) : h("div",{style:{fontSize:12,color:"#94A3B8",marginBottom:8}},"現在の添付はありません"),
        h("input",{type:"file",onChange:e=>setEd(p=>({...p,file:(e.target.files&&e.target.files[0])?e.target.files[0]:null,removeAttachment:false})),style:{...css.inp,padding:"8px 10px"}}),
        h("button",{onClick:()=>setEd(p=>({...p,removeAttachment:!p.removeAttachment,file:null})),
          style:{marginTop:8,border:"1px solid #CBD5E1",background:ed.removeAttachment?"#FEE2E2":"#fff",color:ed.removeAttachment?"#B91C1C":"#475569",borderRadius:8,padding:"6px 10px",fontSize:12,fontWeight:700,cursor:"pointer"}},
          ed.removeAttachment?"添付を削除して保存する":"添付を削除する")
      ),
      h("div",{style:{display:"flex",gap:10}},
        h("button",{onClick:()=>{ if(saving) return; setEditModal(false); },style:css.bG},saving?"処理中...":"キャンセル"),
        h("button",{onClick:saveEdit,disabled:saving,style:{...css.bS,opacity:saving?0.7:1,cursor:saving?"wait":"pointer"}},saving?"保存中...":"更新する")
      )
    ) : null
  );
}

// ── その日の試合まとめページ ─────────────────────────────────────
function DayPage({schedule,results,schedules,members,isAdmin,canWrite,user,users=[],initialTab="",onGoToMatch,onAdd,onEdit,onDelete,onDeleteSchedule,onBack,onHome,onSaveMvp}) {
  const isEventDay = normalizeType(schedule.type) === "event";
  const isPracticeDay = normalizeType(schedule.type) === "practice";
  const isSimpleDay = isEventDay || isPracticeDay;
  const resolveDayTab = raw => {
    const fallback = isSimpleDay ? "detail" : "matches";
    const v = String(raw || "").trim();
    if (isSimpleDay) return (v === "detail" || v === "attend") ? v : fallback;
    return ["matches","detail","attend","carpool","album"].includes(v) ? v : fallback;
  };
  const [dayTab,setDayTab]=useState(()=>resolveDayTab(initialTab)); // "matches"|"detail"|"attend"|"carpool"|"album"
  const tc=getTC(schedule.type);
  const dt=fmt(schedule.date);
  const dayR=results
    .filter(r=>r.scheduleId===schedule.id||nd(r.date)===nd(schedule.date))
    .sort((a,b)=>Number(a.gameNumber||1)-Number(b.gameNumber||1));

  // 合計スコア集計
  const totalOur=dayR.reduce((a,r)=>a+Number(r.ourScore||0),0);
  const totalTheir=dayR.reduce((a,r)=>a+Number(r.theirScore||0),0);
  const st=calcStats(dayR);

  // 公式戦・カップ戦のみ
  const isTournamentTarget=["official","cup","公式戦","カップ戦"].includes(schedule.type);
  const [mvp,setMvp]=useState(schedule.mvp||"");
  const [mvpSaving,setMvpSaving]=useState(false);
  const [rank,setRank]=useState(schedule.rank||"");
  const [rankSaving,setRankSaving]=useState(false);
  const [editSch,setEditSch]=useState(false);
  const [editSchSaving,setEditSchSaving]=useState(false);
  const [schForm,setSchForm]=useState({date:schedule.date||"",title:schedule.title||"",location:schedule.location||"",type:schedule.type||"practice",deadline:schedule.deadline||"",carpoolDeadline:schedule.carpoolDeadline||"",memo:schedule.memo||""});
  const [hpModal,setHpModal]=useState(false);
  const [hpText,setHpText]=useState("");
  const [ytModal,setYtModal]=useState(false);
  const [ytCopied,setYtCopied]=useState("");
  const [aiDraft,setAiDraft]=useState("");
  const [aiResult,setAiResult]=useState("");
  const [aiLoading,setAiLoading]=useState(false);
  const [aiDraftSaved,setAiDraftSaved]=useState(false);
  const [memoToAiCopied,setMemoToAiCopied]=useState(false);
  const [hpCopied,setHpCopied]=useState(false);
  const hpDraftOwner = encodeURIComponent(String(user?.email || user?.id || user?.name || "anon").trim().toLowerCase());
  const hpDraftKey = "afc_hp_ai_draft_" + (schedule?.id || "") + "_" + hpDraftOwner;
  const loadAiDraft = ()=>{
    try{
      return localStorage.getItem(hpDraftKey) || "";
    }catch(e){
      return "";
    }
  };
  const saveAiDraft = ()=>{
    try{
      localStorage.setItem(hpDraftKey, aiDraft || "");
      setAiDraftSaved(true);
      setTimeout(()=>setAiDraftSaved(false),1800);
    }catch(e){
      alert("下書き保存エラー: " + e.message);
    }
  };
  const getMergedHpText = ()=>{
    const base = String(hpText || "").trim();
    const generated = String(aiResult || "").trim();
    return [base, generated].filter(Boolean).join("\n\n");
  };
  const scheduleMemoText = String(schedule.memo || "").trim();
  useEffect(()=>{
    setDayTab(resolveDayTab(initialTab));
  },[schedule.id,isSimpleDay,initialTab]);
  const saveEditSch=async()=>{
    setEditSchSaving(true);
    try{
      const nextType = normalizeType(schForm.type) || schForm.type;
      await api("updateSchedule",{schedule:{...schForm,id:schedule.id,type:nextType,mvp:schedule.mvp||"",deadline:schForm.deadline||"",carpoolDeadline:schForm.carpoolDeadline||""}});
      schedule.date = schForm.date;
      schedule.title = schForm.title;
      schedule.location = schForm.location;
      schedule.type = nextType;
      schedule.deadline = schForm.deadline || "";
      schedule.carpoolDeadline = schForm.carpoolDeadline || "";
      schedule.memo = schForm.memo || "";
      setEditSch(false);
    }catch(e){
      alert("日程更新エラー: " + e.message);
    }
    setEditSchSaving(false);
  };
  const saveMvp=async()=>{
    setMvpSaving(true);
    await onSaveMvp(schedule.id,mvp);
    setMvpSaving(false);
  };
  const saveRank=async()=>{
    setRankSaving(true);
    await api("updateSchedule",{schedule:{id:schedule.id,rank}});
    schedule.rank=rank;
    setRankSaving(false);
  };
  const openHpModal=()=>{
    const text=makeHpTemplate(schedule,dayR);
    setHpText(text);
    setAiDraft(loadAiDraft());
    setAiResult("");
    setMemoToAiCopied(false);
    setHpModal(true);
  };
  const runAi=async()=>{
    if(!aiDraft.trim())return;
    setAiLoading(true);
    try{
      const prompt="あなたは少年サッカーチーム「塚口AFCjr」の広報担当です。\n"+
        "以下の入力内容だけをもとに、HPに載せる自然な文章を作成してください。\n\n"+
        "【当日の試合内容・AIへの指示】\n"+aiDraft.trim()+
        "\n\n出力は本文テキストのみ。前置きや説明は不要です。";
      const d=await api("aiGenerate",{prompt});
      if(d.text) setAiResult(String(d.text).trim());
    }catch(e){alert("AI生成エラー: "+e.message);}
    setAiLoading(false);
  };
  const copyHp=()=>{
    copyToClipboard(getMergedHpText());
    setHpCopied(true);setTimeout(()=>setHpCopied(false),2000);
  };
  const copyYtTemplateText=(text,key)=>{
    copyToClipboard(text);
    setYtCopied(key);
    setTimeout(()=>setYtCopied(""),1800);
  };
  const copyScheduleMemoToAi=()=>{
    if(!scheduleMemoText) return;
    setAiDraft(prev=>{
      const cur = String(prev || "").trim();
      return cur ? (cur + "\n\n" + scheduleMemoText) : scheduleMemoText;
    });
    setMemoToAiCopied(true);
    setTimeout(()=>setMemoToAiCopied(false),1800);
  };

  return h("div",{className:"page"},
    editSchSaving&&h(Loader,{msg:"更新中..."}),
    // HP用テンプレモーダル
    hpModal&&h(Modal,{title:"📋 HP用テンプレ",onClose:()=>setHpModal(false)},
      h("div",{style:{marginBottom:12}},
        h("div",{style:{fontSize:12,fontWeight:700,color:"#334155",marginBottom:6}},"テキスト（手編集）"),
        h("textarea",{value:hpText,onChange:e=>setHpText(e.target.value),rows:14,
          style:{...css.inp,resize:"vertical",minHeight:220,fontSize:13,lineHeight:1.85,fontFamily:"monospace"}})),
      h("div",{style:{marginBottom:10}},
        h("div",{style:{fontSize:12,fontWeight:700,color:"#0F172A",marginBottom:6}},"✨ AI入力（当日の試合内容・指示）"),
        h("textarea",{value:aiDraft,onChange:e=>setAiDraft(e.target.value),
          placeholder:"例：前半は守備が安定、後半は右サイドから崩して得点\n例：保護者への感謝コメントを2文追加",
          rows:7,style:{...css.inp,resize:"vertical",minHeight:130,fontSize:13,lineHeight:1.75}})),
      h("div",{style:{display:"flex",gap:8,marginBottom:10}},
        h("button",{onClick:copyScheduleMemoToAi,disabled:!scheduleMemoText,
          style:{flex:1,padding:"10px 12px",border:"1px solid #BFDBFE",borderRadius:10,
            background:!scheduleMemoText?"#E2E8F0":"#EFF6FF",color:!scheduleMemoText?"#94A3B8":"#1D4ED8",
            fontSize:12,fontWeight:700,cursor:!scheduleMemoText?"not-allowed":"pointer"}},
          memoToAiCopied?"✓ AI入力へ反映済み":"📝 日程メモをAI入力へコピー"),
        scheduleMemoText && h("div",{style:{flex:1,fontSize:11,color:"#64748B",lineHeight:1.55,background:"#F8FAFC",border:"1px solid #E2E8F0",borderRadius:10,padding:"8px 10px",whiteSpace:"pre-wrap",maxHeight:72,overflow:"auto"}},scheduleMemoText)),
      h("div",{style:{display:"flex",gap:8,marginBottom:10}},
        h("button",{onClick:saveAiDraft,
          style:{flex:1,padding:"10px 12px",border:"1px solid #CBD5E1",borderRadius:10,background:"#fff",
            color:"#334155",fontSize:12,fontWeight:700,cursor:"pointer"}},
          aiDraftSaved?"✓ 下書き保存済み":"💾 下書き保存"),
        h("button",{onClick:runAi,disabled:aiLoading||!aiDraft.trim(),
          style:{flex:2,padding:"10px 12px",border:"none",borderRadius:10,
            background:aiLoading||!aiDraft.trim()?"#CBD5E1":"linear-gradient(135deg,#1D4ED8,#2563EB)",
            color:"#fff",fontSize:13,fontWeight:700,cursor:aiLoading||!aiDraft.trim()?"not-allowed":"pointer"}},
          aiLoading?"✨ 生成中...":"✨ AIで文章作成")),
      h("div",{style:{marginBottom:12}},
        h("div",{style:{fontSize:12,fontWeight:700,color:"#334155",marginBottom:6}},"AIで作成した文章（編集可）"),
        h("textarea",{value:aiResult,onChange:e=>setAiResult(e.target.value),rows:10,
          placeholder:"AI生成後にここへ表示されます",
          style:{...css.inp,resize:"vertical",minHeight:170,fontSize:13,lineHeight:1.8}})),
      h("div",{style:{fontSize:11,color:"#64748B",marginBottom:8}},"コピー時は「テキスト」→「AI作成文」の順で結合されます。"),
      h("div",{style:{display:"flex",gap:8}},
        h("button",{onClick:copyHp,
          style:{flex:1,padding:14,border:"none",borderRadius:12,
            background:hpCopied?"#16A34A":"#1D4ED8",color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer"}},
          hpCopied?"✓ コピー済":"📋 結合してコピー"),
        h("button",{onClick:()=>{

function MemberTab({members,liftings=[]}) {
  const [pos,setPos]=useState("all");
  const [gradeF,setGradeF]=useState("4年");
  const baseMembers = useMemo(() =>
    members
      .filter(m => [1,2,3,4].includes(getGradeNumber(m.grade)))
      .map(m => {
        const n = getGradeNumber(m.grade);
        return {...m, _gradeNum:n, _gradeKey:`${n}年`};
      }),
  [members]);
  const gradeOptions = useMemo(() => {
    const grouped = {};
    baseMembers.forEach(m => {
      if (!grouped[m._gradeKey]) grouped[m._gradeKey] = [];
      grouped[m._gradeKey].push(m);
    });
    return Object.keys(grouped)
      .sort((a,b)=>(getGradeNumber(b)??0)-(getGradeNumber(a)??0))
      .map(key => {
        const gens = [...new Set(
          grouped[key]
            .map(m=>String(m.generation||"").replace(/[^\d]/g,""))
            .filter(Boolean)
        )].sort((a,b)=>Number(b)-Number(a));
        const primaryGen = gens[0] || getGenerationByGrade(key);
        return {key, label:formatGenerationGrade(key, primaryGen)};
      });
  }, [baseMembers]);
  useEffect(() => {
    if (gradeF === "全員") return;
    if (!gradeOptions.some(g => g.key === gradeF)) {
      setGradeF(gradeOptions[0]?.key || "全員");
    }
  }, [gradeF, gradeOptions]);
  const gradeFiltered=gradeF==="全員"
    ? baseMembers
    : baseMembers.filter(m=>m._gradeKey===gradeF);
  const filtered=pos==="all"?gradeFiltered:gradeFiltered.filter(m=>m.position===pos);
  const sorted=[...filtered].sort((a,b)=>Number(a.number||99)-Number(b.number||99));
  return h(Fragment,{},
    // 学年フィルター
    h("div",{style:{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}},
      [...gradeOptions, {key:"全員", label:"全員"}].map(g=>h("button",{key:g.key,onClick:()=>setGradeF(g.key),
        style:{padding:"5px 12px",border:"2px solid "+(gradeF===g.key?"#1D4ED8":"#eee"),borderRadius:20,
          background:gradeF===g.key?"#1D4ED8":"#fff",color:gradeF===g.key?"#fff":"#666",
          fontSize:12,fontWeight:gradeF===g.key?700:400,cursor:"pointer"}},g.label))),
    // ポジションフィルター
    h("div",{style:{display:"flex",gap:6,marginBottom:14,flexWrap:"wrap"}},
      [{k:"all",l:"全員"},{k:"FW",l:"FW"},{k:"MF",l:"MF"},{k:"DF",l:"DF"},{k:"GK",l:"GK"}].map(t=>
        h("button",{key:t.k,onClick:()=>setPos(t.k),
          style:{padding:"6px 14px",border:`2px solid ${pos===t.k?"#1D4ED8":"#eee"}`,
            borderRadius:20,background:pos===t.k?"#1D4ED8":"#fff",
            color:pos===t.k?"#fff":"#666",fontSize:12,fontWeight:pos===t.k?700:400,cursor:"pointer"}},t.l))),
    // 選手カード一覧（3列）
    h("div",{style:{display:"grid",gridTemplateColumns:"repeat(3,minmax(0,1fr))",gap:8}},
      sorted.map(m=>{
        const pc=PC[m.position]||{bg:"#999"};
        const lf=liftings.find(x=>x.memberId===m.id);
        return h("div",{key:m.id,style:{background:"#fff",borderRadius:12,padding:"10px 8px",
          boxShadow:"0 2px 8px rgba(0,0,0,0.06)",textAlign:"center",minWidth:0}},
          h("div",{style:{width:40,height:40,borderRadius:10,background:pc.bg,margin:"0 auto 8px",
            display:"flex",alignItems:"center",justifyContent:"center",
            color:"#fff",fontSize:17,fontWeight:900}},m.number||"?"),
          h("div",{style:{fontSize:13,fontWeight:800,color:"#1a1a2e",marginBottom:4,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},m.name),
          h("div",{style:{display:"flex",justifyContent:"center",marginBottom:4}},
            h("span",{style:{fontSize:10,fontWeight:700,color:pc.bg,background:pc.bg+"22",borderRadius:999,padding:"2px 8px"}},m.position||"?")),
          h("div",{style:{fontSize:10,color:"#94A3B8",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},formatMemberGenerationGrade(m)||m.grade||""),
          lf&&h("div",{style:{fontSize:10,color:"#4CAF50",fontWeight:700,marginTop:4}},"🏃"+lf.count));
      })
    ));
}

function SettingsTab({user,users=[],members,notificationEnabled,notificationBusy,onToggleNotifications,onUpdateProfile}) {
  const currentUserProfile = (users || []).find(u => String(u.id || "") === String(user.id || "")) || user;
  const child = members.find(m => String(m.id || "") === String(currentUserProfile.memberId || ""));
  const familyListView = parseFamilyMembers(currentUserProfile.familyMembers || []);
  const accessCount = Number(currentUserProfile.accessCount || 0);
  const lastAccessLabel = currentUserProfile.lastAccessAt
    ? String(currentUserProfile.lastAccessAt).replace("T"," ").slice(0,16)
    : "-";
  const [editing,setEditing] = useState(false);
  const [name,setName] = useState(currentUserProfile.name || "");
  const [memberId,setMemberId] = useState(currentUserProfile.memberId || "");
  const [familyText,setFamilyText] = useState(familyListView.join("\n"));
  const [saving,setSaving] = useState(false);

  useEffect(()=>{
    const latest = (users || []).find(u => String(u.id || "") === String(user.id || "")) || user;
    setName(latest.name || "");
    setMemberId(latest.memberId || "");
    setFamilyText(parseFamilyMembers(latest.familyMembers || []).join("\n"));
  },[user.id,user.name,user.memberId,JSON.stringify((users||[]).map(u=>[u.id,u.familyMembers]))]);

  const generations = [...new Set(members.map(m=>String(m.generation||"").trim()).filter(Boolean))].sort((a,b)=>Number(b)-Number(a));
  const memberOptions = generations.flatMap(gen => {
    const grouped = members
      .filter(m => String(m.generation || "").trim() === gen)
      .sort((a,b)=>Number(a.number||999)-Number(b.number||999));
    if (!grouped.length) return [];
    return [h("optgroup",{key:gen,label:`${gen}期生`},
      grouped.map(m=>h("option",{key:m.id,value:m.id},`${m.name} #${m.number||"-"} (${formatMemberGenerationGrade(m)||m.grade||""})`))
    )];
  });

  const save = async() => {
    setSaving(true);
    try{
      await onUpdateProfile({name, memberId, familyMembers: parseFamilyMembers(familyText)});
      setEditing(false);
      alert("設定を保存しました");
    }catch(e){
      alert("設定保存エラー: " + e.message);
    }
    setSaving(false);
  };

  return h(Fragment,{},
    h("div",{style:{background:"#fff",borderRadius:16,padding:18,marginBottom:12,boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}} ,
      h("div",{style:{fontSize:13,fontWeight:800,color:"#1a1a2e",marginBottom:14}},"👤 アカウント"),
      editing ? h(Fragment,{},
        h("div",{style:{marginBottom:12}},
          h("div",{style:{fontSize:12,fontWeight:600,color:"#666",marginBottom:6}},"表示名"),
          h("input",{value:name,onChange:e=>setName(e.target.value),style:css.inp,placeholder:"保護者名"})),
        h("div",{style:{marginBottom:16}},
          h("div",{style:{fontSize:12,fontWeight:600,color:"#666",marginBottom:6}},"子ども"),
          h("select",{value:memberId,onChange:e=>setMemberId(e.target.value),style:css.inp},
            h("option",{value:""},"選んでください"),
            memberOptions)),
        h("div",{style:{marginBottom:16}},
          h("div",{style:{fontSize:12,fontWeight:600,color:"#666",marginBottom:6}},"家族構成（1行1名）"),
          h("textarea",{value:familyText,onChange:e=>setFamilyText(e.target.value),rows:4,placeholder:"例:\n父\n母\n妹",style:{...css.inp,resize:"none"}})),
        h("div",{style:{display:"flex",gap:10}},
          h("button",{onClick:()=>{setEditing(false);setName(currentUserProfile.name||"");setMemberId(currentUserProfile.memberId||"");setFamilyText(parseFamilyMembers(currentUserProfile.familyMembers||[]).join("\n"));},style:css.bG},"キャンセル"),
          h("button",{onClick:save,disabled:saving||!name||!memberId,style:{...css.bS,opacity:(!name||!memberId)?0.5:1}},saving?"保存中...":"保存する")))
      : h(Fragment,{},
        h("div",{style:{fontSize:12,color:"#888",marginBottom:8}},"メールアドレス"),
        h("div",{style:{fontSize:15,fontWeight:700,color:"#1a1a2e",marginBottom:12}},currentUserProfile.email||user.email||"-"),
        h("div",{style:{fontSize:12,color:"#888",marginBottom:8}},"表示名"),
        h("div",{style:{fontSize:15,fontWeight:700,color:"#1a1a2e",marginBottom:12}},currentUserProfile.name||user.name||"-"),
        h("div",{style:{fontSize:12,color:"#888",marginBottom:8}},"家族構成"),
        h("div",{style:{fontSize:14,fontWeight:700,color:"#1a1a2e",marginBottom:12,whiteSpace:"pre-wrap"}},
          familyListView.length ? familyListView.join("、") : "未登録"),
        h("div",{style:{fontSize:12,color:"#888",marginBottom:8}},"権限"),
        h("div",{style:{fontSize:15,fontWeight:700,color:"#1a1a2e",marginBottom:12}},user.role==="admin"?"admin":"member"),
        h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}},
          h("div",{style:{background:"#F8FAFC",borderRadius:10,padding:"10px 12px"}},
            h("div",{style:{fontSize:11,color:"#94A3B8",marginBottom:2}},"アクセス回数"),
            h("div",{style:{fontSize:15,fontWeight:800,color:"#1a1a2e"}},String(accessCount))),
          h("div",{style:{background:"#F8FAFC",borderRadius:10,padding:"10px 12px"}},
            h("div",{style:{fontSize:11,color:"#94A3B8",marginBottom:2}},"最終アクセス"),
            h("div",{style:{fontSize:12,fontWeight:700,color:"#1a1a2e"}},lastAccessLabel))),
        h("button",{onClick:()=>setEditing(true),style:{...css.bS,width:"100%",marginTop:16}},"プロフィールを編集"))),
    h("div",{style:{background:"#fff",borderRadius:16,padding:18,marginBottom:12,boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}} ,
      h("div",{style:{fontSize:13,fontWeight:800,color:"#1a1a2e",marginBottom:14}},"🧒 子ども情報"),
      h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}},
        h("div",{style:{background:"#F8FAFC",borderRadius:12,padding:"12px 14px"}},
          h("div",{style:{fontSize:11,color:"#94A3B8",marginBottom:4}},"名前"),
          h("div",{style:{fontSize:14,fontWeight:700,color:"#1a1a2e"}},child?.name||"-")),
        h("div",{style:{background:"#F8FAFC",borderRadius:12,padding:"12px 14px"}},
          h("div",{style:{fontSize:11,color:"#94A3B8",marginBottom:4}},"期生"),
          h("div",{style:{fontSize:14,fontWeight:700,color:"#1a1a2e"}},child?.generation?`${child.generation}期生`:"-")),
        h("div",{style:{background:"#F8FAFC",borderRadius:12,padding:"12px 14px"}},
          h("div",{style:{fontSize:11,color:"#94A3B8",marginBottom:4}},"学年"),
          h("div",{style:{fontSize:14,fontWeight:700,color:"#1a1a2e"}},child?formatMemberGenerationGrade(child):"-")),
        h("div",{style:{background:"#F8FAFC",borderRadius:12,padding:"12px 14px"}},
          h("div",{style:{fontSize:11,color:"#94A3B8",marginBottom:4}},"背番号"),
          h("div",{style:{fontSize:14,fontWeight:700,color:"#1a1a2e"}},child?.number||"-")))),
    h("div",{style:{background:"#fff",borderRadius:16,padding:18,boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}} ,
      h("div",{style:{fontSize:13,fontWeight:800,color:"#1a1a2e",marginBottom:14}},"🔔 通知設定"),
      h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",gap:12,marginBottom:12}},
        h("div",{},
          h("div",{style:{fontSize:14,fontWeight:700,color:"#1a1a2e"}},notificationBusy?"切替中..." :(notificationEnabled?"ON":"OFF")),
          h("div",{style:{fontSize:12,color:"#888",marginTop:4}},notificationBusy?"通知設定を更新しています":"締切通知・新規予定・YouTube更新で使います")),
        h("button",{onClick:onToggleNotifications,ariaLabel:"通知切り替え",disabled:notificationBusy,
          style:{width:58,height:32,flexShrink:0,border:"none",borderRadius:999,
            background:notificationEnabled?"#1D4ED8":"#CBD5E1",padding:3,cursor:notificationBusy?"wait":"pointer",
            display:"flex",alignItems:"center",justifyContent:notificationEnabled?"flex-end":"flex-start",
            transition:"all .2s ease",opacity:notificationBusy?0.7:1}},
          h("span",{style:{width:26,height:26,borderRadius:"50%",background:"#fff",
            boxShadow:"0 2px 6px rgba(0,0,0,0.18)",display:"block"}})))));
}

// ── メインアプリ ───────────────────────────────────────────────
function App() {
  const [user,setUser]=useState(()=>{
    try{ const u=localStorage.getItem("afc_user"); return u?JSON.parse(u):null; }catch(e){ return null; }
  });
  const saveUser=(u)=>{
    setUser(u);
    try{
      if(u){
        localStorage.setItem("afc_user",JSON.stringify(u));
      }else{
        localStorage.removeItem("afc_user");
        Object.keys(sessionStorage)
          .filter(k=>k.indexOf("afc_access_logged_")===0)
          .forEach(k=>sessionStorage.removeItem(k));
      }
    }catch(e){}
  };
  const [loading,setLoading]=useState(false);
  const [loadMsg,setLoadMsg]=useState("読み込み中...");
  const [tab,setTab]=useState("home");
  const [dashInitialTab,setDashInitialTab]=useState("result");
  const [page,setPage]=useState(null); // null | {type,schedule?,match?}
  const [members,setMembers]=useState([]);
  const [schedules,setSchedules]=useState([]);
  const [results,setResults]=useState([]);
  const [news,setNews]=useState([]);
  const [pendingNotices,setPendingNotices]=useState([]);
  const [liftings,setLiftings]=useState([]);
  const [users,setUsers]=useState([]);
  const [deepLink,setDeepLink]=useState(()=>{
    const params = new URLSearchParams(location.search);
    return {
      scheduleId: String(params.get("scheduleId") || "").trim(),
      dayTab: String(params.get("dayTab") || "").trim(),
      tab: String(params.get("tab") || "").trim(),
    };
  });
  const [notificationPermission,setNotificationPermission]=useState(()=>("Notification" in window ? Notification.permission : "unsupported"));
  const [notificationEnabled,setNotificationEnabled]=useState(false);
  const [notificationBusy,setNotificationBusy]=useState(false);
  const isAdmin=user?.role==="admin";
  const canWrite=user?.role!=="viewer";

  const load=useCallback(async(msg="読み込み中...")=>{
    setLoadMsg(msg);setLoading(true);
    try{
      const uid = String(user?.id || "").trim();
      const accessKey = uid ? "afc_access_logged_" + uid : "";
      const shouldCountAccess = !!uid && !sessionStorage.getItem(accessKey);
      const d=await api("getAll",{userId:uid,countAccess:shouldCountAccess?1:0});
      if(shouldCountAccess) sessionStorage.setItem(accessKey,"1");
      setMembers((d.members||[]).map(normalizeMember));
      setSchedules(d.schedules||[]);
      setResults(d.results||[]);
      setNews(d.news||[]); setLiftings(d.liftings||[]);
      setPendingNotices(d.myPendingNotices||[]);
      setUsers(d.users||[]);
    }catch(e){alert("読み込みエラー: "+e.message);}
    setLoading(false);
  },[user?.id]);
  useEffect(()=>{if(user)load();},[user,load]);
  useEffect(()=>{
    if(!user || !("serviceWorker" in navigator) || !("PushManager" in window)) {
      setNotificationEnabled(false);
      return;
    }
    getCurrentPushSubscription()
      .then(sub=>setNotificationEnabled(!!sub && Notification.permission==="granted"))
      .catch(()=>setNotificationEnabled(false));
  },[user,notificationPermission]);
  useEffect(()=>{
    if(!user || !("Notification" in window)) return;
    setNotificationPermission(Notification.permission);
    if(Notification.permission!=="granted") return;
    maybeNotifyDeadlines(pendingNotices).catch(()=>{});
    maybeNotifyUpcomingEvents(schedules).catch(()=>{});
  },[user,schedules,pendingNotices]);
  const handleEnableNotifications=async()=>{
    if(notificationBusy) return;
    setNotificationBusy(true);
    try{
      if(notificationEnabled){
        await unsubscribeWebPush();
        setNotificationEnabled(false);
        alert("通知をOFFにしました");
        return;
      }
      const p=await enableNotifications();
      setNotificationPermission(p);
      if(p==="granted"){
        try{
          await subscribeWebPush(user);
        }catch(e){
          alert("通知購読エラー: "+(e&&e.message?e.message:"不明なエラー"));
          return;
        }
        setNotificationEnabled(true);
        setTimeout(()=>{ maybeNotifyDeadlines(pendingNotices).catch(()=>{}); },0);
        setTimeout(()=>{ maybeNotifyUpcomingEvents(schedules).catch(()=>{}); },0);
        alert("通知をONにしました");
      }else if(p==="denied"){
        alert("ブラウザで通知がブロックされています");
      }else if(p==="default"){
        alert("通知の許可が完了しませんでした");
      }else{
        alert("この端末では通知に対応していません");
      }
    }catch(e){
      alert("通知ボタン処理エラー: "+(e&&e.message?e.message:"不明なエラー"));
    }finally{
      setNotificationBusy(false);
    }
  };

  // ── ハンドラ（全てここで定義）─────────────────────────────────
  const goToMatch=(r,s)=>{
    const linked = s || findLinkedScheduleForResult(r, schedules) || {
      id: r?.scheduleId || "",
      date: r?.date || "",
      title: r?.opponent ? ("vs " + r.opponent) : "試合",
      type: r?.type || ""
    };
    scrollAppTop();
    setPage({type:"matchDetail",match:r,schedule:linked});
    setTimeout(scrollAppTop,0);
  };
  const goToDay  =(s,dayTab="")  =>{
    scrollAppTop();
    setPage({type:"dayDetail",schedule:s,dayTab:dayTab||""});
    setTimeout(scrollAppTop,0);
  };
  const openDashTab = (nextTab) => {
    setDashInitialTab(nextTab || "result");
    setTab("dash");
  };
  const goBack   =()   =>{
    scrollAppTop();
    setPage(null);
    setTimeout(scrollAppTop,0);
  };

  const handleAddResult=async fr=>{
    setLoading(true);setLoadMsg("追加中...");
    try{
      await api("addResult",{result:{
        scheduleId:fr.scheduleId,date:fr.date,opponent:fr.opponent,
        formatLabel:fr.formatLabel||"",gameNumber:fr.gameNumber||1,
        type:fr.type,memo:fr.memo||"",
        formation:fr.formation||"",
        formationSlots:fr.formationSlots||"",
        ourShots:fr.ourShots,
        theirShots:fr.theirShots,
        ourCorners:fr.ourCorners,
        theirCorners:fr.theirCorners,
        ourFreeKicks:fr.ourFreeKicks,
        theirFreeKicks:fr.theirFreeKicks,
        ourPkCount:fr.ourPkCount,
        theirPkCount:fr.theirPkCount,
        ourOffsides:fr.ourOffsides,
        theirOffsides:fr.theirOffsides
      }});
      await load("更新中...");
    }catch(e){alert("エラー: "+e.message);}
    setLoading(false);
    setPage({type:"dayDetail",schedule:page?.schedule||fr});
  };
  const handleAddSchedule=async fs=>{
    setLoading(true);setLoadMsg("追加中...");
    try{await api("addSchedule",{schedule:fs});await load("更新中...");}
    catch(e){alert("エラー: "+e.message);}
    setLoading(false);
  };
  const handleSaveMvp=async(scheduleId,mvpName)=>{
    try{await api("updateMvp",{scheduleId,mvp:mvpName});await load("更新中...");}
    catch(e){alert("MVP保存エラー: "+e.message);}
  };
  const handleDeleteResult=async(r)=>{
    if(!confirm("「vs "+r.opponent+"」を削除しますか？"))return;
    setLoading(true);setLoadMsg("削除中...");
    try{await api("deleteResult",{id:r.id});await load("更新中...");}
    catch(e){alert("削除エラー: "+e.message);}
    setLoading(false);
  };
  const handleDeleteSchedule=async(s)=>{
    if(!confirm("「"+(s.title||"この日程")+"」を削除しますか？"))return;
    setLoading(true);setLoadMsg("削除中...");
    try{
      await api("deleteSchedule",{id:s.id});
      await load("更新中...");
      setPage(null);
    }catch(e){alert("削除エラー: "+e.message);}
    setLoading(false);
  };
  const [editResult,setEditResult]=useState(null);
  const handleAddNews=async n=>{
    setLoading(true);setLoadMsg("投稿中...");
    try{await api("addNews",{news:n});await load("更新中...");}
    catch(e){alert("エラー: "+e.message);}
    setLoading(false);
  };
  const handleDeleteNews=async id=>{
    if(!confirm("削除しますか？"))return;
    setLoading(true);
    try{await api("deleteNews",{id});await load("更新中...");}
    catch(e){alert("エラー: "+e.message);}
    setLoading(false);
  };
  const handleUpdateNews=async n=>{
    setLoading(true);setLoadMsg("更新中...");
    try{await api("updateNews",{news:n});await load("更新中...");}
    catch(e){alert("エラー: "+e.message);}
    setLoading(false);
  };
  const handleUpdateProfile=async({name,memberId,familyMembers=[]})=>{
    const r=await api("updateUserProfile",{userId:user.id,name,memberId,familyMembers});
    saveUser({...user,...r.user});
    await load("更新中...");
  };
  const safeSetTab=useCallback((nextTab)=>{
    const t=String(nextTab||"").trim();
    if(!t) return setTab("home");
    if(t==="settings" && !isAdmin) return setTab("home");
    setTab(t);
  },[isAdmin]);
  useEffect(()=>{
    if(!user || !deepLink.scheduleId || schedules.length===0) return;
    const target = schedules.find(s => String(s.id || "").trim() === String(deepLink.scheduleId).trim());
    if (!target) return;
    if (deepLink.tab) safeSetTab(deepLink.tab);
    setPage({type:"dayDetail",schedule:target,dayTab:deepLink.dayTab||""});
    setDeepLink({scheduleId:"",dayTab:"",tab:""});
    try {
      window.history.replaceState(null, "", location.pathname);
    } catch (e) {}
  },[user,deepLink,schedules,safeSetTab]);
  useEffect(()=>{
    if(!isAdmin && tab==="settings") setTab("home");
  },[isAdmin,tab]);

  // ── ページルーティング ────────────────────────────────────────
  if(!user) return h(Login,{onLogin:saveUser});

  if(page?.type==="matchDetail") return h(Fragment,{},
    loading&&h(Loader,{msg:loadMsg}),
    h(GoalPage,{
      key:String(page?.match?.id||"")+"|"+String(page?.schedule?.id||""),
      match:page.match,schedule:page.schedule,members,isAdmin,canWrite,
      onHome:goBack,
      onBack:()=>{
        const backSchedule = findLinkedScheduleForResult(page.match, schedules) || page.schedule;
        goToDay(backSchedule);
      },
      onSaved:async()=>{
        await load("更新中...");
        const backSchedule = findLinkedScheduleForResult(page.match, schedules) || page.schedule;
        goToDay(backSchedule);
      },
      onShotSaved:async()=>{
        await load("更新中...");
      },
    }));

  if(page?.type==="addMatch") return h(Fragment,{},
    loading&&h(Loader,{msg:loadMsg}),
    h(AddMatchModal,{
      schedule:page.schedule,results,
      onSave:handleAddResult,
      onClose:()=>setPage({type:"dayDetail",schedule:page.schedule})
    }));

  if(page?.type==="dayDetail") return h(Fragment,{},
    loading&&h(Loader,{msg:loadMsg}),
    editResult&&h(EditResultModal,{result:editResult,members,onSave:async fr=>{
      setLoading(true);setLoadMsg("更新中...");
      try{await api("updateResult",{result:fr});await load("更新中...");}
      catch(e){alert("更新エラー: "+e.message);}
      setLoading(false);setEditResult(null);
    },onClose:()=>setEditResult(null)}),
    h(DayPage,{
      schedule:page.schedule,results,schedules,members,isAdmin,canWrite,user,users,initialTab:page.dayTab||"",
      onGoToMatch:goToMatch,
      onAdd:s=>setPage({type:"addMatch",schedule:s}),
      onEdit:r=>setEditResult(r),
      onDelete:handleDeleteResult,
      onDeleteSchedule:handleDeleteSchedule,
      onBack:goBack,
      onHome:goBack,
      onSaveMvp:handleSaveMvp,
    }));

  // ── 通常タブ画面 ──────────────────────────────────────────────
  const TABS=[
    {k:"home",   i:"🏠",l:"ホーム"},
    {k:"cal",    i:"📅",l:"日程"},
    {k:"match",  i:"⚽",l:"試合"},
    {k:"dash",   i:"📊",l:"成績"},
    {k:"member", i:"👥",l:"選手"},
    {k:"memo",   i:"📝",l:"メモ"},
    {k:"docs",   i:"📚",l:"資料"},
    ...(isAdmin?[{k:"settings",i:"⚙️",l:"設定"}]:[]),
  ];
  const currentTabContent =
    tab==="home" ? h(HomeTab,{results,schedules,news,pendingNotices,members,isAdmin,onGoToMatch:goToMatch,onGoToDay:goToDay,onOpenDashTab:openDashTab,onOpenTab:safeSetTab})
    : tab==="cal" ? h(CalTab,{schedules,results,isAdmin,onGoToDay:goToDay,onAddSchedule:handleAddSchedule})
    : tab==="match" ? h(MatchTab,{results,schedules,members,isAdmin,onGoToMatch:goToMatch,onGoToDay:goToDay})
    : tab==="dash" ? h(DashTab,{results,members,schedules,liftings,isAdmin,initialDashTab:dashInitialTab,onGoToMatch:goToMatch,onGoToDay:goToDay})
    : tab==="member" ? h(MemberTab,{members,liftings})
    : tab==="memo" ? h(MemoTab,{news,isAdmin,user,onAdd:handleAddNews,onDelete:handleDeleteNews})
    : tab==="docs" ? h(InfoTab,{news,isAdmin,user,onAdd:handleAddNews,onDelete:handleDeleteNews,onUpdate:handleUpdateNews})
    : tab==="settings" ? (isAdmin
        ? h(SettingsTab,{user,users,members,notificationEnabled,notificationBusy,onToggleNotifications:handleEnableNotifications,onUpdateProfile:handleUpdateProfile})
        : null)
    : h(HomeTab,{results,schedules,news,pendingNotices,members,isAdmin,onGoToMatch:goToMatch,onGoToDay:goToDay,onOpenDashTab:openDashTab,onOpenTab:safeSetTab});

  return h(Fragment,{},
    loading && h(Loader,{msg:loadMsg}),
    h("div",{className:"page"},
      h(AppHeader,{user,onLogout:()=>saveUser(null),onRefresh:()=>load("更新中..."),notificationEnabled,notificationBusy,onEnableNotifications:handleEnableNotifications}),
      h("div",{style:{background:"#fff",margin:"0 16px",borderRadius:16,marginTop:-24,boxShadow:"0 4px 20px rgba(0,0,0,0.12)",overflow:"hidden",position:"relative",zIndex:10,marginBottom:16}},
        h("div",{style:{display:"flex"}},
          TABS.map(t=>h("button",{key:t.k,onClick:()=>safeSetTab(t.k),style:{flex:1,padding:"11px 2px 9px",border:"none",background:tab===t.k?"#1D4ED8":"transparent",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:2}},
            h("span",{style:{fontSize:17}},t.i),
            h("span",{style:{fontSize:9,fontWeight:tab===t.k?700:400,color:tab===t.k?"#fff":"#aaa"}},t.l)
          ))
        )
      ),
      h("div",{style:{padding:"12px 16px 0"}}, currentTabContent)
    )
  );
}
render(h(App,{}), document.getElementById("app"));

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js?v=15")
      .then(reg => { try { reg.update(); } catch (e) {} })
      .catch(() => {});
  });
}
</script>
