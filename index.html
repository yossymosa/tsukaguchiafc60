function normalizeType(type) {
  const raw = String(type || "").trim();
  const lower = raw.toLowerCase();

  if (label === "蜈ｬ蠑乗姶") return "official";

function scheduleTypePriority(type) {
  const normalized = normalizeType(type);
  if (normalized === "official") return 5;
  if (normalized === "cup") return 4;
  if (normalized === "training") return 3;
  if (normalized === "practice") return 2;
  if (normalized === "event") return 1;
  return 0;
}
function candidateSchedulesForResult(result, schedules) {
  const sameDayAll = schedules.filter(s => nd(s.date) === nd(result?.date));
  const titled = sameDayAll.filter(s => {
    const title = String(s.title || "").trim();
    return title && title !== "(タイトルなし)";
  });
  return titled.length ? titled : sameDayAll;
}
function isPlaceholderSchedule(schedule) {
  if (!schedule) return true;
  const title = String(schedule.title || "").trim();
  return !title || title === "(タイトルなし)";
}
function pickHighestPrioritySchedule(candidates) {
  if (!candidates.length) return null;
  const sorted = [...candidates].sort((a,b) =>
    scheduleTypePriority(b.type || b.title) - scheduleTypePriority(a.type || a.title)
    || (String(b.title || "").trim() ? 1 : 0) - (String(a.title || "").trim() ? 1 : 0)
  );
  return sorted[0] || null;
}
function findScheduleForResult(result, schedules) {
  if (!result) return null;
  const sameDay = candidateSchedulesForResult(result, schedules);
  const byIdRaw = schedules.find(s => String(s.id || "") === String(result.scheduleId || ""));
  const byId = isPlaceholderSchedule(byIdRaw) ? null : byIdRaw;
  if (byId) return byId;

  const resultType = normalizeType(result.type || result.formatLabel || result.memo || "");
  if (resultType) {
    const typed = sameDay.filter(s => normalizeType(s.type || s.title) === resultType);
    if (typed.length) return pickHighestPrioritySchedule(typed);
  }

  const memoText = String(result.memo || "").trim();
  if (memoText) {
    const memoMatched = sameDay.find(s => String(s.title || "").trim() === memoText);
    if (memoMatched && !isPlaceholderSchedule(memoMatched)) return memoMatched;
  }

  const picked = pickHighestPrioritySchedule(sameDay.filter(s => !isPlaceholderSchedule(s)));
  if (picked) return picked;
  return sameDay.length === 1 ? sameDay[0] : null;
}
function getResultDisplayType(result, schedules) {
  const linked = findScheduleForResult(result, schedules);
  const scheduleType = normalizeType(linked?.type || linked?.title || "");
  if (scheduleType) return scheduleType;

  const candidates = [result.type, result.formatLabel, result.memo].filter(Boolean);
  for (const value of candidates) {
    const normalized = normalizeType(value);
    if (normalized) return normalized;
  }

  const picked = pickHighestPrioritySchedule(candidateSchedulesForResult(result, schedules).filter(s => !isPlaceholderSchedule(s)));
  return picked ? normalizeType(picked.type || picked.title || "") : "";
}

function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map(ch => ch.charCodeAt(0)));
}

async function subscribeWebPush(user) {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
    throw new Error("縺薙・遶ｯ譛ｫ縺ｧ縺ｯWeb Push縺ｫ蟇ｾ蠢懊＠縺ｦ縺・∪縺帙ｓ");
  }
  const swUrl = "/sw.js?v=7";
  const reg =
    (await navigator.serviceWorker.getRegistration()) ||
    (await navigator.serviceWorker.register(swUrl));
  await Promise.race([
    navigator.serviceWorker.ready,
    new Promise((_, reject) =>
      setTimeout(() => reject(new Error("騾夂衍縺ｮ蛻晄悄蛹悶′繧ｿ繧､繝繧｢繧ｦ繝医＠縺ｾ縺励◆")), 8000)
    ),
  ]);
  const keyRes = await fetch("/api/push-public-key");
  if (!keyRes.ok) throw new Error("蜈ｬ髢矩嵯縺ｮ蜿門ｾ励↓螟ｱ謨励＠縺ｾ縺励◆");
  const { publicKey } = await keyRes.json();
  if (!publicKey) throw new Error("騾夂衍蜈ｬ髢矩嵯縺瑚ｨｭ螳壹＆繧後※縺・∪縺帙ｓ");
  let sub = await reg.pushManager.getSubscription();
  if (!sub) {
    sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(publicKey),
    });
  }
  await api("savePushSubscription", {
    userId: user.id,
    userName: user.name,
    subscription: sub.toJSON(),
  });
  return sub;
}

async function getCurrentPushSubscription() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) return null;
  const reg = await navigator.serviceWorker.getRegistration();
  if (!reg || !reg.pushManager) return null;
  return await reg.pushManager.getSubscription();
}

async function unsubscribeWebPush() {
  const sub = await getCurrentPushSubscription();
  if (!sub) return false;
  const endpoint = sub.endpoint;
  await sub.unsubscribe().catch(() => false);
  if (endpoint) {
    await api("deletePushSubscription", { endpoint }).catch(() => {});
  }
  return true;
}

function nd(v) {
  if(!v) return "";
  const s=String(v);
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const d=new Date(s);
  if(!isNaN(d.getTime())) return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  return s;
}
function todayLocal() {
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function dateOnly(v) {
  const s = String(v || "").trim();
  if (!s) return "";
  const m = s.match(/^(\d{4}-\d{2}-\d{2})/);
  if (m) return m[1];
  return nd(s);
}
function fmt(v) {
  const s=nd(v);
  if(!s||s.length<10) return {y:"",m:"",d:"",dw:"",short:"",full:""};
  const dt=new Date(s+"T00:00:00");
  const dw=["譌･","譛・,"轣ｫ","豌ｴ","譛ｨ","驥・,"蝨・][dt.getDay()];
  return {y:s.slice(0,4),m:s.slice(5,7),d:s.slice(8,10),dw,short:s.slice(5,7)+"/"+s.slice(8,10),full:s.slice(0,4)+"蟷ｴ"+s.slice(5,7)+"譛・+s.slice(8,10)+"譌･("+dw+")"};
}
function fmtDateTime(v) {
  if(!v) return {date:"",time:"",label:""};
  const raw=String(v).trim();
  const dt=/^\d{4}-\d{2}-\d{2}$/.test(raw) ? new Date(raw+"T00:00:00") : new Date(raw);
  if(isNaN(dt.getTime())) {
    const f=fmt(raw);
    return {date:f.short,time:"",label:f.short};
  }
  const dw=["譌･","譛・,"轣ｫ","豌ｴ","譛ｨ","驥・,"蝨・][dt.getDay()];
  const date=`${String(dt.getMonth()+1).padStart(2,"0")}/${String(dt.getDate()).padStart(2,"0")}(${dw})`;
  const time=`${String(dt.getHours()).padStart(2,"0")}:${String(dt.getMinutes()).padStart(2,"0")}`;
  return {date,time,label:time==="00:00"?date:`${date} ${time}`};
}
function isRecentNews(v) {
  if(!v) return false;
  const raw=String(v).trim();
  const dt=/^\d{4}-\d{2}-\d{2}$/.test(raw) ? new Date(raw+"T00:00:00") : new Date(raw);
  if(isNaN(dt.getTime())) return false;
  return (Date.now()-dt.getTime()) < 2*24*60*60*1000;
}
function getCurrentThirdGeneration() {
  const now = new Date();
  const fiscalYear = now.getMonth() + 1 >= 4 ? now.getFullYear() : now.getFullYear() - 1;
  return fiscalYear - 1965;
}
function resolveGrade(member) {
  const gen = Number(String(member?.generation || "").replace(/[^\d]/g,""));
  if (!gen) return member?.grade || "";
  const gradeNum = getCurrentThirdGeneration() - gen + 3;
  if (gradeNum >= 1 && gradeNum <= 6) return gradeNum + "蟷ｴ";
  if (gradeNum === 0) return "蟷ｴ髟ｷ";
  if (gradeNum === -1) return "蟷ｴ荳ｭ";
  if (gradeNum > 6) return "蜊呈･ｭ";
  return member?.grade || "";
}

function calcStats(rs) {
  if(!rs.length) return {games:0,wins:0,draws:0,losses:0,gf:0,ga:0,pct:"-"};
  // PK謌ｦ縺後≠繧玖ｩｦ蜷医・縺ｿPK繧ｹ繧ｳ繧｢縺ｧ蜍晄風蛻､螳壹√◎繧御ｻ･螟悶・騾壼ｸｸ繧ｹ繧ｳ繧｢
  const hasPkData = r => {
    // pkKickers驟榊・縺後≠繧後・遒ｺ螳溘↓PK謌ｦ縺ゅｊ
    try { const k=JSON.parse(r.pkKickers); if(Array.isArray(k)&&k.length>0) return true; } catch(e){}
    // 譌ｧ繝・・繧ｿ: pkOur/pkTheir縺御ｸ｡譁ｹ謨ｰ蛟､縺九▽蜷郁ｨ・莉･荳・
    const o=Number(r.pkOur), t=Number(r.pkTheir);
    return !isNaN(o) && !isNaN(t) && r.pkOur!=="" && r.pkTheir!=="" && (o+t)>0;
  };
  const isWin = r => {
    const our=Number(r.ourScore), their=Number(r.theirScore);
    if(our>their) return true;
    if(our<their) return false;
    // 蠑輔″蛻・￠縺ｧPK縺ゅｊ
    if(hasPkData(r)) return Number(r.pkOur)>Number(r.pkTheir);
    return false;
  };
  const isDraw = r => {
    const our=Number(r.ourScore), their=Number(r.theirScore);
    if(our!==their) return false;
    if(hasPkData(r)) return false; // PK縺ゅｌ縺ｰ蠑輔″蛻・￠縺ｪ縺・
    return true;
  };
  const w=rs.filter(isWin).length;
  const dr=rs.filter(isDraw).length;
  const gf=rs.reduce((a,r)=>a+Number(r.ourScore||0),0);
  const ga=rs.reduce((a,r)=>a+Number(r.theirScore||0),0);
  return {games:rs.length,wins:w,draws:dr,losses:rs.length-w-dr,gf,ga,pct:Math.round(w/rs.length*100)+"%"};
}

async function showLocalNotification(title, options={}) {
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  if ("serviceWorker" in navigator) {
    const reg = await navigator.serviceWorker.getRegistration();
    if (reg && reg.showNotification) {
      await reg.showNotification(title, options);
      return;
    }
  }
  new Notification(title, options);
}

async function maybeNotifyDeadlines(schedules) {
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  const today = todayLocal();
  for (const s of schedules) {
    if (!s.deadline) continue;
    const d = nd(s.deadline);
    if (!d) continue;
    const days = Math.round((new Date(d + "T00:00:00") - new Date(today + "T00:00:00")) / (1000 * 60 * 60 * 24));
    if (days !== 1) continue;
    const key = `afc_deadline_notice_${s.id}_${s.deadline}`;
    if (localStorage.getItem(key)) continue;
    await showLocalNotification("蜃ｺ谺邱蛻・′霑代▼縺・※縺・∪縺・, {
      body: `${s.title || "莠亥ｮ・} 縺ｮ邱蛻・・譏取律縺ｧ縺呻ｼ・{d}・荏,
      icon: "/icon-512.png",
      badge: "/icon-512.png",
    });
    localStorage.setItem(key, "1");
  }
}

async function maybeNotifyUpcomingEvents(schedules) {
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  const today = new Date();
  const base = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  for (const s of schedules) {
    if (!s.date) continue;
    const eventDate = new Date(s.date + "T00:00:00");
    const days = Math.round((eventDate.getTime() - base.getTime()) / (1000 * 60 * 60 * 24));
    if (days !== 1) continue;

// 笏笏 YouTube 繝・Φ繝励Ξ逕滓・ 笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏
function makeYtTitle(match, schedule, half) {
  const dt = fmt(match.date || schedule?.date);
  const dateStr = dt.y + "/" + Number(dt.m) + "/" + Number(dt.d);
  const opponent = match.opponent || "";
  const tc = getTC(match.type);
  const gameNo = match.gameNumber ? "隨ｬ" + match.gameNumber + "隧ｦ蜷・ : "";
  const loc = schedule?.location ? "@" + schedule.location : "";
  return [dateStr, "VS", opponent, tc.lb, gameNo, half, loc].filter(Boolean).join(" ");
}

// 遘停・ m:ss 蠖｢蠑・
function secToTime(min, sec) {
  const m = Number(min)||0;
  const s = Number(sec)||0;
  return m + ":" + String(s).padStart(2,"0");
}

// 繝√Ε繝励ち繝ｼ蠖｢蠑上・隱ｬ譏取ｬ・函謌撰ｼ亥燕蜊・or 蠕悟濠・・
function makeYtDesc(match, members, half) {
  const isH1 = half === "1st";
  const halfKey = isH1 ? "1st" : "2nd";

  // 蜈ｨ菴薙せ繧ｳ繧｢・亥燕蜊・蠕悟濠蜷郁ｨ茨ｼ・
  const allOur   = (match.goals||[]).filter(g=>g.team!=="them").length;
  const allTheir = (match.theirGoals||[]).length + (match.goals||[]).filter(g=>g.team==="them").length;

  // 蜑榊濠繝ｻ蠕悟濠蛻･繧ｹ繧ｳ繧｢
  const h1Our   = (match.goals||[]).filter(g=>g.team!=="them" && String(g.half).toLowerCase()==="1st").length;
  const h1Their = (match.theirGoals||[]).filter(g=>String(g.half).toLowerCase()==="1st").length
                + (match.goals||[]).filter(g=>g.team==="them" && String(g.half).toLowerCase()==="1st").length;
  const h2Our   = (match.goals||[]).filter(g=>g.team!=="them" && String(g.half).toLowerCase()==="2nd").length;
  const h2Their = (match.theirGoals||[]).filter(g=>String(g.half).toLowerCase()==="2nd").length
                + (match.goals||[]).filter(g=>g.team==="them" && String(g.half).toLowerCase()==="2nd").length;

  const scoreLine = "蝪壼哨AFC " + allOur + " - " + allTheir + " " + match.opponent
    + "\n蜑榊濠 " + h1Our + "-" + h1Their + "  蠕悟濠 " + h2Our + "-" + h2Their;

  // 繝√Ε繝励ち繝ｼ: 謖・ｮ壹ワ繝ｼ繝輔・繧ｴ繝ｼ繝ｫ縺ｮ縺ｿ
  const myG = (match.goals||[])
    .filter(g => String(g.half).toLowerCase()===halfKey.toLowerCase() && g.team!=="them")
    .sort((a,b)=>Number(a.minute)-Number(b.minute)||Number(a.second)-Number(b.second));
  const thG = [
    ...(match.theirGoals||[]).filter(g => String(g.half).toLowerCase()===halfKey.toLowerCase()),
    ...(match.goals||[]).filter(g => String(g.half).toLowerCase()===halfKey.toLowerCase() && g.team==="them"),
  ].sort((a,b)=>Number(a.minute)-Number(b.minute)||Number(a.second)-Number(b.second));

  const lines = ["0:00 繧ｹ繧ｿ繝ｼ繝・];
  const events = [
    ...myG.map(g => {
      const sc = members.find(m=>m.id===g.scorerId);
      const scorerName = sc?.name || g.scorerName || "荳肴・";
      const as = members.find(m=>m.id===g.assistId);
      const assistName = as?.name || g.assistName || "";
      const type = g.goalType && g.goalType!=="騾壼ｸｸ" ? "("+g.goalType+")" : "";
      const assistStr = assistName ? " 繧｢繧ｷ繧ｹ繝・"+assistName : "";
      return { min:Number(g.minute)||0, sec:Number(g.second)||0,
               text: secToTime(g.minute,g.second)+" [蠕礼せ]"+scorerName+type+assistStr };
    }),
    ...thG.map(g => {

// 笏笏 HP逕ｨ繝・Φ繝励Ξ逕滓・ 笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏
function makeHpTemplate(schedule, results) {
  const dt = fmt(schedule.date);
  const dateStr = dt.m+"譛・+Number(dt.d)+"譌･";
  const title = schedule.title || "";
  const loc = schedule.location || "";
  const nums = ["竭","竭｡","竭｢","竭｣","竭､","竭･","竭ｦ","竭ｧ","竭ｨ","竭ｩ"];

  const sorted = [...results].sort((a,b)=>Number(a.gameNumber||1)-Number(b.gameNumber||1));

  // 繝倥ャ繝繝ｼ: 譌･莉・繧ｿ繧､繝医Ν / 蝣ｴ謇
  let text = dateStr+(title?"縲・+title+"縲・:"");
  text += "\n"+loc;
  text += "\n";

  sorted.forEach((r,i)=>{
    const num = nums[i]||"繝ｻ";
    const our = r.ourScore||0;
    const their = r.theirScore||0;
    // 隧ｦ蜷医＃縺ｨ縺ｮ蠕礼せ閠・
    const scorers = (r.goals||[])
      .filter(g=>g.team!=="them"&&g.goalType!=="繧ｪ繧ｦ繝ｳ繧ｴ繝ｼ繝ｫ"&&g.scorerName&&g.scorerName!=="螟ｱ轤ｹ")
      .map(g=>g.scorerName);
    const scorerStr = scorers.length>0 ? "\n縲蠕礼せ・・+scorers.join("縲・) : "";
    text += num+"蝪壼哨AFCjr "+our+"窶・+their+" "+r.opponent+"縺輔ｓ"+scorerStr+"\n";
  });

  return text.trimEnd();
}

function copyToClipboard(text) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).catch(()=>{});
  } else {
    const el = document.createElement("textarea");
    el.value = text; document.body.appendChild(el);
    el.select(); document.execCommand("copy");
    document.body.removeChild(el);
  }
}

// 笏笏 驟崎ｻ翫そ繧ｯ繧ｷ繝ｧ繝ｳ 笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏

      setLoading(false);

  // 蜿ょ刈閠・Μ繧ｹ繝茨ｼ亥・谺笳具ｼ・

        h("div",{style:{fontSize:12,fontWeight:600,color:"#666",marginBottom:8}},"驟崎ｻ翫〒縺阪∪縺吶°・・),
        h("div",{style:{display:"flex",gap:8}},
          [["蜿ｯ","#4CAF50"],["荳榊庄","#F44336"],["譛ｪ螳・,"#FF9800"]].map(([v,col])=>
            h("button",{key:v,onClick:()=>setMy(p=>({...p,available:v})),
              style:{flex:1,padding:"11px 0",border:`2px solid ${my.available===v?col:"#eee"}`,
                borderRadius:12,background:my.available===v?col:"#fff",
                color:my.available===v?"#fff":"#aaa",fontSize:14,fontWeight:700,cursor:"pointer"}},v)))),
      my.available==="蜿ｯ"&&h("div",{style:{marginBottom:12}},

    // 髮・ｨ・
    h("div",{style:{background:"#fff",borderRadius:16,padding:18,marginBottom:12,boxShadow:"0 2px 10px rgba(0,0,0,0.07)"}},

        h("div",{style:{fontSize:11,fontWeight:700,color:"#bbb",letterSpacing:2}},"髮・ｨ・),

          cp.available==="蜿ｯ"&&h("div",{style:{fontSize:12,color:"#2196F3",fontWeight:700}},cp.capacity+"莠ｺ"),
          cp.note&&h("div",{style:{fontSize:11,color:"#aaa",flex:1,textAlign:"right",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},cp.note))),
      !isAdmin&&carpools.length===0&&h("div",{})),

    isAdmin&&cars.length>0&&participants.length>0&&h("div",{style:{background:"#fff",borderRadius:16,padding:18,boxShadow:"0 2px 10px rgba(0,0,0,0.07)"}},
      h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}},
        h("div",{style:{fontSize:11,fontWeight:700,color:"#bbb",letterSpacing:2}},"亮 驟崎ｻ雁牡繧雁ｽ薙※"),
        h("button",{onClick:()=>setAssignMode(p=>!p),
          style:{fontSize:11,fontWeight:700,color:"#2196F3",background:"none",border:"1px solid #2196F3",borderRadius:8,padding:"4px 10px",cursor:"pointer"}},

      // 霆翫＃縺ｨ縺ｮ繧ｫ繝ｼ繝・
      cars.map((car,ci)=>{

                      },placeholder:"萓・ 蝪壼哨蜈ｬ蝨帝ｧ占ｻ雁ｴ",style:{...css.inp,fontSize:12,padding:"5px 8px",width:"100%"}})

                  canEdit
                    ? h("input",{value:info.time,onChange:e=>{
                        const next=pickupRows(car.userId).map((x,i)=>i===rowIdx?{...x,time:e.target.value}:x);

                canEdit&&h("div",{style:{display:"flex",gap:4,marginBottom:1}},

                onClick:()=>assignMode&&setAssignment(p=>({...p,[m.id]:undefined})),
                style:{fontSize:12,fontWeight:700,color:"#fff",background:pc.bg,borderRadius:8,

            assigned.length===0&&h("div",{style:{fontSize:12,color:"#ccc"}},"譛ｪ蜑ｲ繧雁ｽ薙※")));

      assignMode&&h("div",{style:{marginTop:12,padding:12,background:"#DBEAFE",borderRadius:12}},
        h("div",{style:{fontSize:11,fontWeight:700,color:"#FF9800",marginBottom:8}},"譛ｪ蜑ｲ繧雁ｽ薙※"),
        h("div",{style:{display:"flex",flexWrap:"wrap",gap:6}},
          participants.filter(m=>assignment[m.id]===undefined||assignment[m.id]===null).map(m=>{
            const pc=PC[m.position]||{bg:"#999"};
            return h("div",{key:m.id,style:{position:"relative"}},
              h("select",{
                value:"",
                onChange:e=>{
                  const ci2=Number(e.target.value);
                  if(!isNaN(ci2)&&ci2>=0) setAssignment(p=>({...p,[m.id]:ci2}));
                },
                style:{position:"absolute",top:0,left:0,width:"100%",height:"100%",opacity:0,cursor:"pointer"}},
                h("option",{value:""},"霆翫ｒ驕ｸ謚・),
                cars.map((car,ci2)=>h("option",{key:ci2,value:ci2},car.userName))),
              h("span",{style:{fontSize:12,fontWeight:700,color:"#fff",background:pc.bg,
                borderRadius:8,padding:"3px 10px",display:"inline-block",cursor:"pointer"}},
                m.name+" 笆ｼ"));

function DashTab({results,members,schedules,liftings=[],isAdmin=false,initialDashTab="result",onGoToMatch}) {
  const [dashTab,setDashTab]=useState(initialDashTab); // "result" | "tournament" | "rank" | "personal"
  const [typeF,setTypeF]=useState("all");
  const [periodF,setPeriodF]=useState("year"); // "year"|"month"|"lastmonth"|"custom"
  const [from,setFrom]=useState(""); const [to,setTo]=useState("");
  const [oppFilter,setOppFilter]=useState("all"); // "all" or opponent name
  useEffect(()=>{ if(initialDashTab) setDashTab(initialDashTab); },[initialDashTab]);
  const getResultType=row=> normalizeType(getResultDisplayType(row, schedules));
  function typeMatch(r,typeF){
    if(typeF==="all") return true;
    const baseType = r && Object.prototype.hasOwnProperty.call(r,"opponent") ? getResultDisplayType(r,schedules) : normalizeType(r.type);
    return baseType===normalizeType(typeF);
  }
  const periodRange=useMemo(()=>{
    const now=new Date();
    const y=now.getFullYear(), m=now.getMonth()+1;
    // 蟷ｴ蠎ｦ: 4譛亥ｧ九∪繧・
    const fyStart=(m>=4?y:y-1);
    if(periodF==="year")      return {f:`${fyStart}-04-01`, t:`${fyStart+1}-03-31`};
    if(periodF==="month")     return {f:`${y}-${String(m).padStart(2,"0")}-01`, t:`${y}-${String(m).padStart(2,"0")}-31`};
    if(periodF==="lastmonth"){
      const lm=m===1?12:m-1, ly=m===1?y-1:y;
      return {f:`${ly}-${String(lm).padStart(2,"0")}-01`, t:`${ly}-${String(lm).padStart(2,"0")}-31`};
    }
    return {f:from, t:to};
  },[periodF,from,to]);
  const filtered=useMemo(()=>results.filter(r=>{
    if(typeF!=="all"&&!typeMatch(r,typeF)) return false;
    const d=nd(r.date);
    if(periodRange.f&&d<periodRange.f) return false;
    if(periodRange.t&&d>periodRange.t) return false;
    return true;
  }),[results,typeF,periodRange]);
  const oppFiltered=useMemo(()=>
    oppFilter==="all"?filtered:filtered.filter(r=>r.opponent===oppFilter)
  ,[filtered,oppFilter]);
  const st=calcStats(filtered);
  const tournamentFiltered=useMemo(()=>schedules.filter(s=>{
    if(!["official","cup"].includes(normalizeType(s.type))) return false;
    if(typeF!=="all"&&!typeMatch(s,typeF)) return false;
    const d=nd(s.date);
    if(periodRange.f&&d<periodRange.f) return false;
    if(periodRange.t&&d>periodRange.t) return false;
    return true;
  }),[schedules,typeF,periodRange]);
  const championCount = tournamentFiltered.filter(s => {
    const rank = String(s.rank || "").trim();
    return ["蜆ｪ蜍・,"1菴・,"隨ｬ1菴・,"1"].includes(rank);
  }).length;
  const tournamentRows=tournamentFiltered
    .filter(s=>String(s.rank||"").trim())
    .sort((a,b)=>nd(b.date).localeCompare(nd(a.date)));

  // 繝ｩ繝ｳ繧ｭ繝ｳ繧ｰ髮・ｨ・
  const scorerMap={},assistMap={},mvpMap={};
  // PK謌仙粥邇・ 蜷・∈謇九・PK蠕礼せ(goalType==="PK")繧帝寔險・
  const pkScoreMap={},pkTotalMap={};
  filtered.forEach(r=>{
    (r.goals||[]).forEach(g=>{
      const scId = g.scorerId || (g.scorerName && members.find(m=>m.name===g.scorerName)?.id) || "";
      const isOwnGoal = g.goalType==="繧ｪ繧ｦ繝ｳ繧ｴ繝ｼ繝ｫ";
      if(scId && !isOwnGoal) scorerMap[scId]=(scorerMap[scId]||0)+1;
      const asId = g.assistId || (g.assistName && members.find(m=>m.name===g.assistName)?.id) || "";
      if(asId && !isOwnGoal) assistMap[asId]=(assistMap[asId]||0)+1;
      // PK: goalType==="PK" 縺九▽閾ｪ繝√・繝縺ｮ蠕礼せ
      if(g.goalType==="PK" && scId) {
        pkScoreMap[scId]=(pkScoreMap[scId]||0)+1;
      }
    });
    // 逶ｸ謇九ざ繝ｼ繝ｫ縺ｫPK縺後≠繧後・・亥､ｱ轤ｹPK・俄・ 驕ｸ謇句挨PK隧ｦ陦梧焚縺ｫ蜉邂励・縺励↑縺・ｼ郁｢ｫPK・・
  });
  // MVP縺ｯ繧ｹ繧ｱ繧ｸ繝･繝ｼ繝ｫ・亥・蠑乗姶繝ｻ繧ｫ繝・・謌ｦ・峨°繧会ｼ域悄髢薙ヵ繧｣繝ｫ繧ｿ驕ｩ逕ｨ・・

  const toRank=(map,mbrs)=>Object.entries(map).map(([id,cnt])=>{
    const m=mbrs.find(x=>x.id===id)||mbrs.find(x=>x.name===id);

  }).filter(x=>x.m).sort((a,b)=>Number(b.cnt||0)-Number(a.cnt||0)||Number(a.m.number||999)-Number(b.m.number||999)||String(a.m.name||"").localeCompare(String(b.m.name||""))).slice(0,10);

  // 蛟倶ｺｺ謌千ｸｾ: 繝｡繝ｳ繝舌・蛻･髮・ｨ・

        const isOwnGoal = g.goalType==="繧ｪ繧ｦ繝ｳ繧ｴ繝ｼ繝ｫ";
        if(scId===m.id && !isOwnGoal) goals++;
        if(asId===m.id && !isOwnGoal) assists++;
      });
      // pkKickers・医く繝・き繝ｼ譁ｹ蠑擾ｼ峨°繧臼K謌仙粥邇・ｒ髮・ｨ・
      try{
        const kickers=JSON.parse(r.pkKickers);
        if(Array.isArray(kickers)){
          kickers.forEach(k=>{
            if(k.memberId===m.id){ pkTotal++; if(k.success) pkMade++; }
          });
        }
      }catch(e){}
    });
    schedules.forEach(s=>{
      if(!s.mvp) return;
      if(!["official","cup","蜈ｬ蠑乗姶","繧ｫ繝・・謌ｦ"].includes(s.type)) return;

    });
    return {...m,goals,assists,pkMade,pkTotal,mvpCount};
  }).filter(m=>m.goals>0||m.assists>0||m.mvpCount>0).sort((a,b)=>b.goals-a.goals||b.assists-a.assists)
  ,[filtered,members,schedules,from,to]);

  return h(Fragment,{},
    // 繧ｵ繝悶ち繝・

// 笏笏 繝｡繧､繝ｳ繧｢繝励Μ 笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏
function App() {
  const [user,setUser]=useState(()=>{
    try{ const u=localStorage.getItem("afc_user"); return u?JSON.parse(u):null; }catch(e){ return null; }
  });
  const saveUser=(u)=>{ setUser(u); try{ if(u) localStorage.setItem("afc_user",JSON.stringify(u)); else localStorage.removeItem("afc_user"); }catch(e){} };
  const [loading,setLoading]=useState(false);
  const [loadMsg,setLoadMsg]=useState("隱ｭ縺ｿ霎ｼ縺ｿ荳ｭ...");
  const [tab,setTab]=useState("home");
  const [dashInitialTab,setDashInitialTab]=useState("result");
  const [page,setPage]=useState(null); // null | {type,schedule?,match?}
  const [members,setMembers]=useState([]);
  const [schedules,setSchedules]=useState([]);
  const [results,setResults]=useState([]);
  const [news,setNews]=useState([]);
  const [liftings,setLiftings]=useState([]);
  const [users,setUsers]=useState([]);
  const [notificationPermission,setNotificationPermission]=useState(()=>("Notification" in window ? Notification.permission : "unsupported"));
  const [notificationEnabled,setNotificationEnabled]=useState(false);
  const [notificationBusy,setNotificationBusy]=useState(false);
  const isAdmin=user?.role==="admin";

  const load=useCallback(async(msg="隱ｭ縺ｿ霎ｼ縺ｿ荳ｭ...")=>{
    setLoadMsg(msg);setLoading(true);
    try{
      const d=await api("getAll");
      setMembers((d.members||[]).map(normalizeMember));
      setSchedules(d.schedules||[]);
      setResults(d.results||[]);
      setNews(d.news||[]); setLiftings(d.liftings||[]);
      setUsers(d.users||[]);
    }catch(e){alert("隱ｭ縺ｿ霎ｼ縺ｿ繧ｨ繝ｩ繝ｼ: "+e.message);}
    setLoading(false);
  },[]);
  useEffect(()=>{if(user)load();},[user]);
  useEffect(()=>{
    if(!user || !("serviceWorker" in navigator) || !("PushManager" in window)) {
      setNotificationEnabled(false);
      return;
    }
    getCurrentPushSubscription()
      .then(sub=>setNotificationEnabled(!!sub && Notification.permission==="granted"))
      .catch(()=>setNotificationEnabled(false));
  },[user,notificationPermission]);
  useEffect(()=>{
    if(!user || schedules.length===0 || !("Notification" in window)) return;
    setNotificationPermission(Notification.permission);
    if(Notification.permission!=="granted") return;
    maybeNotifyDeadlines(schedules).catch(()=>{});
    maybeNotifyUpcomingEvents(schedules).catch(()=>{});
  },[user,schedules]);
  const handleEnableNotifications=async()=>{
    if(notificationBusy) return;
    setNotificationBusy(true);
    try{
      if(notificationEnabled){
        await unsubscribeWebPush();
        setNotificationEnabled(false);
        alert("騾夂衍繧丹FF縺ｫ縺励∪縺励◆");
        return;
      }
      const p=await enableNotifications();
      setNotificationPermission(p);
      if(p==="granted"){
        try{
          await subscribeWebPush(user);
        }catch(e){
          alert("騾夂衍雉ｼ隱ｭ繧ｨ繝ｩ繝ｼ: "+(e&&e.message?e.message:"荳肴・縺ｪ繧ｨ繝ｩ繝ｼ"));
          return;
        }
        setNotificationEnabled(true);
        setTimeout(()=>{ maybeNotifyDeadlines(schedules).catch(()=>{}); },0);
        setTimeout(()=>{ maybeNotifyUpcomingEvents(schedules).catch(()=>{}); },0);
        alert("騾夂衍繧丹N縺ｫ縺励∪縺励◆");
      }else if(p==="denied"){
        alert("繝悶Λ繧ｦ繧ｶ縺ｧ騾夂衍縺後ヶ繝ｭ繝・け縺輔ｌ縺ｦ縺・∪縺・);
      }else if(p==="default"){
        alert("騾夂衍縺ｮ險ｱ蜿ｯ縺悟ｮ御ｺ・＠縺ｾ縺帙ｓ縺ｧ縺励◆");
      }else{
        alert("縺薙・遶ｯ譛ｫ縺ｧ縺ｯ騾夂衍縺ｫ蟇ｾ蠢懊＠縺ｦ縺・∪縺帙ｓ");
      }
    }catch(e){
      alert("騾夂衍繝懊ち繝ｳ蜃ｦ逅・お繝ｩ繝ｼ: "+(e&&e.message?e.message:"荳肴・縺ｪ繧ｨ繝ｩ繝ｼ"));
    }finally{
      setNotificationBusy(false);
    }
  };

  // 笏笏 繝上Φ繝峨Λ・亥・縺ｦ縺薙％縺ｧ螳夂ｾｩ・俄楳笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏
  const goToMatch=(r,s)=>setPage({type:"matchDetail",match:r,schedule:(s&&s.id)?s:null});
  const goToDay  =(s)  =>setPage({type:"dayDetail",schedule:s});
  const openDashTab = (nextTab) => {
    setDashInitialTab(nextTab || "result");
    setTab("dash");
  };
  const goBack   =()   =>setPage(null);

  const handleAddResult=async fr=>{
    setLoading(true);setLoadMsg("霑ｽ蜉荳ｭ...");
    try{
      await api("addResult",{result:{
        scheduleId:fr.scheduleId,date:fr.date,opponent:fr.opponent,
        formatLabel:fr.formatLabel||"",gameNumber:fr.gameNumber||1,
        type:fr.type,memo:""
      }});
      await load("譖ｴ譁ｰ荳ｭ...");
    }catch(e){alert("繧ｨ繝ｩ繝ｼ: "+e.message);}
    setLoading(false);
    setPage({type:"dayDetail",schedule:page?.schedule||fr});
  };
  const handleAddSchedule=async fs=>{
    setLoading(true);setLoadMsg("霑ｽ蜉荳ｭ...");
    try{const payload={...fs,date:dateOnly(fs.date)||todayLocal()};await api("addSchedule",{schedule:payload});await load("譖ｴ譁ｰ荳ｭ...");}
    catch(e){alert("繧ｨ繝ｩ繝ｼ: "+e.message);}
    setLoading(false);
  };
  const handleSaveMvp=async(scheduleId,mvpName)=>{
    try{await api("updateMvp",{scheduleId,mvp:mvpName});await load("譖ｴ譁ｰ荳ｭ...");}
    catch(e){alert("MVP菫晏ｭ倥お繝ｩ繝ｼ: "+e.message);}
  };
  const handleDeleteResult=async(r)=>{
    if(!confirm("縲計s "+r.opponent+"縲阪ｒ蜑企勁縺励∪縺吶°・・))return;
    setLoading(true);setLoadMsg("蜑企勁荳ｭ...");
    try{await api("deleteResult",{id:r.id});await load("譖ｴ譁ｰ荳ｭ...");}
    catch(e){alert("蜑企勁繧ｨ繝ｩ繝ｼ: "+e.message);}
    setLoading(false);
  };
  const handleDeleteSchedule=async(s)=>{
    if(!confirm("縲・+(s.title||"縺薙・譌･遞・)+"縲阪ｒ蜑企勁縺励∪縺吶°・・))return;
    setLoading(true);setLoadMsg("蜑企勁荳ｭ...");
    try{
      await api("deleteSchedule",{id:s.id});
      await load("譖ｴ譁ｰ荳ｭ...");
      setPage(null);
    }catch(e){alert("蜑企勁繧ｨ繝ｩ繝ｼ: "+e.message);}
    setLoading(false);
  };
  const [editResult,setEditResult]=useState(null);
  const handleAddNews=async n=>{
    setLoading(true);setLoadMsg("謚慕ｨｿ荳ｭ...");

    catch(e){alert("繧ｨ繝ｩ繝ｼ: "+e.message);}
    setLoading(false);
  };
  const handleDeleteNews=async id=>{
    if(!confirm("蜑企勁縺励∪縺吶°・・))return;

    try{await api("deleteNews",{id});await load("譖ｴ譁ｰ荳ｭ...");}
    catch(e){alert("繧ｨ繝ｩ繝ｼ: "+e.message);}
    setLoading(false);
  };
  const handleUpdateProfile=async({name,memberId})=>{
    const r=await api("updateUserProfile",{userId:user.id,name,memberId});
    saveUser({...user,...r.user});
    await load("譖ｴ譁ｰ荳ｭ...");
  };

  // 笏笏 繝壹・繧ｸ繝ｫ繝ｼ繝・ぅ繝ｳ繧ｰ 笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏
  if(!user) return h(Login,{onLogin:saveUser});

  const resolvedMatchSchedule = page?.type==="matchDetail"
    ? (findScheduleForResult(page.match, schedules) || ((page.schedule && page.schedule.id) ? page.schedule : null))
    : null;
  const resolvedMatchType = page?.type==="matchDetail" ? getResultDisplayType(page.match, schedules) : "";

  if(page?.type==="matchDetail") return h(Fragment,{},
    loading&&h(Loader,{msg:loadMsg}),
    h(GoalPage,{
      match:page.match,schedule:resolvedMatchSchedule,displayType:resolvedMatchType,members,isAdmin,
      onHome:goBack,
      onBack:()=>resolvedMatchSchedule ? setPage({type:"dayDetail",schedule:resolvedMatchSchedule}) : setPage(null),

        await load("譖ｴ譁ｰ荳ｭ...");
        if (resolvedMatchSchedule) setPage({type:"dayDetail",schedule:resolvedMatchSchedule});
        else setPage(null);
      }
    }));

  if(page?.type==="addMatch") return h(Fragment,{},
    loading&&h(Loader,{msg:loadMsg}),
    h(AddMatchModal,{
      schedule:page.schedule,results,
      onSave:handleAddResult,
      onClose:()=>setPage({type:"dayDetail",schedule:page.schedule})
    }));

  if(page?.type==="dayDetail") return h(Fragment,{},
    loading&&h(Loader,{msg:loadMsg}),
    editResult&&h(EditResultModal,{result:editResult,members,onSave:async fr=>{
      setLoading(true);setLoadMsg("譖ｴ譁ｰ荳ｭ...");
      try{await api("updateResult",{result:fr});await load("譖ｴ譁ｰ荳ｭ...");}
      catch(e){alert("譖ｴ譁ｰ繧ｨ繝ｩ繝ｼ: "+e.message);}
      setLoading(false);setEditResult(null);
    },onClose:()=>setEditResult(null)}),
    h(DayPage,{
      schedule:page.schedule,results,schedules,members,isAdmin,user,users,
      onGoToMatch:(r,s)=>setPage({type:"matchDetail",match:r,schedule:(s&&s.id)?s:null}),
      onAdd:s=>setPage({type:"addMatch",schedule:s}),
      onEdit:r=>setEditResult(r),
      onDelete:handleDeleteResult,
      onDeleteSchedule:handleDeleteSchedule,
      onBack:goBack,
      onHome:goBack,
      onSaveMvp:handleSaveMvp,
    }));

  // 笏笏 騾壼ｸｸ繧ｿ繝也判髱｢ 笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏笏

    {k:"match",  i:"笞ｽ",l:"隧ｦ蜷・},
    {k:"dash",   i:"投",l:"謌千ｸｾ"},
    {k:"member", i:"則",l:"驕ｸ謇・},
    {k:"memo",   i:"統",l:"繝｡繝｢"},
    ...(isAdmin?[{k:"settings",i:"笞呻ｸ・,l:"險ｭ螳・}]:[]),
  ];
  const currentTabContent =
    tab==="home" ? h(HomeTab,{results,schedules,news,members,isAdmin,onGoToMatch:goToMatch,onGoToDay:goToDay,onOpenDashTab:openDashTab})
    : tab==="cal" ? h(CalTab,{schedules,results,isAdmin,onGoToDay:goToDay,onAddSchedule:handleAddSchedule})

    : tab==="member" ? h(MemberTab,{members,liftings})
    : tab==="memo" ? h(MemoTab,{news,isAdmin,user,onAdd:handleAddNews,onDelete:handleDeleteNews})
    : tab==="settings" ? h(SettingsTab,{user,members,notificationEnabled,notificationBusy,onToggleNotifications:handleEnableNotifications,onUpdateProfile:handleUpdateProfile})
    : null;

  return h(Fragment,{},
    loading && h(Loader,{msg:loadMsg}),
    h("div",{className:"page"},
      h(AppHeader,{user,onLogout:()=>saveUser(null),onRefresh:()=>load("譖ｴ譁ｰ荳ｭ...")}),
      h("div",{style:{background:"#fff",margin:"0 16px",borderRadius:16,marginTop:-24,boxShadow:"0 4px 20px rgba(0,0,0,0.12)",overflow:"hidden",position:"relative",zIndex:10,marginBottom:16}},
        h("div",{style:{display:"flex"}},
          TABS.map(t=>h("button",{key:t.k,onClick:()=>setTab(t.k),style:{flex:1,padding:"11px 2px 9px",border:"none",background:tab===t.k?"#1D4ED8":"transparent",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:2}},
            h("span",{style:{fontSize:17}},t.i),
            h("span",{style:{fontSize:9,fontWeight:tab===t.k?700:400,color:tab===t.k?"#fff":"#aaa"}},t.l)
          ))
        )
      ),
      h("div",{style:{padding:"12px 16px 0"}}, currentTabContent)
    )
  );
}
render(h(App,{}), document.getElementById("app"));

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js?v=7").catch(() => {});
  });
}
</script>
