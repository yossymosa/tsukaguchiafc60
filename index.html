async function api(action,body={}) {
  const shortActions = new Set([
    "saveReflection","getReflection","saveGoals","saveFormation","saveShotStats","saveAttend","saveEventAttend","saveCarpool","saveCarpoolPlan"
  ]);
  const longActions = new Set([
    "syncFc2PracticeSchedules","syncOfficialHpMatchImport","syncYoutubeLinksToResults","syncYoutubePlaylist"
  ]);
  const timeoutMs = longActions.has(action) ? 120000 : (shortActions.has(action) ? 25000 : 45000);
  const controller = (typeof AbortController !== "undefined") ? new AbortController() : null;
  let timer = null;
  try{
    const fetchPromise = fetch(GAS_URL,{
      method:"POST",
      body:JSON.stringify({action,...body}),
      ...(controller ? {signal:controller.signal} : {})
    });
    const res = await (controller
      ? new Promise((resolve,reject)=>{
          timer = setTimeout(()=>{
            try{ controller.abort(); }catch(e){}
            reject(new Error("timeout"));
          }, timeoutMs);
          fetchPromise.then(resolve,reject);
        })
      : Promise.race([
          fetchPromise,
          new Promise((_,reject)=>setTimeout(()=>reject(new Error("timeout")), timeoutMs))
        ])
    );
    const raw=await res.text();
    let json=null;
    try{
      json=JSON.parse(raw);
    }catch(e){
      throw new Error(`[${action}] APIレスポンス解析失敗: ${String(raw||"").slice(0,180)}`);
    }
    if(!json.ok){
      const msg = json.error || "エラー";
      const act = json.action ? ` (${json.action})` : "";
      throw new Error(`[${action}] ${msg}${act}`);
    }
    return json;
  }catch(e){
    const msg = String(e && e.message || "");
    if(msg==="timeout" || /aborted|timeout/i.test(msg)){
      throw new Error(`[${action}] 通信がタイムアウトしました。もう一度お試しください`);
    }
    throw e;
  }finally{
    if(timer) clearTimeout(timer);
  }
}

function createEmptyShotByHalf(){
  return {"1st":{}, "2nd":{}, "3rd":{}};
}
function createEmptyTheirShotsByHalf(){
  return {"1st":0, "2nd":0, "3rd":0};
}
function normalizeShotMemberMap(src){
  const out = {};
  if (!src) return out;
  if (Array.isArray(src)) {
    src.forEach(item => {
      if (!item) return;
      const key = String(item.memberId || item.id || "").trim();
      const cnt = Math.max(0, Number(item.count || item.shots || 0) || 0);
      if (key) out[key] = cnt;
    });
    return out;
  }
  if (typeof src !== "object") return out;
  Object.entries(src).forEach(([k,v]) => {
    const key = String(k || "").trim();
    if (!key) return;
    out[key] = Math.max(0, Number(v || 0) || 0);
  });
  return out;
}
function sumShotMemberMap(map){
  return Object.values(map || {}).reduce((sum, n) => sum + Math.max(0, Number(n || 0) || 0), 0);
}
function mergeShotTotalsByHalf(byHalf){
  const out = {};
  ALL_HALF_OPTIONS.forEach(hf => {
    const m = byHalf && byHalf[hf] ? byHalf[hf] : {};
    Object.entries(m).forEach(([memberId, cnt]) => {
      const id = String(memberId || "").trim();
      if (!id) return;
      out[id] = (out[id] || 0) + Math.max(0, Number(cnt || 0) || 0);
    });
  });
  return out;
}
function parseShotStatsDetail(value, fallbackTheirShots=0){
  let src = value;
  if (typeof src === "string") {
    const s = String(src || "").trim();
    if (!s) src = {};
    else {
      try { src = JSON.parse(s); } catch(e) { src = {}; }
    }
  }
  if (!src || typeof src !== "object") src = {};
  const byHalf = createEmptyShotByHalf();
  const theirByHalf = createEmptyTheirShotsByHalf();

  if (Array.isArray(src)) {
    byHalf["1st"] = normalizeShotMemberMap(src);
  } else {
    const rawByHalf = src.byHalf || src.shotsByHalf || null;
    if (rawByHalf && typeof rawByHalf === "object") {
      ALL_HALF_OPTIONS.forEach(hf => {
        byHalf[hf] = normalizeShotMemberMap(rawByHalf[hf]);
      });
    } else if (src.totals && typeof src.totals === "object") {
      byHalf["1st"] = normalizeShotMemberMap(src.totals);
    } else if (ALL_HALF_OPTIONS.some(hf => Object.prototype.hasOwnProperty.call(src, hf))) {
      ALL_HALF_OPTIONS.forEach(hf => {
        byHalf[hf] = normalizeShotMemberMap(src[hf]);
      });
    } else {
      byHalf["1st"] = normalizeShotMemberMap(src);
    }

    const rawTheirByHalf = src.theirByHalf || src.theirShotsByHalf || null;
    if (rawTheirByHalf && typeof rawTheirByHalf === "object") {
      ALL_HALF_OPTIONS.forEach(hf => {
        theirByHalf[hf] = Math.max(0, Number(rawTheirByHalf[hf] || 0) || 0);
      });
    }
  }

  const fallbackTotal = Math.max(0, Number(fallbackTheirShots || 0) || 0);
  const currentTheirTotal = ALL_HALF_OPTIONS.reduce((sum, hf) => sum + Math.max(0, Number(theirByHalf[hf] || 0) || 0), 0);
  if (fallbackTotal > 0 && currentTheirTotal === 0) {
    theirByHalf["1st"] = fallbackTotal;
  }

  return {byHalf, theirByHalf};
}
function buildShotStatsPayload(byHalf, theirByHalf){
  const normalizedByHalf = createEmptyShotByHalf();
  ALL_HALF_OPTIONS.forEach(hf => {
    normalizedByHalf[hf] = normalizeShotMemberMap((byHalf || {})[hf]);
  });
  const normalizedTheirByHalf = createEmptyTheirShotsByHalf();
  ALL_HALF_OPTIONS.forEach(hf => {
    normalizedTheirByHalf[hf] = Math.max(0, Number((theirByHalf || {})[hf] || 0) || 0);
  });
  return {
    version: 2,
    totals: mergeShotTotalsByHalf(normalizedByHalf),
    byHalf: normalizedByHalf,
    theirByHalf: normalizedTheirByHalf,
  };
}
function parseShotStatsMap(value){

}
function isTrueFlag(value){
  if (value === true || value === 1) return true;

  return s === "1" || s === "true" || s === "yes" || s === "on" || s === "y" || s === "ok";
}

}

function normalizeUiTabVisibility(value){
  const toBool = (v, fallback=true) => {
    if (v === undefined || v === null || v === "") return fallback;
    if (typeof v === "boolean") return v;
    const s = String(v).trim().toLowerCase();
    if (["1","true","yes","on","y","ok"].includes(s)) return true;
    if (["0","false","no","off","n"].includes(s)) return false;
    return fallback;
  };
  const src = (value && typeof value === "object" && !Array.isArray(value)) ? value : {};
  return {
    member: toBool(src.member, true),
    memo: toBool(src.memo, true),
  };
}

function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map(ch => ch.charCodeAt(0)));
}

async function subscribeWebPush(user) {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
    throw new Error("この端末ではWeb Pushに対応していません");
  }
  const swUrl = "/sw.js?v=14";
  const reg =
    (await navigator.serviceWorker.getRegistration()) ||
    (await navigator.serviceWorker.register(swUrl));
  await Promise.race([
    navigator.serviceWorker.ready,
    new Promise((_, reject) =>
      setTimeout(() => reject(new Error("通知の初期化がタイムアウトしました")), 8000)
    ),
  ]);
  const keyRes = await fetch("/api/push-public-key");
  if (!keyRes.ok) throw new Error("公開鍵の取得に失敗しました");
  const { publicKey } = await keyRes.json();
  if (!publicKey) throw new Error("通知公開鍵が設定されていません");
  let sub = await reg.pushManager.getSubscription();
  if (!sub) {
    sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(publicKey),
    });
  }
  await api("savePushSubscription", {
    userId: user.id,
    userName: user.name,
    subscription: sub.toJSON(),
  });
  return sub;
}

async function getCurrentPushSubscription() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) return null;
  const reg = await navigator.serviceWorker.getRegistration();
  if (!reg || !reg.pushManager) return null;
  return await reg.pushManager.getSubscription();
}

async function unsubscribeWebPush() {
  const sub = await getCurrentPushSubscription();
  if (!sub) return false;
  const endpoint = sub.endpoint;
  await sub.unsubscribe().catch(() => false);
  if (endpoint) {
    await api("deletePushSubscription", { endpoint }).catch(() => {});
  }
  return true;
}

function nd(v) {
  if(!v) return "";
  const s=String(v);
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const d=new Date(s);
  if(!isNaN(d.getTime())) return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  return s;
}
function findLinkedScheduleForResult(result, schedules=[]) {
  if (!result || !Array.isArray(schedules) || schedules.length === 0) return null;
  const sid = String(result.scheduleId || "").trim();
  if (sid) {
    const byId = schedules.find(s => String(s.id || "") === sid);
    if (byId) return byId;
  }
  const d = nd(result.date);
  if (!d) return null;
  const sameDate = schedules.filter(s => nd(s.date) === d);
  if (sameDate.length === 0) return null;
  let candidates = sameDate;
  const t = normalizeType(result.type || "");
  if (t) {
    const typed = sameDate.filter(s => normalizeType(s.type || "") === t);
    if (typed.length) candidates = typed;
  }
  const opponent = String(result.opponent || "").trim();
  if (opponent) {
    const titled = candidates.filter(s => String(s.title || "").includes(opponent));
    if (titled.length === 1) return titled[0];
    if (titled.length > 1) candidates = titled;
  }
  const withTitle = candidates.filter(s => String(s.title || "").trim());
  if (withTitle.length) return withTitle[0];
  return candidates[0] || sameDate[0];
}

  const d=new Date();

}
function fmt(v) {
  const s=nd(v);
  if(!s||s.length<10) return {y:"",m:"",d:"",dw:"",short:"",full:""};
  const dt=new Date(s+"T00:00:00");
  const dw=["日","月","火","水","木","金","土"][dt.getDay()];
  return {y:s.slice(0,4),m:s.slice(5,7),d:s.slice(8,10),dw,short:s.slice(5,7)+"/"+s.slice(8,10),full:s.slice(0,4)+"年"+s.slice(5,7)+"月"+s.slice(8,10)+"日("+dw+")"};
}
function isValidDateKey(v){
  return /^\d{4}-\d{2}-\d{2}$/.test(String(v||""));
}
function getCurrentThirdGeneration() {
  const now = new Date();
  const fiscalYear = now.getMonth() + 1 >= 4 ? now.getFullYear() : now.getFullYear() - 1;
  return fiscalYear - 1965;
}
function toHalfWidthDigits(v){
  return String(v || "").replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
}
function getGradeNumber(grade){
  const s = toHalfWidthDigits(String(grade || "")).trim();
  const m = s.match(/(\d+)\s*年/);
  if (!m) return null;
  const n = Number(m[1]);
  return Number.isFinite(n) ? n : null;
}
function getGenerationByGrade(grade){
  const n = getGradeNumber(grade);
  if (!n || n < 1 || n > 6) return "";
  return String(getCurrentThirdGeneration() + 3 - n);
}
function formatGenerationGrade(grade, generation){
  const gradeText = toHalfWidthDigits(String(grade || "").trim());
  const genDigits = String(generation || "").replace(/[^\d]/g, "");
  const resolvedGen = genDigits || getGenerationByGrade(gradeText);
  if (resolvedGen && gradeText) return `${resolvedGen}期（${gradeText}）`;
  if (resolvedGen) return `${resolvedGen}期`;
  return gradeText;
}
function formatMemberGenerationGrade(member){
  if (!member) return "";
  const grade = resolveGrade(member) || member.grade || "";
  return formatGenerationGrade(grade, member.generation);
}
function resolveGrade(member) {
  const gen = Number(String(member?.generation || "").replace(/[^\d]/g,""));
  if (!gen) return member?.grade || "";
  const gradeNum = getCurrentThirdGeneration() - gen + 3;
  if (gradeNum >= 1 && gradeNum <= 6) return gradeNum + "年";
  if (gradeNum === 0) return "年長";
  if (gradeNum === -1) return "年中";
  if (gradeNum > 6) return "卒業";
  return member?.grade || "";
}
function normalizeMember(member) {
  const grade = resolveGrade(member);
  return {...member, grade, gradeDisplay: formatGenerationGrade(grade, member?.generation)};
}
function hasPkDecisionData(r){
  try{
    const k = JSON.parse(r?.pkKickers || "[]");
    if(Array.isArray(k) && k.length>0) return true;
  }catch(e){}
  const o=Number(r?.pkOur), t=Number(r?.pkTheir);
  return !isNaN(o) && !isNaN(t) && r?.pkOur!=="" && r?.pkTheir!=="" && (o+t)>0;
}
function normalizeMatchStatus(v){
  const s = String(v||"").trim().toLowerCase();
  if(["finished","done","ended","試合終了","終了","済"].includes(s)) return "finished";
  if(["pre","before","scheduled","試合前","未実施","in_progress","live","playing","試合中","進行中"].includes(s)) return "pre";
  return "";
}
function hasMatchResultEvidence(r){
  const our = Number(r?.ourScore||0);
  const their = Number(r?.theirScore||0);
  if(!isNaN(our) && !isNaN(their) && (our+their)>0) return true;
  if(hasPkDecisionData(r)) return true;
  if(Array.isArray(r?.goals) && r.goals.length>0) return true;
  if(Array.isArray(r?.theirGoals) && r.theirGoals.length>0) return true;
  return false;
}
function hasAdditionalResultInputs(r){
  if(String(r?.memo||"").trim()) return true;
  const subs = r?.substitutions;
  if(Array.isArray(subs) && subs.length>0) return true;
  if(typeof subs==="string"){
    const s=subs.trim();
    if(s && s!=="[]" && s!=="{}") return true;
  }
  const slots = r?.formationSlots;
  if(Array.isArray(slots) && slots.some(v=>String(v||"").trim())) return true;
  if(typeof slots==="string"){
    const s=slots.trim();
    if(s && s!=="[]" && s!=="{}") return true;
  }
  if(String(r?.formation||"").trim()) return true;
  const statKeys=["ourShots","theirShots","ourCorners","theirCorners","ourFreeKicks","theirFreeKicks","ourPkCount","theirPkCount","ourOffsides","theirOffsides"];
  if(statKeys.some(k=>Number(r?.[k]||0)>0)) return true;
  const ss = r?.shotStats;
  if(ss && typeof ss==="object" && !Array.isArray(ss) && Object.keys(ss).length>0) return true;
  if(typeof ss==="string"){
    const s = ss.trim();
    if(s && s!=="{}" && s!=="[]") return true;
  }
  return false;
}
function isMatchFinished(r){
  const status = normalizeMatchStatus(r?.matchStatus);
  if(status==="finished") return true;
  if(status==="pre") return hasMatchResultEvidence(r);
  // 旧データ互換: 明示ステータスがなくても結果データがあるものは実施済み扱い
  if(hasMatchResultEvidence(r)) return true;
  // 旧データ互換: ステータス空欄でも過去日付は試合終了扱い
  const d = nd(r?.date);
  if(d && d < todayLocal()) return true;
  return false;
}
function shouldCountMatchForStats(r){
  if(!isMatchFinished(r)) return false;
  const status = normalizeMatchStatus(r?.matchStatus);
  if(status==="finished") return true;
  if(hasMatchResultEvidence(r)) return true;
  // 旧データ互換: ステータス空欄でも過去日付なら 0-0 含め集計対象
  const d = nd(r?.date);
  if(d && d < todayLocal()) return true;
  return false;
}
function calcStats(rs) {
  const finished = (rs||[]).filter(shouldCountMatchForStats);
  if(!finished.length) return {games:0,wins:0,draws:0,losses:0,gf:0,ga:0,pct:"-"};
  const isWin = r => {
    const our=Number(r.ourScore), their=Number(r.theirScore);
    if(our>their) return true;
    if(our<their) return false;
    if(hasPkDecisionData(r)) return Number(r.pkOur)>Number(r.pkTheir);
    return false;
  };
  const isDraw = r => {
    const our=Number(r.ourScore), their=Number(r.theirScore);
    if(our!==their) return false;
    if(hasPkDecisionData(r)) return false;
    return true;
  };
  const w=finished.filter(isWin).length;
  const dr=finished.filter(isDraw).length;
  const gf=finished.reduce((a,r)=>a+Number(r.ourScore||0),0);
  const ga=finished.reduce((a,r)=>a+Number(r.theirScore||0),0);
  return {games:finished.length,wins:w,draws:dr,losses:finished.length-w-dr,gf,ga,pct:Math.round(w/finished.length*100)+"%"};
}

async function showLocalNotification(title, options={}) {
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  if ("serviceWorker" in navigator) {
    const reg = await navigator.serviceWorker.getRegistration();
    if (reg && reg.showNotification) {
      await reg.showNotification(title, options);
      return;
    }
  }
  new Notification(title, options);
}

async function maybeNotifyDeadlines(pendingNotices=[]) {
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  const list = (pendingNotices || []).filter(n => {
    const tt = String(n?.targetType || "").toLowerCase();
    return tt === "pending_attend" || tt === "pending_carpool";
  });
  const today = todayLocal();
  for (const n of list) {
    const d = nd(n.deadline || n.targetDeadline || "");
    if (!d) continue;
    const days = Math.round((new Date(d + "T00:00:00") - new Date(today + "T00:00:00")) / (1000 * 60 * 60 * 24));
    if (days !== 1) continue;
    const sid = String(n.targetId || n.scheduleId || "");
    const key = `afc_deadline_notice_${sid}_${String(n.targetType || "")}_${d}`;
    if (localStorage.getItem(key)) continue;
    const kind = String(n.targetType || "").toLowerCase() === "pending_carpool" ? "配車" : "出欠";
    const title = String(n.targetType || "").toLowerCase() === "pending_carpool" ? "配車締切が近づいています" : "出欠締切が近づいています";
    await showLocalNotification(title, {
      body: `${n.scheduleTitle || n.title || "予定"} の${kind}締切は明日です（${d}）`,
      icon: "/icon-512.png",
      badge: "/icon-192.png",
    });
    localStorage.setItem(key, "1");
  }
}

async function maybeNotifyUpcomingEvents(schedules) {
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  const today = new Date();
  const base = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  for (const s of schedules) {
    if (!s.date) continue;
    const eventDate = new Date(s.date + "T00:00:00");
    const days = Math.round((eventDate.getTime() - base.getTime()) / (1000 * 60 * 60 * 24));
    if (days !== 1) continue;
    const key = `afc_event_notice_${s.id}_${s.date}`;
    if (localStorage.getItem(key)) continue;
    await showLocalNotification("明日の予定があります", {
      body: `${s.date} ${s.title || "予定"}${s.location ? " / " + s.location : ""}`,
      icon: "/icon-512.png",
      badge: "/icon-192.png",
    });
    localStorage.setItem(key, "1");
  }
}

async function enableNotifications() {
  if (!("Notification" in window)) {
    alert("この端末では通知に対応していません");
    return "unsupported";
  }
  try {
    return await Notification.requestPermission();
  } catch (e) {
    return "denied";
  }
}

// ── YouTube テンプレ生成 ─────────────────────────────────────
function makeYtTitle(match, schedule, half) {
  const dt = fmt(match.date || schedule?.date);
  const dateStr = dt.y + "/" + Number(dt.m) + "/" + Number(dt.d);
  const opponent = match.opponent || "";
  const tc = getTC(match.type);
  const gameNo = match.gameNumber ? "第" + match.gameNumber + "試合" : "";
  const loc = schedule?.location ? "@" + schedule.location : "";
  return [dateStr, "VS", opponent, tc.lb, gameNo, half, loc].filter(Boolean).join(" ");
}

// 秒→ m:ss 形式
function secToTime(min, sec) {
  const m = Number(min)||0;
  const s = Number(sec)||0;
  return m + ":" + String(s).padStart(2,"0");
}

// チャプター形式の説明欄生成（通し / 1st / 2nd / 3rd）
function makeYtDesc(match, members, half) {
  const normalizeHalf = h =>
    /^(1st|前半|first|1)$/i.test(String(h || "").trim()) ? "1st"
    : /^(2nd|後半|second|2)$/i.test(String(h || "").trim()) ? "2nd"
    : /^(3rd|third|3|3本目|三本目)$/i.test(String(h || "").trim()) ? "3rd"
    : "";
  const halfOrder = h => {
    const v = normalizeHalf(h);
    return v==="1st" ? 0 : v==="2nd" ? 1 : v==="3rd" ? 2 : 99;
  };
  const halfKey = normalizeHalf(half); // 通しの場合は ""

  // 全体スコア
  const allOur   = (match.goals||[]).filter(g=>g.team!=="them").length;
  const allTheir = (match.theirGoals||[]).length + (match.goals||[]).filter(g=>g.team==="them").length;

  // ハーフ別スコア
  const h1Our   = (match.goals||[]).filter(g=>g.team!=="them" && String(g.half).toLowerCase()==="1st").length;
  const h1Their = (match.theirGoals||[]).filter(g=>String(g.half).toLowerCase()==="1st").length
                + (match.goals||[]).filter(g=>g.team==="them" && String(g.half).toLowerCase()==="1st").length;
  const h2Our   = (match.goals||[]).filter(g=>g.team!=="them" && String(g.half).toLowerCase()==="2nd").length;
  const h2Their = (match.theirGoals||[]).filter(g=>String(g.half).toLowerCase()==="2nd").length
                + (match.goals||[]).filter(g=>g.team==="them" && String(g.half).toLowerCase()==="2nd").length;
  const h3Our   = (match.goals||[]).filter(g=>g.team!=="them" && String(g.half).toLowerCase()==="3rd").length;
  const h3Their = (match.theirGoals||[]).filter(g=>String(g.half).toLowerCase()==="3rd").length
                + (match.goals||[]).filter(g=>g.team==="them" && String(g.half).toLowerCase()==="3rd").length;
  const has3rd = (h3Our + h3Their) > 0;

  const scoreLine = "塚口AFC " + allOur + " - " + allTheir + " " + match.opponent
    + "\n1st " + h1Our + "-" + h1Their + "  2nd " + h2Our + "-" + h2Their
    + (has3rd ? "  3rd " + h3Our + "-" + h3Their : "");

  // チャプター: 指定ハーフのみ（通しは全ハーフ）
  const myG = (match.goals||[])
    .filter(g => g.team!=="them" && (!halfKey || String(g.half).toLowerCase()===halfKey.toLowerCase()))
    .sort((a,b)=>halfOrder(a.half)-halfOrder(b.half)||Number(a.minute)-Number(b.minute)||Number(a.second)-Number(b.second));
  const thG = [
    ...(match.theirGoals||[]).filter(g => !halfKey || String(g.half).toLowerCase()===halfKey.toLowerCase()),
    ...(match.goals||[]).filter(g => g.team==="them" && (!halfKey || String(g.half).toLowerCase()===halfKey.toLowerCase())),
  ].sort((a,b)=>halfOrder(a.half)-halfOrder(b.half)||Number(a.minute)-Number(b.minute)||Number(a.second)-Number(b.second));

  const lines = ["0:00 スタート"];
  const events = [
    ...myG.map(g => {
      const sc = members.find(m=>m.id===g.scorerId);
      const scorerName = sc?.name || g.scorerName || "不明";
      const as = members.find(m=>m.id===g.assistId);
      const assistName = as?.name || g.assistName || "";
      const type = g.goalType && g.goalType!=="通常" ? "("+g.goalType+")" : "";
      const assistStr = assistName ? " アシスト "+assistName : "";
      return { min:Number(g.minute)||0, sec:Number(g.second)||0,
               text: secToTime(g.minute,g.second)+" [得点]"+scorerName+type+assistStr };
    }),
    ...thG.map(g => {
      const type = g.goalType && g.goalType!=="通常" ? "("+g.goalType+")" : "";
      return { min:Number(g.minute)||0, sec:Number(g.second)||0,
               text: secToTime(g.minute,g.second)+" 失点"+type };
    }),
  ].sort((a,b)=>a.min-b.min||a.sec-b.sec);
  events.forEach(e => lines.push(e.text));

  return scoreLine + "\n\n" + lines.join("\n");
}


// ── HP用テンプレ生成 ─────────────────────────────────────────
function makeHpTemplate(schedule, results) {
  const dt = fmt(schedule.date);
  const dateStr = dt.m+"月"+Number(dt.d)+"日";
  const title = schedule.title || "";
  const loc = schedule.location || "";
  const nums = ["①","②","③","④","⑤","⑥","⑦","⑧","⑨","⑩"];

  const sorted = [...results].sort((a,b)=>Number(a.gameNumber||1)-Number(b.gameNumber||1));

  // ヘッダー: 日付 タイトル / 場所
  let text = dateStr+(title?"「"+title+"」":"");
  text += "\n"+loc;
  text += "\n";

  sorted.forEach((r,i)=>{
    const num = nums[i]||"・";
    const our = r.ourScore||0;
    const their = r.theirScore||0;
    // 試合ごとの得点者
    const scorers = (r.goals||[])
      .filter(g=>g.team!=="them"&&g.goalType!=="オウンゴール"&&g.scorerName&&g.scorerName!=="失点")
      .map(g=>g.scorerName);
    const scorerStr = scorers.length>0 ? "\n　得点："+scorers.join("、") : "";
    text += num+"塚口AFCjr "+our+"—"+their+" "+r.opponent+"さん"+scorerStr+"\n";
  });

  return text.trimEnd();
}

function copyToClipboard(text) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).catch(()=>{});
  } else {
    const el = document.createElement("textarea");
    el.value = text; document.body.appendChild(el);
    el.select(); document.execCommand("copy");
    document.body.removeChild(el);
  }
}

      if (!Array.isArray(arr)) return [];
      return arr.map(item => ({

      try {
        root.scrollTop = 0;
        if (typeof root.scrollTo === "function") root.scrollTo(0, 0);
      } catch (e) {}
    };
    forceTopOnce();
    const rafA = requestAnimationFrame(forceTopOnce);
    const rafB = requestAnimationFrame(() => requestAnimationFrame(forceTopOnce));
    return () => {
      try { cancelAnimationFrame(rafA); } catch (e) {}
      try { cancelAnimationFrame(rafB); } catch (e) {}
    };
  }, [match?.id, schedule?.id]);
  // PK戦
  const parseJson = v => { try{ return typeof v==="string"&&v?JSON.parse(v):v||[]; }catch(e){ return []; }};

function HomeTab({results,schedules,news,pendingNotices=[],members,isAdmin,onGoToMatch,onGoToDay,onOpenDashTab,onOpenTab}) {
  const [todayKey,setTodayKey]=useState(()=>todayLocal());

    const d = new Date(String(v || ""));
    return isNaN(d.getTime()) ? 0 : d.getTime();
  };
  const fmtNewsDateTime = v => {
    const d = new Date(String(v || ""));
    if (isNaN(d.getTime())) return fmt(v).short || "";
    return `${String(d.getMonth() + 1).padStart(2, "0")}/${String(d.getDate()).padStart(2, "0")} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  };
  const isFreshNews = v => {
    const d = new Date(String(v || ""));
    if (isNaN(d.getTime())) return false;
    const postedDate = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    const todayDate = new Date(todayKey + "T00:00:00").getTime();
    const diffDays = Math.floor((todayDate - postedDate) / (1000 * 60 * 60 * 24));
    return diffDays >= 0 && diffDays < 2; // 更新後2日だけ NEW
  };
  const extractDateFromText = text => {
    const m = String(text || "").match(/(20\d{2})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})/);
    if (!m) return "";
    return `${m[1]}-${String(m[2]).padStart(2, "0")}-${String(m[3]).padStart(2, "0")}`;
  };
  const findScheduleFromNotice = n => {
    const targetId = String(n.targetId || "").trim();
    if (targetId) {
      const byId = schedules.find(s => String(s.id || "").trim() === targetId);
      if (byId) return byId;
    }
    const src = `${String(n.title || "")} ${String(n.content || "")}`.trim();
    const dateKey = extractDateFromText(src);
    const byDate = dateKey ? schedules.filter(s => nd(s.date) === dateKey) : [];
    if (byDate.length === 1) return byDate[0];
    if (byDate.length > 1) {
      const hint = String(n.content || n.title || "").replace("新しい予定が追加されました", "").trim();
      const hit = byDate.find(s => {
        const t = String(s.title || "").trim();
        return hint && (hint.includes(t) || t.includes(hint));
      });
      return hit || byDate[0];
    }
    return null;
  };
  const openNotice = n => {
    const tt = String(n.targetType || "").toLowerCase();

    const targetUrl = String(n.targetUrl || "").trim();
    if (tt === "pending_attend" || tt === "pending_carpool") {
      const s = findScheduleFromNotice(n);
      const nextDayTab = tt === "pending_carpool" ? "carpool" : "attend";
      if (s && onGoToDay) {
        onGoToDay(s, nextDayTab);
        return;
      }
      if (onOpenTab) {
        onOpenTab("cal");
        return;
      }
    }
    const isScheduleNotice =
      tt === "schedule" || tt === "deadline" || tt.startsWith("pending_") ||
      title.includes("予定") || title.includes("締切") || content.includes("締切");
    if (isScheduleNotice) {
      const s = findScheduleFromNotice(n);
      if (s && onGoToDay) {
        onGoToDay(s);

      }
      if (onOpenTab) {
        onOpenTab("cal");
        return;
      }

      const extractedUrl = (content.match(/https?:\/\/[^\s]+/i) || [])[0] || "";
      const youtubeUrl = targetUrl || extractedUrl || (HOME_LINKS.find(l => /youtube/i.test(String(l.label || ""))) || {}).url;
      if (youtubeUrl) {
        window.open(youtubeUrl, "_blank", "noopener,noreferrer");
        return;
      }
    }
    if (targetUrl) {
      if (/^https?:\/\//i.test(targetUrl)) {

        return;
      }
      const sidMatch = targetUrl.match(/[?&]scheduleId=([^&]+)/i);
      const tabMatch = targetUrl.match(/[?&]dayTab=([^&]+)/i);
      const sid = sidMatch ? decodeURIComponent(sidMatch[1]) : "";
      const dayTab = tabMatch ? decodeURIComponent(tabMatch[1]) : "";
      if ((sid || dayTab) && onGoToDay) {
        const s = sid
          ? schedules.find(x => String(x.id || "").trim() === String(sid).trim())
          : null;
        if (s) {
          onGoToDay(s, dayTab || "detail");
          return;
        }
      }
      if (targetUrl.includes("tab=cal") && onOpenTab) { onOpenTab("cal"); return; }
      if (targetUrl.includes("tab=match") && onOpenTab) { onOpenTab("match"); return; }
      if (targetUrl.includes("tab=dash") && onOpenTab) { onOpenTab("dash"); return; }

// ── 詳細セクション ────────────────────────────────────────────
function DetailSection({schedule, members, users=[], schedules=[], isAdmin, onSave}) {
  const DEFAULT_CLOTHES = "練習シャツ、白パン、青ソックス、トレシュー、長袖インナー\n・防寒具\n・ジャージなどの上着";
  const DEFAULT_BELONGINGS = "ユニフォーム（白・青）、レガース、キャップ、タオル、スパイク\n・氷柱1本（ペットボトル、ジップロックなど）\n・コロコロ氷（水筒orジップロック）\n・水筒\n・着替え\n・軽食（ゼリー系）\n・昼食\n・お湯（当番・荷物担当）\n・着替え（必須）";
  const BASE_COACH_OPTIONS = ["丸尾コーチ", "健太郎コーチ", "博多コーチ"];
  const CUSTOM_COACH_STORAGE_KEY = "afc_custom_coach_options_v1";
  const parseCoachList = value => String(value || "")
    .split(/[、,\n\/]/)
    .map(v => String(v || "").trim())
    .filter(Boolean);
  const normalizeCoachLabel = raw => {
    const base = String(raw || "").trim().replace(/\s+/g, "");
    if (!base) return "";
    if (/コーチ|先生/.test(base)) return base;
    return base + "コーチ";
  };
  const loadCustomCoachOptions = () => {
    try {
      if (typeof window === "undefined" || !window.localStorage) return [];
      const raw = window.localStorage.getItem(CUSTOM_COACH_STORAGE_KEY);
      if (!raw) return [];
      const parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) return [];
      return parsed.map(normalizeCoachLabel).filter(Boolean);
    } catch (e) {
      return [];
    }
  };
  const isEventSchedule = normalizeType(schedule.type) === "event";
  const isPracticeSchedule = normalizeType(schedule.type) === "practice";
  const [editing, setEditing] = useState(false);
  const buildDetailForm = sch => ({
    gatherTime: sch.gatherTime || "",
    upTime: sch.upTime || "",
    matchTime: sch.matchTime || "",
    clothes: sch.clothes || DEFAULT_CLOTHES,
    belongings: sch.belongings || DEFAULT_BELONGINGS,
    duty: sch.duty || "",
    dutyNote: sch.dutyNote || "",
    luggagePerson: sch.luggagePerson || "",
    firstAidPerson: sch.firstAidPerson || sch.luggagePerson || "",
    coach: parseCoachList(sch.coach || "丸尾コーチ").join("、"),
    memo: sch.memo || "",
    note: sch.note || "",
    pdfUrl: sch.pdfUrl || "",
    pdfName: sch.pdfName || "",
  });
  const [form, setForm] = useState(() => buildDetailForm(schedule));
  const [saving, setSaving] = useState(false);
  const [pdfUploading, setPdfUploading] = useState(false);
  const [attend, setAttend] = useState({});
  const [eventAttend, setEventAttend] = useState([]);
  const [attendLoading, setAttendLoading] = useState(true);
  const [showClothes, setShowClothes] = useState(false);
  const [showBelongings, setShowBelongings] = useState(false);
  const [coachOptions, setCoachOptions] = useState(() => {
    const preset = parseCoachList(schedule.coach || "");
    return [...new Set([...BASE_COACH_OPTIONS, ...loadCustomCoachOptions(), ...preset])];
  });
  const [customCoachInput, setCustomCoachInput] = useState("");

  useEffect(() => {
    setForm(buildDetailForm(schedule));
    const preset = parseCoachList(schedule.coach || "");
    setCoachOptions([...new Set([...BASE_COACH_OPTIONS, ...loadCustomCoachOptions(), ...preset])]);
    setCustomCoachInput("");
    setEditing(false);
  }, [schedule?.id]);

  useEffect(() => {
    let cancelled = false;
    api(isEventSchedule ? "getEventAttend" : "getAttend", { scheduleId: schedule.id })
      .then(r => {
        if (cancelled) return;
        if (isEventSchedule) {
          setEventAttend(r.attend || []);
        } else {
          const map = {};
          (r.attend || []).forEach(a => {
            map[a.memberId] = a.status;
          });
          setAttend(map);
        }
        setAttendLoading(false);
      })
      .catch(() => setAttendLoading(false));
    return () => {
      cancelled = true;
    };
  }, [schedule.id, isEventSchedule]);

  const participants = members
    .filter(m => attend[m.id] === "○")
    .sort((a, b) => Number(a.number) - Number(b.number));

  const gradeGroups = {};
  participants.forEach(m => {
    const g = formatMemberGenerationGrade(m) || m.grade || "その他";
    if (!gradeGroups[g]) gradeGroups[g] = [];
    gradeGroups[g].push(m);
  });
  const eventTotals = eventAttend.reduce((acc, row) => ({
    adult: acc.adult + Number(row.adultCount || 0),
    child: acc.child + Number(row.childCount || 0),
    preschool: acc.preschool + Number(row.preschoolCount || 0),
  }), {adult:0, child:0, preschool:0});

  const toSurname = name => {
    if (!name) return name;
    if (String(name).endsWith("さん")) return name;
    const parts = String(name).split(/[ 　]/).filter(Boolean);
    return (parts[0] || String(name)) + "さん";
  };
  const cleanTime = v => {
    const raw = String(v || "").trim();
    if (!raw) return "";
    const s = toHalfWidthDigits(raw).replace(/：/g, ":");
    if (/1899[\/\-]12[\/\-]30/.test(s) || /1899年12月30日/.test(s)) return "";
    if (/^\d{4}[\/\-]\d{1,2}[\/\-]\d{1,2}$/.test(s)) return "";
    const hmOnly = s.match(/^(\d{1,2}):(\d{2})(?::\d{2})?$/);
    if (hmOnly) return `${String(Number(hmOnly[1])).padStart(2, "0")}:${hmOnly[2]}`;
    const isoTime = s.match(/T(\d{1,2}):(\d{2})(?::\d{2})?/);
    if (isoTime) return `${String(Number(isoTime[1])).padStart(2, "0")}:${isoTime[2]}`;
    const plainTime = s.match(/\b(\d{1,2}):(\d{2})(?::\d{2})?\b/);
    if (plainTime) return `${String(Number(plainTime[1])).padStart(2, "0")}:${plainTime[2]}`;
    const d = new Date(s);
    if (!Number.isNaN(d.getTime())) {
      if (d.getFullYear() === 1899 && d.getMonth() === 11 && d.getDate() === 30) return "";
      return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
    }
    return "";
  };
  const normalizePerson = name => String(toSurname(name || "")).replace(/\s+/g, "").trim();
  const dutyCountMap = {};
  const luggageCountMap = {};
  (schedules || []).forEach(s => {
    if (String(s.id || "") === String(schedule.id || "")) return;
    const dutyName = normalizePerson(s.duty || "");
    if (dutyName) dutyCountMap[dutyName] = (dutyCountMap[dutyName] || 0) + 1;
    const luggageName = normalizePerson(s.luggagePerson || "");
    if (luggageName) luggageCountMap[luggageName] = (luggageCountMap[luggageName] || 0) + 1;
  });
  const userNameOptions = [...new Set(
    (users || [])
      .map(u => toSurname(u.name || ""))
      .filter(Boolean)
  )].sort((a, b) => String(a).localeCompare(String(b), "ja"));
  const mapUrl = schedule.location
    ? "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(schedule.location)
    : "";
  const selectedCoachList = parseCoachList(form.coach);
  const persistCustomCoachOptions = (allOptions) => {
    try {
      if (typeof window === "undefined" || !window.localStorage) return;
      const customOnly = [...new Set((allOptions || []).map(normalizeCoachLabel).filter(Boolean))]
        .filter(name => !BASE_COACH_OPTIONS.includes(name));
      window.localStorage.setItem(CUSTOM_COACH_STORAGE_KEY, JSON.stringify(customOnly));
    } catch (e) {}
  };
  const toggleCoachOption = (name) => {
    const coachName = normalizeCoachLabel(name);
    setForm(prev => {
      const current = parseCoachList(prev.coach);
      const has = current.includes(coachName);
      const next = has ? current.filter(v => v !== coachName) : [...current, coachName];
      return { ...prev, coach: next.join("、") };
    });
  };
  const addCustomCoachOption = () => {
    const label = normalizeCoachLabel(customCoachInput);
    if (!label) return;
    setCoachOptions(prev => {
      const next = [...new Set([...(prev || []), label])];
      persistCustomCoachOptions(next);
      return next;
    });
    setForm(prev => {
      const current = parseCoachList(prev.coach);
      if (current.includes(label)) return prev;
      return { ...prev, coach: [...current, label].join("、") };
    });
    setCustomCoachInput("");
  };
  const parsePdfItems = (urlRaw, nameRaw) => {
    const normalize = value => String(value || "").trim();
    const urlsText = normalize(urlRaw);
    const namesText = normalize(nameRaw);
    if (!urlsText) return [];
    try {
      const parsedUrls = JSON.parse(urlsText);
      if (Array.isArray(parsedUrls)) {
        if (parsedUrls.length && typeof parsedUrls[0] === "object") {
          return parsedUrls
            .map(item => ({ url: normalize(item.url), name: normalize(item.name) }))
            .filter(item => item.url);
        }
        let parsedNames = [];
        try { parsedNames = JSON.parse(namesText || "[]"); } catch (e) {}
        return parsedUrls
          .map((url, idx) => ({ url: normalize(url), name: normalize(parsedNames[idx]) }))
          .filter(item => item.url);
      }
    } catch (e) {}
    return [{ url: urlsText, name: namesText }];
  };
  const buildPdfStoreValue = (items) => {
    const clean = (items || [])
      .map(item => ({ url: String(item?.url || "").trim(), name: String(item?.name || "").trim() }))
      .filter(item => item.url);
    if (clean.length === 0) return { pdfUrl: "", pdfName: "" };
    if (clean.length === 1) return { pdfUrl: clean[0].url, pdfName: clean[0].name || "" };
    return {
      pdfUrl: JSON.stringify(clean.map(item => item.url)),
      pdfName: JSON.stringify(clean.map(item => item.name || "")),
    };
  };
  const pdfItems = parsePdfItems(form.pdfUrl, form.pdfName);
  const extractDriveFileId = url => {
    const s = String(url || "");
    const m1 = s.match(/\/d\/([a-zA-Z0-9_-]+)/);
    if (m1 && m1[1]) return m1[1];
    const m2 = s.match(/[?&]id=([a-zA-Z0-9_-]+)/);
    if (m2 && m2[1]) return m2[1];
    return "";
  };
  const isImageAttachment = item => {
    const name = String((item && item.name) || "").toLowerCase();
    const url = String((item && item.url) || "").toLowerCase();
    return /\.(png|jpe?g|gif|webp|bmp|svg|heic|heif)$/i.test(name) || /\.(png|jpe?g|gif|webp|bmp|svg|heic|heif)([?#].*)?$/i.test(url);
  };
  const isPdfAttachment = item => {
    const name = String((item && item.name) || "").toLowerCase();
    const url = String((item && item.url) || "").toLowerCase();
    return /\.pdf$/i.test(name) || /\.pdf([?#].*)?$/i.test(url);
  };
  const pdfPreviewUrl = url => String(url || "").replace("/view?usp=sharing", "/preview").replace("/view", "/preview");
  const imageThumbUrl = item => {
    const fid = extractDriveFileId(item && item.url);
    return fid ? `https://drive.google.com/thumbnail?id=${fid}&sz=w1200` : String(item && item.url || "");
  };
  const imagePreviewUrl = item => {
    const fid = extractDriveFileId(item && item.url);
    return fid ? `https://drive.google.com/uc?export=view&id=${fid}` : String(item && item.url || "");
  };
  const uploadPdf = async(file) => {
    if (!file) return;
    const isPdf = file.type === "application/pdf" || /\.pdf$/i.test(file.name || "");
    const isImage = /^image\//i.test(file.type || "") || /\.(png|jpe?g|gif|webp|bmp|svg|heic|heif)$/i.test(file.name || "");
    if (!isPdf && !isImage) {
      alert("PDFまたは画像ファイルを選んでください");
      return;
    }
    setPdfUploading(true);
    try{
      const dataUrl = await readFileAsDataUrl(file);
      const base64 = dataUrl.split(",")[1] || "";
      const r = await api("uploadSchedulePdf", {
        scheduleId: schedule.id,
        fileName: file.name,
        mimeType: file.type || "application/pdf",
        base64,
      });
      setForm(p => ({ ...p, pdfUrl: r.pdfUrl || "", pdfName: r.pdfName || "" }));
      schedule.pdfUrl = r.pdfUrl || "";
      schedule.pdfName = r.pdfName || "";
      alert("添付ファイルを追加しました");
    }catch(e){
      alert("添付ファイルアップロードエラー: " + (e.message || e));
    }finally{
      setPdfUploading(false);
    }
  };
  const removePdfAt = async (idx) => {
    if (!isAdmin) return;
    if (idx < 0 || idx >= pdfItems.length) return;
    if (!confirm("この添付ファイルを削除しますか？")) return;
    const nextItems = pdfItems.filter((_, i) => i !== idx);
    const nextStored = buildPdfStoreValue(nextItems);
    setPdfUploading(true);
    try {
      await api("updateSchedule", {
        schedule: {
          id: schedule.id,
          pdfUrl: nextStored.pdfUrl,
          pdfName: nextStored.pdfName,
        }
      });
      setForm(p => ({ ...p, pdfUrl: nextStored.pdfUrl, pdfName: nextStored.pdfName }));
      schedule.pdfUrl = nextStored.pdfUrl;
      schedule.pdfName = nextStored.pdfName;
      alert("添付ファイルを削除しました");
    } catch (e) {
      alert("添付ファイル削除エラー: " + (e.message || e));
    } finally {
      setPdfUploading(false);
    }
  };
  const save = async () => {
    setSaving(true);
    await onSave({
      ...form,
      firstAidPerson: form.luggagePerson || "",
      date: schedule.date,
      title: schedule.title,
      location: schedule.location,
      type: schedule.type,
    });
    Object.assign(schedule, form, { firstAidPerson: form.luggagePerson || "" });
    setSaving(false);
    setEditing(false);
  };

  const timeField = (k, label) => h("div", { style: { flex: 1 } },
    h("div", { style: { fontSize: 11, fontWeight: 600, color: "#666", marginBottom: 4 } }, label),
    h("input", {
      type: "time",
      value: form[k],
      onChange: e => setForm(p => ({ ...p, [k]: e.target.value })),
      style: { ...css.inp, width: "100%", fontSize: 15 }
    })
  );

  const assignmentField = (k, label, countMap, syncLuggageToFirstAid = false) => h("div", { style: { marginBottom: 12 } },
    h("div", { style: { fontSize: 11, fontWeight: 600, color: "#666", marginBottom: 4 } }, label),
    h("select", {
      value: form[k],
      onChange: e => setForm(p => syncLuggageToFirstAid
        ? { ...p, [k]: e.target.value, firstAidPerson: e.target.value }
        : { ...p, [k]: e.target.value }),
      style: { ...css.inp, width: "100%" }
    },
      h("option", { value: "" }, "-- 未設定 --"),
      userNameOptions.map(name => {
        const cnt = countMap[normalizePerson(name)] || 0;
        return h("option", { key: k + "-" + name, value: name }, `${name}（${cnt}回）`);
      })
    ),
    form[k] && h("div", { style: { marginTop: 4, fontSize: 11, color: "#64748B" } },

  );
}

function ReflectionSection({schedule,user,members=[],isAdmin,canWrite=true}) {
  const canEdit = canWrite && String(user?.role || "") !== "viewer";
  const formatUpdatedAt = v => {
    const d = new Date(String(v || ""));
    if (isNaN(d.getTime())) return fmt(v).short || "";
    return `${String(d.getMonth() + 1).padStart(2, "0")}/${String(d.getDate()).padStart(2, "0")} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  };
  const availableMembers = (members || [])
    .filter(m => String(m.id || "").trim())
    .sort((a,b)=>String(a.name||"").localeCompare(String(b.name||""),"ja"));
  const defaultMemberId = String(user?.memberId || "").trim() || String(availableMembers[0]?.id || "");
  const [targetMemberId,setTargetMemberId] = useState(defaultMemberId);
  const [loading,setLoading] = useState(true);
  const [saving,setSaving] = useState(false);
  const [loadError,setLoadError] = useState("");
  const [updatedAt,setUpdatedAt] = useState("");
  const [form,setForm] = useState({
    good:[],
    more:[],
    goodOther:"",
    moreOther:"",
  });

  useEffect(()=>{
    if(!targetMemberId && availableMembers.length){
      setTargetMemberId(String(availableMembers[0].id || ""));
    }
  },[targetMemberId,availableMembers.length]);

  useEffect(()=>{
    let cancelled = false;
    const loadReflection = async()=>{
      if(!schedule?.id || !user?.id){
        if(!cancelled) setLoading(false);
        return;
      }
      if(isAdmin && !targetMemberId){
        if(!cancelled){
          setLoading(false);
          setForm({good:[],more:[],goodOther:"",moreOther:""});
          setUpdatedAt("");
        }
        return;
      }
      setLoading(true);
      setLoadError("");
      try{
        const payload = { scheduleId: schedule.id, userId: user.id };
        if(isAdmin && targetMemberId) payload.memberId = targetMemberId;
        const r = await api("getReflection", payload);
        if(cancelled) return;
        const v = r.reflection || {};
        setForm({
          good: Array.isArray(v.childGood) ? v.childGood : [],
          more: Array.isArray(v.childMore) ? v.childMore : [],
          goodOther: String(v.childGoodOther || ""),
          moreOther: String(v.childMoreOther || ""),
        });
        setUpdatedAt(String(v.updatedAt || ""));
      }catch(e){
        if(!cancelled) setLoadError(String(e?.message || "読み込みに失敗しました"));
      }finally{
        if(!cancelled) setLoading(false);
      }
    };
    loadReflection();
    return ()=>{ cancelled = true; };
  },[schedule?.id,user?.id,isAdmin,targetMemberId]);

  const selectedMember = availableMembers.find(m=>String(m.id||"")===String(targetMemberId||"")) || null;
  const toggleOption = (key, option) => {
    setForm(prev => {
      const current = Array.isArray(prev[key]) ? prev[key] : [];
      const has = current.includes(option);
      const next = has ? current.filter(v=>v!==option) : [...current, option];
      return { ...prev, [key]: next };
    });
  };

  const renderOptionPills = (key, options) =>
    h("div",{style:{display:"flex",gap:8,flexWrap:"wrap",marginBottom:8}},
      options.map(opt=>{
        const active = (form[key] || []).includes(opt);
        return h("button",{
          key:key+"-"+opt,
          type:"button",
          onClick:()=>toggleOption(key,opt),
          disabled:!canEdit || saving,
          style:{
            border: active ? "1px solid #1D4ED8" : "1px solid #CBD5E1",
            background: active ? "#DBEAFE" : "#fff",
            color: active ? "#1D4ED8" : "#334155",
            borderRadius:999,
            padding:"6px 10px",
            fontSize:12,
            fontWeight:700,
            cursor:(!canEdit || saving) ? "default" : "pointer",
            opacity:(!canEdit || saving) ? 0.7 : 1
          }
        }, opt);
      })
    );

  const save = async()=>{
    if(!canEdit) return;
    if(!schedule?.id || !user?.id) return;
    setSaving(true);
    try{
      const payload = {
        scheduleId:schedule.id,
        userId:user.id,
        memberId:isAdmin ? targetMemberId : "",
        childGood:form.good,
        childMore:form.more,
        childGoodOther:form.goodOther,
        childMoreOther:form.moreOther,
        parentGood:[],
        parentMore:[],
        parentGoodOther:"",
        parentMoreOther:"",
      };
      const r = await api("saveReflection", payload);
      const next = r.reflection || {};
      setUpdatedAt(String(next.updatedAt || ""));
      alert("ふりかえりを保存しました");
    }catch(e){
      alert("ふりかえり保存エラー: " + e.message);
    }finally{
      setSaving(false);
    }
  };

  return h("div",{style:{background:"#fff",borderRadius:16,padding:18,marginTop:14,boxShadow:"0 2px 10px rgba(0,0,0,0.07)"}},
    h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12,gap:8,flexWrap:"wrap"}},
      h("div",{style:{fontSize:11,fontWeight:700,color:"#bbb",letterSpacing:2}},"🌱 ふりかえり"),
      updatedAt && h("div",{style:{fontSize:11,color:"#94A3B8"}},`更新: ${formatUpdatedAt(updatedAt)}`)
    ),
    loadError && h("div",{style:{marginBottom:10,padding:"8px 10px",borderRadius:10,background:"#FEF2F2",border:"1px solid #FECACA",fontSize:12,color:"#B91C1C",fontWeight:700}},`読込エラー: ${loadError}`),
    isAdmin && h("div",{style:{marginBottom:12}},
      h("div",{style:{fontSize:11,fontWeight:700,color:"#64748B",marginBottom:4}},"対象選手"),
      h("select",{
        value:targetMemberId,
        onChange:e=>setTargetMemberId(e.target.value),
        style:{...css.inp,width:"100%"}
      },
        h("option",{value:""},"選手を選択"),
        availableMembers.map(m=>h("option",{key:m.id,value:m.id},`#${m.number||"-"} ${m.name}`))
      )
    ),
    !isAdmin && selectedMember && h("div",{style:{fontSize:12,color:"#1E293B",fontWeight:700,marginBottom:10}},
      `対象: ${selectedMember.name}`),
    loading
      ? h("div",{style:{fontSize:13,color:"#94A3B8",padding:"10px 0"}},"読み込み中...")
      : h(Fragment,{},
          h("div",{style:{background:"#F8FAFC",border:"1px solid #E2E8F0",borderRadius:12,padding:12,marginBottom:10}},
            h("div",{style:{fontSize:11,fontWeight:700,color:"#64748B",marginBottom:6}},"Good（できたこと）"),
            renderOptionPills("good", REFLECT_GOOD_OPTIONS),
            (form.good || []).includes("その他") && h("textarea",{
              value:form.goodOther || "",
              onChange:e=>setForm(prev=>({...prev,goodOther:e.target.value})),
              rows:2,
              placeholder:"その他（任意）",
              disabled:!canEdit || saving,
              style:{...css.inp,width:"100%",resize:"vertical",marginBottom:10}
            }),
            h("div",{style:{fontSize:11,fontWeight:700,color:"#64748B",marginBottom:6}},"More（次に意識したいこと）"),
            renderOptionPills("more", REFLECT_MORE_OPTIONS),
            (form.more || []).includes("その他") && h("textarea",{
              value:form.moreOther || "",
              onChange:e=>setForm(prev=>({...prev,moreOther:e.target.value})),
              rows:2,
              placeholder:"その他（任意）",
              disabled:!canEdit || saving,
              style:{...css.inp,width:"100%",resize:"vertical"}
            })
          ),
          canEdit && h("button",{
            type:"button",
            onClick:save,
            disabled:saving || (isAdmin && !targetMemberId),
            style:{...css.bS,width:"100%",opacity:(saving || (isAdmin && !targetMemberId))?0.65:1}
          },saving ? "保存中..." : "保存する")
        )
  );
}
// ── 配車セクション ────────────────────────────────────────────
function CarpoolSection({schedule, user, isAdmin, canWrite=true, members, users=[]}) {
  const isReadOnly = !canWrite;
  const ROLE_COLORS = { child:"#1D4ED8", adult:"#16A34A", coach:"#7C3AED" };
  const normalizeName = v => String(v||"").replace(/\s+/g," ").replace(/さん$/,"").trim();
  const dedupeCarpoolRows = rows => {
    const byUser = {};
    (rows || []).forEach(row => {
      const uid = String(row?.userId || "").trim();
      if (!uid) return;
      byUser[uid] = row;
    });
    return Object.values(byUser);
  };
  const formatDateTimeJa = value => {
    if (!value) return "";
    const d = new Date(value);
    if (Number.isNaN(d.getTime())) return "";
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    const hh = String(d.getHours()).padStart(2, "0");
    const mm = String(d.getMinutes()).padStart(2, "0");
    return `${y}/${m}/${day} ${hh}:${mm}`;
  };
  const getSurname = name => {
    const base = normalizeName(name);
    if (!base) return "";
    const parts = base.split(/[ 　]/).filter(Boolean);
    return parts[0] || base;
  };
  const formatFamilyDisplayName = (familyName, ownerName) => {
    const raw = String(familyName || "").trim();
    const n = normalizeName(raw);
    if (!n) return "";
    if (n === "父" || n === "母") {
      const surname = getSurname(ownerName);
      return surname ? `${surname}${n}` : n;
    }
    return raw;
  };
  const currentUserProfile = (users || []).find(u => String(u.id || "") === String(user.id || "")) || user || {};
  const linkedMemberId = String(currentUserProfile.memberId || user.memberId || "").trim();
  const linkedMemberName = String(
    ((members || []).find(m => String(m.id || "").trim() === linkedMemberId) || {}).name || ""
  ).trim();
  const profileFamilyChoices = [...new Set([
    ...parseFamilyMembers(currentUserProfile.familyMembers || currentUserProfile.familyComposition || [])
      .map(name => formatFamilyDisplayName(name, currentUserProfile.name || user.name || ""))
      .filter(Boolean),
    linkedMemberName
  ].filter(Boolean))];
  const profileFamilyChoiceKeySet = new Set(profileFamilyChoices.map(normalizeName).filter(Boolean));
  const sanitizeFamilySelection = (value) =>
    parseFamilyMembers(value || [])
      .map(name => formatFamilyDisplayName(name, currentUserProfile.name || user.name || ""))
      .filter(name => profileFamilyChoiceKeySet.has(normalizeName(name)));
  const luggageLabel = String(schedule.luggagePerson || "").trim();
  const luggageKey = normalizeName(luggageLabel);
  const luggageSurnameKey = getSurname(luggageLabel);
  const [carpoolDeadlineDraft, setCarpoolDeadlineDraft] = useState(String(schedule.carpoolDeadline || "").trim());
  const [carpoolDeadlineSaving, setCarpoolDeadlineSaving] = useState(false);
  const carpoolDeadline = String(carpoolDeadlineDraft || "").trim();
  const today = todayLocal();
  const isCarpoolPast = !!carpoolDeadline && carpoolDeadline < today;
  const [carpools, setCarpools] = useState([]);
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState("");
  const [reloadTick, setReloadTick] = useState(0);
  const [my, setMy] = useState({available:"", capacity:"", note:"", familyPlan:"", familyMembers:[]});
  const [saving, setSaving] = useState(false);
  const [saved,  setSaved]  = useState(false);
  const [planSaving, setPlanSaving] = useState(false);
  const [confirmedPlan, setConfirmedPlan] = useState(null);
  const [planNote, setPlanNote] = useState("");
  const [familyExtraOpen, setFamilyExtraOpen] = useState({});
  const [attend, setAttend] = useState({});
  // 車ごとの座席割り当て { "kind:userId:slot": riderId }
  const [seatAssignments, setSeatAssignments] = useState({});
  // 配車割り当て state: {memberId: carIndex} carIndex=0〜(cars.length-1)
  const [assignment, setAssignment] = useState({});
  // 家族車割り当て state: {memberId: familyCarUserId}
  const [familyRideAssign, setFamilyRideAssign] = useState({});
  // 各車のピックアップ情報 {userId: {place:"", time:""}}
  const [pickupInfo, setPickupInfo] = useState({});
  // 車ごとの追加情報 {userId: {highway:boolean, adultUser1:"", adultUser2:"", coach:"", coachOther:""}}
  const [carMeta, setCarMeta] = useState({});
  const [planLoaded, setPlanLoaded] = useState(false);
  const [selectedFleetUserIds, setSelectedFleetUserIds] = useState([]);
  useEffect(() => {
    setCarpoolDeadlineDraft(String(schedule.carpoolDeadline || "").trim());
  }, [schedule?.id, schedule?.carpoolDeadline]);
  const saveCarpoolDeadline = async () => {
    if (!isAdmin) return;
    setCarpoolDeadlineSaving(true);
    try {
      await api("updateSchedule", { schedule: { ...schedule, carpoolDeadline: carpoolDeadlineDraft || "" } });
      schedule.carpoolDeadline = carpoolDeadlineDraft || "";
      alert("配車締切を更新しました");
    } catch (e) {
      alert("配車締切の更新エラー: " + (e.message || e));
    }
    setCarpoolDeadlineSaving(false);
  };
  const getMeta = userId => ({
    highway: false,
    driver: "",
    adultUser1: "",
    adultUser2: "",
    coach: "",
    coachOther: "",
    ...(carMeta[userId] || {})
  });
  const setMeta = (userId, patch) => {
    setCarMeta(prev => ({
      ...prev,
      [userId]: {
        highway: false,
        driver: "",
        adultUser1: "",
        adultUser2: "",
        coach: "",
        coachOther: "",
        ...(prev[userId] || {}),
        ...patch
      }
    }));
  };
  const getAdultNames = userId => {
    const m = getMeta(userId);
    return [String(m.adultUser1 || "").trim(), String(m.adultUser2 || "").trim()].filter(Boolean);
  };
  const getDriverName = car => {
    const m = getMeta(car.userId);
    const selected = String(m.driver || "").trim();
    return selected || String(car.userName || "").trim();
  };
  const getCoachName = userId => {
    const m = getMeta(userId);
    if (m.coach === "その他") return String(m.coachOther || "").trim();
    return String(m.coach || "").trim();
  };
  const isLuggageCar = carUserName => {
    const userNameKey = normalizeName(carUserName);
    const userSurnameKey = getSurname(carUserName);
    if (luggageKey && userNameKey && luggageKey === userNameKey) return true;
    if (luggageSurnameKey && userSurnameKey && luggageSurnameKey === userSurnameKey) return true;
    return false;
  };
  const isCurrentLuggageCar = isLuggageCar(currentUserProfile.name || user.name || "");
  // 高速利用時は「運転手 + 同乗大人1名以上（合計大人2名）」を必須にする
  const hasEnoughAdultsForHighway = car => {
    const m = getMeta(car.userId);
    if (!m.highway) return true;

  };
  const showCarpoolRule = () => {
    alert([
      "【配車ルール】",
      "・最初に「配車できますか？」で『可 / 不可 / 家族で行く』を選んでください。",

      "・『可』を選んだ場合は、何人乗せられるか（運転手を含む）を入力してください。",
      "・『家族で行く』を選んだ場合は、空きがある場合の受け入れ人数（0〜）を入力してください。",
      "・荷物車の担当者は、家族同伴の有無に関わらず乗車可能人数を入力してください。",
      "・高速利用の車は、運転手 + 同乗大人1名以上（合計大人2名）が必要です。",
      "・運転手/各席は『その試合に行く人』から選択してください。",
      "・同じ人を複数の席に重複割り当てはできません。",
      "・『家族で行く』を選んだ家庭の子供は、配車対象外になります。",
      "・『家族で行く』で空き人数を入力した場合、他の子供を家族車に割り当てできます。",
      "・集合場所と出発時間を入力してください。",
      "・変更が出たら、できるだけ早く更新してください。",
      "・安全第一（シートベルト着用・定員超過なし）でお願いします。"
    ].join("\n"));
  };
  useEffect(() => {
    setPlanLoaded(false);
    try {
      const raw = localStorage.getItem("afc_carpool_plan_" + schedule.id);
      if (raw) {
        const savedPlan = JSON.parse(raw);
          if (savedPlan && typeof savedPlan === "object") {
            if (savedPlan.assignment && typeof savedPlan.assignment === "object") setAssignment(savedPlan.assignment);
            if (savedPlan.familyRideAssign && typeof savedPlan.familyRideAssign === "object") setFamilyRideAssign(savedPlan.familyRideAssign);
            if (savedPlan.pickupInfo && typeof savedPlan.pickupInfo === "object") setPickupInfo(savedPlan.pickupInfo);
            if (savedPlan.carMeta && typeof savedPlan.carMeta === "object") setCarMeta(savedPlan.carMeta);
            if (savedPlan.seatAssignments && typeof savedPlan.seatAssignments === "object") setSeatAssignments(savedPlan.seatAssignments);
            if (Array.isArray(savedPlan.selectedFleetUserIds)) setSelectedFleetUserIds(savedPlan.selectedFleetUserIds.map(v=>String(v||"")).filter(Boolean));
            if (typeof savedPlan.planNote === "string") setPlanNote(savedPlan.planNote);
          }
      }
    } catch (e) {}
    setPlanLoaded(true);
  }, [schedule.id]);
  useEffect(() => {
    if (!planLoaded) return;
    try {
      localStorage.setItem("afc_carpool_plan_" + schedule.id, JSON.stringify({
        assignment,
        familyRideAssign,
        pickupInfo,
        carMeta,
        seatAssignments,
        selectedFleetUserIds,
        planNote
      }));
    } catch (e) {}
  }, [schedule.id, assignment, familyRideAssign, pickupInfo, carMeta, seatAssignments, selectedFleetUserIds, planNote, planLoaded]);

  useEffect(()=>{

    Promise.allSettled([
      api("getCarpool",{scheduleId:schedule.id}),
      api("getAttend",{scheduleId:schedule.id}),
      api("getCarpoolPlan",{scheduleId:schedule.id})
    ]).then(results=>{
      if(cancelled) return;
      const [carpoolRes, attendRes, planRes] = results;
      const cr = carpoolRes.status === "fulfilled" ? (carpoolRes.value || {}) : { carpools: [] };
      const ar = attendRes.status === "fulfilled" ? (attendRes.value || {}) : { attend: [] };

          const familyPlan = String(cp?.familyPlan || "").trim();
          const available = String(cp?.available || "").trim();
          if (familyPlan === "行く" && available !== "家族で行く") {

          if (!available) return { ...cp, available: "可" };
          return cp;

        setCarpools(dedupedCarpools);

        const mine = mineRows.length ? mineRows[mineRows.length - 1] : null;
        if(mine){
          const mineFamilyMembers = sanitizeFamilySelection(mine.familyMembers || []);

              : ((!availableRaw && legacyFamilyPlan === "行く")

  const save=async()=>{

    if(normalizedAvailable==="可" && (my.capacity==="" || Number.isNaN(capNum) || capNum<0)){
      return alert("何人乗せられるか（運転手を含む）を0以上で入力してください");

// ── アルバムセクション ─────────────────────────────────────────
function AlbumSection({schedule, isAdmin, canWrite=true}) {
  const [albumStore, setAlbumStore] = useState({
    albumUrl: schedule.albumUrl || "",
    albumName: schedule.albumName || "",
  });
  const [uploading, setUploading] = useState(false);
  const [progress, setProgress] = useState({done:0,total:0});
  const [viewerOpen, setViewerOpen] = useState(false);
  const [viewerIndex, setViewerIndex] = useState(0);
  const [selectedMap, setSelectedMap] = useState({});

  useEffect(() => {
    setAlbumStore({
      albumUrl: schedule.albumUrl || "",
      albumName: schedule.albumName || "",
    });
    setViewerOpen(false);
    setViewerIndex(0);
    setSelectedMap({});
  }, [schedule.id, schedule.albumUrl, schedule.albumName]);

  const parseItems = (urlRaw, nameRaw) => {
    const normalize = value => String(value || "").trim();
    const urlsText = normalize(urlRaw);
    const namesText = normalize(nameRaw);
    if (!urlsText) return [];
    try {
      const parsedUrls = JSON.parse(urlsText);
      if (Array.isArray(parsedUrls)) {
        if (parsedUrls.length && typeof parsedUrls[0] === "object") {
          return parsedUrls
            .map(item => ({ url: normalize(item.url), name: normalize(item.name) }))
            .filter(item => item.url);
        }
        let parsedNames = [];
        try { parsedNames = JSON.parse(namesText || "[]"); } catch (e) {}
        return parsedUrls
          .map((url, idx) => ({ url: normalize(url), name: normalize(parsedNames[idx]) }))
          .filter(item => item.url);
      }
    } catch (e) {}
    return [{ url: urlsText, name: namesText }];
  };
  const buildStoreValue = (items) => {
    const clean = (items || [])
      .map(item => ({ url: String(item?.url || "").trim(), name: String(item?.name || "").trim() }))
      .filter(item => item.url);
    if (clean.length === 0) return { albumUrl: "", albumName: "" };
    if (clean.length === 1) return { albumUrl: clean[0].url, albumName: clean[0].name || "" };
    return {
      albumUrl: JSON.stringify(clean.map(item => item.url)),
      albumName: JSON.stringify(clean.map(item => item.name || "")),
    };
  };
  const extractDriveFileId = url => {
    const s = String(url || "");
    const m1 = s.match(/\/d\/([a-zA-Z0-9_-]+)/);
    if (m1 && m1[1]) return m1[1];
    const m2 = s.match(/[?&]id=([a-zA-Z0-9_-]+)/);
    if (m2 && m2[1]) return m2[1];
    return "";
  };
  const isImageFile = (nameOrType) => {
    const s = String(nameOrType || "").toLowerCase();
    return /^image\//.test(s) || /\.(png|jpe?g|gif|webp|bmp|svg|heic|heif)$/i.test(s);
  };
  const imageItems = parseItems(albumStore.albumUrl, albumStore.albumName).filter(item =>
    isImageFile(item.name || "") || isImageFile(item.url || "")
  );
  const selectedIndexes = Object.keys(selectedMap)
    .map(k => Number(k))
    .filter(i => selectedMap[i] && imageItems[i]);

  const toPreviewUrl = (item) => {
    const fid = extractDriveFileId(item?.url);
    return fid ? `https://drive.google.com/thumbnail?id=${fid}&sz=w1200` : String(item?.url || "");
  };
  const toPreviewFallbackUrl = (item) => {
    const fid = extractDriveFileId(item?.url);
    return fid ? `https://drive.google.com/uc?export=view&id=${fid}` : String(item?.url || "");
  };
  const toDownloadUrl = (item) => {
    const fid = extractDriveFileId(item?.url);
    return fid ? `https://drive.google.com/uc?export=download&id=${fid}` : String(item?.url || "");
  };
  const openViewer = (idx) => {
    setViewerIndex(Math.max(0, Math.min(imageItems.length - 1, Number(idx || 0))));
    setViewerOpen(true);
  };
  const toggleSelect = (idx) => {
    const i = Number(idx);
    if (Number.isNaN(i) || !imageItems[i]) return;
    setSelectedMap(prev => ({ ...prev, [i]: !prev[i] }));
  };
  const getTargetIndexes = () => {
    if (selectedIndexes.length > 0) return selectedIndexes;
    return imageItems[viewerIndex] ? [viewerIndex] : [];
  };
  const downloadByIndexes = (indexes) => {
    const uniq = [...new Set((indexes || []).filter(i => imageItems[i]))];
    if (!uniq.length) return;
    uniq.forEach((i, order) => {
      setTimeout(() => {
        window.open(toDownloadUrl(imageItems[i]), "_blank", "noopener,noreferrer");
      }, order * 120);
    });
  };
  const deleteByIndexes = async (indexes) => {
    if (!isAdmin) return;
    const uniq = [...new Set((indexes || []).filter(i => imageItems[i]))];
    if (!uniq.length) return;
    const removeSet = new Set(uniq);
    const nextItems = imageItems.filter((_, i) => !removeSet.has(i));
    const nextStored = buildStoreValue(nextItems);
    setUploading(true);
    try {
      await api("updateSchedule", {
        schedule: {
          id: schedule.id,
          albumUrl: nextStored.albumUrl,
          albumName: nextStored.albumName,
        }
      });
      setAlbumStore(nextStored);
      schedule.albumUrl = nextStored.albumUrl;
      schedule.albumName = nextStored.albumName;
      setSelectedMap({});
      if (nextItems.length === 0) {
        setViewerOpen(false);
        setViewerIndex(0);
      } else {
        setViewerIndex(Math.max(0, Math.min(viewerIndex, nextItems.length - 1)));
      }
    } catch (e) {
      alert("アルバム削除エラー: " + (e.message || e));
    } finally {
      setUploading(false);
    }
  };

  const uploadPhotos = async (fileList) => {
    if (!canWrite) return;
    const files = Array.from(fileList || []);
    if (!files.length) return;
    const imageFiles = files.filter(f => isImageFile(f.type || "") || isImageFile(f.name || ""));
    if (!imageFiles.length) {
      alert("画像ファイルを選んでください");
      return;
    }
    if (imageFiles.length !== files.length) {
      alert("画像以外のファイルはスキップします");
    }
    setUploading(true);
    setProgress({done:0,total:imageFiles.length});
    let latest = { albumUrl: albumStore.albumUrl || "", albumName: albumStore.albumName || "" };
    try {
      for (let i = 0; i < imageFiles.length; i++) {
        const file = imageFiles[i];
        const dataUrl = await readFileAsDataUrl(file);
        const base64 = String(dataUrl || "").split(",")[1] || "";
        if (!base64) continue;
        const r = await api("uploadScheduleAlbumPhoto", {
          scheduleId: schedule.id,
          fileName: file.name || "photo",
          mimeType: file.type || "image/jpeg",
          base64,
        });
        latest = { albumUrl: r.albumUrl || latest.albumUrl, albumName: r.albumName || latest.albumName };
        setAlbumStore(latest);
        schedule.albumUrl = latest.albumUrl;
        schedule.albumName = latest.albumName;
        setProgress({done:i+1,total:imageFiles.length});
      }
      alert(`${imageFiles.length}件アップロードしました`);
    } catch (e) {
      alert("アルバムアップロードエラー: " + (e.message || e));
    } finally {
      setUploading(false);
    }
  };
  const currentItem = imageItems[viewerIndex] || null;
  const targetIndexes = getTargetIndexes();

  return h(Fragment,{},
    viewerOpen && currentItem && h(Modal,{title:`アルバム (${viewerIndex + 1}/${imageItems.length})`,onClose:()=>setViewerOpen(false)},
      h("div",{style:{display:"flex",justifyContent:"center",marginBottom:10}},
        h("img",{
          src:toPreviewUrl(currentItem),

            (selectedIndexes.length>0?`選択を削除 (${selectedIndexes.length})`:"この画像を削除"))
          : h("div",{})

        h("button",{type:"button",disabled:viewerIndex<=0,onClick:()=>setViewerIndex(i=>Math.max(0,i-1)),style:{...css.bG,padding:"7px 12px",fontSize:12,opacity:viewerIndex<=0?0.5:1,cursor:viewerIndex<=0?"default":"pointer"}},"← 前へ"),
        h("div",{style:{fontSize:11,color:"#64748B"}},"複数選択してまとめてDL/削除できます"),
        h("button",{type:"button",disabled:viewerIndex>=imageItems.length-1,onClick:()=>setViewerIndex(i=>Math.min(imageItems.length-1,i+1)),style:{...css.bG,padding:"7px 12px",fontSize:12,opacity:viewerIndex>=imageItems.length-1?0.5:1,cursor:viewerIndex>=imageItems.length-1?"default":"pointer"}},"次へ →")
      ),
      h("div",{style:{display:"grid",gridTemplateColumns:"repeat(6,minmax(0,1fr))",gap:6,maxHeight:110,overflowY:"auto"}},
        imageItems.map((item,idx)=>h("button",{key:"album-thumb-"+idx,type:"button",onClick:()=>setViewerIndex(idx),style:{padding:2,border:idx===viewerIndex?"2px solid #1D4ED8":"1px solid #CBD5E1",background:selectedMap[idx]?"#DBEAFE":"#fff",borderRadius:8,cursor:"pointer"}},
          h("img",{src:toPreviewUrl(item),alt:item.name||`写真${idx+1}`,onError:e=>{
            const img = e && (e.currentTarget || e.target);
            if (!img) return;
            if (img.dataset && img.dataset.previewFallback === "1") return;
            if (img.dataset) img.dataset.previewFallback = "1";
            img.src = toPreviewFallbackUrl(item);
          },style:{width:"100%",aspectRatio:"1 / 1",objectFit:"cover",borderRadius:6}})
        ))
      )
    ),
    h("div",{style:{background:"#fff",borderRadius:16,padding:16,boxShadow:"0 2px 10px rgba(0,0,0,0.07)"}} ,
      h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,marginBottom:12}},
        h("div",{style:{fontSize:11,fontWeight:700,color:"#bbb",letterSpacing:2}},"アルバム"),
        h("div",{style:{fontSize:11,color:"#64748B"}},`${imageItems.length}枚${selectedIndexes.length?` / 選択${selectedIndexes.length}`:""}`)
      ),
      imageItems.length===0
        ? h("div",{style:{background:"#F8FAFC",border:"1px solid #E2E8F0",borderRadius:12,padding:16,textAlign:"center",fontSize:12,color:"#94A3B8"}},"まだ写真がありません")
        : h("div",{style:{display:"grid",gridTemplateColumns:"repeat(3,minmax(0,1fr))",gap:8,marginBottom:12}},
            imageItems.map((item,idx)=>h("button",{key:(item.url||"")+idx,type:"button",onClick:()=>openViewer(idx),style:{background:selectedMap[idx]?"#DBEAFE":"#F8FAFC",border:selectedMap[idx]?"2px solid #60A5FA":"1px solid #E2E8F0",borderRadius:10,padding:4,cursor:"pointer",textAlign:"left",position:"relative"}},
                h("img",{
                  src:toPreviewUrl(item),
                  alt:item.name||`写真${idx+1}`,
                  onError:e=>{
                    const img = e && (e.currentTarget || e.target);
                    if (!img) return;
                    if (img.dataset && img.dataset.previewFallback === "1") return;
                    if (img.dataset) img.dataset.previewFallback = "1";
                    img.src = toPreviewFallbackUrl(item);
                  },
                  style:{width:"100%",aspectRatio:"1 / 1",objectFit:"cover",borderRadius:8,background:"#E2E8F0"}
                }),
                selectedMap[idx] && h("span",{style:{position:"absolute",top:6,right:6,fontSize:10,fontWeight:800,color:"#1D4ED8",background:"#fff",border:"1px solid #93C5FD",borderRadius:999,padding:"2px 6px"}},"選択")
            ))
          ),
      canWrite && h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:2}},

          }

            accept:"image/*,.png,.jpg,.jpeg,.gif,.webp,.bmp,.svg,.heic,.heif",

            onChange:e=>{
              uploadPhotos((e.target.files || []));
              e.target.value = "";

            style:{display:"none"}

        h("label",{
          style:{
            display:"flex",alignItems:"center",justifyContent:"center",gap:6,
            width:"100%",padding:"11px 10px",borderRadius:12,border:"1.5px dashed #93C5FD",
            background:uploading ? "#EFF6FF" : "linear-gradient(135deg,#EFF6FF,#DBEAFE)",

            type:"file",
            accept:"image/*",
            capture:"environment",

              uploadPhotos((e.target.files || []));
              e.target.value = "";
            },
            style:{display:"none"}

      imageItems.length>0 && h("div",{style:{fontSize:11,color:"#64748B",marginTop:8}},"画像をタップすると、表示・ダウンロード・削除（管理者）操作ができます")
    )
